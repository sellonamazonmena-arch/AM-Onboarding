rademarks). Renew or reinstate if necessary before applying.</p>\n<h4>6. Mark Type Mismatch</h4>\n<p><strong>Problem</strong>: Selected \"word mark\" when the trademark is actually a design mark (or vice versa).</p>\n<p><strong>Fix</strong>: Check the trademark record for the mark type. If it's a design mark, you must upload the exact logo image as it appears on the record.</p>\n<h4>7. Applicant Not the Rights Owner</h4>\n<p><strong>Problem</strong>: The applicant is a distributor, manufacturer, or reseller — not the legal trademark owner.</p>\n<p><strong>Fix</strong>: Only the trademark owner (or an authorized employee of the owning entity) can submit the application. Distributors and resellers cannot enroll brands they don't own.</p>\n<h4>8. Account Health Issues</h4>\n<p><strong>Problem</strong>: The applicant's selling account has been involved in abusive conduct — e.g., brands previously removed due to abuse, low account health rating, unresolved performance warnings.</p>\n<p><strong>Fix</strong>: Resolve all account health issues first. If you have outstanding violations or warnings, address them before applying.</p>\n<h4>9. Business Verification Failure</h4>\n<p><strong>Problem</strong>: Amazon was unable to confirm business verification (for business sellers).</p>\n<p><strong>Fix</strong>: Ensure your business registration documents are up to date and match the information in your Amazon selling account.</p>\n<h4>10. Logo/Image Doesn't Match Trademark Record</h4>\n<p><strong>Problem</strong>: For design marks, the uploaded logo doesn't exactly match the trademark record. Common issue: uploading the full trademark certificate instead of just the logo image.</p>\n<p><strong>Fix</strong>: Upload only the logo/mark image exactly as it appears on the trademark record. Do not upload the full certificate document.</p>\n<p>---</p>\n","searchText":"**Problem**: The brand name entered during enrollment doesn't match the trademark record exactly.\n- \"Buy with Prime\" vs. \"BuywithPrime\" → rejected\n- Extra spaces, missing symbols, different punctuation → rejected\n- Capitalization differences → accepted\n\n**Fix**: Copy the brand name directly from the official trademark database. Check for exact spacing and special characters. **Problem**: Images show the brand via stickers, labels, tags, or stamps rather than permanently affixed branding.\n\n**Accepted methods**:\n- Printing directly on the product\n- Sewing (on textiles)\n- Laser etching / engraving\n- Embossing / molding\n\n**NOT accepted**:\n- Stickers or adhesive labels\n- Hang tags\n- Stamps\n- Stock images or computer-generated mockups\n- Digitally altered images\n\n**Fix**: Submit photos of actual production units with the brand name integrated into the product or primary packaging during manufacturing. **Problem**: Selected the wrong IP office (e.g., selected USPTO when the trademark is from SAIP).\n\n**Fix**: Double-check the issuing authority. For Saudi Arabia, select **SAIP (Saudi Authority for Intellectual Property)**. **Problem**: Entered the wrong number format — e.g., using a serial number instead of a registration number, or entering the application number when you have a fully registered mark.\n\n**Fix**: Use the exact registration number or application number as it appears in the official IP office database. For pending trademarks, enter the application number. **Problem**: The trademark has expired, been abandoned, or been canceled.\n\n**Fix**: Verify the trademark status on the official IP office website (saip.gov.sa for Saudi trademarks). Renew or reinstate if necessary before applying. **Problem**: Selected \"word mark\" when the trademark is actually a design mark (or vice versa).\n\n**Fix**: Check the trademark record for the mark type. If it's a design mark, you must upload the exact logo image as it appears on the record. **Problem**: The applicant is a distributor, manufacturer, or reseller — not the legal trademark owner.\n\n**Fix**: Only the trademark owner (or an authorized employee of the owning entity) can submit the application. Distributors and resellers cannot enroll brands they don't own. **Problem**: The applicant's selling account has been involved in abusive conduct — e.g., brands previously removed due to abuse, low account health rating, unresolved performance warnings.\n\n**Fix**: Resolve all account health issues first. If you have outstanding violations or warnings, address them before applying. **Problem**: Amazon was unable to confirm business verification (for business sellers).\n\n**Fix**: Ensure your business registration documents are up to date and match the information in your Amazon selling account. **Problem**: For design marks, the uploaded logo doesn't exactly match the trademark record. Common issue: uploading the full trademark certificate instead of just the logo image.\n\n**Fix**: Upload only the logo/mark image exactly as it appears on the trademark record. Do not upload the full certificate document.\n\n---"},{"title":"11. IP Accelerator — The Alternative Path","html":"<h4>What It Is</h4>\n<p>Amazon IP Accelerator connects brands with a network of <strong>Amazon-vetted IP law firms</strong> that provide trademark registration services at competitive rates.</p>\n<h4>Key Benefits</h4>\n<ul><li>Brands get <strong>faster/earlier access to Brand Registry</strong> — can enroll with a <strong>pending trademark</strong> filed through IP Accelerator, rather than waiting for full registration</li><li>Trademark registration process can be completed in <strong>2–4 months</strong> through IP Accelerator, vs. 8–12 months for standard filing with many trademark offices</li><li>Competitive legal rates from vetted providers</li></ul>\n<h4>How It Works</h4>\n<ul><li>Visit brandservices.amazon.com/ipaccelerator</li><li>Select a law firm from Amazon's vetted network</li><li>The firm files your trademark application</li><li>Upon filing, you receive documentation supporting <strong>provisional Brand Registry enrollment</strong></li><li>You can start using Brand Registry benefits while the trademark application is pending</li></ul>\n<h4>When to Recommend IP Accelerator</h4>\n<ul><li>Seller doesn't have a trademark yet and wants to access Brand Registry quickly</li><li>Seller's trademark application is pending but was <strong>not</strong> filed through IP Accelerator (standard pending applications may have limited acceptance)</li><li>Seller needs help navigating the trademark registration process</li><li>Time-sensitive launch where the 8–12 month standard trademark timeline is too long</li></ul>\n<h4>Important Notes</h4>\n<ul><li>IP Accelerator is <strong>not free</strong> — legal service fees apply</li><li>Since February 2025, the USPTO publishes new trademark serial numbers instantly, and Amazon broadly accepts pending applications from any qualified attorney (this may vary by trademark office)</li><li>A pending trademark filed through IP Accelerator cannot later be \"replaced\" — if the application faces an office action and needs refiling, it may be treated as a separate enrollment</li></ul>\n<p>---</p>\n","searchText":"Amazon IP Accelerator connects brands with a network of **Amazon-vetted IP law firms** that provide trademark registration services at competitive rates. - Brands get **faster/earlier access to Brand Registry** — can enroll with a **pending trademark** filed through IP Accelerator, rather than waiting for full registration\n- Trademark registration process can be completed in **2–4 months** through IP Accelerator, vs. 8–12 months for standard filing with many trademark offices\n- Competitive legal rates from vetted providers 1. Visit brandservices.amazon.com/ipaccelerator\n2. Select a law firm from Amazon's vetted network\n3. The firm files your trademark application\n4. Upon filing, you receive documentation supporting **provisional Brand Registry enrollment**\n5. You can start using Brand Registry benefits while the trademark application is pending - Seller doesn't have a trademark yet and wants to access Brand Registry quickly\n- Seller's trademark application is pending but was **not** filed through IP Accelerator (standard pending applications may have limited acceptance)\n- Seller needs help navigating the trademark registration process\n- Time-sensitive launch where the 8–12 month standard trademark timeline is too long - IP Accelerator is **not free** — legal service fees apply\n- Since February 2025, the USPTO publishes new trademark serial numbers instantly, and Amazon broadly accepts pending applications from any qualified attorney (this may vary by trademark office)\n- A pending trademark filed through IP Accelerator cannot later be \"replaced\" — if the application faces an office action and needs refiling, it may be treated as a separate enrollment\n\n---"},{"title":"12. Frequently Asked Questions","html":"<h4>Enrollment & Eligibility</h4>\n<p><strong>Q: Can I enroll with a trademark from a country where I don't sell?</strong></p>\n<p>A: You can enroll globally with any accepted trademark, but IP enforcement (takedowns) may only apply in the country matching your trademark. Best practice: register your trademark in each country where you sell. For Saudi Arabia, a SAIP trademark is ideal for protecting listings on amazon.sa.</p>\n<p><strong>Q: How long does enrollment take?</strong></p>\n<p>A: Typically <strong>2–4 weeks</strong> from application submission to approval, assuming no issues. Simple applications may process within 48 hours. Delays usually stem from documentation issues or verification code problems.</p>\n<p><strong>Q: Can I enroll multiple brands?</strong></p>\n<p>A: Yes. Each brand requires its own separate trademark and enrollment application. You can manage multiple enrolled brands from one Brand Registry account.</p>\n<p><strong>Q: Is Brand Registry enrollment a one-time process?</strong></p>\n<p>A: Yes — once enrolled, you're enrolled permanently (as long as your trademark remains active). No annual renewal is needed for Brand Registry itself (though you must keep your trademark current with the issuing IP office).</p>\n<h4>Protection & Enforcement</h4>\n<p><strong>Q: Will Brand Registry prevent other sellers from listing on my ASIN?</strong></p>\n<p>A: No. Brand Registry does not prevent authorized or legitimate resellers from selling your products. It gives you tools to address counterfeit and infringing listings, but it's not a listing gating mechanism.</p>\n<p><strong>Q: How quickly are IP violations resolved?</strong></p>\n<p>A: Through Report a Violation, most legitimate claims are resolved within <strong>24–48 hours</strong>. Through Project Zero self-service removal, counterfeit listings are removed in under <strong>60 seconds</strong>.</p>\n<p><strong>Q: What if my Report a Violation claim is rejected?</strong></p>\n<p>A: Review the rejection reason carefully. Common issues include insufficient evidence, incorrect violation type selection, or targeting a legitimate seller. Improve your evidence documentation and resubmit. Remember: your acceptance rate affects Project Zero eligibility.</p>\n<h4>Roles & Access</h4>\n<p><strong>Q: Can a reseller/distributor access my Brand Analytics data?</strong></p>\n<p>A: No. Only accounts with the <strong>Brand Representative</strong> selling role (internal, first-party sellers) can access Brand Analytics. The <strong>Reseller</strong> role intentionally excludes Brand Analytics to protect sensitive brand data.</p>\n<p><strong>Q: What happens if the brand administrator leaves the company?</strong></p>\n<p>A: This is why having <strong>more than one Administrator</strong> is strongly recommended. If the only Administrator is lost, you may need to contact Brand Registry Support with proof of trademark ownership to regain administrative access.</p>\n<p><strong>Q: Can I remove a seller's selling role?</strong></p>\n<p>A: Yes. The Administrator can return to <strong>Manage Selling Accounts</strong> at any time and revoke a selling role.</p>\n<h4>MENA-Specific</h4>\n<p><strong>Q: I have a SAIP trademark. Can I use Brand Registry for both amazon.sa and amazon.ae?</strong></p>\n<p>A: You can enroll using your SAIP trademark, but for maximum protection on amazon.ae, you should also register your trademark with the UAE IP office. Trademark enforcement is typically country-specific.</p>\n<p><strong>Q: When will Transparency be available on amazon.sa?</strong></p>\n<p>A: No official timeline has been announced. Amazon typically announces program expansions through Seller Central notifications. In the meantime, use Report a Violation for counterfeit issues.</p>\n<p><strong>Q: Do I need a Saudi commercial registration (CR) to enroll in Brand Registry?</strong></p>\n<p>A: No — Brand Registry enrollment requires a registered trademark, not a commercial registration. However, you do need a valid seller account to access selling benefits.</p>\n<p>---</p>\n","searchText":"**Q: Can I enroll with a trademark from a country where I don't sell?**\nA: You can enroll globally with any accepted trademark, but IP enforcement (takedowns) may only apply in the country matching your trademark. Best practice: register your trademark in each country where you sell. For Saudi Arabia, a SAIP trademark is ideal for protecting listings on amazon.sa.\n\n**Q: How long does enrollment take?**\nA: Typically **2–4 weeks** from application submission to approval, assuming no issues. Simple applications may process within 48 hours. Delays usually stem from documentation issues or verification code problems.\n\n**Q: Can I enroll multiple brands?**\nA: Yes. Each brand requires its own separate trademark and enrollment application. You can manage multiple enrolled brands from one Brand Registry account.\n\n**Q: Is Brand Registry enrollment a one-time process?**\nA: Yes — once enrolled, you're enrolled permanently (as long as your trademark remains active). No annual renewal is needed for Brand Registry itself (though you must keep your trademark current with the issuing IP office). **Q: Will Brand Registry prevent other sellers from listing on my ASIN?**\nA: No. Brand Registry does not prevent authorized or legitimate resellers from selling your products. It gives you tools to address counterfeit and infringing listings, but it's not a listing gating mechanism.\n\n**Q: How quickly are IP violations resolved?**\nA: Through Report a Violation, most legitimate claims are resolved within **24–48 hours**. Through Project Zero self-service removal, counterfeit listings are removed in under **60 seconds**.\n\n**Q: What if my Report a Violation claim is rejected?**\nA: Review the rejection reason carefully. Common issues include insufficient evidence, incorrect violation type selection, or targeting a legitimate seller. Improve your evidence documentation and resubmit. Remember: your acceptance rate affects Project Zero eligibility. **Q: Can a reseller/distributor access my Brand Analytics data?**\nA: No. Only accounts with the **Brand Representative** selling role (internal, first-party sellers) can access Brand Analytics. The **Reseller** role intentionally excludes Brand Analytics to protect sensitive brand data.\n\n**Q: What happens if the brand administrator leaves the company?**\nA: This is why having **more than one Administrator** is strongly recommended. If the only Administrator is lost, you may need to contact Brand Registry Support with proof of trademark ownership to regain administrative access.\n\n**Q: Can I remove a seller's selling role?**\nA: Yes. The Administrator can return to **Manage Selling Accounts** at any time and revoke a selling role. **Q: I have a SAIP trademark. Can I use Brand Registry for both amazon.sa and amazon.ae?**\nA: You can enroll using your SAIP trademark, but for maximum protection on amazon.ae, you should also register your trademark with the UAE IP office. Trademark enforcement is typically country-specific.\n\n**Q: When will Transparency be available on amazon.sa?**\nA: No official timeline has been announced. Amazon typically announces program expansions through Seller Central notifications. In the meantime, use Report a Violation for counterfeit issues.\n\n**Q: Do I need a Saudi commercial registration (CR) to enroll in Brand Registry?**\nA: No — Brand Registry enrollment requires a registered trademark, not a commercial registration. However, you do need a valid seller account to access selling benefits.\n\n---"},{"title":"Quick Reference: Key URLs","html":"<div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>URL</th></tr></thead><tbody><tr><td>Brand Registry Portal</td><td>brandservices.amazon.com</td></tr><tr><td>Brand Registry Eligibility</td><td>brandservices.amazon.com/brandregistry/eligibility</td></tr><tr><td>IP Accelerator</td><td>brandservices.amazon.com/ipaccelerator</td></tr><tr><td>Report a Violation</td><td>Brand Registry Portal → Protect → Report a Violation</td></tr><tr><td>Project Zero</td><td>Brand Registry Portal → Protect → Project Zero</td></tr><tr><td>SAIP Trademark Search</td><td>saip.gov.sa/en/services/trademarks/trademark1</td></tr><tr><td>Amazon.sa Seller Central</td><td>sellercentral.amazon.sa</td></tr><tr><td>Brand Registry Support</td><td>Within Brand Registry Portal → Help</td></tr></tbody></table></div>\n<p>---</p>\n<p><em>Sources: Amazon Brand Services (brandservices.amazon.com), Amazon Seller Central forums, Amazon Sell documentation, Amazon Advertising help, industry guides from AMZScout, SalesScout, SellerLabs, AmazonGrowthLab, and others. Information verified as of September 2026.</em></p>","searchText":"| Resource | URL |\n|----------|-----|\n| Brand Registry Portal | brandservices.amazon.com |\n| Brand Registry Eligibility | brandservices.amazon.com/brandregistry/eligibility |\n| IP Accelerator | brandservices.amazon.com/ipaccelerator |\n| Report a Violation | Brand Registry Portal → Protect → Report a Violation |\n| Project Zero | Brand Registry Portal → Protect → Project Zero |\n| SAIP Trademark Search | saip.gov.sa/en/services/trademarks/trademark1 |\n| Amazon.sa Seller Central | sellercentral.amazon.sa |\n| Brand Registry Support | Within Brand Registry Portal → Help |\n\n---\n\n*Sources: Amazon Brand Services (brandservices.amazon.com), Amazon Seller Central forums, Amazon Sell documentation, Amazon Advertising help, industry guides from AMZScout, SalesScout, SellerLabs, AmazonGrowthLab, and others. Information verified as of September 2026.*"}]};

// Init
try{completed=JSON.parse(localStorage.getItem('am_hub_done')||'{}');}catch(e){}

function init(){
  buildMpSel();
  buildSidebar();
  showP('welcome');
  updateProgress();
}

function buildMpSel(){
  var el=document.getElementById('mpSel');el.innerHTML='';
  MPS.forEach(function(m){
    var b=document.createElement('button');
    b.className='mp-btn'+(mp===m.id?' active':'');
    b.textContent=m.flag+' '+m.name;
    b.setAttribute('data-mp',m.id);
    b.onclick=function(){mp=this.getAttribute('data-mp');buildMpSel();showP(activePage);};
    el.appendChild(b);
  });
}

function buildSidebar(){
  var sb=document.getElementById('sidebar');sb.innerHTML='';
  PAGES.forEach(function(phase){
    var ph=document.createElement('div');ph.className='sb-phase';ph.textContent=phase.phase;
    sb.appendChild(ph);
    phase.items.forEach(function(item){
      var div=document.createElement('div');
      div.className='sb-item'+(activePage===item.id?' active':'');
      div.innerHTML='<span class="ic">'+item.icon+'</span><span style="flex:1">'+item.name+'</span><span class="sb-check'+(completed[item.id]?' done':'')+'">'+( completed[item.id]?'\u2713':'')+'</span>';
      div.setAttribute('data-page',item.id);
      div.onclick=function(){showP(this.getAttribute('data-page'));};
      var chk=div.querySelector('.sb-check');
      chk.onclick=function(e){e.stopPropagation();toggleDone(item.id);};
      sb.appendChild(div);
    });
  });
}

function showP(id){
  activePage=id;
  buildSidebar();
  var c=document.getElementById('content');
  var mpInfo=MPS.find(function(m){return m.id===mp;});

  if(id==='welcome') c.innerHTML=buildWelcome(mpInfo);
  else if(id==='kpis') c.innerHTML=buildKPIs();
  else if(id==='tools') c.innerHTML=buildTools();
  else if(id==='mp-overview') c.innerHTML=buildMpOverview(mpInfo);
  else if(id==='fees') c.innerHTML=buildFees(mpInfo);
  else if(id==='promos') c.innerHTML=buildPromos(mpInfo);
  else if(id==='pocs') c.innerHTML=buildPOCs();
  else if(id==='links') c.innerHTML=buildLinks(mpInfo);
  else if(PB[id]) c.innerHTML=buildPlaybook(id);
  else c.innerHTML='<div class="page-title">Coming Soon</div><p style="color:var(--t2)">This section is under development.</p>';

  window.scrollTo({top:0});
}

function toggleDone(id){
  completed[id]=!completed[id];
  try{localStorage.setItem('am_hub_done',JSON.stringify(completed));}catch(e){}
  buildSidebar();
  updateProgress();
  checkMilestone();
}

function updateProgress(){
  var total=0,done=0;
  PAGES.forEach(function(p){p.items.forEach(function(i){total++;if(completed[i.id])done++;});});
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
}

function checkMilestone(){
  var total=0,done=0;
  PAGES.forEach(function(p){p.items.forEach(function(i){total++;if(completed[i.id])done++;});});
  var pct=Math.round(done/total*100);
  var milestones={25:{e:'\ud83c\udf89',t:'Great Start!',s:'You completed 25% of your onboarding'},50:{e:'\ud83d\udcaa',t:'Halfway There!',s:'50% done — keep it up!'},75:{e:'\ud83d\udd25',t:'Almost Done!',s:'75% complete — you\'re on fire!'},100:{e:'\ud83d\ude80',t:'You\'re Ready!',s:'100% complete — welcome to the team!'}};
  if(milestones[pct]) showPopup(milestones[pct].e,milestones[pct].t,milestones[pct].s);
}

function showPopup(emoji,title,sub){
  document.getElementById('popupEmoji').textContent=emoji;
  document.getElementById('popupTitle').textContent=title;
  document.getElementById('popupSub').textContent=sub;
  document.getElementById('popup').classList.add('show');
  document.getElementById('popupBg').classList.add('show');
}
function closePopup(){
  document.getElementById('popup').classList.remove('show');
  document.getElementById('popupBg').classList.remove('show');
}

function buildTools(){

function buildPOCs(){

    h+='<div class="sec-content"><table><tr><th>Program</th><th>Contact Details</th></tr>';
    pocs.forEach(function(p){
      h+='<tr><td><strong>'+p.name+'</strong></td><td>'+p.notes+'</td></tr>';
    });
    h+='</table></div>';
  }else{
    h+='<div class="sec-content"><p>POC data for this marketplace will be added soon. Check with your team lead.</p></div>';
  }
  return h;
}
