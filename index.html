ul>\n<h4>Scenario 5: \"My listing is showing a 'potential pricing error'\"</h4>\n<ul><li><strong>Cause:</strong> Your price (whether set by a rule or manually) is significantly lower or higher than Amazon's expected range</li><li><strong>Fix:</strong> Review the price, confirm it's correct (or correct it), and acknowledge the alert in Seller Central</li><li><strong>Prevention:</strong> Ensure your minimum price is reasonable and your rules don't produce extreme values</li></ul>\n<h4>Scenario 6: \"My Featured Offer percentage dropped after enabling Automate Pricing\"</h4>\n<ul><li><strong>Possible causes:</strong> (1) Rule is matching too high (setting price above Featured Offer), (2) Price is bouncing due to rapid competitive changes, (3) Other factors degraded (metrics, inventory)</li><li><strong>Action:</strong> Review rule parameters, check if price action is set correctly (beat vs. stay above), and verify account health metrics</li></ul>\n<p>---</p>\n","searchText":"- **Check:** Is the rule status \"Active\" or \"Paused\"?\n- **Check:** Is the listing status \"Active\"?\n- **Check:** Was the rule just created? Wait up to 1 hour for initial processing.\n- **Check:** Is there a valid reference price? (If no Featured Offer exists or the listing is suppressed, the rule may have nothing to trigger against.)\n- **Check:** Is your current price already at the min or max boundary? - **Diagnosis:** Price war — multiple sellers with aggressive downward rules\n- **Action 1:** Review if your minimum price is correctly calculated (is it still profitable?)\n- **Action 2:** Consider pausing the rule and setting a manual price\n- **Action 3:** Evaluate whether to continue competing on this ASIN at current market prices\n- **Action 4:** Focus on non-price factors (FBA, fast shipping, better metrics) to win the Buy Box at a higher price - **Cause:** An active pricing rule overrode your manual change\n- **Fix:** Pause or remove the rule from that SKU before making manual price changes - **Expected behavior:** Pausing only stops future adjustments — it does NOT revert prices\n- **Fix:** Manually set the price to your desired amount after pausing - **Cause:** Your price (whether set by a rule or manually) is significantly lower or higher than Amazon's expected range\n- **Fix:** Review the price, confirm it's correct (or correct it), and acknowledge the alert in Seller Central\n- **Prevention:** Ensure your minimum price is reasonable and your rules don't produce extreme values - **Possible causes:** (1) Rule is matching too high (setting price above Featured Offer), (2) Price is bouncing due to rapid competitive changes, (3) Other factors degraded (metrics, inventory)\n- **Action:** Review rule parameters, check if price action is set correctly (beat vs. stay above), and verify account health metrics\n\n---"},{"title":"14. Automate Pricing vs. Third-Party Repricers","html":"<h4>Comparison Table</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Feature</th><th>Amazon Automate Pricing</th><th>Third-Party Repricers</th></tr></thead><tbody><tr><td><strong>Cost</strong></td><td>Free (with Professional plan)</td><td>$15–$500+/month depending on SKU count</td></tr><tr><td><strong>Speed</strong></td><td>Polling-based (minutes)</td><td>Event-driven / near real-time (seconds to 90 seconds)</td></tr><tr><td><strong>Cost Awareness</strong></td><td>None — manual minimum only</td><td>Can input COGS, fees; auto-calculate floor</td></tr><tr><td><strong>Competitive Filtering</strong></td><td>Basic (fulfillment type, condition)</td><td>Advanced (feedback score, stock level, seller quality, FBA/FBM/SFP)</td></tr><tr><td><strong>Analytics</strong></td><td>None built-in</td><td>Repricing history, Buy Box win rate, margin tracking</td></tr><tr><td><strong>Simulation Mode</strong></td><td>No</td><td>Some offer \"Safe Mode\" / simulation</td></tr><tr><td><strong>Multi-Channel</strong></td><td>Amazon only</td><td>Some support Noon, eBay, Walmart, Shopify</td></tr><tr><td><strong>SKU Limit</strong></td><td>No limit</td><td>Varies by plan (often tiered)</td></tr><tr><td><strong>Ease of Setup</strong></td><td>Simple, within Seller Central</td><td>Requires integration, some learning curve</td></tr><tr><td><strong>Best For</strong></td><td>New sellers, small catalogs (<50 SKUs), simple strategies</td><td>Established sellers, large catalogs, competitive categories, multi-channel</td></tr></tbody></table></div>\n<h4>When Automate Pricing Is Sufficient</h4>\n<ul><li>Fewer than 50 SKUs</li><li>Low-competition categories</li><li>Simple pricing strategy (match or beat Featured Offer)</li><li>Budget-conscious sellers who want a free solution</li><li>New sellers getting started</li></ul>\n<h4>When to Consider a Third-Party Repricer</h4>\n<ul><li>50+ active repricing SKUs</li><li>Highly competitive categories with frequent price changes (10+ events/day)</li><li>Need to calculate price floors from actual cost data</li><li>Multi-channel selling (Amazon + Noon, etc.)</li><li>Need repricing analytics and reporting</li><li>Margin erosion concerns requiring dynamic floor protection</li></ul>\n<p>---</p>\n","searchText":"| Feature | Amazon Automate Pricing | Third-Party Repricers |\n|---|---|---|\n| **Cost** | Free (with Professional plan) | $15–$500+/month depending on SKU count |\n| **Speed** | Polling-based (minutes) | Event-driven / near real-time (seconds to 90 seconds) |\n| **Cost Awareness** | None — manual minimum only | Can input COGS, fees; auto-calculate floor |\n| **Competitive Filtering** | Basic (fulfillment type, condition) | Advanced (feedback score, stock level, seller quality, FBA/FBM/SFP) |\n| **Analytics** | None built-in | Repricing history, Buy Box win rate, margin tracking |\n| **Simulation Mode** | No | Some offer \"Safe Mode\" / simulation |\n| **Multi-Channel** | Amazon only | Some support Noon, eBay, Walmart, Shopify |\n| **SKU Limit** | No limit | Varies by plan (often tiered) |\n| **Ease of Setup** | Simple, within Seller Central | Requires integration, some learning curve |\n| **Best For** | New sellers, small catalogs (<50 SKUs), simple strategies | Established sellers, large catalogs, competitive categories, multi-channel | - Fewer than 50 SKUs\n- Low-competition categories\n- Simple pricing strategy (match or beat Featured Offer)\n- Budget-conscious sellers who want a free solution\n- New sellers getting started - 50+ active repricing SKUs\n- Highly competitive categories with frequent price changes (10+ events/day)\n- Need to calculate price floors from actual cost data\n- Multi-channel selling (Amazon + Noon, etc.)\n- Need repricing analytics and reporting\n- Margin erosion concerns requiring dynamic floor protection\n\n---"},{"title":"15. Key Terminology Glossary","html":"<div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody><tr><td><strong>Featured Offer (Buy Box)</strong></td><td>The prominent purchase area on a product page with \"Add to Cart\" and \"Buy Now\" buttons. The offer displayed here captures the majority of sales.</td></tr><tr><td><strong>ASIN</strong></td><td>Amazon Standard Identification Number — a unique product identifier on Amazon</td></tr><tr><td><strong>SKU</strong></td><td>Stock Keeping Unit — a seller-specific identifier for a product listing</td></tr><tr><td><strong>FBA</strong></td><td>Fulfillment by Amazon — Amazon stores, picks, packs, and ships the product</td></tr><tr><td><strong>FBM</strong></td><td>Fulfilled by Merchant — the seller handles storage and shipping</td></tr><tr><td><strong>Referral Fee</strong></td><td>The percentage Amazon charges on each sale (varies by category, typically 8–15%)</td></tr><tr><td><strong>Landed Price</strong></td><td>Total cost to the customer = item price + shipping</td></tr><tr><td><strong>COGS</strong></td><td>Cost of Goods Sold — the direct cost of producing/acquiring the product</td></tr><tr><td><strong>ODR</strong></td><td>Order Defect Rate — percentage of orders with defects (A-to-z claims, chargebacks, negative feedback). Must be below 1%.</td></tr><tr><td><strong>Competitive External Price</strong></td><td>Amazon's estimate of the lowest price for a product from major retailers outside Amazon</td></tr><tr><td><strong>Pricing Health</strong></td><td>A Seller Central dashboard that shows pricing opportunities and alerts for potential pricing issues</td></tr><tr><td><strong>Fair Pricing Policy</strong></td><td>Amazon's policy prohibiting misleading or excessively high pricing that could damage customer trust</td></tr><tr><td><strong>Price War</strong></td><td>A cycle where competing sellers continuously undercut each other, driving prices to unprofitable levels</td></tr><tr><td><strong>Repricing</strong></td><td>The act of changing product prices in response to competitive or market conditions</td></tr><tr><td><strong>SAR</strong></td><td>Saudi Riyal — the currency used on Amazon.sa</td></tr><tr><td><strong>VAT</strong></td><td>Value Added Tax — 15% in Saudi Arabia, must be factored into pricing and margins</td></tr></tbody></table></div>\n<p>---</p>","searchText":"| Term | Definition |\n|---|---|\n| **Featured Offer (Buy Box)** | The prominent purchase area on a product page with \"Add to Cart\" and \"Buy Now\" buttons. The offer displayed here captures the majority of sales. |\n| **ASIN** | Amazon Standard Identification Number — a unique product identifier on Amazon |\n| **SKU** | Stock Keeping Unit — a seller-specific identifier for a product listing |\n| **FBA** | Fulfillment by Amazon — Amazon stores, picks, packs, and ships the product |\n| **FBM** | Fulfilled by Merchant — the seller handles storage and shipping |\n| **Referral Fee** | The percentage Amazon charges on each sale (varies by category, typically 8–15%) |\n| **Landed Price** | Total cost to the customer = item price + shipping |\n| **COGS** | Cost of Goods Sold — the direct cost of producing/acquiring the product |\n| **ODR** | Order Defect Rate — percentage of orders with defects (A-to-z claims, chargebacks, negative feedback). Must be below 1%. |\n| **Competitive External Price** | Amazon's estimate of the lowest price for a product from major retailers outside Amazon |\n| **Pricing Health** | A Seller Central dashboard that shows pricing opportunities and alerts for potential pricing issues |\n| **Fair Pricing Policy** | Amazon's policy prohibiting misleading or excessively high pricing that could damage customer trust |\n| **Price War** | A cycle where competing sellers continuously undercut each other, driving prices to unprofitable levels |\n| **Repricing** | The act of changing product prices in response to competitive or market conditions |\n| **SAR** | Saudi Riyal — the currency used on Amazon.sa |\n| **VAT** | Value Added Tax — 15% in Saudi Arabia, must be factored into pricing and margins |\n\n---"},{"title":"16. Sources","html":"<ul><li>Amazon Seller Central — <a href=\"https://sell.amazon.com/tools/automate-pricing\" target=\"_blank\">Automate Pricing Tool</a></li><li>Amazon Seller Blog — <a href=\"https://sell.amazon.com/blog/automate-pricing-rules\" target=\"_blank\">What Are Amazon Automate Pricing Rules?</a></li><li>Amazon Seller Blog — <a href=\"https://sell.amazon.com/blog/amazon-pricing-strategies\" target=\"_blank\">Amazon Pricing Strategies</a></li><li>Amazon Seller Blog — <a href=\"https://sell.amazon.com/blog/buy-box-featured-offer\" target=\"_blank\">Featured Offer / Buy Box</a></li><li>Amazon Seller Forums — <a href=\"https://sellercentral.amazon.com/seller-forums/discussions/t/6d926aa5-df8b-46c9-b72f-0d446f8cdaca\" target=\"_blank\">Everything You Need to Know About Automate Pricing</a></li><li>Amazon SP-API Documentation — <a href=\"https://developer-docs.amazon.com/sp-api/docs/manage-automated-pricing-rules\" target=\"_blank\">Manage Automated Pricing Rules</a></li><li>Amazon — <a href=\"https://sell.amazon.com/global-selling/middle-east\" target=\"_blank\">Expand to the Middle East</a></li><li>SalesDuo — <a href=\"https://salesduo.com/blog/how-to-use-amazon-automated-pricing/\" target=\"_blank\">Amazon Automated Pricing 2026</a></li><li>HectorAI — <a href=\"https://hectorai.live/blog/amazon-automated-pricing\" target=\"_blank\">Amazon Automated Pricing: How It Works and How to Set It Up (2026)</a></li><li>WisePPC — <a href=\"https://wiseppc.com/blog/automate-pricing-rules/\" target=\"_blank\">Amazon Automate Pricing Rules Explained</a></li><li>SellerApp — <a href=\"https://sellerapp.com/blog/amazon-automated-pricing\" target=\"_blank\">Amazon Automated Pricing Guide</a></li><li>Repricer.com — <a href=\"https://www.repricer.com/blog/free-amazon-repricer-review/\" target=\"_blank\">Free Amazon Repricers Review</a></li><li>Repricer.com — <a href=\"https://www.repricer.com/blog/amazon-buy-box-complete-guide/\" target=\"_blank\">Amazon Buy Box Complete Guide 2026</a></li><li>Amazon.sa — <a href=\"https://sell.amazon.sa/pricing\" target=\"_blank\">Selling Fees & Pricing</a></li><li>Amazon Advertising — <a href=\"https://advertising.amazon.com/help/GYVDGT5WNNW23LJ5\" target=\"_blank\">Understand Featured Offer Eligibility</a></li></ul>\n<p>---</p>\n<p><em>Last updated: September 2026</em></p>\n<p><em>Research compiled for MENA/Saudi Arabia marketplace context</em></p>","searchText":"1. Amazon Seller Central — [Automate Pricing Tool](https://sell.amazon.com/tools/automate-pricing)\n2. Amazon Seller Blog — [What Are Amazon Automate Pricing Rules?](https://sell.amazon.com/blog/automate-pricing-rules)\n3. Amazon Seller Blog — [Amazon Pricing Strategies](https://sell.amazon.com/blog/amazon-pricing-strategies)\n4. Amazon Seller Blog — [Featured Offer / Buy Box](https://sell.amazon.com/blog/buy-box-featured-offer)\n5. Amazon Seller Forums — [Everything You Need to Know About Automate Pricing](https://sellercentral.amazon.com/seller-forums/discussions/t/6d926aa5-df8b-46c9-b72f-0d446f8cdaca)\n6. Amazon SP-API Documentation — [Manage Automated Pricing Rules](https://developer-docs.amazon.com/sp-api/docs/manage-automated-pricing-rules)\n7. Amazon — [Expand to the Middle East](https://sell.amazon.com/global-selling/middle-east)\n8. SalesDuo — [Amazon Automated Pricing 2026](https://salesduo.com/blog/how-to-use-amazon-automated-pricing/)\n9. HectorAI — [Amazon Automated Pricing: How It Works and How to Set It Up (2026)](https://hectorai.live/blog/amazon-automated-pricing)\n10. WisePPC — [Amazon Automate Pricing Rules Explained](https://wiseppc.com/blog/automate-pricing-rules/)\n11. SellerApp — [Amazon Automated Pricing Guide](https://sellerapp.com/blog/amazon-automated-pricing)\n12. Repricer.com — [Free Amazon Repricers Review](https://www.repricer.com/blog/free-amazon-repricer-review/)\n13. Repricer.com — [Amazon Buy Box Complete Guide 2026](https://www.repricer.com/blog/amazon-buy-box-complete-guide/)\n14. Amazon.sa — [Selling Fees & Pricing](https://sell.amazon.sa/pricing)\n15. Amazon Advertising — [Understand Featured Offer Eligibility](https://advertising.amazon.com/help/GYVDGT5WNNW23LJ5)\n\n---\n\n*Last updated: September 2026*\n*Research compiled for MENA/Saudi Arabia marketplace context*"}],"brand":[{"title":"Comprehensive Research Guide for Account Managers","html":"<p><em>Last updated: September 2026</em></p>\n<p>---</p>\n<ul><li><a href=\"#1-what-is-amazon-brand-registry\" target=\"_blank\">What Is Amazon Brand Registry?</a></li><li><a href=\"#2-eligibility-requirements\" target=\"_blank\">Eligibility Requirements</a></li><li><a href=\"#3-mena--saudi-arabia-specific-details\" target=\"_blank\">MENA / Saudi Arabia Specific Details</a></li><li><a href=\"#4-enrollment-process--step-by-step\" target=\"_blank\">Enrollment Process — Step by Step</a></li><li><a href=\"#5-verification-process\" target=\"_blank\">Verification Process</a></li><li><a href=\"#6-benefits-of-brand-registry\" target=\"_blank\">Benefits of Brand Registry</a></li><li>6.1 <a href=\"#61-a-content-enhanced-brand-content\" target=\"_blank\">A+ Content (Enhanced Brand Content)</a></li><li>6.2 <a href=\"#62-brand-store-storefront\" target=\"_blank\">Brand Store (Storefront)</a></li><li>6.3 <a href=\"#63-brand-analytics\" target=\"_blank\">Brand Analytics</a></li><li>6.4 <a href=\"#64-sponsored-brands-advertising\" target=\"_blank\">Sponsored Brands Advertising</a></li><li>6.5 <a href=\"#65-amazon-vine\" target=\"_blank\">Amazon Vine</a></li><li>6.6 <a href=\"#66-virtual-bundles\" target=\"_blank\">Virtual Bundles</a></li><li><a href=\"#7-brand-protection--ip-tools\" target=\"_blank\">Brand Protection & IP Tools</a></li><li>7.1 <a href=\"#71-automated-protections\" target=\"_blank\">Automated Protections</a></li><li>7.2 <a href=\"#72-report-a-violation-rav\" target=\"_blank\">Report a Violation (RAV)</a></li><li>7.3 <a href=\"#73-project-zero\" target=\"_blank\">Project Zero</a></li><li>7.4 <a href=\"#74-transparency-program\" target=\"_blank\">Transparency Program</a></li><li>7.5 <a href=\"#75-counterfeit-crimes-unit-ccu\" target=\"_blank\">Counterfeit Crimes Unit (CCU)</a></li><li><a href=\"#8-brand-registry-vs-not-having-it\" target=\"_blank\">Brand Registry vs. Not Having It</a></li><li><a href=\"#9-managing-brand-representatives--roles\" target=\"_blank\">Managing Brand Representatives & Roles</a></li><li>9.1 <a href=\"#91-protection-roles\" target=\"_blank\">Protection Roles</a></li><li>9.2 <a href=\"#92-selling-roles\" target=\"_blank\">Selling Roles</a></li><li>9.3 <a href=\"#93-how-to-assign-roles\" target=\"_blank\">How to Assign Roles</a></li><li><a href=\"#10-common-rejection-reasons--how-to-avoid-them\" target=\"_blank\">Common Rejection Reasons & How to Avoid Them</a></li><li><a href=\"#11-ip-accelerator--the-alternative-path\" target=\"_blank\">IP Accelerator — The Alternative Path</a></li><li><a href=\"#12-frequently-asked-questions\" target=\"_blank\">Frequently Asked Questions</a></li></ul>\n<p>---</p>","searchText":"*Last updated: September 2026*\n\n---\n\n\n1. [What Is Amazon Brand Registry?](#1-what-is-amazon-brand-registry)\n2. [Eligibility Requirements](#2-eligibility-requirements)\n3. [MENA / Saudi Arabia Specific Details](#3-mena--saudi-arabia-specific-details)\n4. [Enrollment Process — Step by Step](#4-enrollment-process--step-by-step)\n5. [Verification Process](#5-verification-process)\n6. [Benefits of Brand Registry](#6-benefits-of-brand-registry)\n   - 6.1 [A+ Content (Enhanced Brand Content)](#61-a-content-enhanced-brand-content)\n   - 6.2 [Brand Store (Storefront)](#62-brand-store-storefront)\n   - 6.3 [Brand Analytics](#63-brand-analytics)\n   - 6.4 [Sponsored Brands Advertising](#64-sponsored-brands-advertising)\n   - 6.5 [Amazon Vine](#65-amazon-vine)\n   - 6.6 [Virtual Bundles](#66-virtual-bundles)\n7. [Brand Protection & IP Tools](#7-brand-protection--ip-tools)\n   - 7.1 [Automated Protections](#71-automated-protections)\n   - 7.2 [Report a Violation (RAV)](#72-report-a-violation-rav)\n   - 7.3 [Project Zero](#73-project-zero)\n   - 7.4 [Transparency Program](#74-transparency-program)\n   - 7.5 [Counterfeit Crimes Unit (CCU)](#75-counterfeit-crimes-unit-ccu)\n8. [Brand Registry vs. Not Having It](#8-brand-registry-vs-not-having-it)\n9. [Managing Brand Representatives & Roles](#9-managing-brand-representatives--roles)\n   - 9.1 [Protection Roles](#91-protection-roles)\n   - 9.2 [Selling Roles](#92-selling-roles)\n   - 9.3 [How to Assign Roles](#93-how-to-assign-roles)\n10. [Common Rejection Reasons & How to Avoid Them](#10-common-rejection-reasons--how-to-avoid-them)\n11. [IP Accelerator — The Alternative Path](#11-ip-accelerator--the-alternative-path)\n12. [Frequently Asked Questions](#12-frequently-asked-questions)\n\n---"},{"title":"1. What Is Amazon Brand Registry?","html":"<p>Amazon Brand Registry is a <strong>free program</strong> that connects a brand owner's registered trademark to their Amazon seller account. It serves as the foundational layer for brand protection, listing control, and access to Amazon's full suite of brand-building tools.</p><h4>Key Facts</h4>\n<ul><li><strong>Cost</strong>: Free to enroll — no enrollment fee or annual subscription</li><li><strong>Scope</strong>: Protects the brand across the Amazon marketplace where the trademark is registered</li><li><strong>Purpose</strong>: Intellectual property protection, listing accuracy control, and unlocking premium selling tools</li><li><strong>Who it's for</strong>: Brand owners (individuals, businesses, organizations) with an active registered trademark or pending trademark (via IP Accelerator)</li><li><strong>Not required to sell</strong>: You can sell on Amazon without Brand Registry, but you lose access to the majority of brand-building and brand-protection tools</li></ul>\n<h4>What Brand Registry Is NOT</h4>\n<ul><li>It is <strong>not a guarantee</strong> that all counterfeit problems will disappear</li><li>It does <strong>not prevent</strong> other authorized sellers from listing against your ASINs (it's not a gating tool)</li><li>It does <strong>not replace</strong> having a solid legal IP strategy outside of Amazon</li><li>It does <strong>not cost money</strong> to enroll (though related programs like Transparency have per-unit costs)</li></ul>\n<p>---</p>\n","searchText":"Amazon Brand Registry is a **free program** that connects a brand owner's registered trademark to their Amazon seller account. It serves as the foundational layer for brand protection, listing control, and access to Amazon's full suite of brand-building tools.- **Cost**: Free to enroll — no enrollment fee or annual subscription\n- **Scope**: Protects the brand across the Amazon marketplace where the trademark is registered\n- **Purpose**: Intellectual property protection, listing accuracy control, and unlocking premium selling tools\n- **Who it's for**: Brand owners (individuals, businesses, organizations) with an active registered trademark or pending trademark (via IP Accelerator)\n- **Not required to sell**: You can sell on Amazon without Brand Registry, but you lose access to the majority of brand-building and brand-protection tools - It is **not a guarantee** that all counterfeit problems will disappear\n- It does **not prevent** other authorized sellers from listing against your ASINs (it's not a gating tool)\n- It does **not replace** having a solid legal IP strategy outside of Amazon\n- It does **not cost money** to enroll (though related programs like Transparency have per-unit costs)\n\n---"},{"title":"2. Eligibility Requirements","html":"<h4>Trademark Requirements</h4>\n<p>To enroll a brand in Brand Registry, you <strong>must have</strong>:</p>\n<ul><li><strong>An active registered trademark</strong> — issued by a government trademark office in an accepted country</li><li><strong>OR</strong> a <strong>pending trademark application</strong> filed through <strong>Amazon IP Accelerator</strong></li></ul>\n<ul><li>The trademark must be one of the following types:</li><li><strong>Text-based mark (Word Mark)</strong>: Protects the brand name in standard characters — offers the most flexibility as it protects the name regardless of stylization</li><li><strong>Image-based mark (Design Mark)</strong> with words, letters, or numbers: Protects a logo that includes readable text</li><li>⚠️ <strong>Design-only marks</strong> (logos without any text) are <strong>NOT accepted</strong> — Amazon needs a clear, readable brand identifier to match against listings</li></ul>\n<h4>Accepted Trademark Offices (Full Current List)</h4>\n<p>Amazon currently accepts trademarks issued by government IP offices in:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Region</th><th>Countries/Offices</th></tr></thead><tbody><tr><td><strong>Americas</strong></td><td>United States (USPTO), Canada (CIPO), Brazil (INPI), Mexico (IMPI)</td></tr><tr><td><strong>Europe</strong></td><td>European Union (EUIPO), United Kingdom (UKIPO), France (INPI), Germany (DPMA), Italy (UIBM), Spain (OEPM), Sweden, Poland, Benelux, Turkey</td></tr><tr><td><strong>Middle East & Africa</strong></td><td><strong>Saudi Arabia (SAIP)</strong> <span class=\"icon-yes\">✅</span>, United Arab Emirates, Egypt</td></tr><tr><td><strong>Asia-Pacific</strong></td><td>Australia, India, Japan, Singapore</td></tr></tbody></table></div>\n<blockquote><strong>Key for MENA sellers</strong>: Saudi Arabia's <strong>Saudi Authority for Intellectual Property (SAIP)</strong> is on the accepted list. Trademarks registered with SAIP (saip.gov.sa) are fully accepted for Brand Registry enrollment.</blockquote>\n<h4>Who Can Apply</h4>\n<ul><li>The application <strong>must be submitted by the trademark owner</strong> — the individual, business, organization, or entity that legally owns the rights to the trademark</li><li>Distributors, manufacturers, or third-party resellers <strong>cannot</strong> submit Brand Registry applications — they will be declined</li><li>The applicant must use an Amazon account (Seller Central or Vendor Central credentials)</li></ul>\n<h4>Additional Requirements</h4>\n<ul><li>You do <strong>not</strong> need an active Amazon selling account to enroll (you can use Brand Registry for protection only)</li><li>However, without a selling account, you won't have access to selling benefits (A+ Content, Stores, etc.) — only protection tools like Report a Violation</li></ul>\n<p>---</p>\n","searchText":"To enroll a brand in Brand Registry, you **must have**:\n\n1. **An active registered trademark** — issued by a government trademark office in an accepted country\n   - **OR** a **pending trademark application** filed through **Amazon IP Accelerator**\n\n2. The trademark must be one of the following types:\n   - **Text-based mark (Word Mark)**: Protects the brand name in standard characters — offers the most flexibility as it protects the name regardless of stylization\n   - **Image-based mark (Design Mark)** with words, letters, or numbers: Protects a logo that includes readable text\n   - ⚠️ **Design-only marks** (logos without any text) are **NOT accepted** — Amazon needs a clear, readable brand identifier to match against listings Amazon currently accepts trademarks issued by government IP offices in:\n\n| Region | Countries/Offices |\n|--------|-------------------|\n| **Americas** | United States (USPTO), Canada (CIPO), Brazil (INPI), Mexico (IMPI) |\n| **Europe** | European Union (EUIPO), United Kingdom (UKIPO), France (INPI), Germany (DPMA), Italy (UIBM), Spain (OEPM), Sweden, Poland, Benelux, Turkey |\n| **Middle East & Africa** | **Saudi Arabia (SAIP)** ✅, United Arab Emirates, Egypt |\n| **Asia-Pacific** | Australia, India, Japan, Singapore |\n\n> **Key for MENA sellers**: Saudi Arabia's **Saudi Authority for Intellectual Property (SAIP)** is on the accepted list. Trademarks registered with SAIP (saip.gov.sa) are fully accepted for Brand Registry enrollment. - The application **must be submitted by the trademark owner** — the individual, business, organization, or entity that legally owns the rights to the trademark\n- Distributors, manufacturers, or third-party resellers **cannot** submit Brand Registry applications — they will be declined\n- The applicant must use an Amazon account (Seller Central or Vendor Central credentials) - You do **not** need an active Amazon selling account to enroll (you can use Brand Registry for protection only)\n- However, without a selling account, you won't have access to selling benefits (A+ Content, Stores, etc.) — only protection tools like Report a Violation\n\n---"},{"title":"3. MENA / Saudi Arabia Specific Details","html":"<h4>Saudi Arabia (amazon.sa) Marketplace</h4>\n<ul><li><strong>SAIP trademarks accepted</strong>: Yes — Saudi Authority for Intellectual Property trademarks are on Amazon's accepted list</li><li><strong>Brand Registry portal</strong>: Accessible via brandservices.amazon.com (same global portal)</li><li><strong>A+ Content</strong>: Available on amazon.sa for Brand Registry enrolled brands</li><li><strong>Brand Store</strong>: Available on amazon.sa</li><li><strong>Brand Analytics</strong>: Available (though some dashboards may have limited data compared to larger marketplaces due to smaller marketplace size)</li><li><strong>Sponsored Brands</strong>: Available on amazon.sa for Brand Registry enrolled brands</li><li><strong>Report a Violation</strong>: Available globally, including for amazon.sa listings</li></ul>\n<h4>UAE (amazon.ae) Marketplace</h4>\n<ul><li>UAE trademarks are also accepted</li><li>Brand Registry benefits are largely the same as amazon.sa</li><li>Brands operating across both marketplaces should consider registering trademarks in both countries for maximum protection</li></ul>\n<h4>Transparency & Project Zero on MENA</h4>\n<div class=\"callout warning\">⚠️ <strong>Critical Note</strong>: As of late 2025, the <strong>Transparency program is NOT yet available</strong> on amazon.sa or amazon.ae. Transparency is currently available in: US, Canada, Germany, France, Italy, Spain, UK, Australia, India, and Japan. Amazon has not announced a specific timeline for MENA expansion.</div>\n<blockquote></blockquote>\n<blockquote><strong>Workaround</strong>: For counterfeit issues on MENA marketplaces, Amazon recommends using the <strong>Report a Violation tool</strong> as the primary enforcement mechanism.</blockquote>\n<h4>Localization Considerations</h4>\n<ul><li>Listings for Saudi Arabia should be localized (Arabic content is critical for conversion)</li><li>Brand names on trademarks must match exactly what appears on product packaging</li><li>Consumer behavior, pricing expectations, and product preferences differ between KSA and UAE — do not simply copy strategies from US/EU</li><li>The first 3–6 months after launch are critical for establishing ranking momentum in these marketplaces</li></ul>\n<p>---</p>\n","searchText":"- **SAIP trademarks accepted**: Yes — Saudi Authority for Intellectual Property trademarks are on Amazon's accepted list\n- **Brand Registry portal**: Accessible via brandservices.amazon.com (same global portal)\n- **A+ Content**: Available on amazon.sa for Brand Registry enrolled brands\n- **Brand Store**: Available on amazon.sa\n- **Brand Analytics**: Available (though some dashboards may have limited data compared to larger marketplaces due to smaller marketplace size)\n- **Sponsored Brands**: Available on amazon.sa for Brand Registry enrolled brands\n- **Report a Violation**: Available globally, including for amazon.sa listings - UAE trademarks are also accepted\n- Brand Registry benefits are largely the same as amazon.sa\n- Brands operating across both marketplaces should consider registering trademarks in both countries for maximum protection > ⚠️ **Critical Note**: As of late 2025, the **Transparency program is NOT yet available** on amazon.sa or amazon.ae. Transparency is currently available in: US, Canada, Germany, France, Italy, Spain, UK, Australia, India, and Japan. Amazon has not announced a specific timeline for MENA expansion.\n>\n> **Workaround**: For counterfeit issues on MENA marketplaces, Amazon recommends using the **Report a Violation tool** as the primary enforcement mechanism. - Listings for Saudi Arabia should be localized (Arabic content is critical for conversion)\n- Brand names on trademarks must match exactly what appears on product packaging\n- Consumer behavior, pricing expectations, and product preferences differ between KSA and UAE — do not simply copy strategies from US/EU\n- The first 3–6 months after launch are critical for establishing ranking momentum in these marketplaces\n\n---"},{"title":"4. Enrollment Process — Step by Step","html":"<h4>Pre-Enrollment Checklist</h4>\n<p>Before starting the application, gather:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Details</th></tr></thead><tbody><tr><td><strong>Brand name</strong></td><td>Exact format as it appears on the trademark record (spaces, symbols, capitalization — though capitalization differences are accepted)</td></tr><tr><td><strong>Logo image</strong></td><td>Exact copy as it appears on the trademark record (only if you have a design mark)</td></tr><tr><td><strong>Trademark registration number</strong></td><td>Exact format from the issuing IP office (e.g., SAIP registration number)</td></tr><tr><td><strong>Trademark office</strong></td><td>The specific government office that issued the trademark</td></tr><tr><td><strong>Product categories</strong></td><td>Categories in which you sell products under this brand</td></tr><tr><td><strong>Product images</strong></td><td>Photos of your actual product or packaging with the brand name <strong>permanently affixed</strong></td></tr><tr><td><strong>Website & distribution info</strong></td><td>Brand's website URL and distribution details (if applicable)</td></tr></tbody></table></div>\n<h4>Step-by-Step Enrollment</h4>\n<p>#### Step 1: Create a Brand Registry Account</p>\n<ul><li>Go to <strong>brandservices.amazon.com</strong></li><li>Sign in using the <strong>same credentials</strong> you use for Seller Central or Vendor Central</li><li>This is critical — using the same login links your selling account to Brand Registry, giving you seamless access to brand tools in both portals</li><li>If you don't have a selling account, you can still create a Brand Registry account for IP protection purposes</li><li>On the Brand Registry homepage, click <strong>\"Enroll a new brand\"</strong></li></ul>\n<p>#### Step 2: Provide Brand Information</p>\n<ul><li>Enter your <strong>brand name</strong> — must match the trademark record exactly</li><li>Select the <strong>trademark office</strong> (e.g., SAIP for Saudi Arabia)</li><li>Enter the <strong>trademark registration number</strong> (or pending application number if using IP Accelerator)</li><li>Select the <strong>trademark type</strong> (word mark or design mark)</li><li>If design mark: upload the <strong>logo image</strong> exactly as it appears on the trademark record</li><li>Select the <strong>product categories</strong> for your brand</li></ul>\n<p>#### Step 3: Submit Product Images</p>\n<ul><li>Upload images of your <strong>actual product or product packaging</strong> showing the brand name</li><li>The brand name must be <strong>permanently affixed</strong> to the product or packaging</li><li>\"Permanently affixed\" means applied during production via:</li><li><span class=\"icon-yes\">✅</span> Printing, sewing, laser etching, engraving, embossing, molding</li><li><span class=\"icon-no\">❌</span> <strong>NOT accepted</strong>: Stickers, labels, stamps, hang tags (can be easily added/removed after production)</li><li><span class=\"icon-no\">❌</span> <strong>NOT accepted</strong>: Stock images, digitally altered images, computer-generated mockups</li></ul>\n<p>#### Step 4: Provide Additional Information</p>\n<ul><li>You may be asked for manufacturing or distribution information</li><li>Provide your brand website URL if applicable</li><li>Additional documents may be requested to verify identity as the rights owner</li></ul>\n<p>#### Step 5: Review and Submit</p>\n<ul><li>Double-check all information for accuracy</li><li>Ensure brand name spelling matches the trademark record exactly</li><li>Verify the correct trademark office is selected</li><li>Submit the application</li></ul>\n<p>---</p>\n","searchText":"Before starting the application, gather:\n\n| Item | Details |\n|------|---------|\n| **Brand name** | Exact format as it appears on the trademark record (spaces, symbols, capitalization — though capitalization differences are accepted) |\n| **Logo image** | Exact copy as it appears on the trademark record (only if you have a design mark) |\n| **Trademark registration number** | Exact format from the issuing IP office (e.g., SAIP registration number) |\n| **Trademark office** | The specific government office that issued the trademark |\n| **Product categories** | Categories in which you sell products under this brand |\n| **Product images** | Photos of your actual product or packaging with the brand name **permanently affixed** |\n| **Website & distribution info** | Brand's website URL and distribution details (if applicable) | #### Step 1: Create a Brand Registry Account\n1. Go to **brandservices.amazon.com**\n2. Sign in using the **same credentials** you use for Seller Central or Vendor Central\n   - This is critical — using the same login links your selling account to Brand Registry, giving you seamless access to brand tools in both portals\n3. If you don't have a selling account, you can still create a Brand Registry account for IP protection purposes\n4. On the Brand Registry homepage, click **\"Enroll a new brand\"**\n\n#### Step 2: Provide Brand Information\n1. Enter your **brand name** — must match the trademark record exactly\n2. Select the **trademark office** (e.g., SAIP for Saudi Arabia)\n3. Enter the **trademark registration number** (or pending application number if using IP Accelerator)\n4. Select the **trademark type** (word mark or design mark)\n5. If design mark: upload the **logo image** exactly as it appears on the trademark record\n6. Select the **product categories** for your brand\n\n#### Step 3: Submit Product Images\n1. Upload images of your **actual product or product packaging** showing the brand name\n2. The brand name must be **permanently affixed** to the product or packaging\n3. \"Permanently affixed\" means applied during production via:\n   - ✅ Printing, sewing, laser etching, engraving, embossing, molding\n   - ❌ **NOT accepted**: Stickers, labels, stamps, hang tags (can be easily added/removed after production)\n   - ❌ **NOT accepted**: Stock images, digitally altered images, computer-generated mockups\n\n#### Step 4: Provide Additional Information\n- You may be asked for manufacturing or distribution information\n- Provide your brand website URL if applicable\n- Additional documents may be requested to verify identity as the rights owner\n\n#### Step 5: Review and Submit\n1. Double-check all information for accuracy\n2. Ensure brand name spelling matches the trademark record exactly\n3. Verify the correct trademark office is selected\n4. Submit the application\n\n---"},{"title":"5. Verification Process","html":"<h4>How Verification Works</h4>\n<p>After submission, Amazon verifies you are the legitimate trademark rights owner:</p>\n<ul><li><strong>Amazon sends a verification code</strong> to the <strong>public contact listed on the trademark record</strong></li><li>This is usually the <strong>trademark attorney</strong> or <strong>correspondent on file</strong> with the trademark office — <strong>not</strong> the Seller Central login email</li><li>For SAIP trademarks, this is the contact registered with SAIP</li><li>That person receives the code via <strong>email or postal mail</strong> (varies by trademark office)</li><li>The code recipient must <strong>share the code with you</strong></li><li>You then <strong>enter the verification code</strong> in your Brand Registry case log to complete enrollment</li></ul>\n<h4>Critical Tips for Verification</h4>\n<ul><li><strong>Before submitting</strong>: Alert the trademark attorney/correspondent to watch for the verification code email from Amazon</li><li><strong>Timeline</strong>: The code typically arrives within a few business days, but can vary</li><li><strong>Overall approval timeline</strong>: Typically <strong>2–4 weeks</strong> from submission to approval, assuming no issues</li><li>If there is no response within one week, consider retracting and resubmitting the application</li><li>Single-submission claims are usually processed within <strong>48 hours</strong> if everything is clean</li></ul>\n<h4>What Can Go Wrong with Verification</h4>\n<ul><li>The trademark attorney's email rejects or filters Amazon's message as spam</li><li>The contact on the trademark record has changed and wasn't updated</li><li>The verification code expires before being entered</li><li>The applicant enters an incorrect code</li></ul>\n<p>---</p>\n","searchText":"After submission, Amazon verifies you are the legitimate trademark rights owner:\n\n1. **Amazon sends a verification code** to the **public contact listed on the trademark record**\n   - This is usually the **trademark attorney** or **correspondent on file** with the trademark office — **not** the Seller Central login email\n   - For SAIP trademarks, this is the contact registered with SAIP\n2. That person receives the code via **email or postal mail** (varies by trademark office)\n3. The code recipient must **share the code with you**\n4. You then **enter the verification code** in your Brand Registry case log to complete enrollment - **Before submitting**: Alert the trademark attorney/correspondent to watch for the verification code email from Amazon\n- **Timeline**: The code typically arrives within a few business days, but can vary\n- **Overall approval timeline**: Typically **2–4 weeks** from submission to approval, assuming no issues\n- If there is no response within one week, consider retracting and resubmitting the application\n- Single-submission claims are usually processed within **48 hours** if everything is clean - The trademark attorney's email rejects or filters Amazon's message as spam\n- The contact on the trademark record has changed and wasn't updated\n- The verification code expires before being entered\n- The applicant enters an incorrect code\n\n---"},{"title":"6. Benefits of Brand Registry","html":"<h4>6.1 A+ Content (Enhanced Brand Content)</h4>\n<p><strong>What it is</strong>: Replaces the plain-text product description with rich multimedia content on product detail pages.</p>\n<p><strong>Two tiers</strong>:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Feature</th><th>Basic A+ Content</th><th>Premium A+ Content</th></tr></thead><tbody><tr><td><strong>Cost</strong></td><td>Free</td><td>Free (eligibility-based)</td></tr><tr><td><strong>Image modules</strong></td><td>Standard image sizes</td><td>Larger, higher-quality images</td></tr><tr><td><strong>Video</strong></td><td>Not available</td><td>Video support</td></tr><tr><td><strong>Interactive elements</strong></td><td>Comparison charts, image/text modules</td><td>Interactive hotspots, image carousels, Q&A modules</td></tr><tr><td><strong>Shoppable content</strong></td><td>Basic</td><td>Full shoppable content integration</td></tr></tbody></table></div>\n<p><strong>Impact</strong>: A+ Content typically increases conversion rates by <strong>8–12%</strong> on average.</p>\n<p><strong>Practical notes for agents</strong>:</p>\n<ul><li>A+ Content must be created per ASIN (or applied to parent ASIN for variations)</li><li>Content must comply with Amazon's A+ Content guidelines (no time-sensitive claims, no references to competitors, no pricing info)</li><li>Arabic content for A+ is critical for amazon.sa conversions</li><li>Available immediately after Brand Registry approval</li></ul>\n<h4>6.2 Brand Store (Storefront)</h4>\n<p><strong>What it is</strong>: A dedicated, multi-page storefront within Amazon showcasing the brand's full product catalog.</p>\n<p><strong>Key features</strong>:</p>\n<ul><li>Custom branded URL (amazon.sa/stores/yourbrand)</li><li>Multiple pages with tiles, images, videos, and product grids</li><li>Serves as a landing page for Sponsored Brands ads</li><li>Free to create and maintain</li><li>Drag-and-drop Store Builder in Seller Central</li></ul>\n<p><strong>Benefits</strong>:</p>\n<ul><li>Immersive shopping experience drives higher engagement</li><li>Cross-selling opportunities across product lines</li><li>Directs traffic from Sponsored Brands ads to a curated shopping experience</li><li>Acts as a brand's \"home\" on Amazon</li></ul>\n<p><strong>Requirement</strong>: Must be enrolled in Brand Registry; seller must have Brand Representative or Reseller role.</p>\n<h4>6.3 Brand Analytics</h4>\n<p><strong>What it is</strong>: A data reporting suite available exclusively to Brand Registry members, providing aggregated customer search and purchase data.</p>\n<p><strong>Available Dashboards</strong>:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Dashboard</th><th>What It Shows</th></tr></thead><tbody><tr><td><strong>Search Query Performance</strong></td><td>Keywords customers use → volume, impressions, clicks, cart adds, purchases; your brand's share at each stage</td></tr><tr><td><strong>Search Catalog Performance</strong></td><td>How your catalog performs against specific search terms</td></tr><tr><td><strong>Top Search Terms</strong></td><td>Highest-volume search terms in your category</td></tr><tr><td><strong>Repeat Purchase Behavior</strong></td><td>Customer repurchase rates, time between purchases</td></tr><tr><td><strong>Demographics</strong></td><td>Aggregated customer demographics (age, income, education, gender)</td></tr><tr><td><strong>Market Basket Analysis</strong></td><td>What customers buy together with your products</td></tr><tr><td><strong>Customer Loyalty Analytics</strong></td><td>Customer segmentation by loyalty tier (new, at-risk, loyal, etc.)</td></tr><tr><td><strong>Customer Journey Analytics</strong></td><td>How customers discover and engage with your brand</td></tr></tbody></table></div>\n<p><strong>Why it matters</strong>: This is the same data Amazon's internal retail team uses for merchandising decisions. Non-registered sellers have zero access to these insights.</p>\n<p><strong>Note for MENA</strong>: Brand Analytics data is available on amazon.sa, but data volume may be smaller than mature marketplaces like US or EU due to marketplace size.</p>\n<h4>6.4 Sponsored Brands Advertising</h4>\n<p><strong>What it is</strong>: Cost-per-click (CPC) banner ads featuring the brand's logo, a custom headline, and multiple products.</p>\n<p><strong>Key points</strong>:</p>\n<ul><li>Requires Brand Registry enrollment</li><li>Ads appear at the top of search results, category pages, and product detail pages</li><li>Can link to Brand Store or a custom landing page</li><li>Supports video ad format (Sponsored Brands Video)</li><li>Higher visibility positioning than standard Sponsored Products ads</li></ul>\n<h4>6.5 Amazon Vine</h4>\n<p><strong>What it is</strong>: Amazon's invitation-only review program where trusted reviewers receive free products and leave honest reviews.</p>\n<p><strong>Key points</strong>:</p>\n<ul><li>Requires Brand Registry</li><li>Helps kickstart reviews for new product launches</li><li>Available on amazon.sa (check current availability)</li><li>Reviews are marked as \"Vine Voice\" but are genuine, unbiased opinions</li></ul>\n<h4>6.6 Virtual Bundles</h4>\n<p><strong>What it is</strong>: Allows creation of product bundles that combine multiple ASINs into a single listing without physical repackaging.</p>\n<p><strong>Key points</strong>:</p>\n<ul><li>Only available to Brand Representatives (not Resellers)</li><li>FBA inventory required</li><li>Great for increasing average order value</li><li>No additional packaging or fulfillment changes needed</li></ul>\n<p>---</p>\n","searchText":"**What it is**: Replaces the plain-text product description with rich multimedia content on product detail pages.\n\n**Two tiers**:\n\n| Feature | Basic A+ Content | Premium A+ Content |\n|---------|-----------------|-------------------|\n| **Cost** | Free | Free (eligibility-based) |\n| **Image modules** | Standard image sizes | Larger, higher-quality images |\n| **Video** | Not available | Video support |\n| **Interactive elements** | Comparison charts, image/text modules | Interactive hotspots, image carousels, Q&A modules |\n| **Shoppable content** | Basic | Full shoppable content integration |\n\n**Impact**: A+ Content typically increases conversion rates by **8–12%** on average.\n\n**Practical notes for agents**:\n- A+ Content must be created per ASIN (or applied to parent ASIN for variations)\n- Content must comply with Amazon's A+ Content guidelines (no time-sensitive claims, no references to competitors, no pricing info)\n- Arabic content for A+ is critical for amazon.sa conversions\n- Available immediately after Brand Registry approval **What it is**: A dedicated, multi-page storefront within Amazon showcasing the brand's full product catalog.\n\n**Key features**:\n- Custom branded URL (amazon.sa/stores/yourbrand)\n- Multiple pages with tiles, images, videos, and product grids\n- Serves as a landing page for Sponsored Brands ads\n- Free to create and maintain\n- Drag-and-drop Store Builder in Seller Central\n\n**Benefits**:\n- Immersive shopping experience drives higher engagement\n- Cross-selling opportunities across product lines\n- Directs traffic from Sponsored Brands ads to a curated shopping experience\n- Acts as a brand's \"home\" on Amazon\n\n**Requirement**: Must be enrolled in Brand Registry; seller must have Brand Representative or Reseller role. **What it is**: A data reporting suite available exclusively to Brand Registry members, providing aggregated customer search and purchase data.\n\n**Available Dashboards**:\n\n| Dashboard | What It Shows |\n|-----------|---------------|\n| **Search Query Performance** | Keywords customers use → volume, impressions, clicks, cart adds, purchases; your brand's share at each stage |\n| **Search Catalog Performance** | How your catalog performs against specific search terms |\n| **Top Search Terms** | Highest-volume search terms in your category |\n| **Repeat Purchase Behavior** | Customer repurchase rates, time between purchases |\n| **Demographics** | Aggregated customer demographics (age, income, education, gender) |\n| **Market Basket Analysis** | What customers buy together with your products |\n| **Customer Loyalty Analytics** | Customer segmentation by loyalty tier (new, at-risk, loyal, etc.) |\n| **Customer Journey Analytics** | How customers discover and engage with your brand |\n\n**Why it matters**: This is the same data Amazon's internal retail team uses for merchandising decisions. Non-registered sellers have zero access to these insights.\n\n**Note for MENA**: Brand Analytics data is available on amazon.sa, but data volume may be smaller than mature marketplaces like US or EU due to marketplace size. **What it is**: Cost-per-click (CPC) banner ads featuring the brand's logo, a custom headline, and multiple products.\n\n**Key points**:\n- Requires Brand Registry enrollment\n- Ads appear at the top of search results, category pages, and product detail pages\n- Can link to Brand Store or a custom landing page\n- Supports video ad format (Sponsored Brands Video)\n- Higher visibility positioning than standard Sponsored Products ads **What it is**: Amazon's invitation-only review program where trusted reviewers receive free products and leave honest reviews.\n\n**Key points**:\n- Requires Brand Registry\n- Helps kickstart reviews for new product launches\n- Available on amazon.sa (check current availability)\n- Reviews are marked as \"Vine Voice\" but are genuine, unbiased opinions **What it is**: Allows creation of product bundles that combine multiple ASINs into a single listing without physical repackaging.\n\n**Key points**:\n- Only available to Brand Representatives (not Resellers)\n- FBA inventory required\n- Great for increasing average order value\n- No additional packaging or fulfillment changes needed\n\n---"},{"title":"7. Brand Protection & IP Tools","html":"<h4>7.1 Automated Protections</h4>\n<p><strong>What they are</strong>: Machine learning algorithms that automatically scan the Amazon catalog for potential IP violations.</p>\n<p><strong>How they work</strong>:</p>\n<ul><li>Activated automatically upon Brand Registry enrollment — no manual setup required</li><li>Scans for trademark infringement, inaccurate product information, and potential counterfeits</li><li>Blocks/prevents violations <strong>before</strong> they impact the brand or customers</li><li>Gets smarter over time based on your accurate use of Report a Violation</li></ul>\n<p><strong>Scale</strong>: Amazon's automated protections have blocked billions of suspected bad listings before they were ever published.</p>\n<h4>7.2 Report a Violation (RAV)</h4>\n<p><strong>What it is</strong>: The primary self-service tool for reporting suspected intellectual property infringement.</p>\n<p><strong>Types of violations you can report</strong>:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Violation Type</th><th>Description</th></tr></thead><tbody><tr><td><strong>Trademark Infringement</strong></td><td>Unauthorized use of your trademark on listings, products, or packaging. Can be ASIN-level (whole listing) or offer-level (specific seller on a listing)</td></tr><tr><td><strong>Copyright Infringement</strong></td><td>Unauthorized use of your copyrighted content (images, text, videos)</td></tr><tr><td><strong>Patent Infringement</strong></td><td>Listings that infringe on your registered design or utility patents</td></tr><tr><td><strong>Store Policy Violations</strong></td><td>Listing inaccuracies, wrong product information, etc.</td></tr></tbody></table></div>\n<p><strong>How to use RAV</strong>:</p>\n<ul><li>Log into Brand Registry → click <strong>Protect</strong> → <strong>Report a Violation</strong></li><li>Search for the ASIN or listing</li><li>Select the type of violation</li><li>Provide evidence and supporting documentation</li><li>Submit the report</li></ul>\n<p><strong>Key details</strong>:</p>\n<ul><li>Supports <strong>bulk reporting</strong> for multiple violations at once</li><li>Typical resolution: Brand Registry complaints get resolution in <strong>24–48 hours</strong> (vs. 7–14 days for generic IP complaints)</li><li><strong>Accuracy matters</strong>: Your acceptance rate on RAV submissions directly affects your eligibility for Project Zero</li><li>Available globally, including for amazon.sa and amazon.ae listings</li></ul>\n<h4>7.3 Project Zero</h4>\n<p><strong>What it is</strong>: Amazon's premium anti-counterfeiting program with three pillars:</p>\n<p><strong>Pillar 1: Automated Protections</strong></p>\n<ul><li>Enhanced automated scanning that continuously scans 8+ billion listings daily</li><li>Uses machine learning trained on your brand's specific data</li></ul>\n<p><strong>Pillar 2: Self-Service Counterfeit Removal</strong></p>\n<ul><li>Brands can <strong>directly and immediately remove</strong> suspected counterfeit listings — no need to wait for Amazon review</li><li>Removal happens in under <strong>60 seconds</strong> (vs. 72+ hours via standard RAV)</li><li>⚠️ Only for counterfeits — not for other types of IP violations</li></ul>\n<p><strong>Pillar 3: Product Serialization (via Transparency)</strong></p>\n<ul><li>Optional integration with Transparency for unit-level authentication</li></ul>\n<p><strong>Eligibility Requirements</strong>:</p>\n<ul><li>Must be enrolled in Brand Registry</li><li>Must have a <strong>registered trademark</strong> (not pending)</li><li>Must have a <strong>90%+ acceptance rate</strong> on Report a Violation submissions over the past 6 months</li><li>Active use of RAV is required (demonstrate pattern of legitimate reporting)</li></ul>\n<p><strong>How to Enroll</strong>:</p>\n<ul><li>Check eligibility: Sign into Brand Registry → navigate to the <strong>Project Zero page</strong></li><li>If eligible, complete the <strong>15-minute online training</strong> (covers counterfeit policy and tool usage, includes a quiz)</li><li>After passing the training, enrollment is complete</li></ul>\n<p><strong>Critical Accuracy Requirement</strong>:</p>\n<ul><li>Must maintain at least <strong>99% removal accuracy</strong> to keep access</li><li>Amazon will <strong>permanently revoke access</strong> if accuracy drops below this threshold</li><li>Only use the tool for genuine counterfeit cases — do not use it to remove legitimate competitors</li></ul>\n<p><strong>Availability for MENA</strong>: Project Zero self-service removal is available for stores in countries where the brand has an active registered trademark. For amazon.sa, this would require a SAIP-registered trademark linked to Brand Registry.</p>\n<h4>7.4 Transparency Program</h4>\n<p><strong>What it is</strong>: A product serialization service that assigns a <strong>unique 2D barcode</strong> to every individual unit of an enrolled product.</p>\n<p><strong>How it works</strong>:</p>\n<ul><li>Brand enrolls specific ASINs in Transparency</li><li>Amazon generates unique serialized codes for each unit</li><li>Codes are printed on each physical product or its packaging during manufacturing</li><li>When units arrive at FBA warehouses, Amazon <strong>scans every unit</strong> and verifies the code</li><li>Only units with valid Transparency codes are accepted — counterfeit/unauthorized units are rejected at intake</li></ul>\n<p><strong>Cost</strong>:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Annual Volume</th><th>Cost Per Code</th></tr></thead><tbody><tr><td>Low volume</td><td>~$0.05 per code</td></tr><tr><td>Medium volume</td><td>~$0.03 per code</td></tr><tr><td>High volume</td><td>~$0.01 per code</td></tr></tbody></table></div>\n<p><strong>Benefits</strong>:</p>\n<ul><li>Prevents counterfeit units from entering FBA commingled inventory</li><li>Protects against listing hijacking at the fulfillment level</li><li>Customers can scan codes via the Amazon Shopping app to verify authenticity</li><li>Reduces returns by 20–30% (fewer \"not as described\" returns)</li></ul>\n<p><strong>Requirements</strong>:</p>\n<ul><li>Must be enrolled in Brand Registry</li><li>Must apply unique codes to <strong>every unit</strong> of enrolled ASINs (even those sold outside Amazon)</li><li>Manufacturing/packaging process must be updated to apply codes</li></ul>\n<div class=\"callout warning\">⚠️ <strong>MENA Availability</strong>: Transparency is <strong>NOT currently available</strong> on amazon.sa or amazon.ae as of late 2025. Available in: US, Canada, UK, Germany, France, Italy, Spain, Australia, India, Japan. No official timeline for MENA expansion. The Report a Violation tool is the recommended alternative for MENA anti-counterfeiting.</div>\n<h4>7.5 Counterfeit Crimes Unit (CCU)</h4>\n<p><strong>What it is</strong>: Amazon's dedicated global team that investigates and pursues legal action against counterfeiters.</p>\n<p><strong>Key points</strong>:</p>\n<ul><li>Works with law enforcement, brand owners, and rights holders</li><li>Pursues civil litigation and criminal referrals against bad actors</li><li>Brand Registry enrollment helps feed data to CCU for pattern detection</li><li>Not a tool sellers use directly — it's Amazon's internal enforcement arm</li></ul>\n<p>---</p>\n","searchText":"**What they are**: Machine learning algorithms that automatically scan the Amazon catalog for potential IP violations.\n\n**How they work**:\n- Activated automatically upon Brand Registry enrollment — no manual setup required\n- Scans for trademark infringement, inaccurate product information, and potential counterfeits\n- Blocks/prevents violations **before** they impact the brand or customers\n- Gets smarter over time based on your accurate use of Report a Violation\n\n**Scale**: Amazon's automated protections have blocked billions of suspected bad listings before they were ever published. **What it is**: The primary self-service tool for reporting suspected intellectual property infringement.\n\n**Types of violations you can report**:\n\n| Violation Type | Description |\n|----------------|-------------|\n| **Trademark Infringement** | Unauthorized use of your trademark on listings, products, or packaging. Can be ASIN-level (whole listing) or offer-level (specific seller on a listing) |\n| **Copyright Infringement** | Unauthorized use of your copyrighted content (images, text, videos) |\n| **Patent Infringement** | Listings that infringe on your registered design or utility patents |\n| **Store Policy Violations** | Listing inaccuracies, wrong product information, etc. |\n\n**How to use RAV**:\n1. Log into Brand Registry → click **Protect** → **Report a Violation**\n2. Search for the ASIN or listing\n3. Select the type of violation\n4. Provide evidence and supporting documentation\n5. Submit the report\n\n**Key details**:\n- Supports **bulk reporting** for multiple violations at once\n- Typical resolution: Brand Registry complaints get resolution in **24–48 hours** (vs. 7–14 days for generic IP complaints)\n- **Accuracy matters**: Your acceptance rate on RAV submissions directly affects your eligibility for Project Zero\n- Available globally, including for amazon.sa and amazon.ae listings **What it is**: Amazon's premium anti-counterfeiting program with three pillars:\n\n**Pillar 1: Automated Protections**\n- Enhanced automated scanning that continuously scans 8+ billion listings daily\n- Uses machine learning trained on your brand's specific data\n\n**Pillar 2: Self-Service Counterfeit Removal**\n- Brands can **directly and immediately remove** suspected counterfeit listings — no need to wait for Amazon review\n- Removal happens in under **60 seconds** (vs. 72+ hours via standard RAV)\n- ⚠️ Only for counterfeits — not for other types of IP violations\n\n**Pillar 3: Product Serialization (via Transparency)**\n- Optional integration with Transparency for unit-level authentication\n\n**Eligibility Requirements**:\n- Must be enrolled in Brand Registry\n- Must have a **registered trademark** (not pending)\n- Must have a **90%+ acceptance rate** on Report a Violation submissions over the past 6 months\n- Active use of RAV is required (demonstrate pattern of legitimate reporting)\n\n**How to Enroll**:\n1. Check eligibility: Sign into Brand Registry → navigate to the **Project Zero page**\n2. If eligible, complete the **15-minute online training** (covers counterfeit policy and tool usage, includes a quiz)\n3. After passing the training, enrollment is complete\n\n**Critical Accuracy Requirement**:\n- Must maintain at least **99% removal accuracy** to keep access\n- Amazon will **permanently revoke access** if accuracy drops below this threshold\n- Only use the tool for genuine counterfeit cases — do not use it to remove legitimate competitors\n\n**Availability for MENA**: Project Zero self-service removal is available for stores in countries where the brand has an active registered trademark. For amazon.sa, this would require a SAIP-registered trademark linked to Brand Registry. **What it is**: A product serialization service that assigns a **unique 2D barcode** to every individual unit of an enrolled product.\n\n**How it works**:\n1. Brand enrolls specific ASINs in Transparency\n2. Amazon generates unique serialized codes for each unit\n3. Codes are printed on each physical product or its packaging during manufacturing\n4. When units arrive at FBA warehouses, Amazon **scans every unit** and verifies the code\n5. Only units with valid Transparency codes are accepted — counterfeit/unauthorized units are rejected at intake\n\n**Cost**:\n| Annual Volume | Cost Per Code |\n|---------------|---------------|\n| Low volume | ~$0.05 per code |\n| Medium volume | ~$0.03 per code |\n| High volume | ~$0.01 per code |\n\n**Benefits**:\n- Prevents counterfeit units from entering FBA commingled inventory\n- Protects against listing hijacking at the fulfillment level\n- Customers can scan codes via the Amazon Shopping app to verify authenticity\n- Reduces returns by 20–30% (fewer \"not as described\" returns)\n\n**Requirements**:\n- Must be enrolled in Brand Registry\n- Must apply unique codes to **every unit** of enrolled ASINs (even those sold outside Amazon)\n- Manufacturing/packaging process must be updated to apply codes\n\n> ⚠️ **MENA Availability**: Transparency is **NOT currently available** on amazon.sa or amazon.ae as of late 2025. Available in: US, Canada, UK, Germany, France, Italy, Spain, Australia, India, Japan. No official timeline for MENA expansion. The Report a Violation tool is the recommended alternative for MENA anti-counterfeiting. **What it is**: Amazon's dedicated global team that investigates and pursues legal action against counterfeiters.\n\n**Key points**:\n- Works with law enforcement, brand owners, and rights holders\n- Pursues civil litigation and criminal referrals against bad actors\n- Brand Registry enrollment helps feed data to CCU for pattern detection\n- Not a tool sellers use directly — it's Amazon's internal enforcement arm\n\n---"},{"title":"8. Brand Registry vs. Not Having It","html":"<h4>Comparison Table</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Capability</th><th>Without Brand Registry</th><th>With Brand Registry</th></tr></thead><tbody><tr><td><strong>Listing control</strong></td><td>Any seller can edit your title, bullet points, images</td><td>Brand owner has authoritative control over product detail pages</td></tr><tr><td><strong>A+ Content</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Full access (basic + potential premium)</td></tr><tr><td><strong>Brand Store</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Dedicated multi-page storefront</td></tr><tr><td><strong>Sponsored Brands ads</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Banner ads with logo, headline, multiple products</td></tr><tr><td><strong>Brand Analytics</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Full analytics suite (search, demographics, loyalty, etc.)</td></tr><tr><td><strong>Amazon Vine</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Access to Vine review program</td></tr><tr><td><strong>Virtual Bundles</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Create bundles without repackaging</td></tr><tr><td><strong>IP violation reporting</strong></td><td>Generic IP complaint form (7–14 day resolution)</td><td>Report a Violation tool (24–48 hour resolution)</td></tr><tr><td><strong>Automated protections</strong></td><td><span class=\"icon-no\">❌</span> None</td><td><span class=\"icon-yes\">✅</span> ML-powered proactive scanning</td></tr><tr><td><strong>Project Zero</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Self-service counterfeit removal (if eligible)</td></tr><tr><td><strong>Transparency</strong></td><td><span class=\"icon-no\">❌</span> Not available</td><td><span class=\"icon-yes\">✅</span> Unit-level serialization (if available in marketplace)</td></tr><tr><td><strong>New ASIN creation</strong></td><td>Limited (2026 policy tightening)</td><td>Full control over ASIN creation for the brand</td></tr><tr><td><strong>Listing hijack response</strong></td><td>Slow, manual process</td><td>Fast, dedicated Brand Registry support channel</td></tr><tr><td><strong>Content protection</strong></td><td>Others can copy images/text with limited recourse</td><td>Proactive content scanning + dedicated reporting</td></tr></tbody></table></div>\n<h4>The Bottom Line</h4>\n<blockquote>\"A brand selling on Amazon without Brand Registry is renting shelf space it can't control.\" — Industry consensus</blockquote>\n<p>Brand Registry is considered <strong>non-optional infrastructure</strong> for any brand that takes its Amazon presence seriously. It is analogous to setting up your product catalog correctly or securing your GS1 barcodes — a foundational step, not a nice-to-have.</p>\n<p>---</p>\n","searchText":"| Capability | Without Brand Registry | With Brand Registry |\n|------------|----------------------|---------------------|\n| **Listing control** | Any seller can edit your title, bullet points, images | Brand owner has authoritative control over product detail pages |\n| **A+ Content** | ❌ Not available | ✅ Full access (basic + potential premium) |\n| **Brand Store** | ❌ Not available | ✅ Dedicated multi-page storefront |\n| **Sponsored Brands ads** | ❌ Not available | ✅ Banner ads with logo, headline, multiple products |\n| **Brand Analytics** | ❌ Not available | ✅ Full analytics suite (search, demographics, loyalty, etc.) |\n| **Amazon Vine** | ❌ Not available | ✅ Access to Vine review program |\n| **Virtual Bundles** | ❌ Not available | ✅ Create bundles without repackaging |\n| **IP violation reporting** | Generic IP complaint form (7–14 day resolution) | Report a Violation tool (24–48 hour resolution) |\n| **Automated protections** | ❌ None | ✅ ML-powered proactive scanning |\n| **Project Zero** | ❌ Not available | ✅ Self-service counterfeit removal (if eligible) |\n| **Transparency** | ❌ Not available | ✅ Unit-level serialization (if available in marketplace) |\n| **New ASIN creation** | Limited (2026 policy tightening) | Full control over ASIN creation for the brand |\n| **Listing hijack response** | Slow, manual process | Fast, dedicated Brand Registry support channel |\n| **Content protection** | Others can copy images/text with limited recourse | Proactive content scanning + dedicated reporting | > \"A brand selling on Amazon without Brand Registry is renting shelf space it can't control.\" — Industry consensus\n\nBrand Registry is considered **non-optional infrastructure** for any brand that takes its Amazon presence seriously. It is analogous to setting up your product catalog correctly or securing your GS1 barcodes — a foundational step, not a nice-to-have.\n\n---"},{"title":"9. Managing Brand Representatives & Roles","html":"<p>Brand Registry uses two categories of roles: <strong>Protection Roles</strong> (for IP enforcement) and <strong>Selling Roles</strong> (for selling benefits).</p><h4>9.1 Protection Roles</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Role</th><th>How Assigned</th><th>Access Level</th></tr></thead><tbody><tr><td><strong>Administrator</strong></td><td>Auto-assigned to trademark owner upon enrollment</td><td>Full access: can assign/manage all roles, use all protection tools, access User Permissions</td></tr><tr><td><strong>Rights Owner</strong></td><td>Auto-assigned to trademark owner; can be updated by Administrator</td><td>Access to protection benefits including Report a Violation</td></tr><tr><td><strong>Registered Agent</strong></td><td>Manually assigned by Administrator</td><td>Third-party authorized to report suspected IP violations on behalf of the brand (e.g., IP attorney, agency)</td></tr></tbody></table></div>\n<p><strong>Best practices</strong>:</p>\n<ul><li>Have <strong>more than one Administrator</strong> for continuity</li><li>Only assign protection roles to <strong>internal/employee accounts</strong> — not to external resellers or agencies (except Registered Agent for IP firms)</li><li>Use discretion — protection roles provide access to potentially sensitive brand information</li></ul>\n<h4>9.2 Selling Roles</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Role</th><th>Who It's For</th><th>Access Level</th></tr></thead><tbody><tr><td><strong>Brand Representative</strong></td><td>Internal, first-party sellers directly employed by the brand</td><td><strong>Full access</strong>: A+ Content, Brand Store, Sponsored Brands, Brand Analytics, Vine, Virtual Bundles, new ASIN creation</td></tr><tr><td><strong>Reseller</strong></td><td>External, third-party sellers authorized to sell the brand's products</td><td><strong>Limited access</strong>: A+ Content, Brand Store, Sponsored Brands, new ASIN creation — but <strong>NO Brand Analytics</strong> (protects brand's private data)</td></tr></tbody></table></div>\n<p><strong>Key update (July 2026)</strong>: Brand Registry Administrators now use <strong>Account IDs</strong> instead of Merchant Tokens to manage selling roles, simplifying the process.</p>\n<p><strong>Important for 2026</strong>: Under updated ASIN creation policies, vendors in the US store who want to create new ASINs for brands enrolled in Brand Registry must have a formally assigned Reseller role. Without one, ASIN creation is blocked.</p>\n<h4>9.3 How to Assign Roles</h4>\n<p>#### Assigning Protection Roles</p>\n<ul><li>Log in to Brand Registry → hover over gear icon → <strong>User Permissions</strong></li><li>Click <strong>\"Invite a user to your brand\"</strong></li><li>Enter the user's Brand Registry account email, name, and preferred language</li><li>Select the brand</li><li>Choose the store/marketplace</li><li>Check the boxes for the role(s) to assign</li><li>Click <strong>Send invitation</strong></li><li>The user accepts via email to activate</li></ul>\n<p>#### Assigning Selling Roles</p>\n<ul><li>Log in to Brand Registry → <strong>Manage</strong> → <strong>Manage Selling Accounts</strong></li><li>Click <strong>\"Connect a selling account\"</strong></li><li>Choose role type: <strong>Brand Representative</strong> or <strong>Reseller</strong></li><li>Select <strong>your own account</strong> from dropdown, or choose <strong>\"Other account\"</strong> and enter the seller's Account ID (formerly Merchant Token)</li><li>Select the relevant brand</li><li>Click <strong>Connect a selling account</strong></li><li>An invitation email is sent to the seller; role becomes active once accepted</li></ul>\n<p>#### Managing Existing Roles</p>\n<ul><li>Return to <strong>User Permissions</strong> (protection) or <strong>Manage Selling Accounts</strong> (selling) at any time</li><li>View pending invitations under <strong>Open Invitations</strong> tab</li><li>Accept/reject incoming requests from sellers under the <strong>Requests</strong> tab</li><li>Update or remove roles by selecting <strong>Manage</strong> next to any account</li></ul>\n<p>#### Role Combinations</p>\n<ul><li>A user can have <strong>one selling role</strong> per selling account (either Brand Representative or Reseller, not both)</li><li>A user can simultaneously hold protection roles and a selling role</li><li>Example: A brand owner might hold <strong>Administrator + Rights Owner + Brand Representative</strong> on the same account</li></ul>\n<p>---</p>\n","searchText":"Brand Registry uses two categories of roles: **Protection Roles** (for IP enforcement) and **Selling Roles** (for selling benefits).| Role | How Assigned | Access Level |\n|------|-------------|-------------|\n| **Administrator** | Auto-assigned to trademark owner upon enrollment | Full access: can assign/manage all roles, use all protection tools, access User Permissions |\n| **Rights Owner** | Auto-assigned to trademark owner; can be updated by Administrator | Access to protection benefits including Report a Violation |\n| **Registered Agent** | Manually assigned by Administrator | Third-party authorized to report suspected IP violations on behalf of the brand (e.g., IP attorney, agency) |\n\n**Best practices**:\n- Have **more than one Administrator** for continuity\n- Only assign protection roles to **internal/employee accounts** — not to external resellers or agencies (except Registered Agent for IP firms)\n- Use discretion — protection roles provide access to potentially sensitive brand information | Role | Who It's For | Access Level |\n|------|-------------|-------------|\n| **Brand Representative** | Internal, first-party sellers directly employed by the brand | **Full access**: A+ Content, Brand Store, Sponsored Brands, Brand Analytics, Vine, Virtual Bundles, new ASIN creation |\n| **Reseller** | External, third-party sellers authorized to sell the brand's products | **Limited access**: A+ Content, Brand Store, Sponsored Brands, new ASIN creation — but **NO Brand Analytics** (protects brand's private data) |\n\n**Key update (July 2026)**: Brand Registry Administrators now use **Account IDs** instead of Merchant Tokens to manage selling roles, simplifying the process.\n\n**Important for 2026**: Under updated ASIN creation policies, vendors in the US store who want to create new ASINs for brands enrolled in Brand Registry must have a formally assigned Reseller role. Without one, ASIN creation is blocked. #### Assigning Protection Roles\n1. Log in to Brand Registry → hover over gear icon → **User Permissions**\n2. Click **\"Invite a user to your brand\"**\n3. Enter the user's Brand Registry account email, name, and preferred language\n4. Select the brand\n5. Choose the store/marketplace\n6. Check the boxes for the role(s) to assign\n7. Click **Send invitation**\n8. The user accepts via email to activate\n\n#### Assigning Selling Roles\n1. Log in to Brand Registry → **Manage** → **Manage Selling Accounts**\n2. Click **\"Connect a selling account\"**\n3. Choose role type: **Brand Representative** or **Reseller**\n4. Select **your own account** from dropdown, or choose **\"Other account\"** and enter the seller's Account ID (formerly Merchant Token)\n5. Select the relevant brand\n6. Click **Connect a selling account**\n7. An invitation email is sent to the seller; role becomes active once accepted\n\n#### Managing Existing Roles\n- Return to **User Permissions** (protection) or **Manage Selling Accounts** (selling) at any time\n- View pending invitations under **Open Invitations** tab\n- Accept/reject incoming requests from sellers under the **Requests** tab\n- Update or remove roles by selecting **Manage** next to any account\n\n#### Role Combinations\n- A user can have **one selling role** per selling account (either Brand Representative or Reseller, not both)\n- A user can simultaneously hold protection roles and a selling role\n- Example: A brand owner might hold **Administrator + Rights Owner + Brand Representative** on the same account\n\n---"},{"title":"10. Common Rejection Reasons & How to Avoid Them","html":"<h4>1. Brand Name Mismatch</h4>\n<p><strong>Problem</strong>: The brand name entered during enrollment doesn't match the trademark record exactly.</p>\n<ul><li>\"Buy with Prime\" vs. \"BuywithPrime\" → rejected</li><li>Extra spaces, missing symbols, different punctuation → rejected</li><li>Capitalization differences → accepted</li></ul>\n<p><strong>Fix</strong>: Copy the brand name directly from the official trademark database. Check for exact spacing and special characters.</p>\n<h4>2. Product Images Don't Show Permanent Brand Name</h4>\n<p><strong>Problem</strong>: Images show the brand via stickers, labels, tags, or stamps rather than permanently affixed branding.</p>\n<p><strong>Accepted methods</strong>:</p>\n<ul><li>Printing directly on the product</li><li>Sewing (on textiles)</li><li>Laser etching / engraving</li><li>Embossing / molding</li></ul>\n<p><strong>NOT accepted</strong>:</p>\n<ul><li>Stickers or adhesive labels</li><li>Hang tags</li><li>Stamps</li><li>Stock images or computer-generated mockups</li><li>Digitally altered images</li></ul>\n<p><strong>Fix</strong>: Submit photos of actual production units with the brand name integrated into the product or primary packaging during manufacturing.</p>\n<h4>3. Wrong Trademark Office Selected</h4>\n<p><strong>Problem</strong>: Selected the wrong IP office (e.g., selected USPTO when the trademark is from SAIP).</p>\n<p><strong>Fix</strong>: Double-check the issuing authority. For Saudi Arabia, select <strong>SAIP (Saudi Authority for Intellectual Property)</strong>.</p>\n<h4>4. Incorrect Registration Number</h4>\n<p><strong>Problem</strong>: Entered the wrong number format — e.g., using a serial number instead of a registration number, or entering the application number when you have a fully registered mark.</p>\n<p><strong>Fix</strong>: Use the exact registration number or application number as it appears in the official IP office database. For pending trademarks, enter the application number.</p>\n<h4>5. Trademark Not Active</h4>\n<p><strong>Problem</strong>: The trademark has expired, been abandoned, or been canceled.</p>\n<p><strong>Fix</strong>: Verify the trademark status on the official IP office website (saip.gov.sa for Saudi t
