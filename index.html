<meta charset="UTF-8">

<title>AM Onboarding Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--p:#0F172A;--a:#FF9900;--a2:#F59E0B;--bg:#F8FAFC;--sf:#FFFFFF;--t:#0F172A;--t2:#475569;--t3:#94A3B8;--bd:#E2E8F0;--bl:#F1F5F9;--r:16px;--sh:0 1px 3px rgba(0,0,0,.04);--shm:0 4px 16px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
body.dk{--bg:#0F172A;--sf:#1E293B;--t:#E2E8F0;--t2:#94A3B8;--t3:#64748B;--bd:#334155;--bl:#1E293B}
.topnav{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#0F172A,#1E293B);height:60px;display:flex;align-items:center;padding:0 20px;gap:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.topnav .brand{color:#fff;font-weight:800;font-size:16px;white-space:nowrap}
.topnav .brand span{color:var(--a)}
.mp-sel{display:flex;gap:4px;margin-left:auto}
.mp-btn{border:2px solid rgba(255,255,255,.15);background:none;color:rgba(255,255,255,.6);padding:6px 14px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:.2s;white-space:nowrap}
.mp-btn:hover{border-color:rgba(255,255,255,.3);color:#fff}
.mp-btn.active{border-color:var(--a);background:rgba(255,153,0,.15);color:var(--a)}
.topnav .tbtn{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
.topnav .tbtn:hover{background:rgba(255,255,255,.15);color:#fff}

.sidebar{position:fixed;top:60px;left:0;bottom:0;width:240px;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;z-index:100;padding:16px 0}
.sb-phase{padding:4px 16px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-top:16px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);transition:.15s;border-left:3px solid transparent}
.sb-item:hover{background:var(--bl);color:var(--t)}
.sb-item.active{background:rgba(255,153,0,.08);color:var(--a);border-left-color:var(--a);font-weight:700}
.sb-item .ic{width:24px;text-align:center;font-size:16px}
.sb-check{width:18px;height:18px;border:2px solid var(--bd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:.2s;cursor:pointer}
.sb-check.done{background:var(--a);border-color:var(--a);color:#fff}

.main{margin-left:240px;margin-top:60px;min-height:calc(100vh - 60px)}
.progress-bar{height:4px;background:var(--bd);position:sticky;top:60px;z-index:90}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--a),#F59E0B);transition:width .5s;border-radius:0 2px 2px 0}

.content{max-width:900px;margin:0 auto;padding:32px 24px 100px}
.page-title{font-size:28px;font-weight:800;margin-bottom:4px}
.page-sub{font-size:14px;color:var(--t2);margin-bottom:24px}
.time-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:600;background:var(--bl);color:var(--t3);margin-bottom:16px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}
.card-h{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.card-h:hover{background:var(--bl)}
.card-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card-t{flex:1;font-size:14px;font-weight:700}
.card-sub{font-size:11px;color:var(--t3);margin-top:1px}
.card-arr{font-size:10px;color:var(--t3);transition:.3s}
.card.open .card-arr{transform:rotate(180deg)}
.card-body{display:none;padding:0 20px 20px;border-top:1px solid var(--bl)}
.card.open .card-body{display:block}

.sec-content{font-size:13px;color:var(--t2);line-height:1.8}
.sec-content h4{font-size:14px;font-weight:700;color:var(--t);margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--a)}
.sec-content p{margin-bottom:10px}
.sec-content ul{margin:6px 0 12px 20px}
.sec-content li{margin-bottom:4px}
.sec-content strong{color:var(--t)}
.sec-content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.sec-content th{background:var(--p);color:#fff;padding:8px 12px;text-align:left}
.sec-content td{padding:6px 12px;border-bottom:1px solid var(--bd)}
.sec-content tr:nth-child(even) td{background:var(--bl)}
.sec-content a{color:#3B82F6;text-decoration:none}
.sec-content a:hover{text-decoration:underline}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:16px 0}
.kpi-card{background:var(--bl);border-radius:12px;padding:16px;text-align:center}
.kpi-name{font-size:12px;font-weight:700;color:var(--t)}
.kpi-desc{font-size:11px;color:var(--t3);margin-top:4px}

.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:12px 0}
.link-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bl);border-radius:10px;font-size:12px;color:var(--t2);transition:.15s;text-decoration:none}
.link-item:hover{background:rgba(255,153,0,.08);color:var(--a)}
.link-item .li-name{font-weight:600;color:var(--t)}
.link-item .li-cat{font-size:10px;color:var(--t3)}

.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--sf);border-radius:20px;padding:40px;text-align:center;z-index:300;box-shadow:0 20px 60px rgba(0,0,0,.3);transition:.3s}
.popup.show{transform:translate(-50%,-50%) scale(1)}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250;display:none}
.popup-overlay.show{display:block}
.popup-emoji{font-size:64px;margin-bottom:12px}
.popup-title{font-size:22px;font-weight:800;margin-bottom:4px}
.popup-sub{font-size:14px;color:var(--t2)}
.popup-close{margin-top:16px;padding:8px 24px;border:none;background:var(--a);color:var(--p);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

.footer{margin-left:240px;background:var(--p);color:rgba(255,255,255,.4);text-align:center;padding:20px;font-size:11px}
.footer strong{color:var(--a)}

@media(max-width:768px){.sidebar{display:none}.main,.footer{margin-left:0}}
@media print{.topnav,.sidebar,.progress-bar,.sb-check,.popup,.popup-overlay{display:none!important}.main,.footer{margin-left:0}}

var PB = {"registration":[{"title":"1. Account Types: Individual vs Professional","html":"<p>Amazon.sa offers <strong>three registration paths</strong> for sellers:</p><h4>Individual Account (No Commercial Registration Required)</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Aspect</th><th>Details</th></tr></thead><tbody><tr><td><strong>Who it's for</strong></td><td>Small-scale sellers, beginners, those selling < 40 items/month</td></tr><tr><td><strong>Monthly fee</strong></td><td>No monthly subscription fee</td></tr><tr><td><strong>Per-item fee</strong></td><td>SAR 3.75 (~$1.00) per item sold</td></tr><tr><td><strong>Identity document</strong></td><td>National ID (for Saudi citizens) or Iqama/Resident ID (must be valid)</td></tr><tr><td><strong>Address proof</strong></td><td>Bank/credit card statement OR utility bill confirming the owner's address (PDF format)</td></tr><tr><td><strong>Commercial register</strong></td><td><strong>Not required</strong></td></tr><tr><td><strong>Limitations</strong></td><td>No access to: bulk listing tools, Amazon Advertising (PPC), advanced analytics/reports, APIs, restricted category selling, top placement on detail pages</td></tr></tbody></table></div>\n<p><strong>Important note on Individual accounts for non-Saudi residents</strong>: As of mid-2026, there is ambiguity around whether non-Saudi residents (Iqama holders) can register for Individual accounts. Amazon's SIV team has stated: <em>\"For individual accounts, we accept Saudi national ID cards for Saudi citizens.\"</em> Some sellers have reported that Iqama was previously accepted but is now sometimes rejected for Individual accounts. <strong>Advise non-Saudi resident sellers to register as a Business account with their commercial register instead.</strong></p>\n<h4>Business Account (Commercial Registration Required)</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Aspect</th><th>Details</th></tr></thead><tbody><tr><td><strong>Who it's for</strong></td><td>Established businesses, sellers planning > 40 items/month, those wanting advertising access</td></tr><tr><td><strong>Monthly fee</strong></td><td>Currently <strong>SAR 0 / free</strong> (limited-time promotion — Professional plan subscription waived)</td></tr><tr><td><strong>Per-item fee</strong></td><td>No per-item selling fee</td></tr><tr><td><strong>Identity document</strong></td><td>National ID or Iqama of the business <strong>owner</strong> (must be valid)</td></tr><tr><td><strong>Business document</strong></td><td>Business Trade License (Commercial Register / السجل التجاري) — must contain the owner's name, in PDF format</td></tr><tr><td><strong>Commercial register</strong></td><td><strong>Required</strong> — must be valid and show the owner's name</td></tr><tr><td><strong>Benefits</strong></td><td>Full access to: bulk listing tools, Amazon Advertising/PPC, advanced analytics & reports, APIs, A+ Content, restricted categories, Brand Registry eligibility, top placement eligibility</td></tr></tbody></table></div>\n<h4>Legal Representative of a Business Account</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Aspect</th><th>Details</th></tr></thead><tbody><tr><td><strong>Who it's for</strong></td><td>When someone other than the business owner is registering (e.g., an employee, authorized agent)</td></tr><tr><td><strong>Identity document</strong></td><td>National ID or Iqama of the <strong>Legal Representative</strong> (must be valid)</td></tr><tr><td><strong>Business document</strong></td><td>Business Trade License <strong>AND</strong> Power of Attorney — both must be combined in the <strong>same PDF file</strong></td></tr><tr><td><strong>Other requirements</strong></td><td>Same as Business Account (email, phone number)</td></tr></tbody></table></div>\n<h4>Key Differences at a Glance</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Feature</th><th>Individual</th><th>Professional (Business)</th></tr></thead><tbody><tr><td>Monthly subscription</td><td>None</td><td>Free (promotional) / normally $39.99</td></tr><tr><td>Per-item fee</td><td>SAR 3.75 per sale</td><td>None</td></tr><tr><td>Amazon Advertising</td><td><span class=\"icon-no\">❌</span></td><td><span class=\"icon-yes\">✅</span></td></tr><tr><td>Bulk listing tools</td><td><span class=\"icon-no\">❌</span></td><td><span class=\"icon-yes\">✅</span></td></tr><tr><td>Advanced reports/APIs</td><td><span class=\"icon-no\">❌</span></td><td><span class=\"icon-yes\">✅</span></td></tr><tr><td>Restricted categories</td><td><span class=\"icon-no\">❌</span></td><td><span class=\"icon-yes\">✅</span></td></tr><tr><td>A+ Content / Brand Registry</td><td><span class=\"icon-no\">❌</span></td><td><span class=\"icon-yes\">✅</span></td></tr><tr><td>Buy Box eligibility</td><td>Limited</td><td><span class=\"icon-yes\">✅</span></td></tr><tr><td>Commercial Register needed</td><td>No</td><td>Yes</td></tr></tbody></table></div>\n<p>---</p>\n","searchText":"Amazon.sa offers **three registration paths** for sellers:| Aspect | Details |\n|---|---|\n| **Who it's for** | Small-scale sellers, beginners, those selling < 40 items/month |\n| **Monthly fee** | No monthly subscription fee |\n| **Per-item fee** | SAR 3.75 (~$1.00) per item sold |\n| **Identity document** | National ID (for Saudi citizens) or Iqama/Resident ID (must be valid) |\n| **Address proof** | Bank/credit card statement OR utility bill confirming the owner's address (PDF format) |\n| **Commercial register** | **Not required** |\n| **Limitations** | No access to: bulk listing tools, Amazon Advertising (PPC), advanced analytics/reports, APIs, restricted category selling, top placement on detail pages |\n\n**Important note on Individual accounts for non-Saudi residents**: As of mid-2026, there is ambiguity around whether non-Saudi residents (Iqama holders) can register for Individual accounts. Amazon's SIV team has stated: *\"For individual accounts, we accept Saudi national ID cards for Saudi citizens.\"* Some sellers have reported that Iqama was previously accepted but is now sometimes rejected for Individual accounts. **Advise non-Saudi resident sellers to register as a Business account with their commercial register instead.** | Aspect | Details |\n|---|---|\n| **Who it's for** | Established businesses, sellers planning > 40 items/month, those wanting advertising access |\n| **Monthly fee** | Currently **SAR 0 / free** (limited-time promotion — Professional plan subscription waived) |\n| **Per-item fee** | No per-item selling fee |\n| **Identity document** | National ID or Iqama of the business **owner** (must be valid) |\n| **Business document** | Business Trade License (Commercial Register / السجل التجاري) — must contain the owner's name, in PDF format |\n| **Commercial register** | **Required** — must be valid and show the owner's name |\n| **Benefits** | Full access to: bulk listing tools, Amazon Advertising/PPC, advanced analytics & reports, APIs, A+ Content, restricted categories, Brand Registry eligibility, top placement eligibility | | Aspect | Details |\n|---|---|\n| **Who it's for** | When someone other than the business owner is registering (e.g., an employee, authorized agent) |\n| **Identity document** | National ID or Iqama of the **Legal Representative** (must be valid) |\n| **Business document** | Business Trade License **AND** Power of Attorney — both must be combined in the **same PDF file** |\n| **Other requirements** | Same as Business Account (email, phone number) | | Feature | Individual | Professional (Business) |\n|---|---|---|\n| Monthly subscription | None | Free (promotional) / normally $39.99 |\n| Per-item fee | SAR 3.75 per sale | None |\n| Amazon Advertising | ❌ | ✅ |\n| Bulk listing tools | ❌ | ✅ |\n| Advanced reports/APIs | ❌ | ✅ |\n| Restricted categories | ❌ | ✅ |\n| A+ Content / Brand Registry | ❌ | ✅ |\n| Buy Box eligibility | Limited | ✅ |\n| Commercial Register needed | No | Yes |\n\n---"},{"title":"2. Pre-Registration Requirements & Documents","html":"<h4>For ALL Account Types</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Requirement</th><th>Details</th></tr></thead><tbody><tr><td><strong>Business email address</strong></td><td>Or an existing Amazon customer account email. Use an established, long-term email — avoid newly created or disposable emails.</td></tr><tr><td><strong>Active phone number</strong></td><td>A number where Amazon can reach you directly. Must be able to receive SMS/OTP verification codes.</td></tr><tr><td><strong>Credit or debit card</strong></td><td>Internationally chargeable card (Visa, Mastercard). Amazon runs small authorization holds to verify. <strong>Must be a real credit/debit card — not prepaid.</strong></td></tr><tr><td><strong>Bank account</strong></td><td>For receiving sales proceeds (disbursements). The account holder name must match the registered seller entity name exactly.</td></tr></tbody></table></div>\n<h4>Document Requirements by Account Type</h4>\n<p>#### Individual Account</p>\n<ul><li><strong>Valid National ID</strong> (Saudi citizens) or <strong>Valid Iqama/Resident ID</strong> (non-Saudi residents — see note above about potential restrictions)</li><li><strong>Bank/Credit Card Statement</strong> OR <strong>Utility Bill</strong> — must confirm the owner's address, must be in PDF format, issued within the last 180 days</li></ul>\n<p>#### Business Account</p>\n<ul><li><strong>Valid National ID or Iqama</strong> of the business owner</li><li><strong>Business Trade License (Commercial Register)</strong> — must contain the owner's name, must be in PDF format, must be valid/active</li></ul>\n<p>#### Legal Representative Account</p>\n<ul><li><strong>Valid National ID or Iqama</strong> of the legal representative</li><li><strong>Business Trade License + Power of Attorney</strong> — both must be in the <strong>same PDF file</strong></li></ul>\n<h4>Document Quality Requirements (Critical)</h4>\n<ul><li><strong>Full-frame</strong>: The entire document must be visible, with all four edges/corners showing</li><li><strong>High resolution</strong>: Clear, legible, no blur or overexposure</li><li><strong>Unedited</strong>: Do NOT crop, compress, digitally alter, or \"clean up\" scans — Amazon's system flags edited documents as potential tampering</li><li><strong>Current and valid</strong>: All IDs must be unexpired; bank statements within 180 days</li><li><strong>Original format</strong>: Submit original scan/photo — not a screenshot of a screenshot</li><li><strong>PDF format</strong>: Business documents must be in PDF format as specified</li></ul>\n<p>---</p>\n","searchText":"| Requirement | Details |\n|---|---|\n| **Business email address** | Or an existing Amazon customer account email. Use an established, long-term email — avoid newly created or disposable emails. |\n| **Active phone number** | A number where Amazon can reach you directly. Must be able to receive SMS/OTP verification codes. |\n| **Credit or debit card** | Internationally chargeable card (Visa, Mastercard). Amazon runs small authorization holds to verify. **Must be a real credit/debit card — not prepaid.** |\n| **Bank account** | For receiving sales proceeds (disbursements). The account holder name must match the registered seller entity name exactly. | #### Individual Account\n1. **Valid National ID** (Saudi citizens) or **Valid Iqama/Resident ID** (non-Saudi residents — see note above about potential restrictions)\n2. **Bank/Credit Card Statement** OR **Utility Bill** — must confirm the owner's address, must be in PDF format, issued within the last 180 days\n\n#### Business Account\n1. **Valid National ID or Iqama** of the business owner\n2. **Business Trade License (Commercial Register)** — must contain the owner's name, must be in PDF format, must be valid/active\n\n#### Legal Representative Account\n1. **Valid National ID or Iqama** of the legal representative\n2. **Business Trade License + Power of Attorney** — both must be in the **same PDF file** - **Full-frame**: The entire document must be visible, with all four edges/corners showing\n- **High resolution**: Clear, legible, no blur or overexposure\n- **Unedited**: Do NOT crop, compress, digitally alter, or \"clean up\" scans — Amazon's system flags edited documents as potential tampering\n- **Current and valid**: All IDs must be unexpired; bank statements within 180 days\n- **Original format**: Submit original scan/photo — not a screenshot of a screenshot\n- **PDF format**: Business documents must be in PDF format as specified\n\n---"},{"title":"3. Step-by-Step Registration Process","html":"<h4>Step 1: Navigate to Registration</h4>\n<ul><li>Go to <strong>sell.amazon.sa</strong> (or <strong>services.amazon.sa</strong>)</li><li>Click <strong>\"Register Now\"</strong> (سجل الآن)</li></ul>\n<h4>Step 2: Create Your Amazon Account</h4>\n<ul><li>Enter your <strong>first and last name</strong></li><li>Enter your <strong>email address</strong> (use an existing Amazon customer account email, or create a new one)</li><li>Create a <strong>password</strong></li><li>Click <strong>\"Next\"</strong> — you'll receive an <strong>OTP (One-Time Password)</strong> via email</li><li>Enter the OTP to verify your email</li></ul>\n<h4>Step 3: Select Account Type</h4>\n<p>Choose one of:</p>\n<ul><li><strong>Individual</strong> (no commercial registration)</li><li><strong>Business</strong> (with commercial registration)</li><li><strong>Legal Representative of a Business</strong></li></ul>\n<h4>Step 4: Enter Business Information</h4>\n<ul><li><strong>Business location</strong>: Select Saudi Arabia (or your country of registration)</li><li><strong>Business type</strong>: Individual / State-owned / Publicly-listed / Privately-owned / Charity</li><li><strong>Full legal name</strong> (as it appears on your official documents — <strong>must match exactly</strong>)</li><li>For business accounts: Enter your <strong>Commercial Register number</strong> and business details</li></ul>\n<h4>Step 5: Enter Seller Information</h4>\n<ul><li><strong>Personal details</strong>: Full legal name of the primary contact / account owner</li><li><strong>Phone number</strong>: Enter your active mobile number — Amazon will send an SMS verification code</li><li><strong>Verify phone</strong>: Enter the SMS OTP code</li></ul>\n<h4>Step 6: Enter Pickup Address</h4>\n<ul><li>Provide the address where Amazon will pick up your orders (for Easy Ship) or your business address</li><li><strong>This address must match your supporting documents exactly</strong> — same spelling, abbreviations, format</li></ul>\n<h4>Step 7: Set Up Payment Method</h4>\n<ul><li><strong>Credit/debit card</strong>: Enter an internationally chargeable credit or debit card</li><li>Amazon will run a small temporary authorization hold (e.g., $1 or SAR 1) to verify the card</li><li>Prepaid cards are <strong>NOT accepted</strong> — this is a common rejection cause</li><li><strong>Bank account</strong>: Enter your bank account details for receiving sales disbursements</li><li><strong>The account holder name MUST match the registered seller entity name exactly</strong></li></ul>\n<h4>Step 8: Enter Product Information</h4>\n<ul><li>Provide basic information about what you plan to sell</li><li>Select your primary product category</li><li>Indicate whether you have UPC/EAN codes</li></ul>\n<h4>Step 9: Identity Verification (SIV)</h4>\n<p>This is the most critical step — see detailed section below.</p>\n<h4>Step 10: Complete and Start Selling</h4>\n<ul><li>Once verification is complete, you'll receive confirmation</li><li><strong>Important promotion</strong>: Add your first products within <strong>20 days</strong> of signing up → get a <strong>30% discount on referral fees for 60 days</strong></li></ul>\n<p>---</p>\n","searchText":"1. Go to **sell.amazon.sa** (or **services.amazon.sa**)\n2. Click **\"Register Now\"** (سجل الآن) 1. Enter your **first and last name**\n2. Enter your **email address** (use an existing Amazon customer account email, or create a new one)\n3. Create a **password**\n4. Click **\"Next\"** — you'll receive an **OTP (One-Time Password)** via email\n5. Enter the OTP to verify your email Choose one of:\n- **Individual** (no commercial registration)\n- **Business** (with commercial registration)\n- **Legal Representative of a Business** 1. **Business location**: Select Saudi Arabia (or your country of registration)\n2. **Business type**: Individual / State-owned / Publicly-listed / Privately-owned / Charity\n3. **Full legal name** (as it appears on your official documents — **must match exactly**)\n4. For business accounts: Enter your **Commercial Register number** and business details 1. **Personal details**: Full legal name of the primary contact / account owner\n2. **Phone number**: Enter your active mobile number — Amazon will send an SMS verification code\n3. **Verify phone**: Enter the SMS OTP code 1. Provide the address where Amazon will pick up your orders (for Easy Ship) or your business address\n2. **This address must match your supporting documents exactly** — same spelling, abbreviations, format 1. **Credit/debit card**: Enter an internationally chargeable credit or debit card\n   - Amazon will run a small temporary authorization hold (e.g., $1 or SAR 1) to verify the card\n   - Prepaid cards are **NOT accepted** — this is a common rejection cause\n2. **Bank account**: Enter your bank account details for receiving sales disbursements\n   - **The account holder name MUST match the registered seller entity name exactly** 1. Provide basic information about what you plan to sell\n2. Select your primary product category\n3. Indicate whether you have UPC/EAN codes This is the most critical step — see detailed section below. 1. Once verification is complete, you'll receive confirmation\n2. **Important promotion**: Add your first products within **20 days** of signing up → get a **30% discount on referral fees for 60 days**\n\n---"},{"title":"4. Identity Verification (SIV) Process","html":"<p>Amazon's Seller Identity Verification (SIV) is a rigorous, multi-step process designed to prevent fraud.</p><h4>What Amazon Verifies</h4>\n<ul><li><strong>Identity</strong>: Confirming you are a real person matching the documents</li><li><strong>Address</strong>: Your residential/business address matches document records</li><li><strong>Banking</strong>: Bank ownership verification and money trail</li><li><strong>Business legitimacy</strong>: Commercial register validity, business existence</li><li><strong>Risk assessment</strong>: Algorithmic scoring of the overall application (IP address, device fingerprinting, network stability, behavioral patterns)</li></ul>\n<h4>Document Upload Process</h4>\n<ul><li><strong>Upload your identity document</strong>:</li><li>Government-issued photo ID (National ID, Iqama, or Passport)</li><li>Must be valid/unexpired</li><li>Must be clear, high-resolution, showing all four corners</li><li>Front AND back (for National ID / Iqama)</li></ul>\n<ul><li><strong>Upload your supporting document</strong>:</li><li><strong>Individual</strong>: Bank statement / credit card statement / utility bill (PDF, within 180 days)</li><li><strong>Business</strong>: Commercial Register (PDF, must show owner's name)</li><li><strong>Legal Representative</strong>: Commercial Register + Power of Attorney (combined in one PDF)</li></ul>\n<ul><li><strong>Additional verification</strong> (may be requested):</li><li>Selfie photo holding your ID</li><li>Video verification call (see section below)</li><li>Additional bank or utility documents</li></ul>\n<h4>Automated vs Manual Review</h4>\n<ul><li>Most applications are initially screened by <strong>automated systems</strong> (KYC algorithms)</li><li>The system checks for: name consistency, document quality, address matching, risk signals</li><li>Applications flagged by automation are escalated to <strong>manual review</strong></li><li>Manual review may include a video verification call</li></ul>\n<h4>Key SIV Tips for Agents</h4>\n<ul><li><strong>Name consistency is paramount</strong>: The exact same name must appear on the ID, bank statement, Seller Central profile, and commercial register. Even minor differences (initials vs. full name, missing middle name) can trigger rejection.</li><li><strong>Address must be character-for-character match</strong>: Copy the address exactly as it appears on the proof document — same abbreviations, same format, same postal code format.</li><li><strong>Documents must not be edited</strong>: Even \"innocent\" cropping or compression can be flagged as tampering.</li><li><strong>Use one device, one network</strong>: Register from a single, stable internet connection (home/office). Do not use VPN during registration.</li></ul>\n<p>---</p>\n","searchText":"Amazon's Seller Identity Verification (SIV) is a rigorous, multi-step process designed to prevent fraud.1. **Identity**: Confirming you are a real person matching the documents\n2. **Address**: Your residential/business address matches document records\n3. **Banking**: Bank ownership verification and money trail\n4. **Business legitimacy**: Commercial register validity, business existence\n5. **Risk assessment**: Algorithmic scoring of the overall application (IP address, device fingerprinting, network stability, behavioral patterns) 1. **Upload your identity document**:\n   - Government-issued photo ID (National ID, Iqama, or Passport)\n   - Must be valid/unexpired\n   - Must be clear, high-resolution, showing all four corners\n   - Front AND back (for National ID / Iqama)\n\n2. **Upload your supporting document**:\n   - **Individual**: Bank statement / credit card statement / utility bill (PDF, within 180 days)\n   - **Business**: Commercial Register (PDF, must show owner's name)\n   - **Legal Representative**: Commercial Register + Power of Attorney (combined in one PDF)\n\n3. **Additional verification** (may be requested):\n   - Selfie photo holding your ID\n   - Video verification call (see section below)\n   - Additional bank or utility documents - Most applications are initially screened by **automated systems** (KYC algorithms)\n- The system checks for: name consistency, document quality, address matching, risk signals\n- Applications flagged by automation are escalated to **manual review**\n- Manual review may include a video verification call - **Name consistency is paramount**: The exact same name must appear on the ID, bank statement, Seller Central profile, and commercial register. Even minor differences (initials vs. full name, missing middle name) can trigger rejection.\n- **Address must be character-for-character match**: Copy the address exactly as it appears on the proof document — same abbreviations, same format, same postal code format.\n- **Documents must not be edited**: Even \"innocent\" cropping or compression can be flagged as tampering.\n- **Use one device, one network**: Register from a single, stable internet connection (home/office). Do not use VPN during registration.\n\n---"},{"title":"5. Video Verification Call","html":"<p>Amazon may require a live video verification call as the final identity confirmation step.</p><h4>When It's Required</h4>\n<ul><li>Amazon's system determines if video verification is needed based on risk assessment</li><li>More common for: new sellers, international sellers, flagged applications</li><li>Sellers receive an email/notification with a link to schedule or start instantly</li></ul>\n<h4>Two Options</h4>\n<ul><li><strong>Instant video call</strong>: Start immediately if documents are ready</li><li><strong>Scheduled video call</strong>: Book a specific date/time — note the time zone carefully</li></ul>\n<h4>What Happens During the Call</h4>\n<ul><li>An Amazon associate joins the video call</li><li>They will ask you to show <strong>original physical copies</strong> of:</li><li>The government-issued photo ID submitted during registration</li><li>The bank/credit card statement OR business license submitted during registration</li><li><strong>Only documents submitted at registration are accepted</strong> — no new/replacement documents</li><li>The associate verifies:</li><li>The person on camera matches the ID photo</li><li>The documents are original (not photocopies)</li><li>The information is legible and matches what was entered in Seller Central</li><li>They may ask basic questions about your business</li></ul>\n<h4>How to Prepare</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Preparation Item</th><th>Details</th></tr></thead><tbody><tr><td><strong>Environment</strong></td><td>Quiet, well-lit room with neutral background. Professional setting.</td></tr><tr><td><strong>Documents</strong></td><td>Have ALL original physical documents laid out and immediately accessible.</td></tr><tr><td><strong>Technical setup</strong></td><td>Test camera, microphone, internet connection beforehand. Use stable broadband.</td></tr><tr><td><strong>Appearance</strong></td><td>Dress professionally, as you would for a business meeting.</td></tr><tr><td><strong>Timing</strong></td><td>Double-check the scheduled date/time AND time zone. Be on time.</td></tr><tr><td><strong>Speaker</strong></td><td>Only the account owner or designated legal representative should speak.</td></tr><tr><td><strong>Consistency</strong></td><td>Be prepared to verbally confirm details that match your submitted application.</td></tr></tbody></table></div>\n<h4>After the Call</h4>\n<ul><li>Amazon reviews the verification results</li><li>Outcome communicated within <strong>5 business days</strong> (per Amazon's stated timeline)</li><li>If successful: account is activated</li><li>If unsuccessful: account may be deactivated or additional documentation requested</li></ul>\n<h4>Common Video Call Failures</h4>\n<ul><li>Not having original physical documents (only digital copies)</li><li>Showing documents that don't match what was submitted during registration</li><li>Poor lighting/camera quality — associate can't see documents clearly</li><li>Verbal answers contradicting the application details</li><li>Technical issues (unstable internet, microphone not working)</li><li>Wrong person attending (not the account owner or authorized representative)</li></ul>\n<p>---</p>\n","searchText":"Amazon may require a live video verification call as the final identity confirmation step.- Amazon's system determines if video verification is needed based on risk assessment\n- More common for: new sellers, international sellers, flagged applications\n- Sellers receive an email/notification with a link to schedule or start instantly 1. **Instant video call**: Start immediately if documents are ready\n2. **Scheduled video call**: Book a specific date/time — note the time zone carefully 1. An Amazon associate joins the video call\n2. They will ask you to show **original physical copies** of:\n   - The government-issued photo ID submitted during registration\n   - The bank/credit card statement OR business license submitted during registration\n3. **Only documents submitted at registration are accepted** — no new/replacement documents\n4. The associate verifies:\n   - The person on camera matches the ID photo\n   - The documents are original (not photocopies)\n   - The information is legible and matches what was entered in Seller Central\n5. They may ask basic questions about your business | Preparation Item | Details |\n|---|---|\n| **Environment** | Quiet, well-lit room with neutral background. Professional setting. |\n| **Documents** | Have ALL original physical documents laid out and immediately accessible. |\n| **Technical setup** | Test camera, microphone, internet connection beforehand. Use stable broadband. |\n| **Appearance** | Dress professionally, as you would for a business meeting. |\n| **Timing** | Double-check the scheduled date/time AND time zone. Be on time. |\n| **Speaker** | Only the account owner or designated legal representative should speak. |\n| **Consistency** | Be prepared to verbally confirm details that match your submitted application. | - Amazon reviews the verification results\n- Outcome communicated within **5 business days** (per Amazon's stated timeline)\n- If successful: account is activated\n- If unsuccessful: account may be deactivated or additional documentation requested - Not having original physical documents (only digital copies)\n- Showing documents that don't match what was submitted during registration\n- Poor lighting/camera quality — associate can't see documents clearly\n- Verbal answers contradicting the application details\n- Technical issues (unstable internet, microphone not working)\n- Wrong person attending (not the account owner or authorized representative)\n\n---"},{"title":"6. Account Approval Timeline","html":"<h4>Typical Timeline</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Stage</th><th>Expected Duration</th></tr></thead><tbody><tr><td>Account creation & setup</td><td>Immediate (minutes)</td></tr><tr><td>Document upload & initial review</td><td>24–72 hours (if all documents are correct)</td></tr><tr><td>Video verification (if required)</td><td>Scheduled within days; results within 5 business days</td></tr><tr><td>Full account activation</td><td><strong>1–3 business days</strong> (best case) to <strong>7–14 days</strong> (if flagged)</td></tr><tr><td>Complex cases / additional review</td><td>Up to <strong>30–45 days</strong> (reported by sellers in forums)</td></tr></tbody></table></div>\n<h4>Factors That Extend the Timeline</h4>\n<ul><li>Incomplete or poor-quality documents → resubmission cycle</li><li>Name/address mismatches → additional review</li><li>Video verification required → adds 5+ business days</li><li>Peak registration seasons → longer queue times</li><li>Application flagged by risk algorithms → manual review queue</li><li>Multiple resubmissions of the same incorrect information → progressive delays</li></ul>\n<h4>What Sellers Should Know</h4>\n<ul><li>The <strong>20-day promotional window</strong> (30% referral fee discount) starts from account creation, not verification completion — so delays in verification eat into this window</li><li>Sellers should have all documents prepared <strong>before</strong> starting registration to minimize delays</li><li>If no response after 72 hours, sellers should check their Seller Central dashboard for notifications or open a support case</li></ul>\n<p>---</p>\n","searchText":"| Stage | Expected Duration |\n|---|---|\n| Account creation & setup | Immediate (minutes) |\n| Document upload & initial review | 24–72 hours (if all documents are correct) |\n| Video verification (if required) | Scheduled within days; results within 5 business days |\n| Full account activation | **1–3 business days** (best case) to **7–14 days** (if flagged) |\n| Complex cases / additional review | Up to **30–45 days** (reported by sellers in forums) | - Incomplete or poor-quality documents → resubmission cycle\n- Name/address mismatches → additional review\n- Video verification required → adds 5+ business days\n- Peak registration seasons → longer queue times\n- Application flagged by risk algorithms → manual review queue\n- Multiple resubmissions of the same incorrect information → progressive delays - The **20-day promotional window** (30% referral fee discount) starts from account creation, not verification completion — so delays in verification eat into this window\n- Sellers should have all documents prepared **before** starting registration to minimize delays\n- If no response after 72 hours, sellers should check their Seller Central dashboard for notifications or open a support case\n\n---"},{"title":"7. Common Rejection Reasons & How to Fix Them","html":"<h4>1. Name Mismatch Across Documents</h4>\n<p><strong>The #1 rejection reason.</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Examples</th></tr></thead><tbody><tr><td>Missing middle name</td><td>ID says \"Mohammed Ahmed Al-Saud\" but Seller Central says \"Mohammed Al-Saud\"</td></tr><tr><td>Initials vs. full name</td><td>ID says \"Abdullah\" but bank statement shows \"A. Rahman\"</td></tr><tr><td>Arabic vs. English transliteration</td><td>Name spelled differently on different documents</td></tr><tr><td>Entity name vs. owner name</td><td>Commercial register says \"شركة الفجر التجارية\" but bank account is under the owner's personal name</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Establish one <strong>canonical legal name</strong> exactly as it appears on the primary government ID. Use this <strong>exact</strong> name everywhere: Seller Central profile, bank account, credit card, commercial register. If Arabic transliteration varies, use the exact English spelling from the National ID or passport.</p>\n<h4>2. Low-Quality or Incomplete Documents</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Details</th></tr></thead><tbody><tr><td>Cropped images</td><td>Edges of document cut off</td></tr><tr><td>Blurry/low resolution</td><td>Text not legible</td></tr><tr><td>Expired documents</td><td>ID past expiration date</td></tr><tr><td>Screenshots</td><td>Screenshot of a document instead of scan/photo</td></tr><tr><td>Compressed/edited files</td><td>Files that appear tampered with</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Rescan at high resolution. Show all four corners. Submit the original file without any editing. Ensure the document is current and valid.</p>\n<h4>3. Address Inconsistencies</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Examples</th></tr></thead><tbody><tr><td>Abbreviations mismatch</td><td>\"St.\" vs \"Street,\" \"Apt.\" vs \"Apartment\"</td></tr><tr><td>Missing details</td><td>Forgot apartment/suite/floor number</td></tr><tr><td>Different formats</td><td>Postal code with/without dash</td></tr><tr><td>Old address</td><td>Moved but didn't update all documents</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Use your proof-of-address document (bank statement/utility bill) as the <strong>single source of truth</strong>. Copy the address character-for-character into Seller Central. Do not \"correct\" or standardize anything.</p>\n<h4>4. Invalid or Rejected Payment Method</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Details</th></tr></thead><tbody><tr><td>Prepaid card used</td><td>Amazon does not accept prepaid or gift cards</td></tr><tr><td>Debit card not enabled for e-commerce</td><td>Card blocks online/international transactions</td></tr><tr><td>Insufficient credit</td><td>Card declined during small authorization hold</td></tr><tr><td>Card name mismatch</td><td>Name on card doesn't match Seller Central profile</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Use a primary credit card (Visa/Mastercard). Ensure e-commerce and international transactions are enabled. Verify sufficient available balance. Card holder name should match the seller entity.</p>\n<h4>5. Commercial Register Issues (Business Accounts)</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Details</th></tr></thead><tbody><tr><td>Expired commercial register</td><td>CR (سجل تجاري) has lapsed</td></tr><tr><td>Owner name not on CR</td><td>CR doesn't list the person registering the Amazon account</td></tr><tr><td>CR not in PDF format</td><td>Uploaded as image instead of PDF</td></tr><tr><td>CR activities don't match</td><td>Business activities don't align with intended Amazon selling categories</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Ensure the CR is valid and current. Verify the owner's name appears on the CR. For legal representatives, include the Power of Attorney in the same PDF as the CR. Renew the CR on the Ministry of Commerce platform (mc.gov.sa) if expired.</p>\n<h4>6. Risky Registration Environment</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Details</th></tr></thead><tbody><tr><td>VPN usage</td><td>IP appears to be from a different country/location</td></tr><tr><td>Shared network</td><td>Same IP/device linked to other Amazon accounts</td></tr><tr><td>Multiple devices</td><td>Logging in from different devices during registration</td></tr><tr><td>Public Wi-Fi</td><td>Coffee shop or coworking space network</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Register from a single, dedicated device on a stable home/office network. Disable VPN during the entire registration process. Do not access the account from multiple locations until verification is complete.</p>\n<h4>7. Duplicate/Multiple Account Signals</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Details</th></tr></thead><tbody><tr><td>Same person/entity already has an account</td><td>Amazon detects shared identity details</td></tr><tr><td>Family member has an account on same network</td><td>Shared IP/device triggers linkage</td></tr><tr><td>Previous account suspended</td><td>Amazon links new application to old deactivated account</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: If you have a legitimate need for a second account, document the business justification and get Amazon approval first. If a previous account was suspended, resolve that issue before attempting to register again.</p>\n<h4>8. Incorrect Business Structure Selection</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Details</th></tr></thead><tbody><tr><td>Selected \"Individual\" but has a company</td><td>Mismatch between selected type and documents</td></tr><tr><td>Selected \"Business\" but no CR</td><td>Can't provide required business documents</td></tr></tbody></table></div>\n<p><strong>How to fix</strong>: Select the account type that matches your actual legal status and available documents. If you're an individual without a CR, choose Individual. If you have a registered business, choose Business.</p>\n<h4>What to Do After Rejection</h4>\n<ul><li><strong>Read the rejection notice carefully</strong> — identify what Amazon is flagging</li><li><strong>Do NOT immediately create a new account</strong> — Amazon tracks and links attempts</li><li><strong>Isolate the root cause</strong> — compare the rejection notice with your submitted documents</li><li><strong>Fix the specific issue</strong> — rebuild your document set addressing the exact problem</li><li><strong>Submit a clear, structured appeal</strong> — if Amazon allows, list each issue and its fix in a clean checklist format</li><li><strong>Only restart if fundamentally unfixable</strong> — wrong legal entity, unresolvable account linkage, or persistent tax/banking mismatch</li></ul>\n<p>---</p>\n","searchText":"**The #1 rejection reason.**\n\n| Problem | Examples |\n|---|---|\n| Missing middle name | ID says \"Mohammed Ahmed Al-Saud\" but Seller Central says \"Mohammed Al-Saud\" |\n| Initials vs. full name | ID says \"Abdullah\" but bank statement shows \"A. Rahman\" |\n| Arabic vs. English transliteration | Name spelled differently on different documents |\n| Entity name vs. owner name | Commercial register says \"شركة الفجر التجارية\" but bank account is under the owner's personal name |\n\n**How to fix**: Establish one **canonical legal name** exactly as it appears on the primary government ID. Use this **exact** name everywhere: Seller Central profile, bank account, credit card, commercial register. If Arabic transliteration varies, use the exact English spelling from the National ID or passport. | Problem | Details |\n|---|---|\n| Cropped images | Edges of document cut off |\n| Blurry/low resolution | Text not legible |\n| Expired documents | ID past expiration date |\n| Screenshots | Screenshot of a document instead of scan/photo |\n| Compressed/edited files | Files that appear tampered with |\n\n**How to fix**: Rescan at high resolution. Show all four corners. Submit the original file without any editing. Ensure the document is current and valid. | Problem | Examples |\n|---|---|\n| Abbreviations mismatch | \"St.\" vs \"Street,\" \"Apt.\" vs \"Apartment\" |\n| Missing details | Forgot apartment/suite/floor number |\n| Different formats | Postal code with/without dash |\n| Old address | Moved but didn't update all documents |\n\n**How to fix**: Use your proof-of-address document (bank statement/utility bill) as the **single source of truth**. Copy the address character-for-character into Seller Central. Do not \"correct\" or standardize anything. | Problem | Details |\n|---|---|\n| Prepaid card used | Amazon does not accept prepaid or gift cards |\n| Debit card not enabled for e-commerce | Card blocks online/international transactions |\n| Insufficient credit | Card declined during small authorization hold |\n| Card name mismatch | Name on card doesn't match Seller Central profile |\n\n**How to fix**: Use a primary credit card (Visa/Mastercard). Ensure e-commerce and international transactions are enabled. Verify sufficient available balance. Card holder name should match the seller entity. | Problem | Details |\n|---|---|\n| Expired commercial register | CR (سجل تجاري) has lapsed |\n| Owner name not on CR | CR doesn't list the person registering the Amazon account |\n| CR not in PDF format | Uploaded as image instead of PDF |\n| CR activities don't match | Business activities don't align with intended Amazon selling categories |\n\n**How to fix**: Ensure the CR is valid and current. Verify the owner's name appears on the CR. For legal representatives, include the Power of Attorney in the same PDF as the CR. Renew the CR on the Ministry of Commerce platform (mc.gov.sa) if expired. | Problem | Details |\n|---|---|\n| VPN usage | IP appears to be from a different country/location |\n| Shared network | Same IP/device linked to other Amazon accounts |\n| Multiple devices | Logging in from different devices during registration |\n| Public Wi-Fi | Coffee shop or coworking space network |\n\n**How to fix**: Register from a single, dedicated device on a stable home/office network. Disable VPN during the entire registration process. Do not access the account from multiple locations until verification is complete. | Problem | Details |\n|---|---|\n| Same person/entity already has an account | Amazon detects shared identity details |\n| Family member has an account on same network | Shared IP/device triggers linkage |\n| Previous account suspended | Amazon links new application to old deactivated account |\n\n**How to fix**: If you have a legitimate need for a second account, document the business justification and get Amazon approval first. If a previous account was suspended, resolve that issue before attempting to register again. | Problem | Details |\n|---|---|\n| Selected \"Individual\" but has a company | Mismatch between selected type and documents |\n| Selected \"Business\" but no CR | Can't provide required business documents |\n\n**How to fix**: Select the account type that matches your actual legal status and available documents. If you're an individual without a CR, choose Individual. If you have a registered business, choose Business. 1. **Read the rejection notice carefully** — identify what Amazon is flagging\n2. **Do NOT immediately create a new account** — Amazon tracks and links attempts\n3. **Isolate the root cause** — compare the rejection notice with your submitted documents\n4. **Fix the specific issue** — rebuild your document set addressing the exact problem\n5. **Submit a clear, structured appeal** — if Amazon allows, list each issue and its fix in a clean checklist format\n6. **Only restart if fundamentally unfixable** — wrong legal entity, unresolvable account linkage, or persistent tax/banking mismatch\n\n---"},{"title":"8. Switching Between Account Types","html":"<h4>Upgrading: Individual → Professional</h4>\n<ul><li>Log in to <strong>Seller Central</strong></li><li>Go to <strong>Settings</strong> → <strong>Account Info</strong></li><li>Under <strong>Seller Account Information</strong>, find <strong>Your Services</strong> → click <strong>Manage</strong></li><li>In the <strong>\"Sell on Amazon\"</strong> row, click <strong>\"Upgrade\"</strong></li><li>Follow the prompts to confirm</li></ul>\n<p><strong>What changes</strong>:</p>\n<ul><li>Monthly subscription fee begins (currently waived for SA marketplace)</li><li>Access to advertising, bulk tools, advanced reports, APIs unlocked</li><li>Per-item selling fee (SAR 3.75) is removed</li><li>Existing listings remain active</li></ul>\n<p><strong>Note</strong>: When upgrading, Amazon recommends also updating your <strong>Legal Entity information</strong>, <strong>tax information</strong>, and <strong>bank information</strong> (if needed) so you don't trigger multiple reviews.</p>\n<h4>Downgrading: Professional → Individual</h4>\n<ul><li>Log in to <strong>Seller Central</strong></li><li>Go to <strong>Settings</strong> → <strong>Account Info</strong></li><li>Under <strong>Your Services</strong> → click <strong>Manage</strong></li><li>In the <strong>\"Sell on Amazon\"</strong> row, click <strong>\"Downgrade\"</strong></li><li>Confirm the change</li></ul>\n<p><strong>What changes</strong>:</p>\n<ul><li>Monthly subscription fee stops</li><li>Per-item fee (SAR 3.75) applies to each sale</li><li>Lose access to advertising, bulk tools, advanced reports, APIs</li><li><strong>Existing listings remain active</strong> unless you manually deactivate them</li><li>Deactivating listings alone does NOT switch your plan — you must explicitly downgrade</li></ul>\n<h4>Important Notes on Switching</h4>\n<ul><li>Switching can be done at any time — no waiting period</li><li>You can switch back and forth as needed</li><li>There may be a brief processing period during the switch</li><li>For the Saudi marketplace specifically, since Professional plan subscriptions are currently <strong>free</strong>, there's typically no financial reason to downgrade</li><li>If switching from Individual to Business, you may need to provide your <strong>Commercial Register</strong> and go through additional verification</li></ul>\n<p>---</p>\n","searchText":"1. Log in to **Seller Central**\n2. Go to **Settings** → **Account Info**\n3. Under **Seller Account Information**, find **Your Services** → click **Manage**\n4. In the **\"Sell on Amazon\"** row, click **\"Upgrade\"**\n5. Follow the prompts to confirm\n\n**What changes**:\n- Monthly subscription fee begins (currently waived for SA marketplace)\n- Access to advertising, bulk tools, advanced reports, APIs unlocked\n- Per-item selling fee (SAR 3.75) is removed\n- Existing listings remain active\n\n**Note**: When upgrading, Amazon recommends also updating your **Legal Entity information**, **tax information**, and **bank information** (if needed) so you don't trigger multiple reviews. 1. Log in to **Seller Central**\n2. Go to **Settings** → **Account Info**\n3. Under **Your Services** → click **Manage**\n4. In the **\"Sell on Amazon\"** row, click **\"Downgrade\"**\n5. Confirm the change\n\n**What changes**:\n- Monthly subscription fee stops\n- Per-item fee (SAR 3.75) applies to each sale\n- Lose access to advertising, bulk tools, advanced reports, APIs\n- **Existing listings remain active** unless you manually deactivate them\n- Deactivating listings alone does NOT switch your plan — you must explicitly downgrade - Switching can be done at any time — no waiting period\n- You can switch back and forth as needed\n- There may be a brief processing period during the switch\n- For the Saudi marketplace specifically, since Professional plan subscriptions are currently **free**, there's typically no financial reason to downgrade\n- If switching from Individual to Business, you may need to provide your **Commercial Register** and go through additional verification\n\n---"},{"title":"9. Multiple Account Policy","html":"<h4>Amazon's Standard Policy</h4>\n<blockquote><strong>\"Sellers may only maintain one Seller Central account per region unless they have a legitimate business need for a second account and all accounts are in good standing.\"</strong></blockquote>\n<h4>What This Means for MENA Sellers</h4>\n<ul><li><strong>One account per region</strong>: The MENA region (Amazon.sa, Amazon.ae, Amazon.eg) typically operates under a unified regional account structure</li><li>A single seller registration can potentially access multiple MENA marketplaces</li><li>Creating a separate account for each marketplace within the same region is <strong>not permitted</strong> without justification</li></ul>\n<h4>Legitimate Business Reasons for Multiple Accounts</h4>\n<p>Amazon may permit a second account if:</p>\n<ul><li>You own multiple <strong>distinct brands</strong> with separate storefronts</li><li>You manufacture products for <strong>two or more separate and distinct companies</strong></li><li>You operate <strong>completely separate business entities</strong> (different legal entities, not just different trade names)</li><li>You have been <strong>explicitly approved</strong> by Amazon for a second account</li></ul>\n<h4>What Triggers Account Linkage Detection</h4>\n<p>Amazon's algorithms detect shared ownership through:</p>\n<ul><li><strong>Shared devices</strong>: Same computer, phone, or tablet used for multiple accounts</li><li><strong>Shared networks</strong>: Same IP address or Wi-Fi</li><li><strong>Shared identity fields</strong>: Same name, address, email, phone number</li><li><strong>Shared banking</strong>: Same credit card for fees or same bank account for disbursements</li><li><strong>Behavioral patterns</strong>: Similar login patterns, product catalogs, or operational patterns</li></ul>\n<h4>Consequences of Unauthorized Multiple Accounts</h4>\n<ul><li><strong>All linked accounts may be suspended</strong> — not just the duplicate</li><li>Even if one account is in good standing, it can be affected</li><li>Difficult to appeal once accounts are flagged as linked</li><li>Amazon tracks device fingerprints, IP history, and metadata — simply using different credentials is insufficient</li></ul>\n<h4>Best Practices</h4>\n<ul><li>Maintain <strong>one account</strong> unless you have a clear, documented business justification</li><li>If you legitimately need a second account, use completely separate: devices, IPs, banking, contact details, and legal entities</li><li><strong>Never create \"backup\" or \"test\" accounts</strong> — this is a policy violation</li><li>Family members sharing a household should be aware that shared network/device could link their accounts</li></ul>\n<p>---</p>\n","searchText":"> **\"Sellers may only maintain one Seller Central account per region unless they have a legitimate business need for a second account and all accounts are in good standing.\"** - **One account per region**: The MENA region (Amazon.sa, Amazon.ae, Amazon.eg) typically operates under a unified regional account structure\n- A single seller registration can potentially access multiple MENA marketplaces\n- Creating a separate account for each marketplace within the same region is **not permitted** without justification Amazon may permit a second account if:\n- You own multiple **distinct brands** with separate storefronts\n- You manufacture products for **two or more separate and distinct companies**\n- You operate **completely separate business entities** (different legal entities, not just different trade names)\n- You have been **explicitly approved** by Amazon for a second account Amazon's algorithms detect shared ownership through:\n- **Shared devices**: Same computer, phone, or tablet used for multiple accounts\n- **Shared networks**: Same IP address or Wi-Fi\n- **Shared identity fields**: Same name, address, email, phone number\n- **Shared banking**: Same credit card for fees or same bank account for disbursements\n- **Behavioral patterns**: Similar login patterns, product catalogs, or operational patterns - **All linked accounts may be suspended** — not just the duplicate\n- Even if one account is in good standing, it can be affected\n- Difficult to appeal once accounts are flagged as linked\n- Amazon tracks device fingerprints, IP history, and metadata — simply using different credentials is insufficient - Maintain **one account** unless you have a clear, documented business justification\n- If you legitimately need a second account, use completely separate: devices, IPs, banking, contact details, and legal entities\n- **Never create \"backup\" or \"test\" accounts** — this is a policy violation\n- Family members sharing a household should be aware that shared network/device could link their accounts\n\n---"},{"title":"10. Saudi-Specific Regulatory Requirements","html":"<h4>Commercial Registration (السجل التجاري / CR)</h4>\n<ul><li><strong>What it is</strong>: A registration certificate issued by the Saudi Ministry of Commerce (MoC) required for businesses operating in KSA</li><li><strong>How to obtain</strong>: Register electronically through <strong>mc.gov.sa</strong> or via the <strong>Business Platform</strong> (business.sa)</li><li><strong>Requirements</strong>: Saudi National ID or Iqama, valid address, business activity description</li><li><strong>For Amazon</strong>: Required for Business accounts; must contain the owner's name; submit in PDF format</li><li><strong>Renewal</strong>: Must be kept current — an expired CR will cause Amazon verification failure</li><li><strong>CR number</strong>: Used to verify business legitimacy</li></ul>\n<h4>VAT Registration (ZATCA)</h4>\n<ul><li><strong>Authority</strong>: Zakat, Tax and Customs Authority (ZATCA — الزكاة والضريبة والجمارك)</li><li><strong>VAT rate</strong>: <strong>15%</strong> — one of the highest in the GCC</li><li><strong>Mandatory registration threshold</strong>: Annual turnover of <strong>SAR 375,000</strong> (~USD $100,000) within KSA</li><li><strong>Voluntary registration</strong>: Businesses below the threshold may register voluntarily</li><li><strong>For Amazon sellers</strong>: If selling via FBA and exceeding the threshold, VAT registration is mandatory</li><li><strong>As of January 2026</strong>: Platforms facilitating supply by non-VAT-registered resident suppliers must act as \"deemed supplier\" and remit VAT</li><li><strong>VAT compliance</strong>: Sellers must issue VAT-compliant invoices and file returns on time</li></ul>\n<h4>SASO Conformity & SABER Platform</h4>\n<ul><li><strong>SASO</strong>: Saudi Standards, Metrology and Quality Organization</li><li><strong>SABER</strong>: Online platform where imported products must be registered before shipment</li><li><strong>Certificate of Conformity</strong>: Required for most imported products</li><li><strong>Process</strong>: Submit product details and test reports to a SASO-approved conformity body via SABER</li><li><strong>Critical</strong>: Shipments without a valid SABER certificate will be <strong>rejected by customs</strong></li></ul>\n<h4>E-Commerce Registration</h4>\n<ul><li>The Ministry of Commerce requires e-stores to register via the <strong>Business Platform</strong> (business.sa) — previously done through Maroof</li><li>This is a Saudi government requirement separate from Amazon's own registration</li></ul>\n<h4>Language Requirements</h4>\n<ul><li>Arabic is the dominant language for Saudi e-commerce</li><li>Product listings should be in <strong>Arabic first</strong>, English secondary</li><li>Customer service should support Arabic communication</li></ul>\n<p>---</p>\n","searchText":"- **What it is**: A registration certificate issued by the Saudi Ministry of Commerce (MoC) required for businesses operating in KSA\n- **How to obtain**: Register electronically through **mc.gov.sa** or via the **Business Platform** (business.sa)\n- **Requirements**: Saudi National ID or Iqama, valid address, business activity description\n- **For Amazon**: Required for Business accounts; must contain the owner's name; submit in PDF format\n- **Renewal**: Must be kept current — an expired CR will cause Amazon verification failure\n- **CR number**: Used to verify business legitimacy - **Authority**: Zakat, Tax and Customs Authority (ZATCA — الزكاة والضريبة والجمارك)\n- **VAT rate**: **15%** — one of the highest in the GCC\n- **Mandatory registration threshold**: Annual turnover of **SAR 375,000** (~USD $100,000) within KSA\n- **Voluntary registration**: Businesses below the threshold may register voluntarily\n- **For Amazon sellers**: If selling via FBA and exceeding the threshold, VAT registration is mandatory\n- **As of January 2026**: Platforms facilitating supply by non-VAT-registered resident suppliers must act as \"deemed supplier\" and remit VAT\n- **VAT compliance**: Sellers must issue VAT-compliant invoices and file returns on time - **SASO**: Saudi Standards, Metrology and Quality Organization\n- **SABER**: Online platform where imported products must be registered before shipment\n- **Certificate of Conformity**: Required for most imported products\n- **Process**: Submit product details and test reports to a SASO-approved conformity body via SABER\n- **Critical**: Shipments without a valid SABER certificate will be **rejected by customs** - The Ministry of Commerce requires e-stores to register via the **Business Platform** (business.sa) — previously done through Maroof\n- This is a Saudi government requirement separate from Amazon's own registration - Arabic is the dominant language for Saudi e-commerce\n- Product listings should be in **Arabic first**, English secondary\n- Customer service should support Arabic communication\n\n---"},{"title":"11. Key Fees & Pricing (Amazon.sa)","html":"<h4>Subscription Fees</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Plan</th><th>Fee</th></tr></thead><tbody><tr><td>Individual</td><td>No monthly fee; SAR 3.75 per item sold</td></tr><tr><td>Professional</td><td><strong>Free</strong> (limited-time promotional offer — normally $39.99/month)</td></tr></tbody></table></div>\n<h4>Referral Fees (Selected Categories)</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Category</th><th>Referral Fee</th><th>Minimum</th></tr></thead><tbody><tr><td>Consumer Electronics</td><td>5.5%</td><td>1 SAR</td></tr><tr><td>Mobiles & Tablets</td><td>5.5%</td><td>1 SAR</td></tr><tr><td>Beauty</td><td>8.5% (≤50 SAR) / 11% (>50 SAR)</td><td>1 SAR</td></tr><tr><td>Home</td><td>14%</td><td>1 SAR</td></tr><tr><td>Kitchen</td><td>14%</td><td>1 SAR</td></tr><tr><td>Books</td><td>15%</td><td>1 SAR</td></tr><tr><td>Apparel</td><td>15%</td><td>1 SAR</td></tr><tr><td>Shoes</td><td>15%</td><td>1 SAR</td></tr><tr><td>Perfumes</td><td>15%</td><td>1 SAR</td></tr><tr><td>Jewelry</td><td>16% (≤1000 SAR) / 5% (>1000 SAR)</td><td>1 SAR</td></tr><tr><td>All Other Categories</td><td>10%</td><td>1 SAR</td></tr></tbody></table></div>\n<p><em>Note: All fees are exclusive of applicable VAT. Amazon applies 5% VAT on selling fees.</em></p>\n<h4>New Seller Promotion</h4>\n<ul><li>Add first products within <strong>20 days</strong> of registration → <strong>30% discount on referral fees for 60 days</strong></li></ul>\n<p>---</p>\n","searchText":"| Plan | Fee |\n|---|---|\n| Individual | No monthly fee; SAR 3.75 per item sold |\n| Professional | **Free** (limited-time promotional offer — normally $39.99/month) | | Category | Referral Fee | Minimum |\n|---|---|---|\n| Consumer Electronics | 5.5% | 1 SAR |\n| Mobiles & Tablets | 5.5% | 1 SAR |\n| Beauty | 8.5% (≤50 SAR) / 11% (>50 SAR) | 1 SAR |\n| Home | 14% | 1 SAR |\n| Kitchen | 14% | 1 SAR |\n| Books | 15% | 1 SAR |\n| Apparel | 15% | 1 SAR |\n| Shoes | 15% | 1 SAR |\n| Perfumes | 15% | 1 SAR |\n| Jewelry | 16% (≤1000 SAR) / 5% (>1000 SAR) | 1 SAR |\n| All Other Categories | 10% | 1 SAR |\n\n*Note: All fees are exclusive of applicable VAT. Amazon applies 5% VAT on selling fees.* - Add first products within **20 days** of registration → **30% discount on referral fees for 60 days**\n\n---"},{"title":"12. Quick Reference: Agent Cheat Sheet","html":"<h4>Most Common Seller Questions & Quick Answers</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Question</th><th>Answer</th></tr></thead><tbody><tr><td>\"Do I need a commercial register to sell?\"</td><td>Only for Business accounts. Individual accounts don't require one (but are limited in features).</td></tr><tr><td>\"Can I use my Iqama to register?\"</td><td>Yes, for Business accounts. For Individual accounts, there's ambiguity for non-Saudi residents — recommend Business account with CR for certainty.</td></tr><tr><td>\"How long does approval take?\"</td><td>Typically 1–3 business days if everything is in order. Can take 7–14 days if video verification is needed. Complex cases: up to 30–45 days.</td></tr><tr><td>\"My account was rejected. What do I do?\"</td><td>Do NOT create a new account. Identify the specific rejection reason, fix that issue, and appeal with corrected documents.</td></tr><tr><td>\"Can I switch from Individual to Professional?\"</td><td>Yes, anytime via Settings → Account Info → Your Services → Upgrade.</td></tr><tr><td>\"Is the Professional plan really free?\"</td><td>Yes, currently there's a limited-time promotional offer with no monthly subscription for Amazon.sa.</td></tr><tr><td>\"What documents do I need?\"</td><td>National ID/Iqama (valid), bank statement or commercial register (PDF), active phone number, credit/debit card, business email.</td></tr><tr><td>\"Why was my document rejected?\"</td><td>Most common: name mismatch, blurry/cropped image, expired document, edited PDF, or address inconsistency.</td></tr><tr><td>\"Do I need to register for VAT?\"</td><td>Yes, if your annual KSA turnover exceeds SAR 375,000. Below that, voluntary registration is available.</td></tr><tr><td>\"Can I sell on both Amazon.sa and Amazon.ae?\"</td><td>Yes, MENA marketplaces can be accessed from a single regional account. Check if you need to complete separate marketplace-specific registration steps.</td></tr><tr><td>\"What language should my listings be in?\"</td><td>Arabic first, English optional. Arabic is essential for the Saudi market.</td></tr><tr><td>\"Can my employee register on my behalf?\"</td><td>Yes, using the \"Legal Representative\" path — requires Power of Attorney + Commercial Register combined in one PDF.</td></tr></tbody></table></div>\n<h4>Registration Troubleshooting Flowchart</h4>\n<p><code>`</code></p>\n<p>Seller can't complete registration</p>\n<p>│</p>\n<p>├─ Document rejected?</p>\n<p>│   ├─ Name mismatch → Ensure EXACT same name on all documents</p>\n<p>│   ├─ Low quality → Rescan at high resolution, all corners visible</p>\n<p>│   ├─ Expired → Renew ID/CR before resubmitting</p>\n<p>│   └─ Wrong format → Convert to PDF for business documents</p>\n<p>│</p>\n<p>├─ Payment method rejected?</p>\n<p>│   ├─ Prepaid card → Switch to real credit/debit card</p>\n<p>│   ├─ Card declined → Enable international/e-commerce transactions</p>\n<p>│   └─ Name mismatch → Card name must match Seller Central profile</p>\n<p>│</p>\n<p>├─ Identity verification pending?</p>\n<p>│   ├─ < 72 hours → Wait; normal processing time</p>\n<p>│   ├─ > 72 hours → Check Seller Central for notifications</p>\n<p>│   └─ Video call requested → Schedule promptly, prepare original docs</p>\n<p>│</p>\n<p>├─ Account deactivated after verification?</p>\n<p>│   ├─ Check rejection email for specifics</p>\n<p>│   ├─ Do NOT create new account</p>\n<p>│   ├─ Fix root cause</p>\n<p>│   └─ Submit structured appeal</p>\n<p>│</p>\n<p>└─ Technical error during registration?</p>\n<p>├─ Clear browser cache, try different browser</p>\n<p>├─ \"merchantId not present\" error → Contact Seller Support</p>\n<p>└─ Saudi marketplace not showing → Open support case for marketplace activation</p>\n<p><code>`</code></p>\n<h4>Key Contacts & Resources</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>URL / Details</th></tr></thead><tbody><tr><td>Amazon SA Seller Central</td><td>sellercentral.amazon.sa</td></tr><tr><td>Start Selling on Amazon SA</td><td>sell.amazon.sa</td></tr><tr><td>Amazon SA Pricing</td><td>sell.amazon.sa/pricing</td></tr><tr><td>Ministry of Commerce (CR)</td><td>mc.gov.sa</td></tr><tr><td>ZATCA (Tax/VAT)</td><td>zatca.gov.sa</td></tr><tr><td>SABER Platform</td><td>saber.sa</td></tr><tr><td>Business Platform Registration</td><td>business.sa</td></tr><tr><td>Seller Support (from Seller Central)</td><td>Help → Get Support → Selling on Amazon → Your Account → Registration Issues</td></tr></tbody></table></div>\n<p>---</p>\n<p><em>This document is for internal reference by account managers assisting sellers with the Amazon.sa registration process. Information is based on publicly available Amazon documentation, official Saudi government sources, and verified community reports as of September 2026. Policies and processes may change — always verify against the latest Amazon Seller Central guidance.</em></p>\n","searchText":"| Question | Answer |\n|---|---|\n| \"Do I need a commercial register to sell?\" | Only for Business accounts. Individual accounts don't require one (but are limited in features). |\n| \"Can I use my Iqama to register?\" | Yes, for Business accounts. For Individual accounts, there's ambiguity for non-Saudi residents — recommend Business account with CR for certainty. |\n| \"How long does approval take?\" | Typically 1–3 business days if everything is in order. Can take 7–14 days if video verification is needed. Complex cases: up to 30–45 days. |\n| \"My account was rejected. What do I do?\" | Do NOT create a new account. Identify the specific rejection reason, fix that issue, and appeal with corrected documents. |\n| \"Can I switch from Individual to Professional?\" | Yes, anytime via Settings → Account Info → Your Services → Upgrade. |\n| \"Is the Professional plan really free?\" | Yes, currently there's a limited-time promotional offer with no monthly subscription for Amazon.sa. |\n| \"What documents do I need?\" | National ID/Iqama (valid), bank statement or commercial register (PDF), active phone number, credit/debit card, business email. |\n| \"Why was my document rejected?\" | Most common: name mismatch, blurry/cropped image, expired document, edited PDF, or address inconsistency. |\n| \"Do I need to register for VAT?\" | Yes, if your annual KSA turnover exceeds SAR 375,000. Below that, voluntary registration is available. |\n| \"Can I sell on both Amazon.sa and Amazon.ae?\" | Yes, MENA marketplaces can be accessed from a single regional account. Check if you need to complete separate marketplace-specific registration steps. |\n| \"What language should my listings be in?\" | Arabic first, English optional. Arabic is essential for the Saudi market. |\n| \"Can my employee register on my behalf?\" | Yes, using the \"Legal Representative\" path — requires Power of Attorney + Commercial Register combined in one PDF. | ```\nSeller can't complete registration\n│\n├─ Document rejected?\n│   ├─ Name mismatch → Ensure EXACT same name on all documents\n│   ├─ Low quality → Rescan at high resolution, all corners visible\n│   ├─ Expired → Renew ID/CR before resubmitting\n│   └─ Wrong format → Convert to PDF for business documents\n│\n├─ Payment method rejected?\n│   ├─ Prepaid card → Switch to real credit/debit card\n│   ├─ Card declined → Enable international/e-commerce transactions\n│   └─ Name mismatch → Card name must match Seller Central profile\n│\n├─ Identity verification pending?\n│   ├─ < 72 hours → Wait; normal processing time\n│   ├─ > 72 hours → Check Seller Central for notifications\n│   └─ Video call requested → Schedule promptly, prepare original docs\n│\n├─ Account deactivated after verification?\n│   ├─ Check rejection email for specifics\n│   ├─ Do NOT create new account\n│   ├─ Fix root cause\n│   └─ Submit structured appeal\n│\n└─ Technical error during registration?\n    ├─ Clear browser cache, try different browser\n    ├─ \"merchantId not present\" error → Contact Seller Support\n    └─ Saudi marketplace not showing → Open support case for marketplace activation\n``` | Resource | URL / Details |\n|---|---|\n| Amazon SA Seller Central | sellercentral.amazon.sa |\n| Start Selling on Amazon SA | sell.amazon.sa |\n| Amazon SA Pricing | sell.amazon.sa/pricing |\n| Ministry of Commerce (CR) | mc.gov.sa |\n| ZATCA (Tax/VAT) | zatca.gov.sa |\n| SABER Platform | saber.sa |\n| Business Platform Registration | business.sa |\n| Seller Support (from Seller Central) | Help → Get Support → Selling on Amazon → Your Account → Registration Issues |\n\n---\n\n*This document is for internal reference by account managers assisting sellers with the Amazon.sa registration process. Information is based on publicly available Amazon documentation, official Saudi government sources, and verified community reports as of September 2026. Policies and processes may change — always verify against the latest Amazon Seller Central guidance.*"}],"listing":[{"title":"1. Overview: How Amazon Listings Work","html":"<p>An Amazon <strong>product listing</strong> consists of two parts:</p>\n<ul><li><strong>Product Detail Page (PDP)</strong> — The shared page displaying product information (title, images, bullets, description, A+ Content, reviews, variations). This page represents <em>the product itself</em>, not any single seller.</li><li><strong>Offers</strong> — Each seller creates an <em>offer</em> against that product detail page, with their own price, quantity, condition, and fulfillment method. Multiple sellers can sell the same product on the same PDP.</li></ul><h4>The ASIN System</h4>\n<p>Every unique product in Amazon's catalog is assigned an <strong>ASIN (Amazon Standard Identification Number)</strong> — a 10-character alphanumeric code (e.g., <code>B0XXXXXXXXX</code>). This is the foundation of Amazon's catalog:</p>\n<ul><li><strong>One product = one ASIN = one product detail page</strong></li><li>Multiple sellers share the same ASIN/PDP</li><li>Creating duplicate ASINs for the same product violates Amazon's ASIN Creation Policy</li><li>A new ASIN is created only when the product does not already exist in Amazon's catalog</li></ul>\n<h4>Amazon.sa Marketplace Context</h4>\n<p>Amazon.sa (Saudi Arabia) operates within the broader <strong>Amazon MENA</strong> ecosystem alongside Amazon.ae (UAE) and Amazon.eg (Egypt). Sellers can manage SA, AE, and EG stores from a <strong>unified Seller Central account</strong> (linked accounts). The Amazon.sa catalog is distinct from other marketplaces — ASINs may or may not exist across stores.</p>\n<p>---</p>\n","searchText":"An Amazon **product listing** consists of two parts:\n\n1. **Product Detail Page (PDP)** — The shared page displaying product information (title, images, bullets, description, A+ Content, reviews, variations). This page represents *the product itself*, not any single seller.\n2. **Offers** — Each seller creates an *offer* against that product detail page, with their own price, quantity, condition, and fulfillment method. Multiple sellers can sell the same product on the same PDP.Every unique product in Amazon's catalog is assigned an **ASIN (Amazon Standard Identification Number)** — a 10-character alphanumeric code (e.g., `B0XXXXXXXXX`). This is the foundation of Amazon's catalog:\n\n- **One product = one ASIN = one product detail page**\n- Multiple sellers share the same ASIN/PDP\n- Creating duplicate ASINs for the same product violates Amazon's ASIN Creation Policy\n- A new ASIN is created only when the product does not already exist in Amazon's catalog Amazon.sa (Saudi Arabia) operates within the broader **Amazon MENA** ecosystem alongside Amazon.ae (UAE) and Amazon.eg (Egypt). Sellers can manage SA, AE, and EG stores from a **unified Seller Central account** (linked accounts). The Amazon.sa catalog is distinct from other marketplaces — ASINs may or may not exist across stores.\n\n---"},{"title":"2. Listing Methods: Match Existing vs. Create New","html":"<h4>M
