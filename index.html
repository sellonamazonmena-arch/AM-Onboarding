<meta charset="UTF-8">

<title>AM Onboarding Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--p:#0F172A;--a:#FF9900;--a2:#F59E0B;--bg:#F8FAFC;--sf:#FFFFFF;--t:#0F172A;--t2:#475569;--t3:#94A3B8;--bd:#E2E8F0;--bl:#F1F5F9;--r:16px;--sh:0 1px 3px rgba(0,0,0,.04);--shm:0 4px 16px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
body.dk{--bg:#0F172A;--sf:#1E293B;--t:#E2E8F0;--t2:#94A3B8;--t3:#64748B;--bd:#334155;--bl:#1E293B}
.topnav{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#0F172A,#1E293B);height:60px;display:flex;align-items:center;padding:0 20px;gap:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.topnav .brand{color:#fff;font-weight:800;font-size:16px;white-space:nowrap}
.topnav .brand span{color:var(--a)}
.mp-sel{display:flex;gap:4px;margin-left:auto}
.mp-btn{border:2px solid rgba(255,255,255,.15);background:none;color:rgba(255,255,255,.6);padding:6px 14px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:.2s;white-space:nowrap}
.mp-btn:hover{border-color:rgba(255,255,255,.3);color:#fff}
.mp-btn.active{border-color:var(--a);background:rgba(255,153,0,.15);color:var(--a)}
.topnav .tbtn{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
.topnav .tbtn:hover{background:rgba(255,255,255,.15);color:#fff}
.sidebar{position:fixed;top:60px;left:0;bottom:0;width:260px;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;z-index:100;padding:8px 0}
.sb-phase{padding:4px 16px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.sb-phase-pct{font-size:10px;color:var(--a);font-weight:700}
.phase-bar{height:3px;background:var(--bd);border-radius:2px;margin:4px 16px 4px;overflow:hidden}
.phase-fill{height:100%;background:var(--a);border-radius:2px;transition:width .5s}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--t2);transition:.15s;border-left:3px solid transparent}
.sb-item:hover{background:var(--bl);color:var(--t)}
.sb-item.active{background:rgba(255,153,0,.08);color:var(--a);border-left-color:var(--a);font-weight:700}
.sb-item.done-item{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--bd)}
.sb-item .ic{width:20px;text-align:center;font-size:14px}
.sb-check{width:18px;height:18px;border:2px solid var(--bd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:.2s;cursor:pointer}
.sb-check.done{background:var(--a);border-color:var(--a);color:#fff}
.sb-check.just-done{animation:checkPop .4s ease}
@keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.main{margin-left:260px;margin-top:60px;min-height:calc(100vh - 60px)}
.progress-bar{height:5px;background:var(--bd);position:sticky;top:60px;z-index:90}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF9900,#F59E0B,#10B981);transition:width .8s ease;border-radius:0 3px 3px 0}
.content{max-width:900px;margin:0 auto;padding:32px 24px 100px}
.page-title{font-size:28px;font-weight:800;margin-bottom:4px}
.page-sub{font-size:14px;color:var(--t2);margin-bottom:24px}
.time-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:600;background:var(--bl);color:var(--t3);margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--sh);opacity:0;transform:translateY(12px);animation:cardIn .4s ease forwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.card-h{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.card-h:hover{background:var(--bl)}
.card-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card-t{flex:1;font-size:14px;font-weight:700}
.card-sub{font-size:11px;color:var(--t3);margin-top:1px}
.card-arr{font-size:10px;color:var(--t3);transition:.3s}
.card.open .card-arr{transform:rotate(180deg)}
.card-body{display:none;padding:0 20px 20px;border-top:1px solid var(--bl)}

.sec-content{font-size:13px;color:var(--t2);line-height:1.8}
.sec-content h4{font-size:14px;font-weight:700;color:var(--t);margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--a)}
.sec-content p{margin-bottom:10px}
.sec-content ul{margin:6px 0 12px 20px}
.sec-content li{margin-bottom:4px}
.sec-content strong{color:var(--t)}
.sec-content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.sec-content th{background:var(--p);color:#fff;padding:8px 12px;text-align:left}
.sec-content td{padding:6px 12px;border-bottom:1px solid var(--bd)}
.sec-content tr:nth-child(even) td{background:var(--bl)}
.sec-content a{color:#3B82F6;text-decoration:none}
.sec-content a:hover{text-decoration:underline}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:16px 0}
.kpi-card{background:var(--bl);border-radius:12px;padding:16px;text-align:center;transition:.2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.kpi-name{font-size:13px;font-weight:700;color:var(--t)}
.kpi-desc{font-size:11px;color:var(--t3);margin-top:4px}
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:12px 0}
.link-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bl);border-radius:10px;font-size:12px;color:var(--t2);transition:.15s;text-decoration:none}
.link-item:hover{background:rgba(255,153,0,.08);color:var(--a)}
.link-item .li-name{font-weight:600;color:var(--t)}
.link-item .li-cat{font-size:10px;color:var(--t3)}
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--sf);border-radius:24px;padding:48px;text-align:center;z-index:300;box-shadow:0 20px 60px rgba(0,0,0,.3);transition:.3s;max-width:380px}
.popup.show{transform:translate(-50%,-50%) scale(1)}

.popup-overlay.show{display:block}
.popup-emoji{font-size:72px;margin-bottom:12px}

.popup-close:hover{background:var(--a2)}

/* PROGRESS RING */
.progress-ring{margin:16px auto;text-align:center}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring-bg{fill:none;stroke:var(--bd);stroke-width:6}

.phase-bar{height:3px;background:var(--bd);border-radius:2px;margin:4px 16px 8px;overflow:hidden}

var PB={"registration": [{"title": "1. Account Types: Individual vs Professional", "text": "Amazon.sa offers three registration paths for sellers: Individual Account (No Commercial Registration Required) Aspect Details Who it's for Small-scale sellers, beginners, those selling Monthly fee No monthly subscription fee Per-item fee SAR 3.75 (~$1.00) per item sold Identity document National ID"}, {"title": "2. Pre-Registration Requirements & Documents", "text": "For ALL Account Types Requirement Details Business email address Or an existing Amazon customer account email. Use an established, long-term email \u2014 avoid newly created or disposable emails. Active phone number A number where Amazon can reach you directly. Must be able to receive SMS/OTP verificatio"}, {"title": "3. Step-by-Step Registration Process", "text": "Step 1: Navigate to Registration Go to sell.amazon.sa (or services.amazon.sa ) Click \"Register Now\" (\u0633\u062c\u0644 \u0627\u0644\u0622\u0646) Step 2: Create Your Amazon Account Enter your first and last name Enter your email address (use an existing Amazon customer account email, or create a new one) Create a password Click \"Next"}, {"title": "4. Identity Verification (SIV) Process", "text": "Amazon's Seller Identity Verification (SIV) is a rigorous, multi-step process designed to prevent fraud. What Amazon Verifies Identity : Confirming you are a real person matching the documents Address : Your residential/business address matches document records Banking : Bank ownership verification "}, {"title": "5. Video Verification Call", "text": "Amazon may require a live video verification call as the final identity confirmation step. When It's Required Amazon's system determines if video verification is needed based on risk assessment More common for: new sellers, international sellers, flagged applications Sellers receive an email/notific"}, {"title": "6. Account Approval Timeline", "text": "Typical Timeline Stage Expected Duration Account creation & setup Immediate (minutes) Document upload & initial review 24\u201372 hours (if all documents are correct) Video verification (if required) Scheduled within days; results within 5 business days Full account activation 1\u20133 business days (best cas"}, {"title": "7. Common Rejection Reasons & How to Fix Them", "text": "1. Name Mismatch Across Documents The #1 rejection reason. Problem Examples Missing middle name ID says \"Mohammed Ahmed Al-Saud\" but Seller Central says \"Mohammed Al-Saud\" Initials vs. full name ID says \"Abdullah\" but bank statement shows \"A. Rahman\" Arabic vs. English transliteration Name spelled d"}, {"title": "8. Switching Between Account Types", "text": "Upgrading: Individual \u2192 Professional Log in to Seller Central Go to Settings \u2192 Account Info Under Seller Account Information , find Your Services \u2192 click Manage In the \"Sell on Amazon\" row, click \"Upgrade\" Follow the prompts to confirm What changes : Monthly subscription fee begins (currently waived"}, {"title": "9. Multiple Account Policy", "text": "Amazon's Standard Policy \"Sellers may only maintain one Seller Central account per region unless they have a legitimate business need for a second account and all accounts are in good standing.\" What This Means for MENA Sellers One account per region : The MENA region (Amazon.sa, Amazon.ae, Amazon.e"}, {"title": "10. Saudi-Specific Regulatory Requirements", "text": "Commercial Registration (\u0627\u0644\u0633\u062c\u0644 \u0627\u0644\u062a\u062c\u0627\u0631\u064a / CR) What it is : A registration certificate issued by the Saudi Ministry of Commerce (MoC) required for businesses operating in KSA How to obtain : Register electronically through mc.gov.sa or via the Business Platform (business.sa) Requirements : Saudi Natio"}, {"title": "11. Key Fees & Pricing (Amazon.sa)", "text": "Subscription Fees Plan Fee Individual No monthly fee; SAR 3.75 per item sold Professional Free (limited-time promotional offer \u2014 normally $39.99/month) Referral Fees (Selected Categories) Category Referral Fee Minimum Consumer Electronics 5.5% 1 SAR Mobiles & Tablets 5.5% 1 SAR Beauty 8.5% (\u226450 SAR)"}, {"title": "12. Quick Reference: Agent Cheat Sheet", "text": "Most Common Seller Questions & Quick Answers Question Answer \"Do I need a commercial register to sell?\" Only for Business accounts. Individual accounts don't require one (but are limited in features). \"Can I use my Iqama to register?\" Yes, for Business accounts. For Individual accounts, there's ambi"}], "listing": [{"title": "1. Overview: How Amazon Listings Work", "text": "An Amazon product listing consists of two parts: Product Detail Page (PDP) \u2014 The shared page displaying product information (title, images, bullets, description, A+ Content, reviews, variations). This page represents the product itself , not any single seller. Offers \u2014 Each seller creates an offer a"}, {"title": "2. Listing Methods: Match Existing vs. Create New", "text": "Method 1: Match an Existing Listing (Add Offer to Existing ASIN) When to use: The product already exists in the Amazon.sa catalog. Steps: Go to Catalog \u2192 Add Products in Seller Central Search by GTIN (UPC/EAN), ASIN, or product name If a match is found, click \"Sell this product\" Fill out Offer Detai"}, {"title": "3. Product Detail Page Anatomy", "text": "The Amazon Product Detail Page (PDP) contains these key sections: Above the Fold (Visible Without Scrolling) Element Description Who Controls It Product Title The product name displayed at the top. Critical for search ranking. Brand owner (highest authority) or most authoritative contributor Main Im"}, {"title": "4. Product Identifiers (UPC / EAN / GTIN)", "text": "What Are Product IDs? Amazon requires a Global Trade Item Number (GTIN) to identify products in its catalog. GTINs come in several formats: Identifier Digits Primary Use UPC (Universal Product Code) 12 North America EAN (European Article Number) 13 Europe, MENA, rest of world ISBN (International Sta"}, {"title": "5. GTIN Exemption \u2014 Listing Without a Product ID", "text": "What Is a GTIN Exemption? A GTIN exemption is an approval from Amazon that lets you create product listings without a standard product identifier (UPC, EAN, ISBN). This is a legitimate, Amazon-approved process \u2014 not a workaround. Who Qualifies? Private label sellers whose brand doesn't yet have regi"}, {"title": "6. Bulk Listing via Flat Files", "text": "What Are Flat Files? Flat files are structured spreadsheet templates (tab-delimited .txt or .xlsx) that sellers upload to Seller Central to create, update, or delete multiple listings at once . This is the standard method for managing large catalogs. When to Use Flat Files Creating more than a few l"}, {"title": "7. Listing Optimization", "text": "Title Optimization The product title is the single most important field for both search ranking and click-through rate. Title Formula: ` Brand Name + Primary Keyword + Key Feature/Benefit + Size/Variant + Secondary Keyword ` Title Rules (General): Capitalize the first letter of each word (Title Case"}, {"title": "8. Title Update: 75-Character Cap & Item Highlights (2026)", "text": "The Change (Effective July 27, 2026) Amazon announced and enforced a new 75-character title limit (including spaces) for all product categories except media (books, music, video). \u26a0\ufe0f MENA Exclusion Amazon.sa (Saudi Arabia), Amazon.ae (UAE), Amazon.eg (Egypt), and Amazon T\u00fcrkiye are currently EXCLUDE"}, {"title": "9. A+ Content (Enhanced Brand Content)", "text": "What Is A+ Content? A+ Content allows Brand Registry\u2013enrolled sellers to replace the standard text product description with rich media modules including enhanced images, custom text layouts, comparison charts, and brand story sections. Requirements A Professional selling plan Brand must be enrolled "}, {"title": "10. Product Variations (Parent-Child Relationships)", "text": "What Are Variations? Variations group related products (differing by size, color, flavor, style, etc.) onto a single product detail page so shoppers can toggle between options without leaving the listing. Structure Role Description Buyable? Parent ASIN The umbrella listing that ties the family toget"}, {"title": "11. Listing Quality & Suppressed Listings", "text": "Listing Quality Dashboard Amazon provides a Listing Quality Dashboard in Seller Central: Location : Inventory \u2192 Manage All Inventory \u2192 Listing Quality Dashboard (or Catalog \u2192 Improve Listing Quality) Shows recommendations to improve listings, prioritized by page views and sales potential Listings ar"}, {"title": "12. Common Listing Errors and Fixes", "text": "Feed Upload / Flat File Errors Error Code Description Fix 5461 You don't have permission to create a new ASIN under this brand Apply for brand approval, enroll in Brand Registry, or match to existing ASIN 5665 Brand name not recognized / not approved Enroll brand in Brand Registry or submit GTIN exe"}, {"title": "13. Product Categories & Approval-Gated Categories", "text": "Category Structure on Amazon.sa Products are organized in a hierarchical category tree (browse tree). When creating a listing, you must select the most specific applicable category (the browse node ). The category determines: Which attributes are required vs. optional Which flat file template to use"}, {"title": "14. Listing Policies & Compliance", "text": "Product Detail Page Rules One product = one ASIN : Do not create duplicate ASINs Accurate information only : All listing content must be truthful and accurate Country-correct product : Don't list a product version meant for another country under a listing for the local version No promotional content"}, {"title": "15. MENA / Saudi Arabia\u2013Specific Considerations", "text": "Arabic-First Approach Arabic is essential for Amazon.sa \u2014 it is the dominant language for online commerce in KSA Product listings should be in professional, accurate Arabic \u2014 not machine-translated English can be secondary but Arabic is mandatory for building customer trust For SEO, include both Ara"}, {"title": "16. Buy Box (Featured Offer)", "text": "What Is the Buy Box? The Buy Box is the section on the product detail page containing the \"Add to Cart\" and \"Buy Now\" buttons. When multiple sellers offer the same product, Amazon selects one seller's offer to feature in the Buy Box. This seller captures the vast majority of sales. How the Buy Box I"}, {"title": "17. Quick Reference Checklists", "text": "New Listing Checklist (Amazon.sa) [ ] Search catalog thoroughly \u2014 confirm product doesn't already exist [ ] If exists: match offer to existing ASIN [ ] If new: select correct product category [ ] Enter valid EAN/UPC (or apply for GTIN exemption) [ ] Write Arabic title (professional, keyword-rich, wi"}], "fba": [{"title": "1. What Is FBA?", "text": "Fulfillment by Amazon (FBA) is a logistics service where sellers send their inventory to Amazon's fulfillment centers, and Amazon handles the entire post-sale process: storage, picking, packing, shipping, customer service, and returns . In the MENA region, FBA operates through Amazon's fulfillment n"}, {"title": "2. How FBA Works \u2014 Step-by-Step Flow", "text": "The FBA Lifecycle ` Seller lists products \u2192 Sends inventory to Amazon FC \u2192 Amazon stores inventory \u2192 Customer orders \u2192 Amazon picks, packs, ships \u2192 Amazon handles returns/CS ` Detailed flow: Seller creates product listing on Amazon.sa and designates it as FBA inventory. Seller prepares shipment \u2014 pr"}, {"title": "3. Enrollment Steps \u2014 How to Start with FBA on Amazon.sa", "text": "Prerequisites An active Amazon.sa Professional selling account Products listed in the Amazon catalog Compliance with Saudi Arabia import/tax requirements (see Section 9) Step-by-Step Enrollment #### Step 1: Create an Amazon.sa Selling Account Go to sellercentral.amazon.sa and register for a new acco"}, {"title": "4. FBA Fees Structure \u2014 Amazon.sa (Saudi Arabia)", "text": "Overview of Fee Categories FBA fees on Amazon.sa consist of several layers: Referral Fees \u2014 Percentage of sale price (varies by category) FBA Fulfillment Fees \u2014 Per-unit charge for pick, pack, and ship Monthly Inventory Storage Fees \u2014 Based on space occupied Long-Term / Aged Inventory Surcharge \u2014 Fo"}, {"title": "5. Inventory Management", "text": "5.1 Inventory Performance Index (IPI) The IPI score is Amazon's composite metric measuring how well you manage FBA inventory. It ranges from 0 to 1,000. Score \u2265 400: Unlimited standard storage capacity Score Amazon caps your storage capacity (cubic footage limits) IPI is influenced by: Excess invent"}, {"title": "6. Shipping to Amazon Warehouses (KSA)", "text": "6.1 Inbound Shipment Process Using \"Send to Amazon\" workflow in Seller Central: Select inventory \u2014 Choose which products and quantities to ship. Choose shipping method \u2014 Options include: Amazon Partnered Carrier (PCP) \u2014 Discounted rates through Amazon's carrier partners Seller Managed Carrier \u2014 Use "}, {"title": "7. FBA Prep Requirements", "text": "7.1 Overview Every unit must arrive at Amazon's fulfillment center fully prepped, labeled, and compliant. Amazon discontinued in-house FBA prep and labeling services for US shipments as of January 1, 2026. The same expectation applies to MENA \u2014 all prep must be completed before arrival. 7.2 Barcode "}, {"title": "8. FBA Returns Policy", "text": "8.1 How FBA Returns Work For FBA orders, Amazon handles the entire returns process : Customer initiates return through their Amazon account or the Online Returns Center. Amazon evaluates the request against the return window and product eligibility. Auto-authorization \u2014 Most in-policy requests are a"}, {"title": "9. Compliance & Regulatory Requirements for KSA", "text": "9.1 VAT (Value Added Tax) VAT rate: 15% in Saudi Arabia (one of the highest in the region). Managed by ZATCA (Zakat, Tax and Customs Authority). Mandatory VAT registration for businesses with annual turnover \u2265 SAR 375,000 (~USD $100,000). FBA sellers must register for and remit VAT. VAT must be fact"}, {"title": "10. FBA Advantages", "text": "10.1 Sales & Visibility Benefits Advantage Impact Prime Badge FBA products display the Prime logo \u2014 Prime members are 2\u20133\u00d7 more likely to purchase Buy Box advantage FBA listings have a significant edge in winning the Featured Offer (Buy Box) Higher conversion rates FBA listings convert at 18\u201325% vs."}, {"title": "11. Common Seller Questions (FAQ)", "text": "Getting Started Q: Do I need a KSA-based business entity to sell on Amazon.sa? A: No. International sellers can sell on Amazon.sa without forming a Saudi-based company. However, depending on your sales strategy and volumes, having a local entity may be advantageous for customs, VAT, and banking. Q: "}, {"title": "12. Key Seller Central Reports for FBA", "text": "Report Purpose Frequency FBA Dashboard Overall inventory health, IPI score Weekly Inventory Adjustment Report Track lost, damaged, transferred units Weekly Reimbursements Report View reimbursements already issued Monthly Inventory Ledger Report Detailed inventory movement records Weekly Customer Ret"}, {"title": "13. Key Sales Events in KSA", "text": "Plan FBA inventory around these peak periods: Event Timing Notes Ramadan Varies (Islamic calendar) Major shopping period; stock up well in advance Eid al-Fitr End of Ramadan Gift-giving spike Eid al-Adha ~70 days after Eid al-Fitr Another major gifting event Saudi National Day September 23 National "}, {"title": "14. Quick Reference \u2014 Key Contacts & Resources", "text": "Resource URL / Location Amazon.sa Seller Central sellercentral.amazon.sa Amazon.sa FBA Page sell.amazon.sa/fulfillment-by-amazon Amazon.sa Pricing / Fees sell.amazon.sa/pricing FBA Revenue Calculator Available in Seller Central SABER Platform saber.sa ZATCA (Tax Authority) zatca.gov.sa SASO (Standar"}], "pricing": [{"title": "Focus: MENA / Saudi Arabia (Amazon.sa) Marketplace", "text": "Purpose: Practical reference for account managers and support agents to answer seller questions about Amazon's Automate Pricing tool, manual pricing strategies, and Buy Box / Featured Offer pricing. --- What Is Automate Pricing? Availability on Amazon.sa / MENA How It Works \u2014 Core Mechanics Types of"}, {"title": "1. What Is Automate Pricing?", "text": "Amazon Automate Pricing is a free, built-in repricing tool available in Seller Central to all sellers with a Professional selling plan . It automatically adjusts product prices on selected SKUs in near real-time based on rules defined by the seller. Key Facts Attribute Detail Cost Free \u2014 included wi"}, {"title": "2. Availability on Amazon.sa / MENA", "text": "Marketplace Details Amazon operates two primary marketplaces in the MENA region: Amazon.sa \u2014 Saudi Arabia (currency: SAR) Amazon.ae \u2014 United Arab Emirates (currency: AED) Both marketplaces are on Amazon's EU tech stack and share the unified Seller Central infrastructure. Automate Pricing Availabilit"}, {"title": "3. How It Works \u2014 Core Mechanics", "text": "The Repricing Loop ` Seller creates a pricing rule with parameters Seller assigns SKUs to the rule and sets min/max prices Seller activates repricing (\"Start Repricing\") Amazon monitors marketplace pricing events (e.g., competitor price changes, Featured Offer changes) When an event occurs, the syst"}, {"title": "4. Types of Pricing Rules (Detailed)", "text": "4.1 Competitive Featured Offer Rule Goal: Position your price relative to the current Featured Offer (Buy Box) price to increase your chances of winning the Featured Offer. How It Works: The rule monitors the current Featured Offer price on the listing. You configure your price to be: Below the Feat"}, {"title": "5. Step-by-Step Setup Guide", "text": "Prerequisites Before setting up Automate Pricing, ensure: \u2705 Professional selling plan is active \u2705 Product catalog is uploaded and listings are Active in Seller Central \u2705 You have calculated your minimum price for each SKU (covering COGS + referral fee + FBA fee + shipping + VAT + target margin) \u2705 Yo"}, {"title": "6. Min / Max Price Guardrails", "text": "Minimum Price (REQUIRED) The minimum price is the single most important margin-protection mechanism in Automate Pricing. Key Facts: Mandatory for every SKU enrolled in automated pricing Represents the absolute floor \u2014 the tool will never price below this amount The tool does NOT calculate this for y"}, {"title": "7. How the Tool Reprices \u2014 Timing & Behavior", "text": "Response Time Existing rules (no parameter changes): Price updates are usually processed in less than 15 minutes but may take longer under certain circumstances. New rules or parameter changes: Can take up to 1 hour for all products assigned to the rule to reprice according to new parameters. Amazon"}, {"title": "8. Best Practices", "text": "Strategy & Planning Define your objective first: Are you trying to win the Featured Offer? Maximize margins? Clear inventory? Your goal determines the rule type. Start small and conservative: Test rules on 10\u201350 SKUs before rolling out to your full catalog. Monitor for 2 weeks before judging results"}, {"title": "9. Limitations & Known Issues", "text": "Structural Limitations Limitation Detail No cost awareness The tool doesn't know your COGS, fees, or margins. The minimum price is your only protection. No profit calculation Cannot calculate whether a repriced sale is profitable. Polling-based, not real-time Doesn't respond instantly to every compe"}, {"title": "10. Manual Pricing Strategies", "text": "While Automate Pricing is powerful, some sellers prefer or need manual pricing control. Here's how manual pricing works on Amazon and when it makes sense. How to Manually Update Prices Individual SKU update: Seller Central \u2192 Inventory \u2192 Manage All Inventory Click on the price field for the SKU Enter"}, {"title": "11. Buy Box / Featured Offer \u2014 Pricing Strategies", "text": "What Is the Featured Offer (Buy Box)? The Featured Offer (formerly called the \"Buy Box\") is the prominent section on an Amazon product detail page containing the \"Add to Cart\" and \"Buy Now\" buttons. When multiple sellers list the same product (same ASIN), Amazon's algorithm selects one or more offer"}, {"title": "12. Frequently Asked Questions (FAQ)", "text": "General Questions Q: Is Automate Pricing free? A: Yes. It's included at no additional cost with the Professional selling plan. Q: Who is eligible to use Automate Pricing? A: Any seller with a Professional selling account and active product listings. Q: Can I use Automate Pricing on Amazon.sa? A: Yes"}, {"title": "13. Troubleshooting Scenarios", "text": "Scenario 1: \"I set up a rule but my price hasn't changed\" Check: Is the rule status \"Active\" or \"Paused\"? Check: Is the listing status \"Active\"? Check: Was the rule just created? Wait up to 1 hour for initial processing. Check: Is there a valid reference price? (If no Featured Offer exists or the li"}, {"title": "14. Automate Pricing vs. Third-Party Repricers", "text": "Comparison Table Feature Amazon Automate Pricing Third-Party Repricers Cost Free (with Professional plan) $15\u2013$500+/month depending on SKU count Speed Polling-based (minutes) Event-driven / near real-time (seconds to 90 seconds) Cost Awareness None \u2014 manual minimum only Can input COGS, fees; auto-ca"}, {"title": "15. Key Terminology Glossary", "text": "Term Definition Featured Offer (Buy Box) The prominent purchase area on a product page with \"Add to Cart\" and \"Buy Now\" buttons. The offer displayed here captures the majority of sales. ASIN Amazon Standard Identification Number \u2014 a unique product identifier on Amazon SKU Stock Keeping Unit \u2014 a sell"}, {"title": "16. Sources", "text": "Amazon Seller Central \u2014 Automate Pricing Tool Amazon Seller Blog \u2014 What Are Amazon Automate Pricing Rules? Amazon Seller Blog \u2014 Amazon Pricing Strategies Amazon Seller Blog \u2014 Featured Offer / Buy Box Amazon Seller Forums \u2014 Everything You Need to Know About Automate Pricing Amazon SP-API Documentatio"}], "brand": [{"title": "Comprehensive Research Guide for Account Managers", "text": "Last updated: September 2026 --- What Is Amazon Brand Registry? Eligibility Requirements MENA / Saudi Arabia Specific Details Enrollment Process \u2014 Step by Step Verification Process Benefits of Brand Registry 6.1 A+ Content (Enhanced Brand Content) 6.2 Brand Store (Storefront) 6.3 Brand Analytics 6.4"}, {"title": "1. What Is Amazon Brand Registry?", "text": "Amazon Brand Registry is a free program that connects a brand owner's registered trademark to their Amazon seller account. It serves as the foundational layer for brand protection, listing control, and access to Amazon's full suite of brand-building tools. Key Facts Cost : Free to enroll \u2014 no enroll"}, {"title": "2. Eligibility Requirements", "text": "Trademark Requirements To enroll a brand in Brand Registry, you must have : An active registered trademark \u2014 issued by a government trademark office in an accepted country OR a pending trademark application filed through Amazon IP Accelerator The trademark must be one of the following types: Text-ba"}, {"title": "3. MENA / Saudi Arabia Specific Details", "text": "Saudi Arabia (amazon.sa) Marketplace SAIP trademarks accepted : Yes \u2014 Saudi Authority for Intellectual Property trademarks are on Amazon's accepted list Brand Registry portal : Accessible via brandservices.amazon.com (same global portal) A+ Content : Available on amazon.sa for Brand Registry enrolle"}, {"title": "4. Enrollment Process \u2014 Step by Step", "text": "Pre-Enrollment Checklist Before starting the application, gather: Item Details Brand name Exact format as it appears on the trademark record (spaces, symbols, capitalization \u2014 though capitalization differences are accepted) Logo image Exact copy as it appears on the trademark record (only if you hav"}, {"title": "5. Verification Process", "text": "How Verification Works After submission, Amazon verifies you are the legitimate trademark rights owner: Amazon sends a verification code to the public contact listed on the trademark record This is usually the trademark attorney or correspondent on file with the trademark office \u2014 not the Seller Cen"}, {"title": "6. Benefits of Brand Registry", "text": "6.1 A+ Content (Enhanced Brand Content) What it is : Replaces the plain-text product description with rich multimedia content on product detail pages. Two tiers : Feature Basic A+ Content Premium A+ Content Cost Free Free (eligibility-based) Image modules Standard image sizes Larger, higher-quality "}, {"title": "7. Brand Protection & IP Tools", "text": "7.1 Automated Protections What they are : Machine learning algorithms that automatically scan the Amazon catalog for potential IP violations. How they work : Activated automatically upon Brand Registry enrollment \u2014 no manual setup required Scans for trademark infringement, inaccurate product informa"}, {"title": "8. Brand Registry vs. Not Having It", "text": "Comparison Table Capability Without Brand Registry With Brand Registry Listing control Any seller can edit your title, bullet points, images Brand owner has authoritative control over product detail pages A+ Content \u274c Not available \u2705 Full access (basic + potential premium) Brand Store \u274c Not availabl"}, {"title": "9. Managing Brand Representatives & Roles", "text": "Brand Registry uses two categories of roles: Protection Roles (for IP enforcement) and Selling Roles (for selling benefits). 9.1 Protection Roles Role How Assigned Access Level Administrator Auto-assigned to trademark owner upon enrollment Full access: can assign/manage all roles, use all protection"}, {"title": "10. Common Rejection Reasons & How to Avoid Them", "text": "1. Brand Name Mismatch Problem : The brand name entered during enrollment doesn't match the trademark record exactly. \"Buy with Prime\" vs. \"BuywithPrime\" \u2192 rejected Extra spaces, missing symbols, different punctuation \u2192 rejected Capitalization differences \u2192 accepted Fix : Copy the brand name directl"}, {"title": "11. IP Accelerator \u2014 The Alternative Path", "text": "What It Is Amazon IP Accelerator connects brands with a network of Amazon-vetted IP law firms that provide trademark registration services at competitive rates. Key Benefits Brands get faster/earlier access to Brand Registry \u2014 can enroll with a pending trademark filed through IP Accelerator, rather "}, {"title": "12. Frequently Asked Questions", "text": "Enrollment & Eligibility Q: Can I enroll with a trademark from a country where I don't sell? A: You can enroll globally with any accepted trademark, but IP enforcement (takedowns) may only apply in the country matching your trademark. Best practice: register your trademark in each country where you "}, {"title": "Quick Reference: Key URLs", "text": "Resource URL Brand Registry Portal brandservices.amazon.com Brand Registry Eligibility brandservices.amazon.com/brandregistry/eligibility IP Accelerator brandservices.amazon.com/ipaccelerator Report a Violation Brand Registry Portal \u2192 Protect \u2192 Report a Violation Project Zero Brand Registry Portal \u2192"}]};
var TR={"locale": "tr-TR", "marketplace_id": "TR", "last_updated": "2026-10-04", "ui": {"welcome_title": "Amazon T\u00fcrkiye'ye Ho\u015f Geldiniz \ud83d\udc4b", "welcome_sub": "Hesap Y\u00f6neticisi oryantasyonunuz burada ba\u015fl\u0131yor. A\u015fa\u011f\u0131daki b\u00f6l\u00fcmleri tamamlayarak Amazon T\u00fcrkiye pazaryerini tan\u0131y\u0131n.", "kpis_title": "KPI'lar\u0131n\u0131z \ud83c\udfaf", "tools_title": "Dahili Ara\u00e7lar ve CTI'lar \ud83d\udee0\ufe0f", "mp_overview_title": "T\u00fcrkiye Pazaryeri Genel Bak\u0131\u015f\u0131 \ud83c\udf0d", "fees_title": "Sat\u0131\u015f Komisyonlar\u0131 \ud83d\udcb0", "promos_title": "Promosyonlar ve Kampanyalar \ud83c\udf81", "registration_title": "Kay\u0131t \u0130\u015flemi \ud83d\udccb", "listing_title": "\u00dcr\u00fcn Listeleme \ud83d\udce6", "fba_title": "Amazon Lojistik (FBA) \ud83d\ude9a", "pricing_title": "Otomatik Fiyatland\u0131rma \ud83d\udcb2", "brand_title": "Marka Kayd\u0131 \ud83d\udee1\ufe0f", "pocs_title": "\u0130leti\u015fim Ki\u015fileri \ud83d\udc65", "links_title": "\u00d6nemli Ba\u011flant\u0131lar \ud83d\udd17", "sections_complete": "tamamland\u0131", "min_read": "dk okuma", "continue": "Devam Et", "back": "Geri", "next": "\u0130leri", "section_complete_toast": "B\u00f6l\u00fcm Tamamland\u0131!", "keep_going": "Devam edin!", "in_a_row": "art arda!", "all_complete": "T\u00fcm b\u00f6l\u00fcmler tamamland\u0131! \ud83c\udf89", "progress": "\u0130lerleme", "phase1": "A\u015fama 1: Ho\u015f Geldiniz", "phase2": "A\u015fama 2: Pazaryeri", "phase3": "A\u015fama 3: Programlar", "phase4": "A\u015fama 4: Kaynaklar", "expand_all": "T\u00fcm\u00fcn\u00fc A\u00e7", "collapse_all": "T\u00fcm\u00fcn\u00fc Kapat", "search_placeholder": "B\u00f6l\u00fcm ara...", "loading": "Y\u00fckleniyor...", "error_retry": "Tekrar Dene", "not_started": "Ba\u015flanmad\u0131", "in_progress": "Devam Ediyor", "completed": "Tamamland\u0131"}, "registration": {"title": "Amazon T\u00fcrkiye'de Sat\u0131c\u0131 Hesab\u0131 A\u00e7ma", "content": "## Amazon T\u00fcrkiye'de Sat\u0131\u015fa Ba\u015flama\n\nAmazon.com.tr'de sat\u0131\u015f yapmak i\u00e7in \u00f6ncelikle bir Sat\u0131c\u0131 Merkezi (Seller Central) hesab\u0131 olu\u015fturman\u0131z gerekmektedir. Kay\u0131t i\u015flemi tamamen \u00e7evrimi\u00e7i olup, gerekli belgelerin haz\u0131r olmas\u0131 durumunda ortalama 15-20 dakika s\u00fcrmektedir.\n\n### Hesap T\u00fcrleri\n\n**Bireysel Hesap:**\n- Ayl\u0131k abonelik \u00fccreti yoktur\n- Sat\u0131lan her \u00fcr\u00fcn ba\u015f\u0131na sabit i\u015flem \u00fccreti uygulan\u0131r\n- Ayda 40'tan az \u00fcr\u00fcn satan sat\u0131c\u0131lar i\u00e7in uygundur\n- Reklam ara\u00e7lar\u0131na ve geli\u015fmi\u015f raporlara eri\u015fim s\u0131n\u0131rl\u0131d\u0131r\n\n**Profesyonel Hesap:**\n- Ayl\u0131k sabit abonelik \u00fccreti uygulan\u0131r\n- \u00dcr\u00fcn ba\u015f\u0131na ek i\u015flem \u00fccreti al\u0131nmaz\n- Amazon Reklam, A+ \u0130\u00e7erik, toplu listeleme ve geli\u015fmi\u015f raporlama ara\u00e7lar\u0131na tam eri\u015fim sa\u011flar\n- \u00d6ne \u00c7\u0131kan Teklif (Buy Box) kazanma hakk\u0131 verir\n- Ciddi sat\u0131\u015f hedefi olan t\u00fcm sat\u0131c\u0131lara \u00f6nerilir\n\n### Gerekli Belgeler\n\nKay\u0131t s\u00fcrecine ba\u015flamadan \u00f6nce a\u015fa\u011f\u0131daki belgeleri haz\u0131rlay\u0131n:\n\n1. **Vergi Kimlik Numaras\u0131 / Vergi Levhas\u0131:** Gelir \u0130daresi Ba\u015fkanl\u0131\u011f\u0131 (G\u0130B) taraf\u0131ndan d\u00fczenlenen g\u00fcncel vergi levhan\u0131z. \u015eah\u0131s \u015firketi veya t\u00fczel ki\u015filik fark etmeksizin vergi m\u00fckellefi olman\u0131z zorunludur.\n\n2. **MERSIS Numaras\u0131:** Ticaret sicil kayd\u0131n\u0131z\u0131 g\u00f6steren Merkezi Sicil Kay\u0131t Sistemi numaran\u0131z. T\u00fczel ki\u015filikler i\u00e7in zorunludur. mersis.gtb.gov.tr \u00fczerinden sorgulanabilir.\n\n3. **T.C. Kimlik Belgesi:** \u015eirket yetkilisinin T.C. kimlik kart\u0131 veya pasaportu. Belgenin ge\u00e7erlilik s\u00fcresi dolmam\u0131\u015f olmal\u0131d\u0131r.\n\n4. **Banka Hesap Bilgileri:** T\u00fcrkiye'de yerle\u015fik bir bankada a\u00e7\u0131lm\u0131\u015f, TRY cinsinden ticari banka hesab\u0131. IBAN numaras\u0131 ve hesap sahibi bilgileri kay\u0131t s\u0131ras\u0131nda istenecektir.\n\n5. **Kredi/Banka Kart\u0131:** Ayl\u0131k abonelik \u00fccretinin tahsil edilece\u011fi, uluslararas\u0131 \u00f6deme kabul eden ge\u00e7erli bir kart.\n\n6. **Telefon Numaras\u0131 ve E-posta Adresi:** Do\u011frulama amac\u0131yla kullan\u0131lacak g\u00fcncel bir cep telefonu numaras\u0131 ve e-posta adresi.\n\n### Kay\u0131t Ad\u0131mlar\u0131\n\n1. **sellercentral.amazon.com.tr** adresine gidin ve \"Kay\u0131t Ol\" butonuna t\u0131klay\u0131n.\n2. E-posta adresinizi ve \u015fifrenizi belirleyerek Amazon hesab\u0131n\u0131z\u0131 olu\u015fturun.\n3. \u0130\u015fletme bilgilerinizi girin: \u015eirket unvan\u0131, adresi, vergi kimlik numaras\u0131 ve MERSIS numaras\u0131.\n4. \u015eirket yetkilisinin kimlik bilgilerini girin ve T.C. kimlik belgenizi y\u00fckleyin.\n5. Banka hesap bilgilerinizi ekleyin (IBAN, banka ad\u0131, hesap sahibi).\n6. \u00d6deme y\u00f6ntemini (kredi/banka kart\u0131) tan\u0131mlay\u0131n.\n7. Telefon numaran\u0131z\u0131 SMS do\u011frulamas\u0131 ile onaylay\u0131n.\n8. Ma\u011faza ad\u0131n\u0131z\u0131 belirleyin.\n\n### Kimlik Do\u011frulama (SIV) S\u00fcreci\n\nKay\u0131t tamamland\u0131ktan sonra Amazon, Sat\u0131c\u0131 Kimlik Do\u011frulama (Seller Identity Verification - SIV) s\u00fcrecini ba\u015flat\u0131r:\n\n- Y\u00fckledi\u011finiz belgeler Amazon ekipleri taraf\u0131ndan incelenir.\n- Ek belge veya bilgi talep edilebilir (genellikle e-posta yoluyla).\n- Do\u011frulama s\u00fcreci tipik olarak 2-5 i\u015f g\u00fcn\u00fc s\u00fcrer, ancak ek inceleme gerekti\u011finde uzayabilir.\n- Video g\u00f6r\u00fc\u015fme yoluyla kimlik do\u011frulama istenebilir.\n- S\u00fcre\u00e7 tamamlanana kadar \u00fcr\u00fcn listeleyemez ve sat\u0131\u015fa ba\u015flayamazs\u0131n\u0131z.\n\n### S\u0131k Kar\u015f\u0131la\u015f\u0131lan Red Nedenleri ve \u00c7\u00f6z\u00fcmleri\n\n| Sorun | \u00c7\u00f6z\u00fcm |\n|---|---|\n| Belgelerdeki isim uyu\u015fmazl\u0131\u011f\u0131 | T\u00fcm belgelerde (kimlik, vergi levhas\u0131, banka hesab\u0131) ayn\u0131 ismin/unvan\u0131n yer ald\u0131\u011f\u0131ndan emin olun |\n| D\u00fc\u015f\u00fck \u00e7\u00f6z\u00fcn\u00fcrl\u00fckl\u00fc belge g\u00f6rseli | Belgeleri en az 300 DPI \u00e7\u00f6z\u00fcn\u00fcrl\u00fckte, renkli ve t\u00fcm k\u00f6\u015feleri g\u00f6r\u00fcn\u00fcr \u015fekilde taray\u0131n |\n| S\u00fcresi dolmu\u015f kimlik belgesi | G\u00fcncel ve ge\u00e7erli kimlik kart\u0131 veya pasaport kullan\u0131n |\n| Vergi levhas\u0131 g\u00fcncel de\u011fil | G\u0130B \u0130nteraktif Vergi Dairesi \u00fczerinden g\u00fcncel vergi levhan\u0131z\u0131 indirin |\n| Banka hesab\u0131 do\u011frulanam\u0131yor | Banka hesab\u0131n\u0131n kay\u0131t yapan ki\u015fi/\u015firket ad\u0131na oldu\u011fundan ve IBAN'\u0131n do\u011fru girildi\u011finden emin olun |\n| Adres uyu\u015fmazl\u0131\u011f\u0131 | T\u00fcm belgelerdeki adreslerin tutarl\u0131 olmas\u0131na dikkat edin |\n\n### T\u00fcrkiye'ye \u00d6zel \u0130pu\u00e7lar\u0131\n\n- **e-Ticaret Mevzuat\u0131:** 6563 say\u0131l\u0131 Elektronik Ticaretin D\u00fczenlenmesi Hakk\u0131nda Kanun kapsam\u0131nda ETB\u0130S (Elektronik Ticaret Bilgi Sistemi) kayd\u0131 yapt\u0131rman\u0131z gerekmektedir.\n- **KEP Adresi:** Kay\u0131tl\u0131 Elektronik Posta (KEP) adresi, ticari i\u015fletmeler i\u00e7in yasal zorunluluktur.\n- **e-Fatura / e-Ar\u015fiv:** Belirli ciro e\u015fi\u011fini a\u015fan sat\u0131c\u0131lar e-fatura ve e-ar\u015fiv fatura d\u00fczenleme y\u00fck\u00fcml\u00fcl\u00fc\u011f\u00fcne tabidir. G\u0130B'in g\u00fcncel limitlerini kontrol edin.\n- **Bilgi Toplumu Hizmetleri:** Sat\u0131c\u0131 sayfan\u0131zda ticaret unvan\u0131, MERSIS numaras\u0131, adres ve ileti\u015fim bilgilerinizin yer almas\u0131 zorunludur."}, "listing": {"title": "Amazon T\u00fcrkiye'de \u00dcr\u00fcn Listeleme", "content": "## \u00dcr\u00fcn Listeleme Rehberi\n\nAmazon.com.tr'de \u00fcr\u00fcnlerinizi listelemek, sat\u0131\u015f ba\u015far\u0131n\u0131z\u0131n temelini olu\u015fturur. Do\u011fru ve eksiksiz \u00fcr\u00fcn bilgileri hem m\u00fc\u015fteri deneyimini iyile\u015ftirir hem de arama sonu\u00e7lar\u0131nda \u00fcst s\u0131ralarda yer alman\u0131z\u0131 sa\u011flar.\n\n### Listeleme Y\u00f6ntemleri\n\n**1. Mevcut ASIN'e Ekleme (Katalogda Var Olan \u00dcr\u00fcn)**\n- Sat\u0131c\u0131 Merkezi'nde \"Envanter\" > \"\u00dcr\u00fcn Ekle\" yolunu izleyin.\n- \u00dcr\u00fcn ad\u0131, ASIN, EAN veya UPC ile arama yap\u0131n.\n- E\u015fle\u015fen \u00fcr\u00fcn\u00fc se\u00e7ip fiyat, miktar ve kargo bilgilerinizi girin.\n- Ayn\u0131 \u00fcr\u00fcn\u00fc satan birden fazla sat\u0131c\u0131, \u00d6ne \u00c7\u0131kan Teklif (Buy Box) i\u00e7in rekabet eder.\n\n**2. Yeni \u00dcr\u00fcn Olu\u015fturma (Katalogda Bulunmayan \u00dcr\u00fcn)**\n- \"Envanter\" > \"\u00dcr\u00fcn Ekle\" > \"Amazon'da sat\u0131lmayan bir \u00fcr\u00fcn ekliyorum\" se\u00e7ene\u011fini t\u0131klay\u0131n.\n- Uygun kategoriyi se\u00e7in (baz\u0131 kategoriler onay gerektirir).\n- T\u00fcm zorunlu alanlar\u0131 eksiksiz doldurun.\n\n**3. Toplu Listeleme (Envanter Dosyas\u0131)**\n- \u00c7ok say\u0131da \u00fcr\u00fcn listelemek i\u00e7in envanter dosyas\u0131 \u015fablonlar\u0131n\u0131 kullan\u0131n.\n- Sat\u0131c\u0131 Merkezi'nden ilgili kategorinin \u015fablonunu indirin.\n- Excel dosyas\u0131n\u0131 doldurup \"Envanter\" > \"Toplu Y\u00fckleme\" ile sisteme y\u00fckleyin.\n- \u0130\u015flem raporunu kontrol ederek hatalar\u0131 d\u00fczeltin.\n\n### \u00dcr\u00fcn Detay Sayfas\u0131 Optimizasyonu\n\n**\u00dcr\u00fcn Ba\u015fl\u0131\u011f\u0131:**\n- T\u00fcrk\u00e7e karakter kullan\u0131m\u0131na dikkat edin (\u011f, \u00fc, \u015f, \u0131, \u00f6, \u00e7).\n- Marka ad\u0131 + \u00fcr\u00fcn ad\u0131 + temel \u00f6zellik + bo rtising platform.\n\u2022 Campaign terms and credit amount are subject to change."}, {"name": "Amazon Lojistik (FBA) Depolama Kampanyas\u0131", "details_tr": "Yeni FBA sat\u0131c\u0131lar\u0131, Amazon Lojistik program\u0131na ilk kez kat\u0131ld\u0131klar\u0131nda belirli bir s\u00fcre boyunca \u00fccretsiz depolama ve indirimli kar\u015f\u0131lama \u00fccretlerinden yararlanabilir. Bu kampanya ile Amazon Lojistik'in avantajlar\u0131n\u0131 d\u00fc\u015f\u00fck maliyetle deneyimleyebilirsiniz.", "details_en": "New FBA sellers can benefit from free storage and discounted fulfillment fees for a limited period when joining the FBA program for the first time. This campaign allows you to experience FBA benefits at reduced costs.", "conditions_tr": "\u2022 Amazon Lojistik'e ilk kez kay\u0131t olan sat\u0131c\u0131lar i\u00e7in ge\u00e7erlidir.\n\u2022 Kampanya s\u00fcresi ve \u00fccretsiz depolama limiti de\u011fi\u015fiklik g\u00f6sterebilir.\n\u2022 G\u00fcncel kampanya detaylar\u0131 i\u00e7in Sat\u0131c\u0131 Merkezi'ndeki FBA b\u00f6l\u00fcm\u00fcn\u00fc kontrol edin.", "conditions_en": "\u2022 Valid for sellers enrolling in FBA for the first time.\n\u2022 Campaign duration and free storage limits may vary.\n\u2022 Check the FBA section in Seller Central for current campaign details."}]}, "marketplace_overview": {"title_tr": "Amazon T\u00fcrkiye Hakk\u0131nda", "title_en": "About Amazon Turkey", "content_tr": "## Amazon T\u00fcrkiye Pazaryeri\n\nAmazon, T\u00fcrkiye pazar\u0131na 2018 y\u0131l\u0131nda amazon.com.tr ile giri\u015f yapm\u0131\u015ft\u0131r. O tarihten bu yana h\u0131zla b\u00fcy\u00fcyen pazaryeri, T\u00fcrkiye'nin e-ticaret ekosisteminin \u00f6nemli oyuncular\u0131ndan biri haline gelmi\u015ftir.\n\n### Pazar B\u00fcy\u00fckl\u00fc\u011f\u00fc ve Dinamikler\n\nT\u00fcrkiye, 85 milyonun \u00fczerindeki n\u00fcfusu, gen\u00e7 demografisi ve artan internet penetrasyonu ile e-ticaret alan\u0131nda b\u00fcy\u00fck bir b\u00fcy\u00fcme potansiyeline sahiptir. \u00d6zellikle mobil ticaret oran\u0131 olduk\u00e7a y\u00fcksektir; al\u0131\u015fveri\u015flerin b\u00fcy\u00fck \u00e7o\u011funlu\u011fu mobil cihazlar \u00fczerinden ger\u00e7ekle\u015fmektedir.\n\n### \u00d6ne \u00c7\u0131kan Kategoriler\n\n- **Moda ve Giyim:** T\u00fcrkiye'nin g\u00fc\u00e7l\u00fc tekstil ve haz\u0131r giyim sekt\u00f6r\u00fc, bu kategoriyi en rekabet\u00e7i ve en y\u00fcksek hacimli kategorilerden biri yapmaktad\u0131r.\n- **Ev ve Ya\u015fam:** Ev dekorasyonu, mutfak gere\u00e7leri ve mobilya \u00fcr\u00fcnleri g\u00fc\u00e7l\u00fc talep g\u00f6rmektedir.\n- **Elektronik:** Cep telefonu aksesuarlar\u0131, bilgisayar \u00e7evre birimleri ve k\u00fc\u00e7\u00fck ev elektronikleri pop\u00fclerdir.\n- **Ki\u015fisel Bak\u0131m ve G\u00fczellik:** H\u0131zla b\u00fcy\u00fcyen bir kategori; yerli ve uluslararas\u0131 markalar aras\u0131nda g\u00fc\u00e7l\u00fc rekabet vard\u0131r.\n- **Kitap ve K\u0131rtasiye:** Amazon'un k\u00f6kl\u00fc uzmanl\u0131k alan\u0131; T\u00fcrk\u00e7e yay\u0131nc\u0131l\u0131k \u00fcr\u00fcnleri yo\u011fun talep g\u00f6rmektedir.\n- **Oyuncak ve Bebek \u00dcr\u00fcnleri:** Sezonsal dalgalanmalar g\u00f6steren ancak s\u00fcrekli b\u00fcy\u00fcyen bir kategoridir.\n\n### Rekabet Ortam\u0131\n\nT\u00fcrkiye e-ticaret pazar\u0131nda Trendyol, Hepsiburada ve N11 gibi g\u00fc\u00e7l\u00fc yerel oyuncular bulunmaktad\u0131r. Amazon.com.tr, Prime \u00fcyeli\u011fi, Amazon Lojistik altyap\u0131s\u0131 ve global sat\u0131c\u0131 a\u011f\u0131 ile farkl\u0131la\u015fmaktad\u0131r. Sat\u0131c\u0131lar i\u00e7in Amazon'un uluslararas\u0131 pazaryerlerine a\u00e7\u0131lma imk\u00e2n\u0131 \u00f6nemli bir ek avantajd\u0131r.\n\n### D\u00fczenleyici Ortam\n\n- **Ticaret Bakanl\u0131\u011f\u0131:** E-ticaret faaliyetleri 6563 say\u0131l\u0131 Elektronik Ticaretin D\u00fczenlenmesi Hakk\u0131nda Kanun kapsam\u0131ndad\u0131r.\n- **ETB\u0130S Kayd\u0131:** E-ticaret yapan t\u00fcm i\u015fletmelerin Elektronik Ticaret Bilgi Sistemi'ne (ETB\u0130S) kay\u0131t olmas\u0131 zorunludur.\n- **MERSIS:** T\u00fczel ki\u015filiklerin Merkezi Sicil Kay\u0131t Sistemi'ne kay\u0131tl\u0131 olmas\u0131 gerekmektedir.\n- **Vergi Y\u00fck\u00fcml\u00fcl\u00fckleri:** KDV oranlar\u0131 \u00fcr\u00fcn kategorisine g\u00f6re %1, %10 veya %20 olarak uygulan\u0131r. Gelir \u0130daresi Ba\u015fkanl\u0131\u011f\u0131 (G\u0130B) g\u00fcncel oran bilgilerini yay\u0131nlar.\n- **e-Fatura Zorunlulu\u011fu:** Belirli ciro e\u015fiklerini a\u015fan i\u015fletmeler e-fatura ve e-ar\u015fiv fatura d\u00fczenleme y\u00fck\u00fcml\u00fcl\u00fc\u011f\u00fcne tabidir.\n- **Ki\u015fisel Verilerin Korunmas\u0131:** 6698 say\u0131l\u0131 KVKK (Ki\u015fisel Verilerin Korunmas\u0131 Kanunu) kapsam\u0131nda m\u00fc\u015fteri verilerinin i\u015flenmesinde yasal y\u00fck\u00fcml\u00fcl\u00fckler bulunmaktad\u0131r.\n\n### Kampanya D\u00f6nemleri\n\nT\u00fcrkiye pazar\u0131nda \u00f6ne \u00e7\u0131kan \u00f6nemli sat\u0131\u015f d\u00f6nemleri:\n- **Prime Day** (Temmuz): Amazon'a \u00f6zel global kampanya\n- **Efsane Kas\u0131m / Black Friday** (Kas\u0131m): Y\u0131l\u0131n en yo\u011fun al\u0131\u015fveri\u015f d\u00f6nemi\n- **11.11 Bekarlar G\u00fcn\u00fc** (Kas\u0131m): Artan pop\u00fclerlikte global kampanya\n- **Y\u0131lba\u015f\u0131 Al\u0131\u015fveri\u015fleri** (Aral\u0131k): Hediye al\u0131\u015fveri\u015fi yo\u011funlu\u011fu\n- **Okula D\u00f6n\u00fc\u015f** (A\u011fustos-Eyl\u00fcl): K\u0131rtasiye ve okul \u00fcr\u00fcnleri\n- **Ramazan ve Bayram D\u00f6nemleri**: G\u0131da, hediye ve ev \u00fcr\u00fcnlerinde art\u0131\u015f", "content_en": "Amazon Turkey (amazon.com.tr) launched in 2018 and has rapidly grown to become a major player in Turkey's e-commerce ecosystem. Key categories include Fashion, Home & Living, Electronics, Personal Care, and Books. Turkey's 85M+ population with a young demographic and high mobile commerce penetration offers significant growth potential.", "key_facts_tr": {"site": "amazon.com.tr", "curre
