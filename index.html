ethod 1: Match an Existing Listing (Add Offer to Existing ASIN)</h4>\n<p><strong>When to use:</strong> The product already exists in the Amazon.sa catalog.</p>\n<p><strong>Steps:</strong></p>\n<ul><li>Go to <strong>Catalog → Add Products</strong> in Seller Central</li><li>Search by GTIN (UPC/EAN), ASIN, or product name</li><li>If a match is found, click <strong>\"Sell this product\"</strong></li><li>Fill out <strong>Offer Details</strong>: price, quantity, condition (New/Used), fulfillment channel (FBA or FBM)</li><li>Submit</li></ul>\n<p><strong>Key points:</strong></p>\n<ul><li>You do NOT edit the product detail page when matching — you only add your offer</li><li>The existing title, images, bullets, and description remain as-is (controlled by the brand owner or the most authoritative contributor)</li><li>You may need category or brand approval before matching</li><li>The Amazon Seller App can scan barcodes to instantly check if an ASIN exists</li></ul>\n<h4>Method 2: Create a New Listing (New ASIN)</h4>\n<p><strong>When to use:</strong> The product does not exist in the Amazon.sa catalog.</p>\n<p><strong>Steps:</strong></p>\n<ul><li>Go to <strong>Catalog → Add Products</strong></li><li>Search for the product — confirm it's truly not in the catalog</li><li>Click <strong>\"Create a new listing\"</strong> (or \"I'm adding a product not sold on Amazon\")</li><li>Select the appropriate <strong>product category/product type</strong></li><li>Fill out all required tabs:</li><li><strong>Product Identity</strong>: Product name, brand, product type, item type keyword</li><li><strong>Product Description</strong>: Title, bullet points, product description, images</li><li><strong>Product Details</strong>: Dimensions, weight, material, color, and category-specific attributes</li><li><strong>Offer</strong>: Price, quantity, condition, fulfillment channel</li><li><strong>Safety & Compliance</strong>: Hazmat info, certifications, battery info</li><li><strong>Keywords</strong>: Backend search terms</li><li>Click <strong>Submit</strong> (or <strong>Save as Draft</strong> to return later)</li></ul>\n<p><strong>ASIN Creation Policy rules:</strong></p>\n<ul><li>Only create a new ASIN if the product genuinely doesn't exist in the catalog</li><li>Search thoroughly by GTIN, brand name, model number, and keywords before creating</li><li>Creating a duplicate ASIN (same product already exists) is a policy violation</li><li>You must not reuse an existing listing for a <em>different</em> version of a product — create a new ASIN for each distinct version (different color, size, material, features)</li><li>Brand-registered products require authorization from the Brand Representative or Reseller role</li></ul>\n<h4>Method 3: AI-Assisted Listing Creation</h4>\n<p>Amazon now offers AI-generated listing content. When creating a new listing, you can provide a brief product description or a URL and Amazon's AI will generate a title, bullets, and description. Sellers should review and refine AI-generated content before publishing.</p>\n<p>---</p>\n","searchText":"**When to use:** The product already exists in the Amazon.sa catalog.\n\n**Steps:**\n1. Go to **Catalog → Add Products** in Seller Central\n2. Search by GTIN (UPC/EAN), ASIN, or product name\n3. If a match is found, click **\"Sell this product\"**\n4. Fill out **Offer Details**: price, quantity, condition (New/Used), fulfillment channel (FBA or FBM)\n5. Submit\n\n**Key points:**\n- You do NOT edit the product detail page when matching — you only add your offer\n- The existing title, images, bullets, and description remain as-is (controlled by the brand owner or the most authoritative contributor)\n- You may need category or brand approval before matching\n- The Amazon Seller App can scan barcodes to instantly check if an ASIN exists **When to use:** The product does not exist in the Amazon.sa catalog.\n\n**Steps:**\n1. Go to **Catalog → Add Products**\n2. Search for the product — confirm it's truly not in the catalog\n3. Click **\"Create a new listing\"** (or \"I'm adding a product not sold on Amazon\")\n4. Select the appropriate **product category/product type**\n5. Fill out all required tabs:\n   - **Product Identity**: Product name, brand, product type, item type keyword\n   - **Product Description**: Title, bullet points, product description, images\n   - **Product Details**: Dimensions, weight, material, color, and category-specific attributes\n   - **Offer**: Price, quantity, condition, fulfillment channel\n   - **Safety & Compliance**: Hazmat info, certifications, battery info\n   - **Keywords**: Backend search terms\n6. Click **Submit** (or **Save as Draft** to return later)\n\n**ASIN Creation Policy rules:**\n- Only create a new ASIN if the product genuinely doesn't exist in the catalog\n- Search thoroughly by GTIN, brand name, model number, and keywords before creating\n- Creating a duplicate ASIN (same product already exists) is a policy violation\n- You must not reuse an existing listing for a *different* version of a product — create a new ASIN for each distinct version (different color, size, material, features)\n- Brand-registered products require authorization from the Brand Representative or Reseller role Amazon now offers AI-generated listing content. When creating a new listing, you can provide a brief product description or a URL and Amazon's AI will generate a title, bullets, and description. Sellers should review and refine AI-generated content before publishing.\n\n---"},{"title":"3. Product Detail Page Anatomy","html":"<p>The Amazon Product Detail Page (PDP) contains these key sections:</p><h4>Above the Fold (Visible Without Scrolling)</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Element</th><th>Description</th><th>Who Controls It</th></tr></thead><tbody><tr><td><strong>Product Title</strong></td><td>The product name displayed at the top. Critical for search ranking.</td><td>Brand owner (highest authority) or most authoritative contributor</td></tr><tr><td><strong>Main Image</strong></td><td>The primary product photo displayed large on the left side</td><td>Brand owner or contributor with highest data quality score</td></tr><tr><td><strong>Image Gallery</strong></td><td>Up to 8 additional images + 1 video thumbnail</td><td>Same as above</td></tr><tr><td><strong>Star Rating & Review Count</strong></td><td>Aggregate customer rating (1–5 stars) and total reviews</td><td>Amazon (auto-calculated from reviews)</td></tr><tr><td><strong>Price</strong></td><td>Current price, sometimes with list price / deal price</td><td>Each seller sets their own offer price</td></tr><tr><td><strong>Buy Box (Featured Offer)</strong></td><td>\"Add to Cart\" / \"Buy Now\" section with seller name, fulfillment, delivery estimate</td><td>Amazon algorithm selects the winning offer</td></tr><tr><td><strong>Bullet Points (Key Features)</strong></td><td>Up to 5 bullet points highlighting product features</td><td>Brand owner or most authoritative contributor</td></tr><tr><td><strong>Variations</strong></td><td>Size/Color/Style selector (if product has variations)</td><td>Defined during listing creation</td></tr></tbody></table></div>\n<h4>Below the Fold</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Element</th><th>Description</th></tr></thead><tbody><tr><td><strong>Product Description</strong></td><td>Longer-form text about the product (replaced by A+ Content if available)</td></tr><tr><td><strong>A+ Content</strong></td><td>Rich media modules with images, comparison charts, brand story (Brand Registry required)</td></tr><tr><td><strong>Product Information / Technical Details</strong></td><td>Table of specifications (dimensions, weight, material, ASIN, etc.)</td></tr><tr><td><strong>Customer Reviews</strong></td><td>Individual review text, photos, ratings</td></tr><tr><td><strong>Customer Q&A</strong></td><td>Questions from shoppers and answers from sellers/other customers</td></tr><tr><td><strong>Related Products</strong></td><td>\"Frequently bought together,\" \"Customers also viewed\"</td></tr><tr><td><strong>Other Sellers</strong></td><td>Link to all sellers offering this product</td></tr></tbody></table></div>\n<h4>Offer-Level vs. Product-Level Data</h4>\n<ul><li><strong>Product-level</strong> (shared across all sellers): Title, images, bullets, description, A+ Content, product details, brand, category</li><li><strong>Offer-level</strong> (unique per seller): Price, quantity, fulfillment method, condition, shipping speed, handling time</li></ul>\n<p>---</p>\n","searchText":"The Amazon Product Detail Page (PDP) contains these key sections:| Element | Description | Who Controls It |\n|---------|-------------|-----------------|\n| **Product Title** | The product name displayed at the top. Critical for search ranking. | Brand owner (highest authority) or most authoritative contributor |\n| **Main Image** | The primary product photo displayed large on the left side | Brand owner or contributor with highest data quality score |\n| **Image Gallery** | Up to 8 additional images + 1 video thumbnail | Same as above |\n| **Star Rating & Review Count** | Aggregate customer rating (1–5 stars) and total reviews | Amazon (auto-calculated from reviews) |\n| **Price** | Current price, sometimes with list price / deal price | Each seller sets their own offer price |\n| **Buy Box (Featured Offer)** | \"Add to Cart\" / \"Buy Now\" section with seller name, fulfillment, delivery estimate | Amazon algorithm selects the winning offer |\n| **Bullet Points (Key Features)** | Up to 5 bullet points highlighting product features | Brand owner or most authoritative contributor |\n| **Variations** | Size/Color/Style selector (if product has variations) | Defined during listing creation | | Element | Description |\n|---------|-------------|\n| **Product Description** | Longer-form text about the product (replaced by A+ Content if available) |\n| **A+ Content** | Rich media modules with images, comparison charts, brand story (Brand Registry required) |\n| **Product Information / Technical Details** | Table of specifications (dimensions, weight, material, ASIN, etc.) |\n| **Customer Reviews** | Individual review text, photos, ratings |\n| **Customer Q&A** | Questions from shoppers and answers from sellers/other customers |\n| **Related Products** | \"Frequently bought together,\" \"Customers also viewed\" |\n| **Other Sellers** | Link to all sellers offering this product | - **Product-level** (shared across all sellers): Title, images, bullets, description, A+ Content, product details, brand, category\n- **Offer-level** (unique per seller): Price, quantity, fulfillment method, condition, shipping speed, handling time\n\n---"},{"title":"4. Product Identifiers (UPC / EAN / GTIN)","html":"<h4>What Are Product IDs?</h4>\n<p>Amazon requires a <strong>Global Trade Item Number (GTIN)</strong> to identify products in its catalog. GTINs come in several formats:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Identifier</th><th>Digits</th><th>Primary Use</th></tr></thead><tbody><tr><td><strong>UPC</strong> (Universal Product Code)</td><td>12</td><td>North America</td></tr><tr><td><strong>EAN</strong> (European Article Number)</td><td>13</td><td>Europe, MENA, rest of world</td></tr><tr><td><strong>ISBN</strong> (International Standard Book Number)</td><td>10 or 13</td><td>Books</td></tr><tr><td><strong>JAN</strong> (Japanese Article Number)</td><td>13</td><td>Japan</td></tr></tbody></table></div>\n<h4>GTIN Rules for Amazon.sa / MENA</h4>\n<ul><li><strong>EAN-13</strong> is the standard identifier for MENA marketplaces</li><li>UPC-12 codes are also accepted (they are a subset of EAN-13)</li><li>Amazon verifies GTINs against the <strong>GS1 database</strong> — codes must be legitimately registered</li><li>Third-party or reseller barcodes (not from GS1) may cause listings to be suppressed or rejected</li><li>Amazon recommends purchasing barcodes directly from <strong>GS1</strong> (gs1.org or the local GS1 member organization, e.g., GS1 Saudi Arabia)</li></ul>\n<h4>How Amazon Uses GTINs</h4>\n<ul><li><strong>Catalog matching</strong>: When you enter a GTIN, Amazon checks if an ASIN already exists for that product</li><li><strong>GS1 validation</strong>: Amazon cross-checks the GTIN against GS1's database to confirm it's real and registered to the stated brand</li><li><strong>Duplicate prevention</strong>: The GTIN-to-ASIN mapping prevents duplicate product pages</li></ul>\n<h4>Common GTIN Problems</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Problem</th><th>Symptom</th><th>Solution</th></tr></thead><tbody><tr><td>GTIN not registered with GS1</td><td>Error 8572 or listing blocked</td><td>Purchase legitimate GS1 barcodes</td></tr><tr><td>GTIN registered to different brand</td><td>Error 8541 / mismatch</td><td>Verify GTIN ownership; contact GS1</td></tr><tr><td>Reseller/third-party barcode</td><td>Listing suppressed</td><td>Re-register through GS1 directly</td></tr><tr><td>GTIN already mapped to another ASIN</td><td>Cannot create new listing</td><td>Match to existing ASIN instead</td></tr></tbody></table></div>\n<p>---</p>\n","searchText":"Amazon requires a **Global Trade Item Number (GTIN)** to identify products in its catalog. GTINs come in several formats:\n\n| Identifier | Digits | Primary Use |\n|-----------|--------|-------------|\n| **UPC** (Universal Product Code) | 12 | North America |\n| **EAN** (European Article Number) | 13 | Europe, MENA, rest of world |\n| **ISBN** (International Standard Book Number) | 10 or 13 | Books |\n| **JAN** (Japanese Article Number) | 13 | Japan | - **EAN-13** is the standard identifier for MENA marketplaces\n- UPC-12 codes are also accepted (they are a subset of EAN-13)\n- Amazon verifies GTINs against the **GS1 database** — codes must be legitimately registered\n- Third-party or reseller barcodes (not from GS1) may cause listings to be suppressed or rejected\n- Amazon recommends purchasing barcodes directly from **GS1** (gs1.org or the local GS1 member organization, e.g., GS1 Saudi Arabia) 1. **Catalog matching**: When you enter a GTIN, Amazon checks if an ASIN already exists for that product\n2. **GS1 validation**: Amazon cross-checks the GTIN against GS1's database to confirm it's real and registered to the stated brand\n3. **Duplicate prevention**: The GTIN-to-ASIN mapping prevents duplicate product pages | Problem | Symptom | Solution |\n|---------|---------|----------|\n| GTIN not registered with GS1 | Error 8572 or listing blocked | Purchase legitimate GS1 barcodes |\n| GTIN registered to different brand | Error 8541 / mismatch | Verify GTIN ownership; contact GS1 |\n| Reseller/third-party barcode | Listing suppressed | Re-register through GS1 directly |\n| GTIN already mapped to another ASIN | Cannot create new listing | Match to existing ASIN instead |\n\n---"},{"title":"5. GTIN Exemption — Listing Without a Product ID","html":"<h4>What Is a GTIN Exemption?</h4>\n<p>A GTIN exemption is an <strong>approval from Amazon</strong> that lets you create product listings without a standard product identifier (UPC, EAN, ISBN). This is a legitimate, Amazon-approved process — not a workaround.</p>\n<h4>Who Qualifies?</h4>\n<ul><li><strong>Private label sellers</strong> whose brand doesn't yet have registered barcodes</li><li><strong>Handmade product</strong> sellers</li><li><strong>Bundle creators</strong> (multi-pack or bundle sets without a unique GTIN)</li><li><strong>Parts and accessories</strong> sellers (where barcodes are uncommon)</li><li><strong>White-label goods</strong> sellers</li><li>GTIN exemptions are <strong>NOT available</strong> for brands that already have GS1-registered barcodes on their products</li></ul>\n<h4>How to Apply</h4>\n<ul><li>Go to <strong>Seller Central → Catalog → Add Products</strong></li><li>Click <strong>\"I don't have a product ID\"</strong> or search and click <strong>\"Apply for GTIN exemption\"</strong></li><li>Select the <strong>product category</strong> and enter the <strong>brand name</strong></li><li>Submit the required documentation:</li><li><strong>Product images</strong> (2–9 images): Must show the brand name permanently affixed to the product AND packaging</li><li><strong>Letter of authorization</strong>: Required if you are not the brand owner</li><li>Photos must be of the <strong>actual product</strong> (not mockups, renderings, or watermarked images)</li><li>Wait for Amazon's decision — typically <strong>24–48 hours</strong></li></ul>\n<h4>Exemption Scope</h4>\n<ul><li>GTIN exemptions are granted per <strong>brand + category combination</strong></li><li>If you sell the same brand in a different category, you need a separate exemption</li><li>Once approved, you can list products in that brand/category without entering a GTIN</li></ul>\n<h4>Common Rejection Reasons</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Reason</th><th>Fix</th></tr></thead><tbody><tr><td>Brand name not visible on the product</td><td>Re-photograph with clear brand marking</td></tr><tr><td>Watermarked or stock photos used</td><td>Use real, unedited product photographs</td></tr><tr><td>Mockup/render images instead of real product</td><td>Submit actual product photos</td></tr><tr><td>Images appear edited or digitally altered</td><td>Use raw, unedited photos</td></tr><tr><td>Brand already has GS1 barcodes</td><td>You must use the existing GTIN instead</td></tr></tbody></table></div>\n<p>---</p>\n","searchText":"A GTIN exemption is an **approval from Amazon** that lets you create product listings without a standard product identifier (UPC, EAN, ISBN). This is a legitimate, Amazon-approved process — not a workaround. - **Private label sellers** whose brand doesn't yet have registered barcodes\n- **Handmade product** sellers\n- **Bundle creators** (multi-pack or bundle sets without a unique GTIN)\n- **Parts and accessories** sellers (where barcodes are uncommon)\n- **White-label goods** sellers\n- GTIN exemptions are **NOT available** for brands that already have GS1-registered barcodes on their products 1. Go to **Seller Central → Catalog → Add Products**\n2. Click **\"I don't have a product ID\"** or search and click **\"Apply for GTIN exemption\"**\n3. Select the **product category** and enter the **brand name**\n4. Submit the required documentation:\n   - **Product images** (2–9 images): Must show the brand name permanently affixed to the product AND packaging\n   - **Letter of authorization**: Required if you are not the brand owner\n   - Photos must be of the **actual product** (not mockups, renderings, or watermarked images)\n5. Wait for Amazon's decision — typically **24–48 hours** - GTIN exemptions are granted per **brand + category combination**\n- If you sell the same brand in a different category, you need a separate exemption\n- Once approved, you can list products in that brand/category without entering a GTIN | Reason | Fix |\n|--------|-----|\n| Brand name not visible on the product | Re-photograph with clear brand marking |\n| Watermarked or stock photos used | Use real, unedited product photographs |\n| Mockup/render images instead of real product | Submit actual product photos |\n| Images appear edited or digitally altered | Use raw, unedited photos |\n| Brand already has GS1 barcodes | You must use the existing GTIN instead |\n\n---"},{"title":"6. Bulk Listing via Flat Files","html":"<h4>What Are Flat Files?</h4>\n<p>Flat files are <strong>structured spreadsheet templates</strong> (tab-delimited .txt or .xlsx) that sellers upload to Seller Central to <strong>create, update, or delete multiple listings at once</strong>. This is the standard method for managing large catalogs.</p>\n<h4>When to Use Flat Files</h4>\n<ul><li>Creating more than a few listings at once</li><li>Updating attributes across hundreds of existing listings (price, quantity, titles, bullets)</li><li>Managing variation families (parent-child relationships)</li><li>Category-specific data that the Seller Central UI doesn't easily support</li><li>Correcting listing errors in bulk</li></ul>\n<h4>How to Download and Use Flat File Templates</h4>\n<ul><li><strong>Navigate to</strong>: Seller Central → <strong>Catalog → Add Products via Upload</strong> (or Inventory → Add Products via Upload)</li><li>Click <strong>\"Download an Inventory File\"</strong></li><li>Select the <strong>product category</strong> that matches your products</li><li>Select the <strong>marketplace</strong> (Amazon.sa)</li><li>Click <strong>\"Generate Template\"</strong> — downloads an Excel file</li><li>Fill in the spreadsheet:</li><li>Each <strong>row</strong> = one product (or one child SKU)</li><li>Each <strong>column</strong> = one attribute (title, brand, price, UPC, images, bullets, etc.)</li><li>Required fields are marked; optional fields improve listing quality</li><li>Save and upload via <strong>\"Upload your inventory file\"</strong> tab</li><li>Check the <strong>Processing Report</strong> for errors</li></ul>\n<h4>Flat File Structure</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Column Type</th><th>Examples</th></tr></thead><tbody><tr><td><strong>Required</strong></td><td>SKU, product-id, product-id-type, item-name (title), brand, manufacturer, price, quantity</td></tr><tr><td><strong>Product Description</strong></td><td>bullet_point1–5, product_description, generic_keywords (backend search terms)</td></tr><tr><td><strong>Images</strong></td><td>main_image_url, other_image_url1–8</td></tr><tr><td><strong>Offer</strong></td><td>price, quantity, condition_type, fulfillment_channel</td></tr><tr><td><strong>Variation</strong></td><td>parent_child, parent_sku, relationship_type, variation_theme, size_name, color_name</td></tr><tr><td><strong>Category-Specific</strong></td><td>Varies by category (e.g., wattage for electronics, fabric_type for clothing)</td></tr></tbody></table></div>\n<h4>Key Upload Limits</h4>\n<ul><li><strong>Up to 10,000 product rows per file</strong></li><li>Image URLs must be publicly accessible HTTPS URLs</li><li>File must be tab-delimited (.txt) or the Excel template format (.xlsx)</li><li>Processing time varies: minutes for small files, hours for large ones</li></ul>\n<h4>Processing Report</h4>\n<p>After upload, <strong>always download the Processing Report</strong> to check for errors:</p>\n<ul><li>Go to <strong>\"Monitor Upload Status\"</strong> tab</li><li>Download the report — it shows each row and whether it was processed successfully or had errors</li><li>Error rows include an error code and message explaining the issue</li><li>Fix errors in the spreadsheet and re-upload only the corrected rows</li></ul>\n<h4>Flat File Actions</h4>\n<div class=\"table-wrap\"><table><thead><tr><th><code>update_delete</code> Value</th><th>Action</th></tr></thead><tbody><tr><td>(blank or not set)</td><td>Creates a new listing or updates an existing one</td></tr><tr><td><code>Update</code></td><td>Updates an existing listing's attributes</td></tr><tr><td><code>Delete</code></td><td>Removes the offer (but does not delete the ASIN from catalog)</td></tr><tr><td><code>PartialUpdate</code></td><td>Updates only the fields you fill in; leaves other fields unchanged</td></tr></tbody></table></div>\n<p>---</p>\n","searchText":"Flat files are **structured spreadsheet templates** (tab-delimited .txt or .xlsx) that sellers upload to Seller Central to **create, update, or delete multiple listings at once**. This is the standard method for managing large catalogs. - Creating more than a few listings at once\n- Updating attributes across hundreds of existing listings (price, quantity, titles, bullets)\n- Managing variation families (parent-child relationships)\n- Category-specific data that the Seller Central UI doesn't easily support\n- Correcting listing errors in bulk 1. **Navigate to**: Seller Central → **Catalog → Add Products via Upload** (or Inventory → Add Products via Upload)\n2. Click **\"Download an Inventory File\"**\n3. Select the **product category** that matches your products\n4. Select the **marketplace** (Amazon.sa)\n5. Click **\"Generate Template\"** — downloads an Excel file\n6. Fill in the spreadsheet:\n   - Each **row** = one product (or one child SKU)\n   - Each **column** = one attribute (title, brand, price, UPC, images, bullets, etc.)\n   - Required fields are marked; optional fields improve listing quality\n7. Save and upload via **\"Upload your inventory file\"** tab\n8. Check the **Processing Report** for errors | Column Type | Examples |\n|------------|---------|\n| **Required** | SKU, product-id, product-id-type, item-name (title), brand, manufacturer, price, quantity |\n| **Product Description** | bullet_point1–5, product_description, generic_keywords (backend search terms) |\n| **Images** | main_image_url, other_image_url1–8 |\n| **Offer** | price, quantity, condition_type, fulfillment_channel |\n| **Variation** | parent_child, parent_sku, relationship_type, variation_theme, size_name, color_name |\n| **Category-Specific** | Varies by category (e.g., wattage for electronics, fabric_type for clothing) | - **Up to 10,000 product rows per file**\n- Image URLs must be publicly accessible HTTPS URLs\n- File must be tab-delimited (.txt) or the Excel template format (.xlsx)\n- Processing time varies: minutes for small files, hours for large ones After upload, **always download the Processing Report** to check for errors:\n- Go to **\"Monitor Upload Status\"** tab\n- Download the report — it shows each row and whether it was processed successfully or had errors\n- Error rows include an error code and message explaining the issue\n- Fix errors in the spreadsheet and re-upload only the corrected rows | `update_delete` Value | Action |\n|-----------------------|--------|\n| (blank or not set) | Creates a new listing or updates an existing one |\n| `Update` | Updates an existing listing's attributes |\n| `Delete` | Removes the offer (but does not delete the ASIN from catalog) |\n| `PartialUpdate` | Updates only the fields you fill in; leaves other fields unchanged |\n\n---"},{"title":"7. Listing Optimization","html":"<h4>Title Optimization</h4>\n<p>The product title is the <strong>single most important field</strong> for both search ranking and click-through rate.</p>\n<p><strong>Title Formula:</strong></p>\n<p><code>`</code></p>\n<p>Brand Name + Primary Keyword + Key Feature/Benefit + Size/Variant + Secondary Keyword</p>\n<p><code>`</code></p>\n<p><strong>Title Rules (General):</strong></p>\n<ul><li>Capitalize the first letter of each word (Title Case) — except articles, prepositions, conjunctions</li><li>Do NOT use all caps (except established abbreviations like USB, LED)</li><li>No promotional language (\"Best Seller\", \"Free Shipping\", \"Sale\")</li><li>No special characters for decoration (★, ©, ™ in title — trademarks go in the brand field)</li><li>No subjective claims (\"Best\", \"Amazing\", \"#1\")</li><li>Include the brand name</li><li>Numbers should be numerals (e.g., \"2 Pack\" not \"Two Pack\")</li></ul>\n<div class=\"callout warning\"><strong>⚠️ 2026 Title Update:</strong> As of July 27, 2026, titles are capped at <strong>75 characters</strong> (including spaces) for all categories except media. See Section 8 for full details. <strong>Note: Saudi Arabia, UAE, Egypt, and Türkiye are currently excluded from this enforcement.</strong></div>\n<h4>Bullet Points (Key Features)</h4>\n<ul><li><strong>5 bullet points</strong> allowed (some categories allow more)</li><li>Each bullet should be <strong>100–200 characters</strong> (varies by category)</li><li>Lead with the benefit, then provide the supporting feature</li><li>Cover: key features, materials, dimensions, use cases, what's included, compatibility</li><li>Use natural, readable language — don't just stuff keywords</li><li>Start each bullet with a capital letter</li><li>Don't include price, shipping info, or promotional language</li></ul>\n<p><strong>Example structure:</strong></p>\n<p><code>`</code></p>\n<ul><li>[BENEFIT IN CAPS] — Supporting detail with relevant keyword naturally included</li></ul>\n<p><code>`</code></p>\n<h4>Product Description</h4>\n<ul><li>Up to <strong>2,000 characters</strong> (replaced by A+ Content for Brand Registry sellers)</li><li>Write in paragraph form</li><li>Include key selling points not covered in bullets</li><li>Light HTML is allowed (<code><br></code>, <code><b></code>, <code><ul></code>, <code><li></code>)</li><li>No promotional language, no external links</li></ul>\n<h4>Image Optimization</h4>\n<p><strong>Main Image Requirements:</strong></p>\n<ul><li><strong>Pure white background</strong> (RGB 255, 255, 255)</li><li>Product must fill <strong>at least 85%</strong> of the image frame</li><li><strong>No text, logos, watermarks, badges, or borders</strong> on the main image</li><li>Minimum <strong>1,000 pixels</strong> on the longest side (1,600–2,000+ px recommended for zoom)</li><li>JPEG format preferred; PNG and GIF also accepted</li><li>Must show the actual product (no illustrations, drawings, or placeholders)</li><li>Product must be fully visible (no cropping of the product itself)</li></ul>\n<p><strong>Additional Image Best Practices (Images 2–9):</strong></p>\n<ul><li>Include at least <strong>6 images + 1 video</strong></li><li>Show product from multiple angles</li><li>Include lifestyle/in-use images</li><li>Show packaging and included accessories</li><li>Include infographic images with dimensions, features, and callouts</li><li>Include close-up images of key details (texture, labels, connections)</li><li>Use images to demonstrate scale</li></ul>\n<p><strong>Common Image Rejection Reasons:</strong></p>\n<ul><li>Background not pure white on main image</li><li>Text or promotional overlays on main image</li><li>Image too small (under 500px)</li><li>Product doesn't fill 85% of the frame</li><li>Image is blurry or low resolution</li></ul>\n<h4>Backend Search Terms (Hidden Keywords)</h4>\n<p>Backend search terms are <strong>invisible to shoppers</strong> but indexed by Amazon's search algorithm.</p>\n<p><strong>Rules:</strong></p>\n<ul><li><strong>Limit: 250 bytes</strong> (not characters — for English, 1 byte ≈ 1 character; Arabic characters = 2 bytes each)</li><li><strong>Exceeding the byte limit by even 1 byte causes Amazon to completely de-index the entire field</strong> — none of your backend keywords will work</li><li>Found in Seller Central under <strong>Edit Listing → Keywords tab</strong></li></ul>\n<p><strong>Best Practices:</strong></p>\n<ul><li>Use only <strong>single words or short phrases</strong>, separated by spaces (no commas needed)</li><li>Don't repeat words already in your title, bullets, or brand name — they're already indexed</li><li>Include: synonyms, alternate spellings, abbreviations, translated terms (Arabic ↔ English), related terms</li><li>Don't include: competitor brand names, ASINs, subjective claims, profanity</li><li>Don't repeat words within the search terms field</li><li>For Amazon.sa: include <strong>both Arabic and English</strong> terms to capture bilingual shoppers</li></ul>\n<p>---</p>\n","searchText":"The product title is the **single most important field** for both search ranking and click-through rate.\n\n**Title Formula:**\n```\nBrand Name + Primary Keyword + Key Feature/Benefit + Size/Variant + Secondary Keyword\n```\n\n**Title Rules (General):**\n- Capitalize the first letter of each word (Title Case) — except articles, prepositions, conjunctions\n- Do NOT use all caps (except established abbreviations like USB, LED)\n- No promotional language (\"Best Seller\", \"Free Shipping\", \"Sale\")\n- No special characters for decoration (★, ©, ™ in title — trademarks go in the brand field)\n- No subjective claims (\"Best\", \"Amazing\", \"#1\")\n- Include the brand name\n- Numbers should be numerals (e.g., \"2 Pack\" not \"Two Pack\")\n\n**⚠️ 2026 Title Update:** As of July 27, 2026, titles are capped at **75 characters** (including spaces) for all categories except media. See Section 8 for full details. **Note: Saudi Arabia, UAE, Egypt, and Türkiye are currently excluded from this enforcement.** - **5 bullet points** allowed (some categories allow more)\n- Each bullet should be **100–200 characters** (varies by category)\n- Lead with the benefit, then provide the supporting feature\n- Cover: key features, materials, dimensions, use cases, what's included, compatibility\n- Use natural, readable language — don't just stuff keywords\n- Start each bullet with a capital letter\n- Don't include price, shipping info, or promotional language\n\n**Example structure:**\n```\n• [BENEFIT IN CAPS] — Supporting detail with relevant keyword naturally included\n``` - Up to **2,000 characters** (replaced by A+ Content for Brand Registry sellers)\n- Write in paragraph form\n- Include key selling points not covered in bullets\n- Light HTML is allowed (`<br>`, `<b>`, `<ul>`, `<li>`)\n- No promotional language, no external links **Main Image Requirements:**\n- **Pure white background** (RGB 255, 255, 255)\n- Product must fill **at least 85%** of the image frame\n- **No text, logos, watermarks, badges, or borders** on the main image\n- Minimum **1,000 pixels** on the longest side (1,600–2,000+ px recommended for zoom)\n- JPEG format preferred; PNG and GIF also accepted\n- Must show the actual product (no illustrations, drawings, or placeholders)\n- Product must be fully visible (no cropping of the product itself)\n\n**Additional Image Best Practices (Images 2–9):**\n- Include at least **6 images + 1 video**\n- Show product from multiple angles\n- Include lifestyle/in-use images\n- Show packaging and included accessories\n- Include infographic images with dimensions, features, and callouts\n- Include close-up images of key details (texture, labels, connections)\n- Use images to demonstrate scale\n\n**Common Image Rejection Reasons:**\n- Background not pure white on main image\n- Text or promotional overlays on main image\n- Image too small (under 500px)\n- Product doesn't fill 85% of the frame\n- Image is blurry or low resolution Backend search terms are **invisible to shoppers** but indexed by Amazon's search algorithm.\n\n**Rules:**\n- **Limit: 250 bytes** (not characters — for English, 1 byte ≈ 1 character; Arabic characters = 2 bytes each)\n- **Exceeding the byte limit by even 1 byte causes Amazon to completely de-index the entire field** — none of your backend keywords will work\n- Found in Seller Central under **Edit Listing → Keywords tab**\n\n**Best Practices:**\n- Use only **single words or short phrases**, separated by spaces (no commas needed)\n- Don't repeat words already in your title, bullets, or brand name — they're already indexed\n- Include: synonyms, alternate spellings, abbreviations, translated terms (Arabic ↔ English), related terms\n- Don't include: competitor brand names, ASINs, subjective claims, profanity\n- Don't repeat words within the search terms field\n- For Amazon.sa: include **both Arabic and English** terms to capture bilingual shoppers\n\n---"},{"title":"8. Title Update: 75-Character Cap & Item Highlights (2026)","html":"<h4>The Change (Effective July 27, 2026)</h4>\n<p>Amazon announced and enforced a new <strong>75-character title limit</strong> (including spaces) for all product categories except media (books, music, video).</p>\n<h4>⚠️ MENA Exclusion</h4>\n<p><strong>Amazon.sa (Saudi Arabia), Amazon.ae (UAE), Amazon.eg (Egypt), and Amazon Türkiye are currently EXCLUDED from this enforcement.</strong> The previous title guidelines still apply in these stores. However, sellers should prepare for eventual rollout.</p>\n<h4>Key Facts</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Detail</th><th>Specification</th></tr></thead><tbody><tr><td><strong>New title limit</strong></td><td>75 characters including spaces</td></tr><tr><td><strong>New field: Item Highlights</strong></td><td>125 characters, searchable, displayed below title</td></tr><tr><td><strong>Combined searchable budget</strong></td><td>200 characters (75 title + 125 highlights)</td></tr><tr><td><strong>Format for Item Highlights</strong></td><td>Comma-separated short phrases (e.g., \"USB-C, PPS Support, Cable not included\")</td></tr><tr><td><strong>Enforcement</strong></td><td>Over-limit titles are gradually AI-rewritten by Amazon</td></tr><tr><td><strong>Suppression risk</strong></td><td>Non-compliant titles \"might not appear in search results\"</td></tr><tr><td><strong>Brand Registry advantage</strong></td><td>Brand owners get 14 days to review/reject AI recommendations</td></tr><tr><td><strong>Excluded stores</strong></td><td>Saudi Arabia, Egypt, Türkiye, UAE</td></tr><tr><td><strong>Excluded categories</strong></td><td>Media (books, music, video, DVD)</td></tr></tbody></table></div>\n<h4>What Sellers Should Know</h4>\n<ul><li>Titles that exceed 75 characters will be <strong>automatically rewritten by Amazon's AI</strong> — gradually, not instantly</li><li>The AI optimizes for length/grammar, <strong>not for your conversion data or keyword strategy</strong></li><li>Listings are NOT suspended — they remain active during the rewrite process</li><li>Sellers should proactively rewrite titles rather than wait for AI rewrites</li><li>The <strong>Item Highlights</strong> field absorbs materials, specs, and use cases that no longer fit the title</li><li>Item Highlights content is <strong>searchable</strong> and displayed beneath the title in both search results and on the PDP</li></ul>\n<p>---</p>\n","searchText":"Amazon announced and enforced a new **75-character title limit** (including spaces) for all product categories except media (books, music, video). **Amazon.sa (Saudi Arabia), Amazon.ae (UAE), Amazon.eg (Egypt), and Amazon Türkiye are currently EXCLUDED from this enforcement.** The previous title guidelines still apply in these stores. However, sellers should prepare for eventual rollout. | Detail | Specification |\n|--------|--------------|\n| **New title limit** | 75 characters including spaces |\n| **New field: Item Highlights** | 125 characters, searchable, displayed below title |\n| **Combined searchable budget** | 200 characters (75 title + 125 highlights) |\n| **Format for Item Highlights** | Comma-separated short phrases (e.g., \"USB-C, PPS Support, Cable not included\") |\n| **Enforcement** | Over-limit titles are gradually AI-rewritten by Amazon |\n| **Suppression risk** | Non-compliant titles \"might not appear in search results\" |\n| **Brand Registry advantage** | Brand owners get 14 days to review/reject AI recommendations |\n| **Excluded stores** | Saudi Arabia, Egypt, Türkiye, UAE |\n| **Excluded categories** | Media (books, music, video, DVD) | - Titles that exceed 75 characters will be **automatically rewritten by Amazon's AI** — gradually, not instantly\n- The AI optimizes for length/grammar, **not for your conversion data or keyword strategy**\n- Listings are NOT suspended — they remain active during the rewrite process\n- Sellers should proactively rewrite titles rather than wait for AI rewrites\n- The **Item Highlights** field absorbs materials, specs, and use cases that no longer fit the title\n- Item Highlights content is **searchable** and displayed beneath the title in both search results and on the PDP\n\n---"},{"title":"9. A+ Content (Enhanced Brand Content)","html":"<h4>What Is A+ Content?</h4>\n<p>A+ Content allows Brand Registry–enrolled sellers to replace the standard text product description with <strong>rich media modules</strong> including enhanced images, custom text layouts, comparison charts, and brand story sections.</p>\n<h4>Requirements</h4>\n<ul><li>A <strong>Professional selling plan</strong></li><li>Brand must be enrolled in <strong>Amazon Brand Registry</strong></li><li>Seller must have Brand Representative or Reseller role for that brand</li></ul>\n<h4>Types of A+ Content</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Type</th><th>Availability</th><th>Impact</th></tr></thead><tbody><tr><td><strong>Basic A+ (Standard)</strong></td><td>All Brand Registry sellers</td><td>Up to ~8% sales increase</td></tr><tr><td><strong>Premium A+ (A++ / P+)</strong></td><td>Free once you have 5 approved Standard submissions in trailing 12 months</td><td>Up to ~20% sales increase</td></tr><tr><td><strong>Brand Story</strong></td><td>All Brand Registry sellers (appears above A+ Content)</td><td>Builds brand trust and cross-sells</td></tr></tbody></table></div>\n<h4>A+ Content Modules (Basic)</h4>\n<p>You can select <strong>5–7 modules</strong> from options including:</p>\n<ul><li>Standard image and text modules</li><li>Standard comparison charts</li><li>Standard single image with sidebar text</li><li>Standard four-image with text</li><li>Standard text block</li><li>Standard image header with text</li></ul>\n<h4>A+ Content Best Practices</h4>\n<ul><li><strong>Use all available module slots</strong> — more content = more engagement</li><li>Include <strong>comparison charts</strong> to highlight advantages vs. competitors or vs. your own product variants</li><li>Include a <strong>Brand Story module</strong> with brand logo, mission, and cross-sell links</li><li>Use <strong>lifestyle images</strong> that show the product in use</li><li>Keep text concise — customers scan, they don't read</li><li>Maintain consistent branding across all A+ pages</li><li>For MENA: Create A+ Content in <strong>Arabic</strong> for Amazon.sa</li></ul>\n<h4>Important: A+ Content Is NOT Indexed for Search</h4>\n<p>A+ Content text is <strong>not indexed</strong> by Amazon's search algorithm. It does NOT help your SEO directly. Its value is purely for <strong>conversion</strong> — turning visitors into buyers. Use titles, bullets, backend keywords, and Item Highlights for search indexing.</p>\n<p>---</p>\n","searchText":"A+ Content allows Brand Registry–enrolled sellers to replace the standard text product description with **rich media modules** including enhanced images, custom text layouts, comparison charts, and brand story sections. - A **Professional selling plan**\n- Brand must be enrolled in **Amazon Brand Registry**\n- Seller must have Brand Representative or Reseller role for that brand | Type | Availability | Impact |\n|------|-------------|--------|\n| **Basic A+ (Standard)** | All Brand Registry sellers | Up to ~8% sales increase |\n| **Premium A+ (A++ / P+)** | Free once you have 5 approved Standard submissions in trailing 12 months | Up to ~20% sales increase |\n| **Brand Story** | All Brand Registry sellers (appears above A+ Content) | Builds brand trust and cross-sells | You can select **5–7 modules** from options including:\n- Standard image and text modules\n- Standard comparison charts\n- Standard single image with sidebar text\n- Standard four-image with text\n- Standard text block\n- Standard image header with text - **Use all available module slots** — more content = more engagement\n- Include **comparison charts** to highlight advantages vs. competitors or vs. your own product variants\n- Include a **Brand Story module** with brand logo, mission, and cross-sell links\n- Use **lifestyle images** that show the product in use\n- Keep text concise — customers scan, they don't read\n- Maintain consistent branding across all A+ pages\n- For MENA: Create A+ Content in **Arabic** for Amazon.sa A+ Content text is **not indexed** by Amazon's search algorithm. It does NOT help your SEO directly. Its value is purely for **conversion** — turning visitors into buyers. Use titles, bullets, backend keywords, and Item Highlights for search indexing.\n\n---"},{"title":"10. Product Variations (Parent-Child Relationships)","html":"<h4>What Are Variations?</h4>\n<p>Variations group <strong>related products</strong> (differing by size, color, flavor, style, etc.) onto a <strong>single product detail page</strong> so shoppers can toggle between options without leaving the listing.</p>\n<h4>Structure</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Role</th><th>Description</th><th>Buyable?</th></tr></thead><tbody><tr><td><strong>Parent ASIN</strong></td><td>The umbrella listing that ties the family together</td><td>No — not buyable</td></tr><tr><td><strong>Child ASINs</strong></td><td>Individual products with unique SKU, GTIN, price, and inventory</td><td>Yes — each is separately buyable</td></tr></tbody></table></div>\n<h4>Variation Themes</h4>\n<p>Each category has approved <strong>variation themes</strong>:</p>\n<ul><li>Size</li><li>Color</li><li>SizeColor (combined)</li><li>FlavorName</li><li>PatternName</li><li>StyleName</li><li>PackSize</li></ul>\n<h4>How to Create Variations</h4>\n<p><strong>Via Seller Central:</strong></p>\n<ul><li>Create the parent listing first, selecting the variation theme</li><li>Add child listings under the parent, specifying the variation attribute</li></ul>\n<p><strong>Via Variation Wizard:</strong></p>\n<ul><li>Seller Central → Catalog → <strong>Variation Wizard</strong></li><li>Interactive tool for creating or modifying variation families</li><li>Can combine existing standalone ASINs into a family</li></ul>\n<p><strong>Via Flat File:</strong></p>\n<ul><li>Row 1: Parent SKU with <code>parent_child = Parent</code> and <code>variation_theme = [theme]</code></li><li>Row 2+: Child SKUs with <code>parent_child = Child</code>, <code>parent_sku = [parent's SKU]</code>, and the variation attribute filled in</li></ul>\n<h4>Key Rules</h4>\n<ul><li>All children in a family must share core attributes (brand, product type)</li><li>Each child must differ by at least one allowed attribute in the chosen theme</li><li>All children share the parent's <strong>review pool</strong> — major strategic advantage</li><li>Don't combine unrelated products into a variation family (policy violation)</li></ul>\n<p>---</p>\n","searchText":"Variations group **related products** (differing by size, color, flavor, style, etc.) onto a **single product detail page** so shoppers can toggle between options without leaving the listing. | Role | Description | Buyable? |\n|------|-------------|----------|\n| **Parent ASIN** | The umbrella listing that ties the family together | No — not buyable |\n| **Child ASINs** | Individual products with unique SKU, GTIN, price, and inventory | Yes — each is separately buyable | Each category has approved **variation themes**:\n- Size\n- Color\n- SizeColor (combined)\n- FlavorName\n- PatternName\n- StyleName\n- PackSize **Via Seller Central:**\n1. Create the parent listing first, selecting the variation theme\n2. Add child listings under the parent, specifying the variation attribute\n\n**Via Variation Wizard:**\n- Seller Central → Catalog → **Variation Wizard**\n- Interactive tool for creating or modifying variation families\n- Can combine existing standalone ASINs into a family\n\n**Via Flat File:**\n- Row 1: Parent SKU with `parent_child = Parent` and `variation_theme = [theme]`\n- Row 2+: Child SKUs with `parent_child = Child`, `parent_sku = [parent's SKU]`, and the variation attribute filled in - All children in a family must share core attributes (brand, product type)\n- Each child must differ by at least one allowed attribute in the chosen theme\n- All children share the parent's **review pool** — major strategic advantage\n- Don't combine unrelated products into a variation family (policy violation)\n\n---"},{"title":"11. Listing Quality & Suppressed Listings","html":"<h4>Listing Quality Dashboard</h4>\n<p>Amazon provides a <strong>Listing Quality Dashboard</strong> in Seller Central:</p>\n<ul><li><strong>Location</strong>: Inventory → Manage All Inventory → Listing Quality Dashboard (or Catalog → Improve Listing Quality)</li><li>Shows recommendations to improve listings, prioritized by page views and sales potential</li><li>Listings are rated: <strong>Poor → Fair → Good → Great → Optimized</strong></li></ul>\n<h4>What Causes Listing Suppression?</h4>\n<p>A <strong>suppressed listing</strong> is hidden from search results — customers cannot find it. The listing still exists in your inventory but is invisible to shoppers.</p>\n<p><strong>Common suppression triggers:</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Cause</th><th>Details</th></tr></thead><tbody><tr><td><strong>Missing main image</strong></td><td>Every listing must have at least one compliant main image</td></tr><tr><td><strong>Non-compliant main image</strong></td><td>Background not white, product not 85% of frame, text overlay, too small</td></tr><tr><td><strong>Missing required attributes</strong></td><td>Category-specific required fields left blank</td></tr><tr><td><strong>Title too long or non-compliant</strong></td><td>Exceeds character limit, contains prohibited phrases</td></tr><tr><td><strong>Missing category</strong></td><td>Item type / product type not set</td></tr><tr><td><strong>Price issue</strong></td><td>Potential pricing error detected (price too high or too low)</td></tr><tr><td><strong>Policy violation</strong></td><td>Prohibited claims, restricted product, IP complaint</td></tr><tr><td><strong>Hazmat/compliance issue</strong></td><td>Product flagged as hazardous but compliance docs not submitted</td></tr><tr><td><strong>Adult product misclassification</strong></td><td>Product flagged but not properly classified</td></tr></tbody></table></div>\n<h4>How to Find and Fix Suppressed Listings</h4>\n<ul><li>Go to <strong>Manage All Inventory</strong> → look for the <strong>\"Suppressed\"</strong> tab at the top</li><li>Click to see all suppressed ASINs with the <strong>specific reason</strong> next to each</li><li>Click <strong>\"Edit\"</strong> on the affected listing</li><li>Fix the identified issue (add image, fill in attribute, update title)</li><li>Amazon <strong>automatically re-checks</strong> and lifts suppression once fixed</li><li>Some fixes require a <strong>Seller Support case</strong> or flat file upload</li></ul>\n<h4>Proactive Monitoring</h4>\n<ul><li>Check the <strong>Suppressed tab</strong> at least weekly</li><li>Review the <strong>Listing Quality Dashboard</strong> for improvement opportunities</li><li>Set up alerts for listing health changes</li><li>After category compliance updates (Amazon adds new required fields), check all affected listings</li></ul>\n<p>---</p>\n","searchText":"Amazon provides a **Listing Quality Dashboard** in Seller Central:\n- **Location**: Inventory → Manage All Inventory → Listing Quality Dashboard (or Catalog → Improve Listing Quality)\n- Shows recommendations to improve listings, prioritized by page views and sales potential\n- Listings are rated: **Poor → Fair → Good → Great → Optimized** A **suppressed listing** is hidden from search results — customers cannot find it. The listing still exists in your inventory but is invisible to shoppers.\n\n**Common suppression triggers:**\n\n| Cause | Details |\n|-------|---------|\n| **Missing main image** | Every listing must have at least one compliant main image |\n| **Non-compliant main image** | Background not white, product not 85% of frame, text overlay, too small |\n| **Missing required attributes** | Category-specific required fields left blank |\n| **Title too long or non-compliant** | Exceeds character limit, contains prohibited phrases |\n| **Missing category** | Item type / product type not set |\n| **Price issue** | Potential pricing error detected (price too high or too low) |\n| **Policy violation** | Prohibited claims, restricted product, IP complaint |\n| **Hazmat/compliance issue** | Product flagged as hazardous but compliance docs not submitted |\n| **Adult product misclassification** | Product flagged but not properly classified | 1. Go to **Manage All Inventory** → look for the **\"Suppressed\"** tab at the top\n2. Click to see all suppressed ASINs with the **specific reason** next to each\n3. Click **\"Edit\"** on the affected listing\n4. Fix the identified issue (add image, fill in attribute, update title)\n5. Amazon **automatically re-checks** and lifts suppression once fixed\n6. Some fixes require a **Seller Support case** or flat file upload - Check the **Suppressed tab** at least weekly\n- Review the **Listing Quality Dashboard** for improvement opportunities\n- Set up alerts for listing health changes\n- After category compliance updates (Amazon adds new required fields), check all affected listings\n\n---"},{"title":"12. Common Listing Errors and Fixes","html":"<h4>Feed Upload / Flat File Errors</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Error Code</th><th>Description</th><th>Fix</th></tr></thead><tbody><tr><td><strong>5461</strong></td><td>You don't have permission to create a new ASIN under this brand</td><td>Apply for brand approval, enroll in Brand Registry, or match to existing ASIN</td></tr><tr><td><strong>5665</strong></td><td>Brand name not recognized / not approved</td><td>Enroll brand in Brand Registry or submit GTIN exemption with product photos showing brand</td></tr><tr><td><strong>8541</strong></td><td>Attribute mismatch — your data conflicts with existing catalog data</td><td>Verify product details match the existing ASIN; check UPC, brand, title, color values</td></tr><tr><td><strong>8572</strong></td><td>GTIN/brand/product details don't match GS1 database</td><td>Use legitimate GS1-registered barcodes; re-register through GS1</td></tr><tr><td><strong>8560</strong></td><td>SKU already exists for a different product</td><td>Use a unique SKU for each product</td></tr><tr><td><strong>90122</strong></td><td>Missing required attribute for this category</td><td>Fill in all required fields per the category template</td></tr><tr><td><strong>90117</strong></td><td>Invalid value for a required field</td><td>Check acceptable values for the field (e.g., valid color names)</td></tr><tr><td><strong>99010</strong></td><td>Product type or category not found</td><td>Verify the item_type_keyword or product_type value is valid</td></tr></tbody></table></div>\n<h4>Catalog / Detail Page Errors</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Issue</th><th>Description</th><th>Fix</th></tr></thead><tbody><tr><td><strong>Listing not appearing in search</strong></td><td>Title suppression or indexing issue</td><td>Check Suppressed tab; verify title compliance; re-check backend keywords byte count</td></tr><tr><td><strong>Images not displaying</strong></td><td>Images not meeting requirements</td><td>Re-upload compliant images; check main image white background</td></tr><tr><td><strong>Wrong information on detail page</strong></td><td>Another seller contributed conflicting data</td><td>Open case with Seller Support; Brand Registry owners can use \"Report an Issue\"</td></tr><tr><td><strong>Cannot edit listing</strong></td><td>Another contributor has higher authority</td><td>Brand Registry enrollment gives highest contribution authority</td></tr><tr><td><strong>Detail page merged with wrong product</strong></td><td>Amazon incorrectly merged two ASINs</td><td>Open Seller Support case to request unmerge</td></tr></tbody></table></div>\n<h4>How to Download the Processing Report</h4>\n<ul><li>Go to <strong>Catalog → Add Products via Upload → Monitor Upload Status</strong></li><li>Find your upload batch</li><li>Click <strong>\"Download Processing Report\"</strong></li><li>Open the report — each row shows the status (Success or Error with code)</li><li>Filter for errors, fix in your flat file, re-upload only error rows</li></ul>\n<p>---</p>\n","searchText":"| Error Code | Description | Fix |\n|-----------|-------------|-----|\n| **5461** | You don't have permission to create a new ASIN under this brand | Apply for brand approval, enroll in Brand Registry, or match to existing ASIN |\n| **5665** | Brand name not recognized / not approved | Enroll brand in Brand Registry or submit GTIN exemption with product photos showing brand |\n| **8541** | Attribute mismatch — your data conflicts with existing catalog data | Verify product details match the existing ASIN; check UPC, brand, title, color values |\n| **8572** | GTIN/brand/product details don't match GS1 database | Use legitimate GS1-registered barcodes; re-register through GS1 |\n| **8560** | SKU already exists for a different product | Use a unique SKU for each product |\n| **90122** | Missing required attribute for this category | Fill in all required fields per the category template |\n| **90117** | Invalid value for a required field | Check acceptable values for the field (e.g., valid color names) |\n| **99010** | Product type or category not found | Verify the item_type_keyword or product_type value is valid | | Issue | Description | Fix |\n|-------|-------------|-----|\n| **Listing not appearing in search** | Title suppression or indexing issue | Check Suppressed tab; verify title compliance; re-check backend keywords byte count |\n| **Images not displaying** | Images not meeting requirements | Re-upload compliant images; check main image white background |\n| **Wrong information on detail page** | Another seller contributed conflicting data | Open case with Seller Support; Brand Registry owners can use \"Report an Issue\" |\n| **Cannot edit listing** | Another contributor has higher authority | Brand Registry enrollment gives highest contribution authority |\n| **Detail page merged with wrong product** | Amazon incorrectly merged two ASINs | Open Seller Support case to request unmerge | 1. Go to **Catalog → Add Products via Upload → Monitor Upload Status**\n2. Find your upload batch\n3. Click **\"Download Processing Report\"**\n4. Open the report — each row shows the status (Success or Error with code)\n5. Filter for errors, fix in your flat file, re-upload only error rows\n\n---"},{"title":"13. Product Categories & Approval-Gated Categories","html":"<h4>Category Structure on Amazon.sa</h4>\n<p>Products are organized in a hierarchical category tree (browse tree). When creating a listing, you must select the most specific applicable category (the <strong>browse node</strong>). The category determines:</p>\n<ul><li>Which attributes are required vs. optional</li><li>Which flat file template to use</li><li>Whether approval is needed</li><li>Referral fee percentage</li></ul>\n<h4>Open Categories (No Approval Needed)</h4>\n<p>Most categories on Amazon.sa are open and allow immediate listing:</p>\n<ul><li>Electronics accessories</li><li>Home & Kitchen</li><li>Sports & Outdoors</li><li>Office Products</li><li>Books</li><li>Tools & Home Improvement</li><li>Toys & Games (most subcategories)</li><li>Automotive parts & accessories (most subcategories)</li><li>Clothing, Shoes & Jewelry (most subcategories)</li><li>Patio, Lawn & Garden</li></ul>\n<h4>Approval-Gated (Restricted) Categories</h4>\n<p>These require Amazon's approval before you can list:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category</th><th>Notes</th></tr></thead><tbody><tr><td><strong>Grocery & Gourmet Food</strong></td><td>Requires invoices, compliance docs, expiry date handling</td></tr><tr><td><strong>Health & Personal Care</strong></td><td>Requires SFDA registration/compliance (Saudi Food & Drug Authority)</td></tr><tr><td><strong>Beauty</strong></td><td>May require safety data sheets, SFDA compliance</td></tr><tr><td><strong>Dietary Supplements</strong></td><td>Strict SFDA requirements; expanded compliance policy since July 2024</td></tr><tr><td><strong>Medical Devices</strong></td><td>SFDA registration mandatory</td></tr><tr><td><strong>Baby Products</strong></td><td>Safety certifications required</td></tr><tr><td><strong>Watches</strong></td><td>Brand authenticity verification</td></tr><tr><td><strong>Fine Jewelry</strong></td><td>Authenticity and quality certifications</td></tr><tr><td><strong>Alcohol-related</strong></td><td>Highly restricted in Saudi Arabia; non-alcoholic variants only</td></tr><tr><td><strong>Hazardous Materials (Hazmat)</strong></td><td>Safety Data Sheets (SDS) required; additional compliance</td></tr><tr><td><strong>Automotive</strong></td><td>Some subcategories gated (safety parts, tires)</td></tr><tr><td><strong>Collectible Coins</strong></td><td>Authenticity verification</td></tr></tbody></table></div>\n<h4>How to Get Ungated (Category Approval Process)</h4>\n<ul><li>Go to <strong>Seller Central → Catalog → Add Products</strong></li><li>Search for a product in the gated category</li><li>Click <strong>\"Request Approval\"</strong> when prompted</li><li>Submit required documentation:</li><li><strong>Invoices</strong> from an authorized supplier/distributor (usually 3+ invoices, dated within 365 days)</li><li><strong>Safety certifications</strong> or test reports (category-specific)</li><li><strong>SASO/SFDA certificates</strong> (for Saudi Arabia)</li><li><strong>Brand authorization letter</strong> (if applicable)</li><li>Wait for Amazon's review — can take days to weeks</li><li>Some categories auto-approve if your account metrics are strong enough</li></ul>\n<h4>Three Levels of Gating</h4>\n<p>Amazon can gate at three levels:</p>\n<ul><li><strong>Category level</strong> — The entire category is restricted</li><li><strong>Brand level</strong> — A specific brand within an open category is restricted</li><li><strong>ASIN level</strong> — A specific product listing is restricted</li></ul>\n<p>---</p>\n","searchText":"Products are organized in a hierarchical category tree (browse tree). When creating a listing, you must select the most specific applicable category (the **browse node**). The category determines:\n- Which attributes are required vs. optional\n- Which flat file template to use\n- Whether approval is needed\n- Referral fee percentage Most categories on Amazon.sa are open and allow immediate listing:\n- Electronics accessories\n- Home & Kitchen\n- Sports & Outdoors\n- Office Products\n- Books\n- Tools & Home Improvement\n- Toys & Games (most subcategories)\n- Automotive parts & accessories (most subcategories)\n- Clothing, Shoes & Jewelry (most subcategories)\n- Patio, Lawn & Garden These require Amazon's approval before you can list:\n\n| Category | Notes |\n|----------|-------|\n| **Grocery & Gourmet Food** | Requires invoices, compliance docs, expiry date handling |\n| **Health & Personal Care** | Requires SFDA registration/compliance (Saudi Food & Drug Authority) |\n| **Beauty** | May require safety data sheets, SFDA compliance |\n| **Dietary Supplements** | Strict SFDA requirements; expanded compliance policy since July 2024 |\n| **Medical Devices** | SFDA registration mandatory |\n| **Baby Products** | Safety certifications required |\n| **Watches** | Brand authenticity verification |\n| **Fine Jewelry** | Authenticity and quality certifications |\n| **Alcohol-related** | Highly restricted in Saudi Arabia; non-alcoholic variants only |\n| **Hazardous Materials (Hazmat)** | Safety Data Sheets (SDS) required; additional compliance |\n| **Automotive** | Some subcategories gated (safety parts, tires) |\n| **Collectible Coins** | Authenticity verification | 1. Go to **Seller Central → Catalog → Add Products**\n2. Search for a product in the gated category\n3. Click **\"Request Approval\"** when prompted\n4. Submit required documentation:\n   - **Invoices** from an authorized supplier/distributor (usually 3+ invoices, dated within 365 days)\n   - **Safety certifications** or test reports (category-specific)\n   - **SASO/SFDA certificates** (for Saudi Arabia)\n   - **Brand authorization letter** (if applicable)\n5. Wait for Amazon's review — can take days to weeks\n6. Some categories auto-approve if your account metrics are strong enough Amazon can gate at three levels:\n1. **Category level** — The entire category is restricted\n2. **Brand level** — A specific brand within an open category is restricted\n3. **ASIN level** — A specific product listing is restricted\n\n---"},{"title":"14. Listing Policies & Compliance","html":"<h4>Product Detail Page Rules</h4>\n<ul><li><strong>One product = one ASIN</strong>: Do not create duplicate ASINs</li><li><strong>Accurate information only</strong>: All listing content must be truthful and accurate</li><li><strong>Country-correct product</strong>: Don't list a product version meant for another country under a listing for the local version</li><li><strong>No promotional content in detail pages</strong>: No \"Sale!\", \"Free Shipping!\", \"Limited Time!\"</li><li><strong>No external links</strong>: No URLs or references to non-Amazon websites</li><li><strong>No contact information</strong>: No phone numbers, email addresses, or social media handles</li><li><strong>No reviews/testimonials in listing content</strong>: Don't include customer quotes in bullets or description</li><li><strong>No competitor references</strong>: Don't mention competitor brands negatively</li></ul>\n<h4>Prohibited Products (Never Allowed on Amazon)</h4>\n<p>These items are <strong>banned</strong> and cannot be listed under any circumstances:</p>\n<ul><li>Real firearms and ammunition (in KSA)</li><li>Illegal drugs and drug paraphernalia</li><li>Tobacco products and e-cigarettes (in KSA)</li><li>Products promoting hate, violence, or intolerance</li><li>Counterfeit or replica products</li><li>Used or expired cosmetics and consumables</li><li>Products making unapproved medical claims</li><li>Products violating intellectual property rights</li><li>Surveillance equipment (hidden cameras)</li><li>Lock-picking tools</li></ul>\n<h4>Restricted Products (Require Documentation/Approval)</h4>\n<p>These require proper documentation before listing:</p>\n<ul><li>Products with health or medical claims</li><li>Products requiring SASO certification</li><li>Products requiring SFDA registration</li><li>Batteries and battery-containing products (hazmat classification)</li><li>Products with lithium batteries</li><li>Pesticides and chemical products</li><li>Laser products</li><li>Recalled products</li></ul>\n<h4>Intellectual Property Compliance</h4>\n<ul><li>Don't use trademarked brand names you're not authorized to sell</li><li>Don't copy images from other sellers or websites</li><li>Don't use copyrighted content in your listings</li><li>If an IP complaint is filed against you, resolve it directly with the rights owner or appeal through Seller Central</li></ul>\n<h4>Listing Contribution Authority Hierarchy</h4>\n<p>When multiple sellers sell the same product, who controls the detail page?</p>\n<ul><li><strong>Amazon Retail</strong> (if applicable) — highest authority</li><li><strong>Brand Registry Brand Owner</strong> — second highest</li><li><strong>Brand Registry Reseller</strong> — next</li><li><strong>Non-registered seller</strong> — lowest authority</li></ul>\n<p>Brand Registry enrollment is essential for controlling your product detail pages.</p>\n<p>---</p>\n","searchText":"- **One product = one ASIN**: Do not create duplicate ASINs\n- **Accurate information only**: All listing content must be truthful and accurate\n- **Country-correct product**: Don't list a product version meant for another country under a listing for the local version\n- **No promotional content in detail pages**: No \"Sale!\", \"Free Shipping!\", \"Limited Time!\"\n- **No external links**: No URLs or references to non-Amazon websites\n- **No contact information**: No phone numbers, email addresses, or social media handles\n- **No reviews/testimonials in listing content**: Don't include customer quotes in bullets or description\n- **No competitor references**: Don't mention competitor brands negatively These items are **banned** and cannot be listed under any circumstances:\n- Real firearms and ammunition (in KSA)\n- Illegal drugs and drug paraphernalia\n- Tobacco products and e-cigarettes (in KSA)\n- Products promoting hate, violence, or intolerance\n- Counterfeit or replica products\n- Used or expired cosmetics and consumables\n- Products making unapproved medical claims\n- Products violating intellectual property rights\n- Surveillance equipment (hidden cameras)\n- Lock-picking tools These require proper documentation before listing:\n- Products with health or medical claims\n- Products requiring SASO certification\n- Products requiring SFDA registration\n- Batteries and battery-containing products (hazmat classification)\n- Products with lithium batteries\n- Pesticides and chemical products\n- Laser products\n- Recalled products - Don't use trademarked brand names you're not authorized to sell\n- Don't copy images from other sellers or websites\n- Don't use copyrighted content in your listings\n- If an IP complaint is filed against you, resolve it directly with the rights owner or appeal through Seller Central When multiple sellers sell the same product, who controls the detail page?\n\n1. **Amazon Retail** (if applicable) — highest authority\n2. **Brand Registry Brand Owner** — second highest\n3. **Brand Registry Reseller** — next\n4. **Non-registered seller** — lowest authority\n\nBrand Registry enrollment is essential for controlling your product detail pages.\n\n---"},{"title":"15. MENA / Saudi Arabia–Specific Considerations","html":"<h4>Arabic-First Approach</h4>\n<ul><li><strong>Arabic is essential</strong> for Amazon.sa — it is the dominant language for online commerce in KSA</li><li>Product listings should be in <strong>professional, accurate Arabic</strong> — not machine-translated</li><li>English can be secondary but Arabic is mandatory for building customer trust</li><li>For SEO, include <strong>both Arabic and English terms</strong> in backend keywords</li><li>Seller Central for Amazon.sa supports both Arabic (ar_AE) and English (en_AE) interfaces</li></ul>\n<h4>Localization Checklist</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Element</th><th>Action</th></tr></thead><tbody><tr><td><strong>Title</strong></td><td>Professional Arabic translation; include brand name in Latin script if internationally known</td></tr><tr><td><strong>Bullet Points</strong></td><td>Arabic text with natural language; not just translated keywords</td></tr><tr><td><strong>Product Description</strong></td><td>Arabic paragraph copy</td></tr><tr><td><strong>A+ Content</strong></td><td>Arabic text and culturally appropriate imagery</td></tr><tr><td><strong>Backend Keywords</strong></td><td>Both Arabic and English search terms</td></tr><tr><td><strong>Images</strong></td><td>Modest, culturally sensitive imagery; Arabic on-image text for infographics</td></tr><tr><td><strong>Units</strong></td><td>Metric system (kg, cm, liters)</td></tr><tr><td><strong>Currency</strong></td><td>SAR (Saudi Riyal)</td></tr></tbody></table></div>\n<h4>SASO Conformity & SABER Platform</h4>\n<ul><li>The <strong>Saudi Standards, Metrology and Quality Organization (SASO)</strong> requires most imported products to have a <strong>Certificate of Conformity</strong></li><li>Products must be registered on the <strong>SABER</strong> online portal before shipment to KSA</li><li>Process: Submit product details and test reports to a SASO-approved conformity body</li><li><strong>Shipments without a valid SABER certificate will be rejected by Saudi customs</strong></li><li>This is the most common point of failure for new sellers entering the KSA market</li></ul>\n<h4>SFDA (Saudi Food & Drug Authority)</h4>\n<ul><li>Products in food, health, beauty, supplements, and medical devices require <strong>SFDA registration</strong></li><li>As of July 2024, expanded compliance requirements for: dietary supplements, medical devices, medicinal products, optical products, and public health pesticides</li><li>Listings may be <strong>suppressed or removed</strong> until required SFDA documents are provided</li></ul>\n<h4>VAT (Value Added Tax)</h4>\n<ul><li>Saudi Arabia VAT rate: <strong>15%</strong></li><li>Mandatory VAT registration threshold: SAR 375,000 annual turnover (~USD $100,000) within KSA</li><li>FBA sellers selling into KSA must register for and remit VAT</li></ul>\n<h4>Cultural Considerations</h4>\n<ul><li>All marketing and imagery must be <strong>modest and respectful</strong> of Islamic values</li><li>Avoid imagery that would be inappropriate in a conservative cultural context</li><li>Key sales events: <strong>White Friday</strong> (November), <strong>Ramadan</strong>, <strong>Eid al-Fitr</strong>, <strong>Eid al-Adha</strong>, <strong>Saudi National Day</strong> (September 23)</li></ul>\n<h4>Title Rule Exception</h4>\n<p>As of September 2026, Amazon.sa, Amazon.ae, Amazon.eg, and Amazon Turkey are <strong>excluded</strong> from the 75-character title limit enforcement. Sellers on these marketplaces can still use longer titles following the traditional guidelines (generally up to 200 characters, recommended 80–150 characters).</p>\n<p>---</p>\n","searchText":"- **Arabic is essential** for Amazon.sa — it is the dominant language for online commerce in KSA\n- Product listings should be in **professional, accurate Arabic** — not machine-translated\n- English can be secondary but Arabic is mandatory for building customer trust\n- For SEO, include **both Arabic and English terms** in backend keywords\n- Seller Central for Amazon.sa supports both Arabic (ar_AE) and English (en_AE) interfaces | Element | Action |\n|---------|--------|\n| **Title** | Professional Arabic translation; include brand name in Latin script if internationally known |\n| **Bullet Points** | Arabic text with natural language; not just translated keywords |\n| **Product Description** | Arabic paragraph copy |\n| **A+ Content** | Arabic text and culturally appropriate imagery |\n| **Backend Keywords** | Both Arabic and English search terms |\n| **Images** | Modest, culturally sensitive imagery; Arabic on-image text for infographics |\n| **Units** | Metric system (kg, cm, liters) |\n| **Currency** | SAR (Saudi Riyal) | - The **Saudi Standards, Metrology and Quality Organization (SASO)** requires most imported products to have a **Certificate of Conformity**\n- Products must be registered on the **SABER** online portal before shipment to KSA\n- Process: Submit product details and test reports to a SASO-approved conformity body\n- **Shipments without a valid SABER certificate will be rejected by Saudi customs**\n- This is the most common point of failure for new sellers entering the KSA market - Products in food, health, beauty, supplements, and medical devices require **SFDA registration**\n- As of July 2024, expanded compliance requirements for: dietary supplements, medical devices, medicinal products, optical products, and public health pesticides\n- Listings may be **suppressed or removed** until required SFDA documents are provided - Saudi Arabia VAT rate: **15%**\n- Mandatory VAT registration threshold: SAR 375,000 annual turnover (~USD $100,000) within KSA\n- FBA sellers selling into KSA must register for and remit VAT - All marketing and imagery must be **modest and respectful** of Islamic values\n- Avoid imagery that would be inappropriate in a conservative cultural context\n- Key sales events: **White Friday** (November), **Ramadan**, **Eid al-Fitr**, **Eid al-Adha**, **Saudi National Day** (September 23) As of September 2026, Amazon.sa, Amazon.ae, Amazon.eg, and Amazon Turkey are **excluded** from the 75-character title limit enforcement. Sellers on these marketplaces can still use longer titles following the traditional guidelines (generally up to 200 characters, recommended 80–150 characters).\n\n---"},{"title":"16. Buy Box (Featured Offer)","html":"<h4>What Is the Buy Box?</h4>\n<p>The Buy Box is the section on the product detail page containing the <strong>\"Add to Cart\"</strong> and <strong>\"Buy Now\"</strong> buttons. When multiple sellers offer the same product, Amazon selects one seller's offer to feature in the Buy Box. This seller captures the vast majority of sales.</p>\n<h4>How the Buy Box Is Awarded</h4>\n<p>Amazon's algorithm considers:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Factor</th><th>Details</th></tr></thead><tbody><tr><td><strong>Price</strong></td><td>Competitive pricing (not necessarily lowest)</td></tr><tr><td><strong>Fulfillment method</strong></td><td>FBA has a structural advantage over FBM</td></tr><tr><td><strong>Shipping speed</strong></td><td>Faster delivery → higher Buy Box chance</td></tr><tr><td><strong>Seller metrics</strong></td><td>Order defect rate, late shipment rate, cancellation rate</td></tr><tr><td><strong>Stock availability</strong></td><td>In-stock sellers only</td></tr><tr><td><strong>Account age & history</strong></td><td>Longer track record helps</td></tr></tbody></table></div>\n<h4>Buy Box Rotation</h4>\n<p>When multiple sellers meet eligibility criteria with similar performance, Amazon <strong>rotates</strong> the Buy Box among them in proportion to their relative performance scores.</p>\n<h4>Relevance to Listings</h4>\n<ul><li>A listing can be perfectly optimized, but if you're not winning the Buy Box, you won't capture sales</li><li>FBA sellers have a significant advantage</li><li>Strong seller performance metrics are essential</li><li>Price competitiveness matters, but isn't the only factor</li></ul>\n<p>---</p>\n","searchText":"The Buy Box is the section on the product detail page containing the **\"Add to Cart\"** and **\"Buy Now\"** buttons. When multiple sellers offer the same product, Amazon selects one seller's offer to feature in the Buy Box. This seller captures the vast majority of sales. Amazon's algorithm considers:\n\n| Factor | Details |\n|--------|---------|\n| **Price** | Competitive pricing (not necessarily lowest) |\n| **Fulfillment method** | FBA has a structural advantage over FBM |\n| **Shipping speed** | Faster delivery → higher Buy Box chance |\n| **Seller metrics** | Order defect rate, late shipment rate, cancellation rate |\n| **Stock availability** | In-stock sellers only |\n| **Account age & history** | Longer track record helps | When multiple sellers meet eligibility criteria with similar performance, Amazon **rotates** the Buy Box among them in proportion to their relative performance scores. - A listing can be perfectly optimized, but if you're not winning the Buy Box, you won't capture sales\n- FBA sellers have a significant advantage\n- Strong seller performance metrics are essential\n- Price competitiveness matters, but isn't the only factor\n\n---"},{"title":"17. Quick Reference Checklists","html":"<h4>New Listing Checklist (Amazon.sa)</h4>\n<ul><li>[ ] Search catalog thoroughly — confirm product doesn't already exist</li><li>[ ] If exists: match offer to existing ASIN</li><li>[ ] If new: select correct product category</li><li>[ ] Enter valid EAN/UPC (or apply for GTIN exemption)</li><li>[ ] Write Arabic title (professional, keyword-rich, within limits)</li><li>[ ] Write 5 Arabic bullet points (benefit-led, feature-supported)</li><li>[ ] Write Arabic product description (or plan A+ Content if Brand Registered)</li><li>[ ] Upload main image (white background, 1000+ px, product fills 85%)</li><li>[ ] Upload 5+ additional images (angles, lifestyle, infographic, scale)</li><li>[ ] Fill in all required category-specific attributes</li><li>[ ] Add backend search terms (Arabic + English, under 250 bytes)</li><li>[ ] Set price in SAR (including 15% VAT consideration)</li><li>[ ] Select fulfillment channel (FBA recommended for Amazon.sa)</li><li>[ ] Complete Safety & Compliance section</li><li>[ ] Verify SASO/SABER certification if importing physical goods</li><li>[ ] Review and submit</li></ul>\n<h4>Listing Optimization Checklist</h4>\n<ul><li>[ ] Title: Brand + primary keyword + key feature + variant (Arabic)</li><li>[ ] Bullet points: 5 benefit-focused bullets with natural keyword inclusion</li><li>[ ] Main image: White background, high-res, product fills 85%+</li><li>[ ] 6+ additional images: angles, lifestyle, infographic, close-ups</li><li>[ ] 1+ video uploaded</li><li>[ ] Backend search terms: Arabic + English, under 250 bytes, no repeats</li><li>[ ] A+ Content created (if Brand Regi
