 local marketplace currency (SAR for Amazon.sa)</td></tr><tr><td><strong>Access Path</strong></td><td>Seller Central → Pricing → Automate Pricing</td></tr></tbody></table></div>\n<h4>What It Does</h4>\n<ul><li>Moves your offer price toward a target reference price (Featured Offer price, lowest price, or external competitive price) based on the rule you choose.</li><li>Respects the minimum price (required) and maximum price (optional) you set for each SKU.</li><li>Adjusts prices by a fixed amount or percentage — above, at, or below the reference price.</li><li>Runs continuously, responding to pricing events without manual intervention.</li></ul>\n<h4>What It Does NOT Do</h4>\n<ul><li><strong>Does not calculate</strong> what your minimum price should be — you must compute your break-even/floor price yourself.</li><li><strong>Does not know</strong> your COGS, FBA fees, referral fees, or target margin.</li><li><strong>Does not filter</strong> the competitive set by seller quality, stock level, or feedback score (limited filtering options).</li><li><strong>Does not provide</strong> analytics dashboards on repricing performance, Buy Box win rate, or historical repricing actions.</li><li><strong>Does not support</strong> multiple sales channels (Amazon only).</li><li><strong>Does not guarantee</strong> winning the Featured Offer (Buy Box).</li></ul>\n<p>---</p>\n","searchText":"**Amazon Automate Pricing** is a **free, built-in repricing tool** available in Seller Central to all sellers with a **Professional selling plan**. It automatically adjusts product prices on selected SKUs in near real-time based on rules defined by the seller.| Attribute | Detail |\n|---|---|\n| **Cost** | Free — included with the Professional selling plan ($39.99/month in the US; equivalent subscription on Amazon.sa) |\n| **Eligibility** | Professional sellers with active product listings |\n| **Scope** | Works on individual SKUs or bulk-assigned SKUs — **not** applied to entire catalog automatically |\n| **Operates** | 24/7, adjusting prices in response to marketplace pricing events |\n| **Currency** | Prices in the local marketplace currency (SAR for Amazon.sa) |\n| **Access Path** | Seller Central → Pricing → Automate Pricing | - Moves your offer price toward a target reference price (Featured Offer price, lowest price, or external competitive price) based on the rule you choose.\n- Respects the minimum price (required) and maximum price (optional) you set for each SKU.\n- Adjusts prices by a fixed amount or percentage — above, at, or below the reference price.\n- Runs continuously, responding to pricing events without manual intervention. - **Does not calculate** what your minimum price should be — you must compute your break-even/floor price yourself.\n- **Does not know** your COGS, FBA fees, referral fees, or target margin.\n- **Does not filter** the competitive set by seller quality, stock level, or feedback score (limited filtering options).\n- **Does not provide** analytics dashboards on repricing performance, Buy Box win rate, or historical repricing actions.\n- **Does not support** multiple sales channels (Amazon only).\n- **Does not guarantee** winning the Featured Offer (Buy Box).\n\n---"},{"title":"2. Availability on Amazon.sa / MENA","html":"<h4>Marketplace Details</h4>\n<p>Amazon operates two primary marketplaces in the MENA region:</p>\n<ul><li><strong>Amazon.sa</strong> — Saudi Arabia (currency: SAR)</li><li><strong>Amazon.ae</strong> — United Arab Emirates (currency: AED)</li></ul>\n<p>Both marketplaces are on Amazon's <strong>EU tech stack</strong> and share the unified Seller Central infrastructure.</p>\n<h4>Automate Pricing Availability</h4>\n<ul><li><strong>Automate Pricing is available on 20+ Amazon marketplaces</strong> globally, including MENA marketplaces.</li><li>The tool is accessible via Seller Central on Amazon.sa under <strong>Pricing → Automate Pricing</strong>.</li><li>All rule types (Competitive Featured Offer, Competitive Lowest Price, Competitive External Price, Sales-Based, Business rules) are available.</li><li><strong>Prices are set in SAR</strong> on Amazon.sa. When applying rules to multiple marketplaces, parameters must be configured <strong>separately</strong> for each marketplace.</li><li><strong>Build International Listings</strong> integration: If a seller uses Build International Listings to cross-list between Amazon.sa and other marketplaces (e.g., Amazon.ae, Amazon.com), Automate Pricing changes can sync across listings automatically.</li></ul>\n<h4>MENA-Specific Considerations</h4>\n<ul><li><strong>VAT</strong>: Saudi Arabia applies 15% VAT. Sellers must ensure their minimum price accounts for VAT obligations.</li><li><strong>Referral fees</strong>: Vary by category on Amazon.sa (check the Amazon.sa fee schedule at sell.amazon.sa/pricing).</li><li><strong>FBA fees</strong>: FBA in the Middle East has region-specific fulfillment and storage fees. Always factor these into your price floor calculation.</li><li><strong>Competition landscape</strong>: The MENA marketplace generally has fewer competing sellers per ASIN than the US/EU, which may affect how aggressively rules need to be configured.</li><li><strong>Fair Pricing Policy</strong>: Amazon's Marketplace Fair Pricing Policy applies equally on Amazon.sa. Prices significantly higher than recent marketplace or external prices may result in loss of Featured Offer eligibility, offer suppression, or account action.</li></ul>\n<p>---</p>\n","searchText":"Amazon operates two primary marketplaces in the MENA region:\n- **Amazon.sa** — Saudi Arabia (currency: SAR)\n- **Amazon.ae** — United Arab Emirates (currency: AED)\n\nBoth marketplaces are on Amazon's **EU tech stack** and share the unified Seller Central infrastructure. - **Automate Pricing is available on 20+ Amazon marketplaces** globally, including MENA marketplaces.\n- The tool is accessible via Seller Central on Amazon.sa under **Pricing → Automate Pricing**.\n- All rule types (Competitive Featured Offer, Competitive Lowest Price, Competitive External Price, Sales-Based, Business rules) are available.\n- **Prices are set in SAR** on Amazon.sa. When applying rules to multiple marketplaces, parameters must be configured **separately** for each marketplace.\n- **Build International Listings** integration: If a seller uses Build International Listings to cross-list between Amazon.sa and other marketplaces (e.g., Amazon.ae, Amazon.com), Automate Pricing changes can sync across listings automatically. - **VAT**: Saudi Arabia applies 15% VAT. Sellers must ensure their minimum price accounts for VAT obligations.\n- **Referral fees**: Vary by category on Amazon.sa (check the Amazon.sa fee schedule at sell.amazon.sa/pricing).\n- **FBA fees**: FBA in the Middle East has region-specific fulfillment and storage fees. Always factor these into your price floor calculation.\n- **Competition landscape**: The MENA marketplace generally has fewer competing sellers per ASIN than the US/EU, which may affect how aggressively rules need to be configured.\n- **Fair Pricing Policy**: Amazon's Marketplace Fair Pricing Policy applies equally on Amazon.sa. Prices significantly higher than recent marketplace or external prices may result in loss of Featured Offer eligibility, offer suppression, or account action.\n\n---"},{"title":"3. How It Works — Core Mechanics","html":"<h4>The Repricing Loop</h4>\n<p><code>`</code></p>\n<ul><li>Seller creates a pricing rule with parameters</li><li>Seller assigns SKUs to the rule and sets min/max prices</li><li>Seller activates repricing (\"Start Repricing\")</li><li>Amazon monitors marketplace pricing events (e.g., competitor price changes, Featured Offer changes)</li><li>When an event occurs, the system evaluates the rule against the current marketplace state</li><li>If conditions are met, the system calculates a new price within min/max boundaries</li><li>New price is applied to the listing</li><li>Loop continues 24/7 until paused or deleted</li></ul>\n<p><code>`</code></p>\n<h4>Core Rule Elements</h4>\n<p>Every rule consists of these components:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Element</th><th>Description</th><th>Required?</th></tr></thead><tbody><tr><td><strong>Rule Type</strong></td><td>Category of rule (competitive, sales-based, business)</td><td>Yes</td></tr><tr><td><strong>Comparison Point</strong></td><td>The reference price to monitor (Featured Offer price, Lowest price, External price, or Sales units)</td><td>Yes</td></tr><tr><td><strong>Price Action</strong></td><td>How to position vs. the reference: Match, Beat (go lower), or Stay Above</td><td>Yes</td></tr><tr><td><strong>Adjustment Amount</strong></td><td>The difference from the reference — fixed amount (e.g., SAR 0.50) or percentage (e.g., 1%)</td><td>Yes</td></tr><tr><td><strong>Minimum Price</strong></td><td>Hard floor — the tool will never price below this</td><td><strong>Yes (Required)</strong></td></tr><tr><td><strong>Maximum Price</strong></td><td>Ceiling — the tool will never price above this</td><td>No (Optional)</td></tr><tr><td><strong>Filters</strong></td><td>Narrow which competing offers are considered (fulfillment type, condition, etc.)</td><td>No (Optional)</td></tr></tbody></table></div>\n<h4>One Rule Per SKU</h4>\n<ul><li>Each SKU can only have <strong>one active pricing rule</strong> at a time.</li><li>Assigning a new rule to a SKU <strong>replaces</strong> the previous rule on that SKU.</li><li>Different SKUs can have different rules simultaneously.</li></ul>\n<p>---</p>\n","searchText":"```\n1. Seller creates a pricing rule with parameters\n2. Seller assigns SKUs to the rule and sets min/max prices\n3. Seller activates repricing (\"Start Repricing\")\n4. Amazon monitors marketplace pricing events (e.g., competitor price changes, Featured Offer changes)\n5. When an event occurs, the system evaluates the rule against the current marketplace state\n6. If conditions are met, the system calculates a new price within min/max boundaries\n7. New price is applied to the listing\n8. Loop continues 24/7 until paused or deleted\n``` Every rule consists of these components:\n\n| Element | Description | Required? |\n|---|---|---|\n| **Rule Type** | Category of rule (competitive, sales-based, business) | Yes |\n| **Comparison Point** | The reference price to monitor (Featured Offer price, Lowest price, External price, or Sales units) | Yes |\n| **Price Action** | How to position vs. the reference: Match, Beat (go lower), or Stay Above | Yes |\n| **Adjustment Amount** | The difference from the reference — fixed amount (e.g., SAR 0.50) or percentage (e.g., 1%) | Yes |\n| **Minimum Price** | Hard floor — the tool will never price below this | **Yes (Required)** |\n| **Maximum Price** | Ceiling — the tool will never price above this | No (Optional) |\n| **Filters** | Narrow which competing offers are considered (fulfillment type, condition, etc.) | No (Optional) | - Each SKU can only have **one active pricing rule** at a time.\n- Assigning a new rule to a SKU **replaces** the previous rule on that SKU.\n- Different SKUs can have different rules simultaneously.\n\n---"},{"title":"4. Types of Pricing Rules (Detailed)","html":"<h4>4.1 Competitive Featured Offer Rule</h4>\n<p><strong>Goal:</strong> Position your price relative to the current Featured Offer (Buy Box) price to increase your chances of winning the Featured Offer.</p>\n<p><strong>How It Works:</strong></p>\n<ul><li>The rule monitors the <strong>current Featured Offer price</strong> on the listing.</li><li>You configure your price to be:</li><li><strong>Below</strong> the Featured Offer by a fixed amount (e.g., SAR 0.50 below) or percentage</li><li><strong>Equal to</strong> (match) the Featured Offer price</li><li><strong>Above</strong> the Featured Offer by a fixed amount or percentage</li><li>Whenever the Featured Offer price changes, your price adjusts accordingly.</li></ul>\n<p><strong>Use Cases:</strong></p>\n<ul><li>You want to consistently undercut or match the Buy Box winner.</li><li>Ideal for competitive ASINs with multiple FBA sellers.</li><li>Use \"match\" to stay even, or \"beat by SAR 0.10\" to edge ahead.</li></ul>\n<p><strong>Key Considerations:</strong></p>\n<ul><li>If you ARE the current Featured Offer, the rule compares against the next-best offer.</li><li>If there is no Featured Offer (suppressed Buy Box), the rule may not trigger.</li><li>Winning the Featured Offer depends on more than price alone (see Section 11).</li></ul>\n<h4>4.2 Competitive Lowest Price Rule</h4>\n<p><strong>Goal:</strong> Keep your price competitive with the lowest-priced offer on the listing.</p>\n<p><strong>How It Works:</strong></p>\n<ul><li>The rule monitors the <strong>lowest listed price</strong> for the ASIN.</li><li>You configure your price to be below, equal to, or above the lowest price.</li><li>Optionally filter by fulfillment method (FBA vs. FBM) and condition (New, Used, etc.).</li></ul>\n<p><strong>Use Cases:</strong></p>\n<ul><li>Budget-conscious strategy: always be the cheapest or near-cheapest.</li><li>Good for commodity items where lowest price drives conversions.</li><li>Caution: can lead to \"race to the bottom\" price wars.</li></ul>\n<p><strong>Difference from Featured Offer Rule:</strong></p>\n<ul><li>The <strong>lowest price</strong> may not be the Featured Offer price (e.g., an FBM seller with the lowest price may not hold the Buy Box due to poor metrics).</li><li>This rule targets the absolute floor of the market, not the Buy Box specifically.</li></ul>\n<h4>4.3 Competitive External Price Rule</h4>\n<p><strong>Goal:</strong> Keep your Amazon price competitive with prices found outside of Amazon.</p>\n<p><strong>How It Works:</strong></p>\n<ul><li>The rule monitors the <strong>competitive external price</strong> — Amazon's estimate of the lowest price for the same or a similar product from major external retailers.</li><li>You set your price relative to this external reference.</li><li>Helps ensure your Amazon listing stays competitive when customers compare across platforms.</li></ul>\n<p><strong>Use Cases:</strong></p>\n<ul><li>Products also sold on Noon.com, your own DTC website, or other regional platforms.</li><li>Maintaining price parity or slight advantage vs. external market.</li><li>Protecting against losing the Featured Offer due to external price undercutting.</li></ul>\n<p><strong>Important Notes:</strong></p>\n<ul><li>Amazon determines the external competitive price through its own web crawling — you cannot control or specify which external sources it uses.</li><li>This reference price is visible on the <strong>Manage All Inventory</strong> and <strong>Pricing Health</strong> pages in Seller Central.</li></ul>\n<h4>4.4 Sales-Based Rule (Based on Sales Units)</h4>\n<p><strong>Goal:</strong> Adjust pricing based on your own sales velocity rather than competitor prices.</p>\n<p><strong>How It Works:</strong></p>\n<ul><li>You define a <strong>target number of units</strong> and a <strong>time period</strong> (e.g., \"if I sell fewer than 10 units in 7 days\").</li><li>If sales drop below the threshold during the period, the system <strong>lowers the price</strong> by the configured amount or percentage to stimulate demand.</li><li>The price decrease continues within your min/max guardrails until sales pick up or the minimum price is reached.</li></ul>\n<p><strong>Use Cases:</strong></p>\n<ul><li>Slow-moving inventory that needs clearance.</li><li>Seasonal products where demand fluctuates.</li><li>Products with approaching expiration dates or seasonal relevance.</li><li>When you want demand-driven pricing rather than competitor-driven pricing.</li></ul>\n<p><strong>Key Considerations:</strong></p>\n<ul><li>Be conservative with thresholds — overly aggressive settings (very high unit targets with short time periods) can trigger unnecessary price drops.</li><li>This rule does NOT raise prices when sales exceed the target — it only lowers them.</li><li>Combine with a well-calculated minimum price to prevent selling below profitability.</li><li>Works independently of competitor pricing signals.</li></ul>\n<h4>4.5 Business Competitive Featured Offer Rule</h4>\n<p><strong>Goal:</strong> Compete for the <strong>Business Featured Offer</strong> spot visible to Amazon Business (B2B) customers.</p>\n<p><strong>How It Works:</strong></p>\n<ul><li>Similar to the standard Competitive Featured Offer rule, but specifically targets the <strong>Business Featured Offer</strong> price.</li><li>Adjusts your <strong>business price</strong> (the price shown to Amazon Business buyers) to be competitive.</li></ul>\n<p><strong>Use Cases:</strong></p>\n<ul><li>Sellers targeting B2B customers who buy in bulk or are registered Amazon Business accounts.</li><li>Products popular with institutional buyers (office supplies, industrial items, etc.).</li></ul>\n<h4>4.6 Business Price & Quantity Discounts Rule</h4>\n<p><strong>Goal:</strong> Automatically sync your business prices and quantity-tier discounts with changes to your standard consumer price.</p>\n<p><strong>How It Works:</strong></p>\n<ul><li>You define a relationship between your consumer (B2C) price and your business (B2B) price.</li><li>When your consumer price changes (whether manually or via another rule), the business price and quantity discount tiers adjust automatically according to the configured relationship (e.g., \"business price = consumer price minus 5%\").</li></ul>\n<p><strong>Use Cases:</strong></p>\n<ul><li>Managing a dual B2C/B2B pricing strategy without manual updates.</li><li>Ensuring business pricing stays consistently attractive vs. consumer pricing.</li><li>Rewarding bulk purchasers with automatic tiered discounts.</li></ul>\n<h4>4.7 Predefined (Pre-Built) Rules</h4>\n<p>Amazon offers several <strong>predefined rules</strong> that come with recommended default settings for quick setup. These are designed for sellers who want to start repricing quickly without deep customization.</p>\n<p><strong>Characteristics:</strong></p>\n<ul><li>Ready to use with minimal configuration.</li><li>Cover common scenarios: basic Featured Offer match, lowest-price competition, global selling synchronization.</li><li>Limited customization compared to custom rules (some parameters are fixed).</li><li>Sellers can still set their own min/max prices when applying predefined rules.</li></ul>\n<p><strong>How to Use:</strong></p>\n<ul><li>On the Automate Pricing page, select a predefined rule instead of \"Create Custom pricing rule.\"</li><li>Review the rule parameters.</li><li>Skip directly to SKU assignment and min/max price setting.</li></ul>\n<p>---</p>\n","searchText":"**Goal:** Position your price relative to the current Featured Offer (Buy Box) price to increase your chances of winning the Featured Offer.\n\n**How It Works:**\n- The rule monitors the **current Featured Offer price** on the listing.\n- You configure your price to be:\n  - **Below** the Featured Offer by a fixed amount (e.g., SAR 0.50 below) or percentage\n  - **Equal to** (match) the Featured Offer price\n  - **Above** the Featured Offer by a fixed amount or percentage\n- Whenever the Featured Offer price changes, your price adjusts accordingly.\n\n**Use Cases:**\n- You want to consistently undercut or match the Buy Box winner.\n- Ideal for competitive ASINs with multiple FBA sellers.\n- Use \"match\" to stay even, or \"beat by SAR 0.10\" to edge ahead.\n\n**Key Considerations:**\n- If you ARE the current Featured Offer, the rule compares against the next-best offer.\n- If there is no Featured Offer (suppressed Buy Box), the rule may not trigger.\n- Winning the Featured Offer depends on more than price alone (see Section 11). **Goal:** Keep your price competitive with the lowest-priced offer on the listing.\n\n**How It Works:**\n- The rule monitors the **lowest listed price** for the ASIN.\n- You configure your price to be below, equal to, or above the lowest price.\n- Optionally filter by fulfillment method (FBA vs. FBM) and condition (New, Used, etc.).\n\n**Use Cases:**\n- Budget-conscious strategy: always be the cheapest or near-cheapest.\n- Good for commodity items where lowest price drives conversions.\n- Caution: can lead to \"race to the bottom\" price wars.\n\n**Difference from Featured Offer Rule:**\n- The **lowest price** may not be the Featured Offer price (e.g., an FBM seller with the lowest price may not hold the Buy Box due to poor metrics).\n- This rule targets the absolute floor of the market, not the Buy Box specifically. **Goal:** Keep your Amazon price competitive with prices found outside of Amazon.\n\n**How It Works:**\n- The rule monitors the **competitive external price** — Amazon's estimate of the lowest price for the same or a similar product from major external retailers.\n- You set your price relative to this external reference.\n- Helps ensure your Amazon listing stays competitive when customers compare across platforms.\n\n**Use Cases:**\n- Products also sold on Noon.com, your own DTC website, or other regional platforms.\n- Maintaining price parity or slight advantage vs. external market.\n- Protecting against losing the Featured Offer due to external price undercutting.\n\n**Important Notes:**\n- Amazon determines the external competitive price through its own web crawling — you cannot control or specify which external sources it uses.\n- This reference price is visible on the **Manage All Inventory** and **Pricing Health** pages in Seller Central. **Goal:** Adjust pricing based on your own sales velocity rather than competitor prices.\n\n**How It Works:**\n- You define a **target number of units** and a **time period** (e.g., \"if I sell fewer than 10 units in 7 days\").\n- If sales drop below the threshold during the period, the system **lowers the price** by the configured amount or percentage to stimulate demand.\n- The price decrease continues within your min/max guardrails until sales pick up or the minimum price is reached.\n\n**Use Cases:**\n- Slow-moving inventory that needs clearance.\n- Seasonal products where demand fluctuates.\n- Products with approaching expiration dates or seasonal relevance.\n- When you want demand-driven pricing rather than competitor-driven pricing.\n\n**Key Considerations:**\n- Be conservative with thresholds — overly aggressive settings (very high unit targets with short time periods) can trigger unnecessary price drops.\n- This rule does NOT raise prices when sales exceed the target — it only lowers them.\n- Combine with a well-calculated minimum price to prevent selling below profitability.\n- Works independently of competitor pricing signals. **Goal:** Compete for the **Business Featured Offer** spot visible to Amazon Business (B2B) customers.\n\n**How It Works:**\n- Similar to the standard Competitive Featured Offer rule, but specifically targets the **Business Featured Offer** price.\n- Adjusts your **business price** (the price shown to Amazon Business buyers) to be competitive.\n\n**Use Cases:**\n- Sellers targeting B2B customers who buy in bulk or are registered Amazon Business accounts.\n- Products popular with institutional buyers (office supplies, industrial items, etc.). **Goal:** Automatically sync your business prices and quantity-tier discounts with changes to your standard consumer price.\n\n**How It Works:**\n- You define a relationship between your consumer (B2C) price and your business (B2B) price.\n- When your consumer price changes (whether manually or via another rule), the business price and quantity discount tiers adjust automatically according to the configured relationship (e.g., \"business price = consumer price minus 5%\").\n\n**Use Cases:**\n- Managing a dual B2C/B2B pricing strategy without manual updates.\n- Ensuring business pricing stays consistently attractive vs. consumer pricing.\n- Rewarding bulk purchasers with automatic tiered discounts. Amazon offers several **predefined rules** that come with recommended default settings for quick setup. These are designed for sellers who want to start repricing quickly without deep customization.\n\n**Characteristics:**\n- Ready to use with minimal configuration.\n- Cover common scenarios: basic Featured Offer match, lowest-price competition, global selling synchronization.\n- Limited customization compared to custom rules (some parameters are fixed).\n- Sellers can still set their own min/max prices when applying predefined rules.\n\n**How to Use:**\n- On the Automate Pricing page, select a predefined rule instead of \"Create Custom pricing rule.\"\n- Review the rule parameters.\n- Skip directly to SKU assignment and min/max price setting.\n\n---"},{"title":"5. Step-by-Step Setup Guide","html":"<h4>Prerequisites</h4>\n<p>Before setting up Automate Pricing, ensure:</p>\n<ul><li><span class=\"icon-yes\">✅</span> <strong>Professional selling plan</strong> is active</li><li><span class=\"icon-yes\">✅</span> <strong>Product catalog</strong> is uploaded and listings are <strong>Active</strong> in Seller Central</li><li><span class=\"icon-yes\">✅</span> You have <strong>calculated your minimum price</strong> for each SKU (covering COGS + referral fee + FBA fee + shipping + VAT + target margin)</li><li><span class=\"icon-yes\">✅</span> You have decided on your <strong>pricing strategy/goal</strong> (win Featured Offer? match lowest? clear inventory?)</li></ul>\n<h4>Step-by-Step: Creating & Applying a Custom Rule</h4>\n<p>#### Step 1: Navigate to Automate Pricing</p>\n<ul><li>Log in to Seller Central (sellercentral.amazon.sa for Saudi Arabia)</li><li>From the main menu, select <strong>Pricing</strong> → <strong>Automate Pricing</strong></li><li>First-time users will see an introductory/instruction page; click <strong>Get Started</strong></li></ul>\n<p>#### Step 2: Select Marketplace & Choose Rule Type</p>\n<ul><li>On the Pricing Rules page, <strong>select the marketplace</strong> (Amazon.sa)</li><li>Click <strong>\"Create a customized pricing rule\"</strong> OR select a predefined rule</li><li>If creating custom: choose from the dropdown:</li><li>Competitive Featured Offer</li><li>Competitive Lowest Price</li><li>Competitive External Price</li><li>Based on Sales Units</li><li>Business Competitive Featured Offer</li><li>Business Price and Quantity Discounts</li></ul>\n<p>#### Step 3: Name Your Rule</p>\n<ul><li>Enter a descriptive name (e.g., \"Featured Offer Match - Electronics\" or \"Beat Lowest by SAR 1\")</li><li>Good naming helps manage multiple rules later</li></ul>\n<p>#### Step 4: Configure Rule Parameters</p>\n<ul><li><strong>Select the comparison/reference price</strong> (Featured Offer, Lowest Price, etc.)</li><li><strong>Choose your price action</strong>: Match / Beat (go lower) / Stay Above</li><li><strong>Set the adjustment amount</strong>: Fixed amount (e.g., SAR 0.50) or percentage (e.g., 2%)</li><li>Minimum adjustment: typically SAR 0.10 or 1%</li><li>Maximum percentage: up to 90% depending on rule type</li><li><strong>Apply filters</strong> (optional): Fulfillment method (FBA/FBM), condition (New), seller rating, etc.</li><li>Review the <strong>plain-text summary</strong> at the bottom that describes exactly what the rule will do</li></ul>\n<p>#### Step 5: Save the Rule</p>\n<ul><li>Click <strong>\"Save and exit\"</strong> or <strong>\"Save and continue to select SKUs\"</strong></li><li>The rule is saved but no products are repricing yet</li></ul>\n<p>#### Step 6: Assign SKUs to the Rule</p>\n<p><strong>Individual Assignment:</strong></p>\n<ul><li>From the Automate Pricing page, click <strong>\"Edit SKUs\"</strong> in the Action column for your rule</li><li>Browse or search for products</li><li>Select products one by one or in bulk (select multiple)</li><li>For each SKU, set:</li><li><strong>Minimum Price</strong> (required) — your absolute floor in SAR</li><li><strong>Maximum Price</strong> (optional) — your ceiling in SAR</li></ul>\n<p><strong>Bulk Assignment via File Upload:</strong></p>\n<ul><li>On the Manage SKUs page, select <strong>\"Manage SKUs via file upload\"</strong></li><li>Go to the <strong>Download Center</strong> tab</li><li>Choose the marketplace (Amazon.sa) and download a pre-populated or blank template file</li><li>Fill out the file with SKU identifiers, rule assignment, min price, max price</li><li>Save the file in <strong>UTF-8 format</strong> (.txt)</li><li>Go to the <strong>Upload Center</strong> tab</li><li>Browse and select your file → Click <strong>\"Upload Automate Pricing File\"</strong></li><li>Monitor the upload status in the <strong>\"Monitor Automate Pricing file upload status\"</strong> section</li></ul>\n<p>#### Step 7: Start Repricing</p>\n<ul><li>From the <strong>Take Action</strong> dropdown menu, select <strong>\"Start repricing\"</strong></li><li>The tool begins actively monitoring and adjusting prices for the assigned SKUs</li></ul>\n<p>#### Step 8: Monitor & Measure</p>\n<ul><li>Cross-reference the 30-day price history in Automate Pricing with your Seller Central <strong>Business Reports</strong></li><li>Track: Featured Offer percentage, sales volume, average selling price, and contribution margin</li><li>Adjust rules, min/max prices, or SKU assignments as needed</li></ul>\n<p>---</p>\n","searchText":"Before setting up Automate Pricing, ensure:\n1. ✅ **Professional selling plan** is active\n2. ✅ **Product catalog** is uploaded and listings are **Active** in Seller Central\n3. ✅ You have **calculated your minimum price** for each SKU (covering COGS + referral fee + FBA fee + shipping + VAT + target margin)\n4. ✅ You have decided on your **pricing strategy/goal** (win Featured Offer? match lowest? clear inventory?) #### Step 1: Navigate to Automate Pricing\n- Log in to Seller Central (sellercentral.amazon.sa for Saudi Arabia)\n- From the main menu, select **Pricing** → **Automate Pricing**\n- First-time users will see an introductory/instruction page; click **Get Started**\n\n#### Step 2: Select Marketplace & Choose Rule Type\n- On the Pricing Rules page, **select the marketplace** (Amazon.sa)\n- Click **\"Create a customized pricing rule\"** OR select a predefined rule\n- If creating custom: choose from the dropdown:\n  - Competitive Featured Offer\n  - Competitive Lowest Price\n  - Competitive External Price\n  - Based on Sales Units\n  - Business Competitive Featured Offer\n  - Business Price and Quantity Discounts\n\n#### Step 3: Name Your Rule\n- Enter a descriptive name (e.g., \"Featured Offer Match - Electronics\" or \"Beat Lowest by SAR 1\")\n- Good naming helps manage multiple rules later\n\n#### Step 4: Configure Rule Parameters\n- **Select the comparison/reference price** (Featured Offer, Lowest Price, etc.)\n- **Choose your price action**: Match / Beat (go lower) / Stay Above\n- **Set the adjustment amount**: Fixed amount (e.g., SAR 0.50) or percentage (e.g., 2%)\n  - Minimum adjustment: typically SAR 0.10 or 1%\n  - Maximum percentage: up to 90% depending on rule type\n- **Apply filters** (optional): Fulfillment method (FBA/FBM), condition (New), seller rating, etc.\n- Review the **plain-text summary** at the bottom that describes exactly what the rule will do\n\n#### Step 5: Save the Rule\n- Click **\"Save and exit\"** or **\"Save and continue to select SKUs\"**\n- The rule is saved but no products are repricing yet\n\n#### Step 6: Assign SKUs to the Rule\n\n**Individual Assignment:**\n- From the Automate Pricing page, click **\"Edit SKUs\"** in the Action column for your rule\n- Browse or search for products\n- Select products one by one or in bulk (select multiple)\n- For each SKU, set:\n  - **Minimum Price** (required) — your absolute floor in SAR\n  - **Maximum Price** (optional) — your ceiling in SAR\n\n**Bulk Assignment via File Upload:**\n1. On the Manage SKUs page, select **\"Manage SKUs via file upload\"**\n2. Go to the **Download Center** tab\n3. Choose the marketplace (Amazon.sa) and download a pre-populated or blank template file\n4. Fill out the file with SKU identifiers, rule assignment, min price, max price\n5. Save the file in **UTF-8 format** (.txt)\n6. Go to the **Upload Center** tab\n7. Browse and select your file → Click **\"Upload Automate Pricing File\"**\n8. Monitor the upload status in the **\"Monitor Automate Pricing file upload status\"** section\n\n#### Step 7: Start Repricing\n- From the **Take Action** dropdown menu, select **\"Start repricing\"**\n- The tool begins actively monitoring and adjusting prices for the assigned SKUs\n\n#### Step 8: Monitor & Measure\n- Cross-reference the 30-day price history in Automate Pricing with your Seller Central **Business Reports**\n- Track: Featured Offer percentage, sales volume, average selling price, and contribution margin\n- Adjust rules, min/max prices, or SKU assignments as needed\n\n---"},{"title":"6. Min / Max Price Guardrails","html":"<h4>Minimum Price (REQUIRED)</h4>\n<p>The minimum price is the <strong>single most important margin-protection mechanism</strong> in Automate Pricing.</p>\n<p><strong>Key Facts:</strong></p>\n<ul><li><strong>Mandatory</strong> for every SKU enrolled in automated pricing</li><li>Represents the absolute floor — the tool will <strong>never</strong> price below this amount</li><li>The tool does NOT calculate this for you — <strong>you must compute it yourself</strong></li><li>If set incorrectly (too low), you will sell at a loss with no warning from the tool</li></ul>\n<p><strong>How to Calculate Your Minimum Price:</strong></p>\n<p><code>`</code></p>\n<p>Minimum Price = (Landed Cost + FBA Fee + Other Costs) ÷ (1 - Referral Fee Rate - Target Margin Rate)</p>\n<p><code>`</code></p>\n<p><strong>Example for Amazon.sa:</strong></p>\n<p><code>`</code></p>\n<p>Landed Cost (COGS + shipping to FBA):     SAR 50.00</p>\n<p>FBA Fulfillment Fee:                       SAR 12.00</p>\n<p>Other Costs (returns, packaging):          SAR 3.00</p>\n<p>Total Cost:                                SAR 65.00</p>\n<p>Referral Fee Rate:                         15%</p>\n<p>Target Margin Rate:                        10%</p>\n<p>Min Price = 65 ÷ (1 - 0.15 - 0.10) = 65 ÷ 0.75 = SAR 86.67</p>\n<p><code>`</code></p>\n<p><strong>Critical Reminders:</strong></p>\n<ul><li><strong>Update your minimum price</strong> whenever costs change: FBA fee updates, COGS changes, referral fee changes, new shipping costs</li><li>Include <strong>VAT obligations</strong> in your cost calculation for Saudi Arabia (15% VAT)</li><li>A minimum price set before a fee change is <strong>silently incorrect</strong> — the tool will not warn you</li><li>Review and recalculate minimums <strong>at least quarterly</strong> or after any fee announcement</li></ul>\n<h4>Maximum Price (OPTIONAL)</h4>\n<p>The maximum price is an optional ceiling that prevents the tool from raising your price above a specified amount.</p>\n<p><strong>Key Facts:</strong></p>\n<ul><li>Optional but recommended</li><li>Prevents unexpected upward price spikes during unusual market conditions (e.g., all competitors go out of stock)</li><li>Useful for products where brand consistency matters or where extreme prices could damage customer trust</li></ul>\n<h4>Built-in High-Price Safeguards</h4>\n<p>Even <strong>without</strong> a maximum price set, Amazon's Automate Pricing includes internal safeguards:</p>\n<ul><li>The system will <strong>not raise your price significantly above recent historical prices</strong> for the product (on or off Amazon)</li><li>This protects Featured Offer eligibility and customer trust</li><li>These safeguards rely on Amazon's internal historical data and may not always align with your expectations</li><li><strong>Recommendation:</strong> Still set a maximum price explicitly for better control</li></ul>\n<h4>What Happens at the Boundaries?</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Scenario</th><th>Behavior</th></tr></thead><tbody><tr><td>Calculated price would be below minimum</td><td>Price stays at the minimum — no further decrease</td></tr><tr><td>Calculated price would be above maximum</td><td>Price stays at the maximum — no further increase</td></tr><tr><td>No maximum set, calculated price is very high</td><td>Built-in safeguards may cap the price to protect Featured Offer eligibility</td></tr><tr><td>Rule conditions not met</td><td>Price stays at its current value — no change</td></tr></tbody></table></div>\n<p>---</p>\n","searchText":"The minimum price is the **single most important margin-protection mechanism** in Automate Pricing.\n\n**Key Facts:**\n- **Mandatory** for every SKU enrolled in automated pricing\n- Represents the absolute floor — the tool will **never** price below this amount\n- The tool does NOT calculate this for you — **you must compute it yourself**\n- If set incorrectly (too low), you will sell at a loss with no warning from the tool\n\n**How to Calculate Your Minimum Price:**\n\n```\nMinimum Price = (Landed Cost + FBA Fee + Other Costs) ÷ (1 - Referral Fee Rate - Target Margin Rate)\n```\n\n**Example for Amazon.sa:**\n```\nLanded Cost (COGS + shipping to FBA):     SAR 50.00\nFBA Fulfillment Fee:                       SAR 12.00\nOther Costs (returns, packaging):          SAR 3.00\nTotal Cost:                                SAR 65.00\nReferral Fee Rate:                         15%\nTarget Margin Rate:                        10%\n\nMin Price = 65 ÷ (1 - 0.15 - 0.10) = 65 ÷ 0.75 = SAR 86.67\n```\n\n**Critical Reminders:**\n- **Update your minimum price** whenever costs change: FBA fee updates, COGS changes, referral fee changes, new shipping costs\n- Include **VAT obligations** in your cost calculation for Saudi Arabia (15% VAT)\n- A minimum price set before a fee change is **silently incorrect** — the tool will not warn you\n- Review and recalculate minimums **at least quarterly** or after any fee announcement The maximum price is an optional ceiling that prevents the tool from raising your price above a specified amount.\n\n**Key Facts:**\n- Optional but recommended\n- Prevents unexpected upward price spikes during unusual market conditions (e.g., all competitors go out of stock)\n- Useful for products where brand consistency matters or where extreme prices could damage customer trust Even **without** a maximum price set, Amazon's Automate Pricing includes internal safeguards:\n- The system will **not raise your price significantly above recent historical prices** for the product (on or off Amazon)\n- This protects Featured Offer eligibility and customer trust\n- These safeguards rely on Amazon's internal historical data and may not always align with your expectations\n- **Recommendation:** Still set a maximum price explicitly for better control | Scenario | Behavior |\n|---|---|\n| Calculated price would be below minimum | Price stays at the minimum — no further decrease |\n| Calculated price would be above maximum | Price stays at the maximum — no further increase |\n| No maximum set, calculated price is very high | Built-in safeguards may cap the price to protect Featured Offer eligibility |\n| Rule conditions not met | Price stays at its current value — no change |\n\n---"},{"title":"7. How the Tool Reprices — Timing & Behavior","html":"<h4>Response Time</h4>\n<ul><li><strong>Existing rules (no parameter changes):</strong> Price updates are usually processed in <strong>less than 15 minutes</strong> but may take longer under certain circumstances.</li><li><strong>New rules or parameter changes:</strong> Can take <strong>up to 1 hour</strong> for all products assigned to the rule to reprice according to new parameters.</li><li>Amazon describes the tool as operating in <strong>\"near real-time\"</strong> — but this is based on a <strong>polling mechanism</strong>, not event-driven triggers.</li></ul>\n<h4>Polling vs. Real-Time</h4>\n<ul><li>Automate Pricing runs on a <strong>polling interval</strong> — it periodically checks for changes, rather than receiving instant notifications of every competitive price change.</li><li>During high-activity periods (e.g., White Friday/Prime Day, evenings, weekends), multiple competitive events may occur between polls, meaning some price changes are missed.</li><li><strong>Practical impact:</strong> On highly competitive listings with frequent price changes (10+ events/day), the tool may not respond to every individual event.</li></ul>\n<h4>Repricing Trigger Events</h4>\n<p>The tool monitors for and responds to:</p>\n<ul><li>Changes in the <strong>Featured Offer price</strong> (for Featured Offer rules)</li><li>Changes in the <strong>lowest listed price</strong> (for Lowest Price rules)</li><li>Changes in the <strong>competitive external price</strong> (for External Price rules)</li><li>Your own <strong>sales velocity</strong> falling below a threshold (for Sales-Based rules)</li><li><strong>Your consumer price changes</strong> (for Business pricing rules)</li></ul>\n<h4>Price Changes Are Reversible</h4>\n<ul><li>You can pause or stop repricing at any time</li><li>When you pause a rule, prices <strong>stay at the last repriced value</strong> — they do NOT revert to pre-automation prices</li><li>To return to a manual price, you must manually update the price after pausing/deleting the rule</li><li>Pausing/resuming can take <strong>up to 1 hour</strong> to affect all SKUs</li></ul>\n<h4>What Happens When Listings Go Inactive?</h4>\n<ul><li>If a listing is set to <strong>Inactive</strong> (e.g., out of stock, vacation mode), all pricing rules on that SKU are <strong>automatically paused</strong></li><li>When the listing returns to <strong>Active</strong>, rules <strong>automatically resume</strong></li><li>This prevents repricing on non-purchasable items</li></ul>\n<p>---</p>\n","searchText":"- **Existing rules (no parameter changes):** Price updates are usually processed in **less than 15 minutes** but may take longer under certain circumstances.\n- **New rules or parameter changes:** Can take **up to 1 hour** for all products assigned to the rule to reprice according to new parameters.\n- Amazon describes the tool as operating in **\"near real-time\"** — but this is based on a **polling mechanism**, not event-driven triggers. - Automate Pricing runs on a **polling interval** — it periodically checks for changes, rather than receiving instant notifications of every competitive price change.\n- During high-activity periods (e.g., White Friday/Prime Day, evenings, weekends), multiple competitive events may occur between polls, meaning some price changes are missed.\n- **Practical impact:** On highly competitive listings with frequent price changes (10+ events/day), the tool may not respond to every individual event. The tool monitors for and responds to:\n- Changes in the **Featured Offer price** (for Featured Offer rules)\n- Changes in the **lowest listed price** (for Lowest Price rules)\n- Changes in the **competitive external price** (for External Price rules)\n- Your own **sales velocity** falling below a threshold (for Sales-Based rules)\n- **Your consumer price changes** (for Business pricing rules) - You can pause or stop repricing at any time\n- When you pause a rule, prices **stay at the last repriced value** — they do NOT revert to pre-automation prices\n- To return to a manual price, you must manually update the price after pausing/deleting the rule\n- Pausing/resuming can take **up to 1 hour** to affect all SKUs - If a listing is set to **Inactive** (e.g., out of stock, vacation mode), all pricing rules on that SKU are **automatically paused**\n- When the listing returns to **Active**, rules **automatically resume**\n- This prevents repricing on non-purchasable items\n\n---"},{"title":"8. Best Practices","html":"<h4>Strategy & Planning</h4>\n<ul><li><strong>Define your objective first:</strong> Are you trying to win the Featured Offer? Maximize margins? Clear inventory? Your goal determines the rule type.</li><li><strong>Start small and conservative:</strong> Test rules on 10–50 SKUs before rolling out to your full catalog. Monitor for 2 weeks before judging results.</li><li><strong>Match rule type to product behavior:</strong></li><li>High-competition → Competitive Featured Offer or Competitive Lowest Price</li><li>Slow movers → Sales-Based rule</li><li>B2B products → Business pricing rules</li><li>External competition (Noon, etc.) → Competitive External Price</li></ul>\n<h4>Price Floor Management</h4>\n<ul><li><strong>Calculate, don't guess:</strong> Use the floor formula — never estimate your minimum price.</li><li><strong>Include all costs:</strong> COGS + referral fee + FBA fee + shipping + packaging + returns allowance + VAT</li><li><strong>Update minimums after fee changes:</strong> Whenever Amazon announces fee changes (typically annually), recalculate all minimum prices immediately.</li><li><strong>Set a maximum price:</strong> Even though optional, it protects against unexpected spikes and maintains brand credibility.</li></ul>\n<h4>Rule Configuration</h4>\n<ul><li><strong>Don't set adjustment amounts too aggressively:</strong> Beating by SAR 0.10 is usually sufficient — undercutting by large amounts erodes margins unnecessarily.</li><li><strong>Use filters wisely:</strong> Filter by fulfillment type (FBA) and condition (New) to avoid chasing irrelevant offers, but don't over-filter to the point of ignoring real competitors.</li><li><strong>Name rules descriptively:</strong> \"Featured Offer Match - SAR 0.25 Below - Electronics\" is much better than \"Rule 1.\"</li></ul>\n<h4>Monitoring & Maintenance</h4>\n<ul><li><strong>Review weekly:</strong> Check price history, Featured Offer percentage, and sales reports at least weekly.</li><li><strong>Watch for price wars:</strong> If your price keeps hitting the minimum, competitors may be in a downward spiral. Consider pausing and reevaluating.</li><li><strong>Cross-reference with Pricing Health:</strong> Use the Pricing Health dashboard to check which offers are ineligible for Featured Offer and why.</li><li><strong>Comply with Fair Pricing Policy:</strong> Avoid prices significantly higher than recent comparable prices. Amazon may suppress offers that violate this policy.</li><li><strong>Seasonal adjustments:</strong> During peak periods (Ramadan, White Friday, National Day), review and adjust rules and min/max prices.</li></ul>\n<h4>Operational Best Practices</h4>\n<ul><li><strong>One rule per SKU:</strong> Remember each SKU can only have one active rule. Plan your rule assignments carefully.</li><li><strong>Use bulk upload for large catalogs:</strong> Don't assign SKUs one by one for hundreds of products — use the file upload method.</li><li><strong>Control user access:</strong> In Seller Central → Settings → User Permissions, control which team members can access and modify Automate Pricing.</li><li><strong>Don't treat it as \"set and forget\":</strong> Automated pricing still requires regular human oversight and adjustment.</li></ul>\n<p>---</p>\n","searchText":"1. **Define your objective first:** Are you trying to win the Featured Offer? Maximize margins? Clear inventory? Your goal determines the rule type.\n2. **Start small and conservative:** Test rules on 10–50 SKUs before rolling out to your full catalog. Monitor for 2 weeks before judging results.\n3. **Match rule type to product behavior:**\n   - High-competition → Competitive Featured Offer or Competitive Lowest Price\n   - Slow movers → Sales-Based rule\n   - B2B products → Business pricing rules\n   - External competition (Noon, etc.) → Competitive External Price 4. **Calculate, don't guess:** Use the floor formula — never estimate your minimum price.\n5. **Include all costs:** COGS + referral fee + FBA fee + shipping + packaging + returns allowance + VAT\n6. **Update minimums after fee changes:** Whenever Amazon announces fee changes (typically annually), recalculate all minimum prices immediately.\n7. **Set a maximum price:** Even though optional, it protects against unexpected spikes and maintains brand credibility. 8. **Don't set adjustment amounts too aggressively:** Beating by SAR 0.10 is usually sufficient — undercutting by large amounts erodes margins unnecessarily.\n9. **Use filters wisely:** Filter by fulfillment type (FBA) and condition (New) to avoid chasing irrelevant offers, but don't over-filter to the point of ignoring real competitors.\n10. **Name rules descriptively:** \"Featured Offer Match - SAR 0.25 Below - Electronics\" is much better than \"Rule 1.\" 11. **Review weekly:** Check price history, Featured Offer percentage, and sales reports at least weekly.\n12. **Watch for price wars:** If your price keeps hitting the minimum, competitors may be in a downward spiral. Consider pausing and reevaluating.\n13. **Cross-reference with Pricing Health:** Use the Pricing Health dashboard to check which offers are ineligible for Featured Offer and why.\n14. **Comply with Fair Pricing Policy:** Avoid prices significantly higher than recent comparable prices. Amazon may suppress offers that violate this policy.\n15. **Seasonal adjustments:** During peak periods (Ramadan, White Friday, National Day), review and adjust rules and min/max prices. 16. **One rule per SKU:** Remember each SKU can only have one active rule. Plan your rule assignments carefully.\n17. **Use bulk upload for large catalogs:** Don't assign SKUs one by one for hundreds of products — use the file upload method.\n18. **Control user access:** In Seller Central → Settings → User Permissions, control which team members can access and modify Automate Pricing.\n19. **Don't treat it as \"set and forget\":** Automated pricing still requires regular human oversight and adjustment.\n\n---"},{"title":"9. Limitations & Known Issues","html":"<h4>Structural Limitations</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Limitation</th><th>Detail</th></tr></thead><tbody><tr><td><strong>No cost awareness</strong></td><td>The tool doesn't know your COGS, fees, or margins. The minimum price is your only protection.</td></tr><tr><td><strong>No profit calculation</strong></td><td>Cannot calculate whether a repriced sale is profitable.</td></tr><tr><td><strong>Polling-based, not real-time</strong></td><td>Doesn't respond instantly to every competitive event. May miss rapid price changes on high-activity listings.</td></tr><tr><td><strong>Limited competitive filtering</strong></td><td>Cannot filter competitors by stock level, feedback score (limited), or seller quality to the degree that third-party tools can.</td></tr><tr><td><strong>No repricing analytics</strong></td><td>No built-in dashboard showing how often rules fired, what prices were set, or Buy Box win rate changes due to repricing.</td></tr><tr><td><strong>One rule per SKU</strong></td><td>Cannot layer multiple strategies on the same SKU.</td></tr><tr><td><strong>No multi-channel support</strong></td><td>Only reprices on Amazon — does not manage pricing on Noon, Shopify, or other platforms.</td></tr><tr><td><strong>No simulation/test mode</strong></td><td>Cannot test what a rule would do before it goes live. Changes affect real prices immediately.</td></tr><tr><td><strong>No upward repricing on sales rules</strong></td><td>The sales-based rule only lowers prices — it doesn't raise prices when sales are strong.</td></tr><tr><td><strong>No FBA/FBM dual strategy</strong></td><td>Cannot configure separate competitive strategies for FBA and FBM on the same listing simultaneously.</td></tr><tr><td><strong>Limited predefined rule editing</strong></td><td>Predefined rules allow only limited parameter changes (mainly adding/removing SKUs).</td></tr></tbody></table></div>\n<h4>Common Issues Reported by Sellers</h4>\n<ul><li><strong>Price hitting minimum and staying there:</strong> If all competitors use aggressive downward rules, prices converge at minimum levels → price war.</li><li><strong>Unexpected price behavior:</strong> When the reference price (Featured Offer/Lowest) changes rapidly, the tool may produce adjustments that seem inconsistent.</li><li><strong>Manual price changes overridden:</strong> If you manually change a price on a SKU with an active rule, the rule may override your manual change at the next repricing cycle.</li><li><strong>Predefined rules auto-enrollment:</strong> Amazon may suggest/prompt sellers to enroll in predefined rules via Pricing Health alerts. Sellers should review rule parameters before accepting.</li><li><strong>Price not reverting after pause:</strong> Pausing a rule does NOT reset the price to its pre-automation value. You must manually set the price to your desired amount.</li><li><strong>Pricing errors on extreme changes:</strong> Amazon may flag very low or very high prices as potential errors, suppressing the listing until confirmed.</li></ul>\n<p>---</p>\n","searchText":"| Limitation | Detail |\n|---|---|\n| **No cost awareness** | The tool doesn't know your COGS, fees, or margins. The minimum price is your only protection. |\n| **No profit calculation** | Cannot calculate whether a repriced sale is profitable. |\n| **Polling-based, not real-time** | Doesn't respond instantly to every competitive event. May miss rapid price changes on high-activity listings. |\n| **Limited competitive filtering** | Cannot filter competitors by stock level, feedback score (limited), or seller quality to the degree that third-party tools can. |\n| **No repricing analytics** | No built-in dashboard showing how often rules fired, what prices were set, or Buy Box win rate changes due to repricing. |\n| **One rule per SKU** | Cannot layer multiple strategies on the same SKU. |\n| **No multi-channel support** | Only reprices on Amazon — does not manage pricing on Noon, Shopify, or other platforms. |\n| **No simulation/test mode** | Cannot test what a rule would do before it goes live. Changes affect real prices immediately. |\n| **No upward repricing on sales rules** | The sales-based rule only lowers prices — it doesn't raise prices when sales are strong. |\n| **No FBA/FBM dual strategy** | Cannot configure separate competitive strategies for FBA and FBM on the same listing simultaneously. |\n| **Limited predefined rule editing** | Predefined rules allow only limited parameter changes (mainly adding/removing SKUs). | 1. **Price hitting minimum and staying there:** If all competitors use aggressive downward rules, prices converge at minimum levels → price war.\n2. **Unexpected price behavior:** When the reference price (Featured Offer/Lowest) changes rapidly, the tool may produce adjustments that seem inconsistent.\n3. **Manual price changes overridden:** If you manually change a price on a SKU with an active rule, the rule may override your manual change at the next repricing cycle.\n4. **Predefined rules auto-enrollment:** Amazon may suggest/prompt sellers to enroll in predefined rules via Pricing Health alerts. Sellers should review rule parameters before accepting.\n5. **Price not reverting after pause:** Pausing a rule does NOT reset the price to its pre-automation value. You must manually set the price to your desired amount.\n6. **Pricing errors on extreme changes:** Amazon may flag very low or very high prices as potential errors, suppressing the listing until confirmed.\n\n---"},{"title":"10. Manual Pricing Strategies","html":"<p>While Automate Pricing is powerful, some sellers prefer or need manual pricing control. Here's how manual pricing works on Amazon and when it makes sense.</p><h4>How to Manually Update Prices</h4>\n<ul><li><strong>Individual SKU update:</strong></li><li>Seller Central → Inventory → Manage All Inventory</li><li>Click on the price field for the SKU</li><li>Enter new price → Save</li></ul>\n<ul><li><strong>Bulk update via spreadsheet:</strong></li><li>Download an inventory file template</li><li>Update price columns for multiple SKUs</li><li>Upload the updated file</li></ul>\n<ul><li><strong>Via the Pricing tab:</strong></li><li>Seller Central → Pricing → Manage Pricing</li><li>View reference prices and make adjustments</li></ul>\n<h4>When Manual Pricing Makes Sense</h4>\n<ul><li><strong>Very small catalog</strong> (< 20 SKUs) where monitoring is manageable</li><li><strong>Unique/private label products</strong> with no direct competition</li><li><strong>Products with stable pricing</strong> that don't need frequent adjustments</li><li><strong>During special events</strong> where you want precise control (flash sales, launches)</li><li><strong>When a pricing rule is producing undesired results</strong> and you need to intervene</li></ul>\n<h4>Manual Pricing Best Practices</h4>\n<ul><li><strong>Monitor Pricing Health regularly:</strong> Check which offers are ineligible for Featured Offer and adjust accordingly.</li><li><strong>Use reference prices:</strong> Compare against the competitive external price and lowest Amazon price (visible in Manage All Inventory).</li><li><strong>Avoid sudden large increases:</strong> Amazon's Fair Pricing Policy may suppress offers with prices significantly higher than recent levels. Keep changes to 5–10% increments.</li><li><strong>Consider total price:</strong> Include shipping costs when evaluating competitiveness. The total landed price to the customer matters most.</li><li><strong>Factor in all costs:</strong> Use Amazon's Revenue Calculator to understand net proceeds after all fees.</li><li><strong>Check prices regularly:</strong> At minimum 2–3 times per week for competitive products.</li></ul>\n<p>---</p>\n","searchText":"While Automate Pricing is powerful, some sellers prefer or need manual pricing control. Here's how manual pricing works on Amazon and when it makes sense.1. **Individual SKU update:**\n   - Seller Central → Inventory → Manage All Inventory\n   - Click on the price field for the SKU\n   - Enter new price → Save\n   \n2. **Bulk update via spreadsheet:**\n   - Download an inventory file template\n   - Update price columns for multiple SKUs\n   - Upload the updated file\n   \n3. **Via the Pricing tab:**\n   - Seller Central → Pricing → Manage Pricing\n   - View reference prices and make adjustments - **Very small catalog** (< 20 SKUs) where monitoring is manageable\n- **Unique/private label products** with no direct competition\n- **Products with stable pricing** that don't need frequent adjustments\n- **During special events** where you want precise control (flash sales, launches)\n- **When a pricing rule is producing undesired results** and you need to intervene - **Monitor Pricing Health regularly:** Check which offers are ineligible for Featured Offer and adjust accordingly.\n- **Use reference prices:** Compare against the competitive external price and lowest Amazon price (visible in Manage All Inventory).\n- **Avoid sudden large increases:** Amazon's Fair Pricing Policy may suppress offers with prices significantly higher than recent levels. Keep changes to 5–10% increments.\n- **Consider total price:** Include shipping costs when evaluating competitiveness. The total landed price to the customer matters most.\n- **Factor in all costs:** Use Amazon's Revenue Calculator to understand net proceeds after all fees.\n- **Check prices regularly:** At minimum 2–3 times per week for competitive products.\n\n---"},{"title":"11. Buy Box / Featured Offer — Pricing Strategies","html":"<h4>What Is the Featured Offer (Buy Box)?</h4>\n<p>The <strong>Featured Offer</strong> (formerly called the \"Buy Box\") is the prominent section on an Amazon product detail page containing the <strong>\"Add to Cart\"</strong> and <strong>\"Buy Now\"</strong> buttons. When multiple sellers list the same product (same ASIN), Amazon's algorithm selects one or more offers to feature in this section.</p>\n<p><strong>Why It Matters:</strong></p>\n<ul><li>The Featured Offer captures the <strong>vast majority of sales</strong> (~82%+ of all Amazon purchases go through the Buy Box)</li><li>Sellers not in the Featured Offer are buried under a \"See All Buying Options\" link that most shoppers never click</li><li>For advertising: only Featured Offer-eligible offers can run Sponsored Products ads effectively</li></ul>\n<h4>Featured Offer Eligibility Requirements</h4>\n<p>To be <strong>eligible</strong> for the Featured Offer, a seller must meet:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Requirement</th><th>Detail</th></tr></thead><tbody><tr><td><strong>Professional Seller Account</strong></td><td>Individual sellers are never eligible</td></tr><tr><td><strong>Order Defect Rate (ODR)</strong></td><td>Must remain below 1%</td></tr><tr><td><strong>Seller Performance Metrics</strong></td><td>Clean record on cancellation rate, late shipment rate, valid tracking rate</td></tr><tr><td><strong>Sales History</strong></td><td>New sellers typically need 2–6 months of consistent sales and good metrics before earning eligibility</td></tr><tr><td><strong>Product Condition</strong></td><td>Generally \"New\" condition for most Featured Offer considerations</td></tr><tr><td><strong>Competitive Pricing</strong></td><td>Price must be in the competitive range — not significantly above reference prices</td></tr></tbody></table></div>\n<blockquote><strong>Note (2026 Update):</strong> Amazon has announced a phased removal of seller-level Featured Offer eligibility requirements globally, starting July 2026 and expected to complete by end of 2026. This may lower the barrier for new sellers.</blockquote>\n<h4>Factors That Determine Who Wins the Featured Offer</h4>\n<p>Eligibility gets you into the rotation. <strong>Winning</strong> is determined by a combination of weighted factors:</p>\n<ul><li><strong>Landed Price</strong> (item price + shipping) — Lower is better, but it's not the only factor</li><li><strong>Fulfillment Method</strong> — FBA has a structural advantage over FBM. FBA sellers can hold the Buy Box at a price premium over FBM sellers.</li><li><strong>Shipping Speed</strong> — Faster delivery options (same-day, next-day, 2-day) improve chances</li><li><strong>Seller Metrics</strong> — Account health, feedback rating, response time</li><li><strong>Inventory Depth</strong> — Adequate stock levels; low-stock sellers lose priority</li><li><strong>Order Defect Rate</strong> — Below 1% threshold</li><li><strong>Return/Refund Rate</strong> — Lower is better</li><li><strong>Time on Platform</strong> — Established sellers have an edge over new sellers</li></ul>\n<p><strong>Critical Insight:</strong> You can <strong>win the Buy Box at a higher price</strong> than competitors if your fulfillment method, metrics, and shipping speed are superior. You can also <strong>lose it while having the lowest price</strong> if your metrics are poor.</p>\n<h4>Pricing Strategies for Winning the Featured Offer</h4>\n<p>#### Strategy 1: Match the Featured Offer Price</p>\n<ul><li>Use Automate Pricing with the <strong>Competitive Featured Offer</strong> rule set to \"Match\"</li><li>Puts you in direct competition with the current winner</li><li>Combined with strong metrics and FBA, matching price can be enough to share rotation</li></ul>\n<p>#### Strategy 2: Beat by a Small Margin</p>\n<ul><li>Set the Competitive Featured Offer rule to \"Beat by SAR 0.10–0.50\"</li><li>Gives you a slight price edge while keeping margins reasonable</li><li>Effective when seller metrics are comparable to competitors</li></ul>\n<p>#### Strategy 3: Focus on Operational Excellence, Not Just Price</p>\n<ul><li>Enroll in FBA (or ensure fast FBM delivery like Seller Fulfilled Prime equivalent)</li><li>Maintain ODR below 1%, cancellation rate below 2.5%, late shipment rate below 4%</li><li>Keep inventory well-stocked</li><li>This allows you to <strong>win the Buy Box at higher prices</strong> than competitors with worse metrics</li></ul>\n<p>#### Strategy 4: External Competitiveness</p>\n<ul><li>Use the Competitive External Price rule to ensure your Amazon price is competitive with Noon.com and other MENA retailers</li><li>Amazon monitors external prices and may suppress Featured Offer for significantly uncompetitive pricing</li></ul>\n<p>#### Strategy 5: Avoid the Race to the Bottom</p>\n<ul><li>Set firm minimum prices based on actual cost calculations</li><li>Don't blindly match the lowest price — focus on total value (FBA, fast shipping, good metrics)</li><li>Monitor for price wars and pause rules if prices spiral downward irrationally</li></ul>\n<h4>Checking Your Featured Offer Status</h4>\n<ul><li><strong>Manage All Inventory</strong> → Select Preferences → Enable \"Featured Offer\" column → Shows which of your products currently hold the Featured Offer</li><li><strong>Pricing Health</strong> page → \"Pricing Opportunities\" tab → Shows offers not currently eligible for Featured Offer, with suggested actions</li><li><strong>Business Reports</strong> → By ASIN → \"Featured Offer Percentage\" → Shows what % of page views your offer was the Featured Offer</li></ul>\n<p>---</p>\n","searchText":"The **Featured Offer** (formerly called the \"Buy Box\") is the prominent section on an Amazon product detail page containing the **\"Add to Cart\"** and **\"Buy Now\"** buttons. When multiple sellers list the same product (same ASIN), Amazon's algorithm selects one or more offers to feature in this section.\n\n**Why It Matters:**\n- The Featured Offer captures the **vast majority of sales** (~82%+ of all Amazon purchases go through the Buy Box)\n- Sellers not in the Featured Offer are buried under a \"See All Buying Options\" link that most shoppers never click\n- For advertising: only Featured Offer-eligible offers can run Sponsored Products ads effectively To be **eligible** for the Featured Offer, a seller must meet:\n\n| Requirement | Detail |\n|---|---|\n| **Professional Seller Account** | Individual sellers are never eligible |\n| **Order Defect Rate (ODR)** | Must remain below 1% |\n| **Seller Performance Metrics** | Clean record on cancellation rate, late shipment rate, valid tracking rate |\n| **Sales History** | New sellers typically need 2–6 months of consistent sales and good metrics before earning eligibility |\n| **Product Condition** | Generally \"New\" condition for most Featured Offer considerations |\n| **Competitive Pricing** | Price must be in the competitive range — not significantly above reference prices |\n\n> **Note (2026 Update):** Amazon has announced a phased removal of seller-level Featured Offer eligibility requirements globally, starting July 2026 and expected to complete by end of 2026. This may lower the barrier for new sellers. Eligibility gets you into the rotation. **Winning** is determined by a combination of weighted factors:\n\n1. **Landed Price** (item price + shipping) — Lower is better, but it's not the only factor\n2. **Fulfillment Method** — FBA has a structural advantage over FBM. FBA sellers can hold the Buy Box at a price premium over FBM sellers.\n3. **Shipping Speed** — Faster delivery options (same-day, next-day, 2-day) improve chances\n4. **Seller Metrics** — Account health, feedback rating, response time\n5. **Inventory Depth** — Adequate stock levels; low-stock sellers lose priority\n6. **Order Defect Rate** — Below 1% threshold\n7. **Return/Refund Rate** — Lower is better\n8. **Time on Platform** — Established sellers have an edge over new sellers\n\n**Critical Insight:** You can **win the Buy Box at a higher price** than competitors if your fulfillment method, metrics, and shipping speed are superior. You can also **lose it while having the lowest price** if your metrics are poor. #### Strategy 1: Match the Featured Offer Price\n- Use Automate Pricing with the **Competitive Featured Offer** rule set to \"Match\"\n- Puts you in direct competition with the current winner\n- Combined with strong metrics and FBA, matching price can be enough to share rotation\n\n#### Strategy 2: Beat by a Small Margin\n- Set the Competitive Featured Offer rule to \"Beat by SAR 0.10–0.50\"\n- Gives you a slight price edge while keeping margins reasonable\n- Effective when seller metrics are comparable to competitors\n\n#### Strategy 3: Focus on Operational Excellence, Not Just Price\n- Enroll in FBA (or ensure fast FBM delivery like Seller Fulfilled Prime equivalent)\n- Maintain ODR below 1%, cancellation rate below 2.5%, late shipment rate below 4%\n- Keep inventory well-stocked\n- This allows you to **win the Buy Box at higher prices** than competitors with worse metrics\n\n#### Strategy 4: External Competitiveness\n- Use the Competitive External Price rule to ensure your Amazon price is competitive with Noon.com and other MENA retailers\n- Amazon monitors external prices and may suppress Featured Offer for significantly uncompetitive pricing\n\n#### Strategy 5: Avoid the Race to the Bottom\n- Set firm minimum prices based on actual cost calculations\n- Don't blindly match the lowest price — focus on total value (FBA, fast shipping, good metrics)\n- Monitor for price wars and pause rules if prices spiral downward irrationally - **Manage All Inventory** → Select Preferences → Enable \"Featured Offer\" column → Shows which of your products currently hold the Featured Offer\n- **Pricing Health** page → \"Pricing Opportunities\" tab → Shows offers not currently eligible for Featured Offer, with suggested actions\n- **Business Reports** → By ASIN → \"Featured Offer Percentage\" → Shows what % of page views your offer was the Featured Offer\n\n---"},{"title":"12. Frequently Asked Questions (FAQ)","html":"<h4>General Questions</h4>\n<p><strong>Q: Is Automate Pricing free?</strong></p>\n<p>A: Yes. It's included at no additional cost with the Professional selling plan.</p>\n<p><strong>Q: Who is eligible to use Automate Pricing?</strong></p>\n<p>A: Any seller with a Professional selling account and active product listings.</p>\n<p><strong>Q: Can I use Automate Pricing on Amazon.sa?</strong></p>\n<p>A: Yes. Automate Pricing is available on all major Amazon marketplaces including Amazon.sa (Saudi Arabia) and Amazon.ae (UAE).</p>\n<p><strong>Q: Does Automate Pricing guarantee I'll become the Featured Offer?</strong></p>\n<p>A: No. Price is one factor, but Featured Offer selection also considers fulfillment method, seller metrics, shipping speed, and inventory levels. Automate Pricing improves your chances but does not guarantee the Featured Offer.</p>\n<p><strong>Q: How many SKUs can I enroll in Automate Pricing?</strong></p>\n<p>A: There is no hard SKU limit on Amazon's native Automate Pricing tool.</p>\n<p><strong>Q: Can I apply multiple rules to the same SKU?</strong></p>\n<p>A: No. Each SKU can only have one active pricing rule at a time.</p>\n<h4>Setup & Operation</h4>\n<p><strong>Q: How long does it take for a new rule to go into effect?</strong></p>\n<p>A: For new rules or parameter changes, up to 1 hour. For existing rules responding to market events, usually less than 15 minutes.</p>\n<p><strong>Q: What happens when I pause a pricing rule?</strong></p>\n<p>A: Prices stay at their last repriced value. They do NOT revert to pre-automation prices. You must manually update the price if you want a different value.</p>\n<p><strong>Q: Can I manually change the price on a SKU with an active rule?</strong></p>\n<p>A: You can, but the rule may override your manual change at the next repricing cycle. To set a manual price, first pause or remove the rule from that SKU.</p>\n<p><strong>Q: Do Automate Pricing changes count toward the daily price update limit?</strong></p>\n<p>A: Amazon's documentation does not indicate that automated pricing changes count against daily price update allotments differently from manual changes. Check current Seller Central help for the latest.</p>\n<p><strong>Q: What happens if I set my listing to Inactive?</strong></p>\n<p>A: Pricing rules on those SKUs are automatically paused and resume when the listing is reactivated.</p>\n<h4>Pricing & Margins</h4>\n<p><strong>Q: How should I calculate my minimum price?</strong></p>\n<p>A: Use the formula: <code>Minimum Price = (Landed Cost + FBA Fee + Other Costs) ÷ (1 - Referral Fee Rate - Target Margin Rate)</code>. Include all costs: COGS, shipping to FBA, FBA fulfillment fee, referral fee, packaging, return allowance, and VAT (15% in Saudi Arabia).</p>\n<p><strong>Q: What happens if the calculated price is below my minimum?</strong></p>\n<p>A: The price stays at your minimum. The tool never goes below the minimum you set.</p>\n<p><strong>Q: What if I don't set a maximum price?</strong></p>\n<p>A: The tool has built-in safeguards to prevent pricing significantly above recent historical prices. However, it's still recommended to set an explicit maximum for better control.</p>\n<p><strong>Q: Can the tool raise my prices?</strong></p>\n<p>A: Yes, competitive rules can raise your price if the reference price (Featured Offer, Lowest Price) increases. However, the sales-based rule only lowers prices.</p>\n<h4>Troubleshooting</h4>\n<p><strong>Q: My price keeps dropping to the minimum — what should I do?</strong></p>\n<p>A: This typically means competitors are also aggressively repricing downward. Consider: (1) pausing the rule and manually setting a profitable price, (2) adjusting your rule to be less aggressive, (3) verifying your minimum price calculation is correct, or (4) evaluating whether this ASIN is worth competing on at current market prices.</p>\n<p><strong>Q: The tool isn't repricing my SKU — why?</strong></p>\n<p>A: Possible reasons: (1) the rule is paused, (2) the listing is Inactive, (3) there's no reference price available (e.g., no Featured Offer on a suppressed listing), (4) the current price is already at the min/max boundary, or (5) the rule was recently created/changed and is still processing (up to 1 hour).</p>\n<p><strong>Q: My price went higher than expected — why?</strong></p>\n<p>A: If competitors stock out or raise prices significantly, competitive rules may push your price upward. Check if you have a maximum price set. Even without one, Amazon's internal safeguards should limit extreme increases, but results may vary.</p>\n<p>---</p>\n","searchText":"**Q: Is Automate Pricing free?**\nA: Yes. It's included at no additional cost with the Professional selling plan.\n\n**Q: Who is eligible to use Automate Pricing?**\nA: Any seller with a Professional selling account and active product listings.\n\n**Q: Can I use Automate Pricing on Amazon.sa?**\nA: Yes. Automate Pricing is available on all major Amazon marketplaces including Amazon.sa (Saudi Arabia) and Amazon.ae (UAE).\n\n**Q: Does Automate Pricing guarantee I'll become the Featured Offer?**\nA: No. Price is one factor, but Featured Offer selection also considers fulfillment method, seller metrics, shipping speed, and inventory levels. Automate Pricing improves your chances but does not guarantee the Featured Offer.\n\n**Q: How many SKUs can I enroll in Automate Pricing?**\nA: There is no hard SKU limit on Amazon's native Automate Pricing tool.\n\n**Q: Can I apply multiple rules to the same SKU?**\nA: No. Each SKU can only have one active pricing rule at a time. **Q: How long does it take for a new rule to go into effect?**\nA: For new rules or parameter changes, up to 1 hour. For existing rules responding to market events, usually less than 15 minutes.\n\n**Q: What happens when I pause a pricing rule?**\nA: Prices stay at their last repriced value. They do NOT revert to pre-automation prices. You must manually update the price if you want a different value.\n\n**Q: Can I manually change the price on a SKU with an active rule?**\nA: You can, but the rule may override your manual change at the next repricing cycle. To set a manual price, first pause or remove the rule from that SKU.\n\n**Q: Do Automate Pricing changes count toward the daily price update limit?**\nA: Amazon's documentation does not indicate that automated pricing changes count against daily price update allotments differently from manual changes. Check current Seller Central help for the latest.\n\n**Q: What happens if I set my listing to Inactive?**\nA: Pricing rules on those SKUs are automatically paused and resume when the listing is reactivated. **Q: How should I calculate my minimum price?**\nA: Use the formula: `Minimum Price = (Landed Cost + FBA Fee + Other Costs) ÷ (1 - Referral Fee Rate - Target Margin Rate)`. Include all costs: COGS, shipping to FBA, FBA fulfillment fee, referral fee, packaging, return allowance, and VAT (15% in Saudi Arabia).\n\n**Q: What happens if the calculated price is below my minimum?**\nA: The price stays at your minimum. The tool never goes below the minimum you set.\n\n**Q: What if I don't set a maximum price?**\nA: The tool has built-in safeguards to prevent pricing significantly above recent historical prices. However, it's still recommended to set an explicit maximum for better control.\n\n**Q: Can the tool raise my prices?**\nA: Yes, competitive rules can raise your price if the reference price (Featured Offer, Lowest Price) increases. However, the sales-based rule only lowers prices. **Q: My price keeps dropping to the minimum — what should I do?**\nA: This typically means competitors are also aggressively repricing downward. Consider: (1) pausing the rule and manually setting a profitable price, (2) adjusting your rule to be less aggressive, (3) verifying your minimum price calculation is correct, or (4) evaluating whether this ASIN is worth competing on at current market prices.\n\n**Q: The tool isn't repricing my SKU — why?**\nA: Possible reasons: (1) the rule is paused, (2) the listing is Inactive, (3) there's no reference price available (e.g., no Featured Offer on a suppressed listing), (4) the current price is already at the min/max boundary, or (5) the rule was recently created/changed and is still processing (up to 1 hour).\n\n**Q: My price went higher than expected — why?**\nA: If competitors stock out or raise prices significantly, competitive rules may push your price upward. Check if you have a maximum price set. Even without one, Amazon's internal safeguards should limit extreme increases, but results may vary.\n\n---"},{"title":"13. Troubleshooting Scenarios","html":"<h4>Scenario 1: \"I set up a rule but my price hasn't changed\"</h4>\n<ul><li><strong>Check:</strong> Is the rule status \"Active\" or \"Paused\"?</li><li><strong>Check:</strong> Is the listing status \"Active\"?</li><li><strong>Check:</strong> Was the rule just created? Wait up to 1 hour for initial processing.</li><li><strong>Check:</strong> Is there a valid reference price? (If no Featured Offer exists or the listing is suppressed, the rule may have nothing to trigger against.)</li><li><strong>Check:</strong> Is your current price already at the min or max boundary?</li></ul>\n<h4>Scenario 2: \"My price dropped to the minimum and stays there\"</h4>\n<ul><li><strong>Diagnosis:</strong> Price war — multiple sellers with aggressive downward rules</li><li><strong>Action 1:</strong> Review if your minimum price is correctly calculated (is it still profitable?)</li><li><strong>Action 2:</strong> Consider pausing the rule and setting a manual price</li><li><strong>Action 3:</strong> Evaluate whether to continue competing on this ASIN at current market prices</li><li><strong>Action 4:</strong> Focus on non-price factors (FBA, fast shipping, better metrics) to win the Buy Box at a higher price</li></ul>\n<h4>Scenario 3: \"I manually changed my price but it reverted\"</h4>\n<ul><li><strong>Cause:</strong> An active pricing rule overrode your manual change</li><li><strong>Fix:</strong> Pause or remove the rule from that SKU before making manual price changes</li></ul>\n<h4>Scenario 4: \"I paused my rule but the price didn't go back to my original price\"</h4>\n<ul><li><strong>Expected behavior:</strong> Pausing only stops future adjustments — it does NOT revert prices</li><li><strong>Fix:</strong> Manually set the price to your desired amount after pausing</li></
