stered)</li><li>[ ] Brand Story module added</li><li>[ ] Variations properly structured (if applicable)</li><li>[ ] All required attributes filled in</li><li>[ ] No prohibited language in title, bullets, or description</li><li>[ ] Price competitive for the category</li><li>[ ] Listing Quality Dashboard shows \"Good\" or higher</li></ul>\n<h4>Troubleshooting Checklist (Listing Not Appearing)</h4>\n<ul><li>Check <strong>Manage All Inventory → Suppressed</strong> tab for suppression reasons</li><li>Check <strong>Account Health Dashboard</strong> for policy violations</li><li>Verify title complies with character limits and content rules</li><li>Verify main image meets all requirements</li><li>Check that all required attributes are filled in for the category</li><li>Verify backend search terms are under 250 bytes</li><li>Check the <strong>Processing Report</strong> if uploaded via flat file</li><li>If recently created, allow 24–48 hours for indexing</li><li>Open <strong>Seller Support case</strong> if all else checks out</li></ul>\n<p>---</p>\n<p><em>Last updated: September 2026</em></p>\n<p><em>Sources: Amazon Seller Central documentation, Amazon Seller Forums, Amazon sell.amazon.com guides, Amazon Seller Central SA, industry guides and practitioner resources.</em></p>\n","searchText":"- [ ] Search catalog thoroughly — confirm product doesn't already exist\n- [ ] If exists: match offer to existing ASIN\n- [ ] If new: select correct product category\n- [ ] Enter valid EAN/UPC (or apply for GTIN exemption)\n- [ ] Write Arabic title (professional, keyword-rich, within limits)\n- [ ] Write 5 Arabic bullet points (benefit-led, feature-supported)\n- [ ] Write Arabic product description (or plan A+ Content if Brand Registered)\n- [ ] Upload main image (white background, 1000+ px, product fills 85%)\n- [ ] Upload 5+ additional images (angles, lifestyle, infographic, scale)\n- [ ] Fill in all required category-specific attributes\n- [ ] Add backend search terms (Arabic + English, under 250 bytes)\n- [ ] Set price in SAR (including 15% VAT consideration)\n- [ ] Select fulfillment channel (FBA recommended for Amazon.sa)\n- [ ] Complete Safety & Compliance section\n- [ ] Verify SASO/SABER certification if importing physical goods\n- [ ] Review and submit - [ ] Title: Brand + primary keyword + key feature + variant (Arabic)\n- [ ] Bullet points: 5 benefit-focused bullets with natural keyword inclusion\n- [ ] Main image: White background, high-res, product fills 85%+\n- [ ] 6+ additional images: angles, lifestyle, infographic, close-ups\n- [ ] 1+ video uploaded\n- [ ] Backend search terms: Arabic + English, under 250 bytes, no repeats\n- [ ] A+ Content created (if Brand Registered)\n- [ ] Brand Story module added\n- [ ] Variations properly structured (if applicable)\n- [ ] All required attributes filled in\n- [ ] No prohibited language in title, bullets, or description\n- [ ] Price competitive for the category\n- [ ] Listing Quality Dashboard shows \"Good\" or higher 1. Check **Manage All Inventory → Suppressed** tab for suppression reasons\n2. Check **Account Health Dashboard** for policy violations\n3. Verify title complies with character limits and content rules\n4. Verify main image meets all requirements\n5. Check that all required attributes are filled in for the category\n6. Verify backend search terms are under 250 bytes\n7. Check the **Processing Report** if uploaded via flat file\n8. If recently created, allow 24–48 hours for indexing\n9. Open **Seller Support case** if all else checks out\n\n---\n\n*Last updated: September 2026*\n*Sources: Amazon Seller Central documentation, Amazon Seller Forums, Amazon sell.amazon.com guides, Amazon Seller Central SA, industry guides and practitioner resources.*"}],"fba":[{"title":"1. What Is FBA?","html":"<p><strong>Fulfillment by Amazon (FBA)</strong> is a logistics service where sellers send their inventory to Amazon's fulfillment centers, and Amazon handles the entire post-sale process: <strong>storage, picking, packing, shipping, customer service, and returns</strong>.</p>\n<p>In the MENA region, FBA operates through Amazon's fulfillment network serving <strong>Amazon.sa</strong> (Saudi Arabia) and <strong>Amazon.ae</strong> (UAE). Sellers ship products to local fulfillment centers in the Kingdom, and Amazon takes over from there.</p><h4>Core Value Proposition</h4>\n<ul><li><strong>\"You sell it, we ship it.\"</strong> — Sellers focus on sourcing, listing, and marketing; Amazon handles physical fulfillment.</li><li>Products become eligible for <strong>Amazon Prime</strong> and <strong>free shipping</strong> badges.</li><li>Amazon manages all <strong>customer service and returns</strong> for FBA orders.</li><li>No minimum inventory requirement — sellers can send as little or as much as they want.</li></ul>\n<h4>FBA vs. FBM (Fulfillment by Merchant)</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Aspect</th><th>FBA</th><th>FBM</th></tr></thead><tbody><tr><td>Fulfillment</td><td>Amazon handles all logistics</td><td>Seller handles storage, packing, shipping</td></tr><tr><td>Prime eligibility</td><td>Automatic</td><td>Requires Seller Fulfilled Prime qualification</td></tr><tr><td>Customer service</td><td>Amazon handles</td><td>Seller handles</td></tr><tr><td>Returns</td><td>Amazon processes</td><td>Seller manages</td></tr><tr><td>Fees</td><td>Fulfillment + storage fees</td><td>Seller bears shipping costs directly</td></tr><tr><td>Control</td><td>Less control over packaging/branding</td><td>Full control over customer experience</td></tr><tr><td>Best for</td><td>High-volume, standard-size items with ≥25–30% margin</td><td>Oversized items, perishables, thin-margin products</td></tr></tbody></table></div>\n<p>---</p>\n","searchText":"**Fulfillment by Amazon (FBA)** is a logistics service where sellers send their inventory to Amazon's fulfillment centers, and Amazon handles the entire post-sale process: **storage, picking, packing, shipping, customer service, and returns**.\n\nIn the MENA region, FBA operates through Amazon's fulfillment network serving **Amazon.sa** (Saudi Arabia) and **Amazon.ae** (UAE). Sellers ship products to local fulfillment centers in the Kingdom, and Amazon takes over from there.- **\"You sell it, we ship it.\"** — Sellers focus on sourcing, listing, and marketing; Amazon handles physical fulfillment.\n- Products become eligible for **Amazon Prime** and **free shipping** badges.\n- Amazon manages all **customer service and returns** for FBA orders.\n- No minimum inventory requirement — sellers can send as little or as much as they want. | Aspect | FBA | FBM |\n|---|---|---|\n| Fulfillment | Amazon handles all logistics | Seller handles storage, packing, shipping |\n| Prime eligibility | Automatic | Requires Seller Fulfilled Prime qualification |\n| Customer service | Amazon handles | Seller handles |\n| Returns | Amazon processes | Seller manages |\n| Fees | Fulfillment + storage fees | Seller bears shipping costs directly |\n| Control | Less control over packaging/branding | Full control over customer experience |\n| Best for | High-volume, standard-size items with ≥25–30% margin | Oversized items, perishables, thin-margin products |\n\n---"},{"title":"2. How FBA Works — Step-by-Step Flow","html":"<h4>The FBA Lifecycle</h4>\n<p><code>`</code></p>\n<p>Seller lists products → Sends inventory to Amazon FC → Amazon stores inventory</p>\n<p>→ Customer orders → Amazon picks, packs, ships → Amazon handles returns/CS</p>\n<p><code>`</code></p>\n<p><strong>Detailed flow:</strong></p>\n<ul><li><strong>Seller creates product listing</strong> on Amazon.sa and designates it as FBA inventory.</li><li><strong>Seller prepares shipment</strong> — products are prepped, labeled, and packaged per Amazon guidelines.</li><li><strong>Seller creates a shipping plan</strong> in Seller Central using the \"Send to Amazon\" workflow.</li><li><strong>Seller ships inventory</strong> to Amazon's designated fulfillment center(s) in KSA.</li><li><strong>Amazon receives and stores</strong> inventory — products become available for purchase.</li><li><strong>Customer places order</strong> — Amazon's systems pick the item from the shelf, pack it, and ship it.</li><li><strong>Delivery</strong> — Typically 1–3 days within KSA for Prime-eligible orders.</li><li><strong>Post-sale</strong> — Amazon handles any customer service inquiries, returns, and refunds.</li></ul>\n<p>---</p>\n","searchText":"```\nSeller lists products → Sends inventory to Amazon FC → Amazon stores inventory\n→ Customer orders → Amazon picks, packs, ships → Amazon handles returns/CS\n```\n\n**Detailed flow:**\n\n1. **Seller creates product listing** on Amazon.sa and designates it as FBA inventory.\n2. **Seller prepares shipment** — products are prepped, labeled, and packaged per Amazon guidelines.\n3. **Seller creates a shipping plan** in Seller Central using the \"Send to Amazon\" workflow.\n4. **Seller ships inventory** to Amazon's designated fulfillment center(s) in KSA.\n5. **Amazon receives and stores** inventory — products become available for purchase.\n6. **Customer places order** — Amazon's systems pick the item from the shelf, pack it, and ship it.\n7. **Delivery** — Typically 1–3 days within KSA for Prime-eligible orders.\n8. **Post-sale** — Amazon handles any customer service inquiries, returns, and refunds.\n\n---"},{"title":"3. Enrollment Steps — How to Start with FBA on Amazon.sa","html":"<h4>Prerequisites</h4>\n<ul><li>An <strong>active Amazon.sa Professional selling account</strong></li><li>Products listed in the Amazon catalog</li><li>Compliance with Saudi Arabia import/tax requirements (see Section 9)</li></ul>\n<h4>Step-by-Step Enrollment</h4>\n<p>#### Step 1: Create an Amazon.sa Selling Account</p>\n<ul><li>Go to <strong>sellercentral.amazon.sa</strong> and register for a new account.</li><li>You need: business email, credit card, bank account details, tax information.</li><li><strong>Incentive</strong>: If you add your first products within 20 days of signing up, you get a <strong>30% discount on referral fees for 60 days</strong>.</li><li>Professional selling plan is currently available with <strong>no monthly subscription fee</strong> (limited-time offer on Amazon.sa).</li></ul>\n<p>#### Step 2: Register for FBA</p>\n<ul><li>In Seller Central, click the <strong>gear icon → Account Info</strong>.</li><li>Select <strong>Manage</strong> on the Seller Account Information page.</li><li>Click <strong>Register for FBA</strong>.</li></ul>\n<p>#### Step 3: List Products and Designate as FBA</p>\n<ul><li>Add products to the Amazon catalog.</li><li>When listing, select <strong>\"Amazon will ship and provide customer service (FBA)\"</strong>.</li><li>Existing listings can be converted to FBA.</li><li>Review <strong>FBA product restrictions</strong> — some products require approval or are ineligible.</li></ul>\n<p>#### Step 4: Prepare Products for Shipment</p>\n<ul><li>Follow Amazon's <strong>packing guidelines, labeling requirements, and shipping/routing rules</strong>.</li><li>Each unit must have a scannable <strong>FNSKU barcode</strong>.</li><li>Products must be properly prepped (poly-bagged, bubble-wrapped, etc. as needed).</li></ul>\n<p>#### Step 5: Create Shipping Plan & Book Appointment</p>\n<ul><li>Use the <strong>\"Send to Amazon\"</strong> workflow in Seller Central.</li><li>Create a shipping plan specifying quantities and products.</li><li>Print <strong>Amazon shipment ID labels</strong> for each carton.</li><li>Book an <strong>appointment on Carrier Central</strong> for delivery to the fulfillment center.</li></ul>\n<p>#### Step 6: Ship to Amazon Fulfillment Center</p>\n<ul><li>Send products to the designated Amazon FC in KSA.</li><li>Track shipment progress in Seller Central.</li><li>Shipment status progression: <code>CREATING → WORKING → SHIPPED → CHECKED_IN → RECEIVING → CLOSED</code></li><li>Standard check-in time: <strong>72 hours</strong> (up to 7 days during peak periods).</li></ul>\n<p>#### Step 7: Amazon Takes Over</p>\n<ul><li>Once received, inventory becomes available for customer purchase.</li><li>Amazon handles all fulfillment, customer service, and returns.</li></ul>\n<p>---</p>\n","searchText":"- An **active Amazon.sa Professional selling account**\n- Products listed in the Amazon catalog\n- Compliance with Saudi Arabia import/tax requirements (see Section 9) #### Step 1: Create an Amazon.sa Selling Account\n- Go to **sellercentral.amazon.sa** and register for a new account.\n- You need: business email, credit card, bank account details, tax information.\n- **Incentive**: If you add your first products within 20 days of signing up, you get a **30% discount on referral fees for 60 days**.\n- Professional selling plan is currently available with **no monthly subscription fee** (limited-time offer on Amazon.sa).\n\n#### Step 2: Register for FBA\n- In Seller Central, click the **gear icon → Account Info**.\n- Select **Manage** on the Seller Account Information page.\n- Click **Register for FBA**.\n\n#### Step 3: List Products and Designate as FBA\n- Add products to the Amazon catalog.\n- When listing, select **\"Amazon will ship and provide customer service (FBA)\"**.\n- Existing listings can be converted to FBA.\n- Review **FBA product restrictions** — some products require approval or are ineligible.\n\n#### Step 4: Prepare Products for Shipment\n- Follow Amazon's **packing guidelines, labeling requirements, and shipping/routing rules**.\n- Each unit must have a scannable **FNSKU barcode**.\n- Products must be properly prepped (poly-bagged, bubble-wrapped, etc. as needed).\n\n#### Step 5: Create Shipping Plan & Book Appointment\n- Use the **\"Send to Amazon\"** workflow in Seller Central.\n- Create a shipping plan specifying quantities and products.\n- Print **Amazon shipment ID labels** for each carton.\n- Book an **appointment on Carrier Central** for delivery to the fulfillment center.\n\n#### Step 6: Ship to Amazon Fulfillment Center\n- Send products to the designated Amazon FC in KSA.\n- Track shipment progress in Seller Central.\n- Shipment status progression: `CREATING → WORKING → SHIPPED → CHECKED_IN → RECEIVING → CLOSED`\n- Standard check-in time: **72 hours** (up to 7 days during peak periods).\n\n#### Step 7: Amazon Takes Over\n- Once received, inventory becomes available for customer purchase.\n- Amazon handles all fulfillment, customer service, and returns.\n\n---"},{"title":"4. FBA Fees Structure — Amazon.sa (Saudi Arabia)","html":"<h4>Overview of Fee Categories</h4>\n<p>FBA fees on Amazon.sa consist of several layers:</p>\n<ul><li><strong>Referral Fees</strong> — Percentage of sale price (varies by category)</li><li><strong>FBA Fulfillment Fees</strong> — Per-unit charge for pick, pack, and ship</li><li><strong>Monthly Inventory Storage Fees</strong> — Based on space occupied</li><li><strong>Long-Term / Aged Inventory Surcharge</strong> — For slow-moving stock</li><li><strong>Optional / Conditional Fees</strong> — Removal, disposal, returns processing</li></ul>\n<h4>4.1 Referral Fees (Amazon.sa)</h4>\n<p>Referral fees are a percentage of the total sale price (item + shipping + gift wrap). Key categories:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category</th><th>Referral Fee</th><th>Min Fee</th></tr></thead><tbody><tr><td>Consumer Electronics</td><td>5.5%</td><td>1 SAR</td></tr><tr><td>Mobiles & Tablets</td><td>5.5%</td><td>1 SAR</td></tr><tr><td>Camera</td><td>8%</td><td>1 SAR</td></tr><tr><td>PC Store</td><td>6%</td><td>1 SAR</td></tr><tr><td>Major Appliances</td><td>6%</td><td>1 SAR</td></tr><tr><td>Video Game Consoles</td><td>6%</td><td>1 SAR</td></tr><tr><td>Home Entertainment</td><td>6.5%</td><td>1 SAR</td></tr><tr><td>Baby</td><td>8% (≤50 SAR) / 15% (>50 SAR)</td><td>1 SAR</td></tr><tr><td>Beauty</td><td>8.5% (≤50 SAR) / 11% (>50 SAR)</td><td>1 SAR</td></tr><tr><td>Health & Personal Care</td><td>8.5% (≤50 SAR) / 11% (>50 SAR)</td><td>1 SAR</td></tr><tr><td>Grocery</td><td>3% (≤25 SAR) / 9% (>25 SAR)</td><td>0 SAR</td></tr><tr><td>Headphones & Portable Audio</td><td>10%</td><td>1 SAR</td></tr><tr><td>Automotive</td><td>12%</td><td>1 SAR</td></tr><tr><td>Small Appliances</td><td>12%</td><td>1 SAR</td></tr><tr><td>Sports</td><td>13%</td><td>1 SAR</td></tr><tr><td>Home</td><td>14%</td><td>1 SAR</td></tr><tr><td>Kitchen</td><td>14%</td><td>1 SAR</td></tr><tr><td>Toys</td><td>14%</td><td>1 SAR</td></tr><tr><td>Video Games</td><td>14%</td><td>1 SAR</td></tr><tr><td>Tools & Home Improvement</td><td>14%</td><td>1 SAR</td></tr><tr><td>Outdoors</td><td>14%</td><td>1 SAR</td></tr><tr><td>Furniture</td><td>15% (≤750 SAR) / 10% (>750 SAR)</td><td>1 SAR</td></tr><tr><td>Books</td><td>15%</td><td>1 SAR</td></tr><tr><td>Perfumes</td><td>15%</td><td>1 SAR</td></tr><tr><td>Shoes</td><td>15%</td><td>1 SAR</td></tr><tr><td>Luggage</td><td>15%</td><td>1 SAR</td></tr><tr><td>Pet Products</td><td>15%</td><td>1 SAR</td></tr><tr><td>Office Products</td><td>15%</td><td>1 SAR</td></tr><tr><td>Watches</td><td>15% (≤5,000 SAR) / 5% (>5,000 SAR)</td><td>1 SAR</td></tr><tr><td>Jewelry</td><td>16% (≤1,000 SAR) / 5% (>1,000 SAR)</td><td>1 SAR</td></tr><tr><td>All Other Categories</td><td>10%</td><td>1 SAR</td></tr></tbody></table></div>\n<p><strong>Note:</strong> All listed fees exclude applicable <strong>VAT (5% on fees)</strong>. Saudi Arabia charges <strong>15% VAT</strong> on consumer goods.</p>\n<h4>4.2 FBA Fulfillment Fees (Amazon.sa — Effective August 1, 2025)</h4>\n<p>FBA fulfillment fees are per-unit, based on <strong>size tier and weight</strong>. Fees differ based on whether the item's <strong>selling price is below or above 25 SAR</strong>.</p>\n<p>#### Product Size Tiers</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Size Tier</th><th>Max Length (cm)</th><th>Max Width (cm)</th><th>Max Height (cm)</th><th>Max Weight</th></tr></thead><tbody><tr><td>Small Envelope</td><td>≤20</td><td>≤15</td><td>≤1</td><td>100g</td></tr><tr><td>Standard Envelope</td><td>≤33</td><td>≤23</td><td>≤2.5</td><td>500g</td></tr><tr><td>Large Envelope</td><td>≤33</td><td>≤23</td><td>≤5</td><td>1,000g</td></tr><tr><td>Standard Parcel</td><td>≤45</td><td>≤34</td><td>≤26</td><td>12,000g (12kg)</td></tr><tr><td>Oversize</td><td>>45</td><td>>34</td><td>>26</td><td>30,000g (30kg)</td></tr></tbody></table></div>\n<p><strong>Standard-size</strong> = ≤45cm longest side, ≤34cm median, ≤26cm shortest, ≤12kg weight.</p>\n<p><strong>Oversize</strong> = Anything exceeding standard dimensions OR weighing >12kg.</p>\n<p>#### Fulfillment Fee Table (SAR per unit)</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Size Tier & Weight</th><th>Fee (Selling Price <25 SAR)</th><th>Fee (Selling Price ≥25 SAR)</th></tr></thead><tbody><tr><td><strong>Small Envelope</strong> ≤0.1kg</td><td>5.5</td><td>7.5</td></tr><tr><td><strong>Standard Envelope</strong> ≤0.1kg</td><td>6.0</td><td>8.0</td></tr><tr><td><strong>Standard Envelope</strong> ≤0.2kg</td><td>6.2</td><td>8.2</td></tr><tr><td><strong>Standard Envelope</strong> ≤0.5kg</td><td>6.5</td><td>8.5</td></tr><tr><td><strong>Large Envelope</strong> ≤1kg</td><td>7.0</td><td>9.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤0.25kg</td><td>7.2</td><td>9.2</td></tr><tr><td><strong>Standard Parcel</strong> ≤0.5kg</td><td>7.5</td><td>9.5</td></tr><tr><td><strong>Standard Parcel</strong> ≤1kg</td><td>8.0</td><td>10.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤1.5kg</td><td>8.5</td><td>11.5</td></tr><tr><td><strong>Standard Parcel</strong> ≤2kg</td><td>9.0</td><td>12.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤3kg</td><td>10.0</td><td>13.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤4kg</td><td>11.0</td><td>14.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤5kg</td><td>12.0</td><td>15.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤6kg</td><td>13.0</td><td>16.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤7kg</td><td>14.0</td><td>17.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤8kg</td><td>15.0</td><td>18.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤9kg</td><td>16.0</td><td>19.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤10kg</td><td>17.0</td><td>20.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤11kg</td><td>18.0</td><td>21.0</td></tr><tr><td><strong>Standard Parcel</strong> ≤12kg</td><td>19.0</td><td>22.0</td></tr><tr><td><strong>Oversize</strong> ≤1kg</td><td>10.0</td><td>14.0</td></tr><tr><td><strong>Oversize</strong> ≤2kg</td><td>11.0</td><td>15.0</td></tr><tr><td><strong>Oversize</strong> ≤3kg</td><td>12.0</td><td>16.0</td></tr><tr><td><strong>Oversize</strong> ≤5kg</td><td>14.0</td><td>18.0</td></tr><tr><td><strong>Oversize</strong> ≤10kg</td><td>19.0</td><td>23.0</td></tr><tr><td><strong>Oversize</strong> ≤15kg</td><td>24.0</td><td>28.0</td></tr><tr><td><strong>Oversize</strong> ≤20kg</td><td>29.0</td><td>33.0</td></tr><tr><td><strong>Oversize</strong> ≤25kg</td><td>34.0</td><td>38.0</td></tr><tr><td><strong>Oversize</strong> ≤30kg</td><td>39.0</td><td>43.0</td></tr></tbody></table></div>\n<p><strong>Key insight:</strong> Items priced below 25 SAR get <strong>lower fulfillment fees</strong> (typically 2 SAR less per unit), incentivizing sellers to offer affordable products.</p>\n<h4>4.3 Monthly Inventory Storage Fees</h4>\n<p>Storage fees are charged based on <strong>daily average volume</strong> (cubic feet) of inventory in Amazon's fulfillment center. Charged monthly, typically between the 7th–15th of the following month.</p>\n<p><strong>Calculating cubic feet from centimeters:</strong></p>\n<blockquote>Volume (cu ft) = (Length cm × Width cm × Height cm) ÷ 28,316.84</blockquote>\n<p>Storage rates on Amazon.sa follow a seasonal model similar to global marketplaces:</p>\n<ul><li><strong>Off-peak (Jan–Sep):</strong> Lower rates</li><li><strong>Peak (Oct–Dec):</strong> Significantly higher rates (expect 2–3× increase)</li></ul>\n<p><em>Sellers should check Seller Central for current exact SAR rates, as Amazon adjusts these periodically.</em></p>\n<h4>4.4 Long-Term / Aged Inventory Surcharge</h4>\n<p>Inventory sitting in fulfillment centers beyond <strong>180 days</strong> incurs additional surcharges:</p>\n<ul><li><strong>181–270 days:</strong> Surcharge applies</li><li><strong>271–365 days:</strong> Higher surcharge</li><li><strong>365+ days:</strong> Highest tier surcharge</li></ul>\n<p>These fees are in addition to monthly storage fees. The surcharge is charged as the greater of a per-cubic-foot rate or a per-unit minimum.</p>\n<p><strong>Best practice:</strong> Maintain <strong>30–60 days of inventory</strong> to avoid aged inventory surcharges.</p>\n<h4>4.5 Other Fees</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Fee Type</th><th>Description</th></tr></thead><tbody><tr><td><strong>Removal fees</strong></td><td>Per-unit charge to have Amazon return inventory to you</td></tr><tr><td><strong>Disposal fees</strong></td><td>Per-unit charge to have Amazon dispose of inventory</td></tr><tr><td><strong>Liquidation fees</strong></td><td>Per-unit charge for Amazon's liquidation program</td></tr><tr><td><strong>Returns processing fees</strong></td><td>Charged when Amazon provides free return shipping on certain categories</td></tr></tbody></table></div>\n<h4>4.6 Total Cost Estimate</h4>\n<p>Industry estimates suggest FBA sellers typically pay <strong>25–40% of the sale price</strong> in total Amazon fees (referral + fulfillment + storage). For Saudi Arabia, with 15% VAT factored in, sellers should target a <strong>minimum gross margin of 25–30%</strong> after all fees to remain profitable.</p>\n<p>---</p>\n","searchText":"FBA fees on Amazon.sa consist of several layers:\n\n1. **Referral Fees** — Percentage of sale price (varies by category)\n2. **FBA Fulfillment Fees** — Per-unit charge for pick, pack, and ship\n3. **Monthly Inventory Storage Fees** — Based on space occupied\n4. **Long-Term / Aged Inventory Surcharge** — For slow-moving stock\n5. **Optional / Conditional Fees** — Removal, disposal, returns processing Referral fees are a percentage of the total sale price (item + shipping + gift wrap). Key categories:\n\n| Category | Referral Fee | Min Fee |\n|---|---|---|\n| Consumer Electronics | 5.5% | 1 SAR |\n| Mobiles & Tablets | 5.5% | 1 SAR |\n| Camera | 8% | 1 SAR |\n| PC Store | 6% | 1 SAR |\n| Major Appliances | 6% | 1 SAR |\n| Video Game Consoles | 6% | 1 SAR |\n| Home Entertainment | 6.5% | 1 SAR |\n| Baby | 8% (≤50 SAR) / 15% (>50 SAR) | 1 SAR |\n| Beauty | 8.5% (≤50 SAR) / 11% (>50 SAR) | 1 SAR |\n| Health & Personal Care | 8.5% (≤50 SAR) / 11% (>50 SAR) | 1 SAR |\n| Grocery | 3% (≤25 SAR) / 9% (>25 SAR) | 0 SAR |\n| Headphones & Portable Audio | 10% | 1 SAR |\n| Automotive | 12% | 1 SAR |\n| Small Appliances | 12% | 1 SAR |\n| Sports | 13% | 1 SAR |\n| Home | 14% | 1 SAR |\n| Kitchen | 14% | 1 SAR |\n| Toys | 14% | 1 SAR |\n| Video Games | 14% | 1 SAR |\n| Tools & Home Improvement | 14% | 1 SAR |\n| Outdoors | 14% | 1 SAR |\n| Furniture | 15% (≤750 SAR) / 10% (>750 SAR) | 1 SAR |\n| Books | 15% | 1 SAR |\n| Perfumes | 15% | 1 SAR |\n| Shoes | 15% | 1 SAR |\n| Luggage | 15% | 1 SAR |\n| Pet Products | 15% | 1 SAR |\n| Office Products | 15% | 1 SAR |\n| Watches | 15% (≤5,000 SAR) / 5% (>5,000 SAR) | 1 SAR |\n| Jewelry | 16% (≤1,000 SAR) / 5% (>1,000 SAR) | 1 SAR |\n| All Other Categories | 10% | 1 SAR |\n\n**Note:** All listed fees exclude applicable **VAT (5% on fees)**. Saudi Arabia charges **15% VAT** on consumer goods. FBA fulfillment fees are per-unit, based on **size tier and weight**. Fees differ based on whether the item's **selling price is below or above 25 SAR**.\n\n#### Product Size Tiers\n\n| Size Tier | Max Length (cm) | Max Width (cm) | Max Height (cm) | Max Weight |\n|---|---|---|---|---|\n| Small Envelope | ≤20 | ≤15 | ≤1 | 100g |\n| Standard Envelope | ≤33 | ≤23 | ≤2.5 | 500g |\n| Large Envelope | ≤33 | ≤23 | ≤5 | 1,000g |\n| Standard Parcel | ≤45 | ≤34 | ≤26 | 12,000g (12kg) |\n| Oversize | >45 | >34 | >26 | 30,000g (30kg) |\n\n**Standard-size** = ≤45cm longest side, ≤34cm median, ≤26cm shortest, ≤12kg weight.\n**Oversize** = Anything exceeding standard dimensions OR weighing >12kg.\n\n#### Fulfillment Fee Table (SAR per unit)\n\n| Size Tier & Weight | Fee (Selling Price <25 SAR) | Fee (Selling Price ≥25 SAR) |\n|---|---|---|\n| **Small Envelope** ≤0.1kg | 5.5 | 7.5 |\n| **Standard Envelope** ≤0.1kg | 6.0 | 8.0 |\n| **Standard Envelope** ≤0.2kg | 6.2 | 8.2 |\n| **Standard Envelope** ≤0.5kg | 6.5 | 8.5 |\n| **Large Envelope** ≤1kg | 7.0 | 9.0 |\n| **Standard Parcel** ≤0.25kg | 7.2 | 9.2 |\n| **Standard Parcel** ≤0.5kg | 7.5 | 9.5 |\n| **Standard Parcel** ≤1kg | 8.0 | 10.0 |\n| **Standard Parcel** ≤1.5kg | 8.5 | 11.5 |\n| **Standard Parcel** ≤2kg | 9.0 | 12.0 |\n| **Standard Parcel** ≤3kg | 10.0 | 13.0 |\n| **Standard Parcel** ≤4kg | 11.0 | 14.0 |\n| **Standard Parcel** ≤5kg | 12.0 | 15.0 |\n| **Standard Parcel** ≤6kg | 13.0 | 16.0 |\n| **Standard Parcel** ≤7kg | 14.0 | 17.0 |\n| **Standard Parcel** ≤8kg | 15.0 | 18.0 |\n| **Standard Parcel** ≤9kg | 16.0 | 19.0 |\n| **Standard Parcel** ≤10kg | 17.0 | 20.0 |\n| **Standard Parcel** ≤11kg | 18.0 | 21.0 |\n| **Standard Parcel** ≤12kg | 19.0 | 22.0 |\n| **Oversize** ≤1kg | 10.0 | 14.0 |\n| **Oversize** ≤2kg | 11.0 | 15.0 |\n| **Oversize** ≤3kg | 12.0 | 16.0 |\n| **Oversize** ≤5kg | 14.0 | 18.0 |\n| **Oversize** ≤10kg | 19.0 | 23.0 |\n| **Oversize** ≤15kg | 24.0 | 28.0 |\n| **Oversize** ≤20kg | 29.0 | 33.0 |\n| **Oversize** ≤25kg | 34.0 | 38.0 |\n| **Oversize** ≤30kg | 39.0 | 43.0 |\n\n**Key insight:** Items priced below 25 SAR get **lower fulfillment fees** (typically 2 SAR less per unit), incentivizing sellers to offer affordable products. Storage fees are charged based on **daily average volume** (cubic feet) of inventory in Amazon's fulfillment center. Charged monthly, typically between the 7th–15th of the following month.\n\n**Calculating cubic feet from centimeters:**\n> Volume (cu ft) = (Length cm × Width cm × Height cm) ÷ 28,316.84\n\nStorage rates on Amazon.sa follow a seasonal model similar to global marketplaces:\n- **Off-peak (Jan–Sep):** Lower rates\n- **Peak (Oct–Dec):** Significantly higher rates (expect 2–3× increase)\n\n*Sellers should check Seller Central for current exact SAR rates, as Amazon adjusts these periodically.* Inventory sitting in fulfillment centers beyond **180 days** incurs additional surcharges:\n- **181–270 days:** Surcharge applies\n- **271–365 days:** Higher surcharge\n- **365+ days:** Highest tier surcharge\n\nThese fees are in addition to monthly storage fees. The surcharge is charged as the greater of a per-cubic-foot rate or a per-unit minimum.\n\n**Best practice:** Maintain **30–60 days of inventory** to avoid aged inventory surcharges. | Fee Type | Description |\n|---|---|\n| **Removal fees** | Per-unit charge to have Amazon return inventory to you |\n| **Disposal fees** | Per-unit charge to have Amazon dispose of inventory |\n| **Liquidation fees** | Per-unit charge for Amazon's liquidation program |\n| **Returns processing fees** | Charged when Amazon provides free return shipping on certain categories | Industry estimates suggest FBA sellers typically pay **25–40% of the sale price** in total Amazon fees (referral + fulfillment + storage). For Saudi Arabia, with 15% VAT factored in, sellers should target a **minimum gross margin of 25–30%** after all fees to remain profitable.\n\n---"},{"title":"5. Inventory Management","html":"<h4>5.1 Inventory Performance Index (IPI)</h4>\n<p>The <strong>IPI score</strong> is Amazon's composite metric measuring how well you manage FBA inventory. It ranges from 0 to 1,000.</p>\n<ul><li><strong>Score ≥ 400:</strong> Unlimited standard storage capacity</li><li><strong>Score < 400:</strong> Amazon caps your storage capacity (cubic footage limits)</li></ul>\n<p><strong>IPI is influenced by:</strong></p>\n<ul><li>Excess inventory percentage</li><li>Sell-through rate</li><li>Stranded inventory percentage</li><li>In-stock rate for popular items</li></ul>\n<h4>5.2 FBA Capacity Limits</h4>\n<ul><li>Capacity limits are calculated <strong>per storage type</strong> (standard-size, oversize, apparel, footwear), not per ASIN.</li><li>View limits in Seller Central: <strong>Inventory → Manage All Inventory → FBA Dashboard → Capacity Monitor</strong>.</li><li>Amazon recalculates limits monthly based on your inventory health metrics.</li></ul>\n<h4>5.3 Restock Recommendations</h4>\n<p>Amazon provides restock tools in Seller Central:</p>\n<ul><li><strong>FBA Restock Tool</strong> — Recommends quantities and timing for replenishment</li><li><strong>Replenishment Alerts</strong> — Notifications when inventory is running low</li><li><strong>FBA Dashboard</strong> — Forecasting and inventory health overview</li><li><strong>Manage All Inventory</strong> page — View restock recommendations per SKU</li></ul>\n<h4>5.4 Inventory Best Practices</h4>\n<ul><li><strong>Target 30–60 days of forward cover</strong> — Enough to avoid stockouts, not enough to incur aged inventory fees.</li><li><strong>Monitor weekly:</strong> Check IPI score, sell-through rate, and stranded inventory.</li><li><strong>Remove slow-movers:</strong> Use removal or liquidation orders before the 180-day aged surcharge kicks in.</li><li><strong>Plan for Q4 peak:</strong> Storage fees spike Oct–Dec; adjust inventory levels accordingly.</li><li><strong>Use FBA Liquidations</strong> for unproductive inventory rather than paying long-term storage.</li></ul>\n<p>---</p>\n","searchText":"The **IPI score** is Amazon's composite metric measuring how well you manage FBA inventory. It ranges from 0 to 1,000.\n\n- **Score ≥ 400:** Unlimited standard storage capacity\n- **Score < 400:** Amazon caps your storage capacity (cubic footage limits)\n\n**IPI is influenced by:**\n- Excess inventory percentage\n- Sell-through rate\n- Stranded inventory percentage\n- In-stock rate for popular items - Capacity limits are calculated **per storage type** (standard-size, oversize, apparel, footwear), not per ASIN.\n- View limits in Seller Central: **Inventory → Manage All Inventory → FBA Dashboard → Capacity Monitor**.\n- Amazon recalculates limits monthly based on your inventory health metrics. Amazon provides restock tools in Seller Central:\n- **FBA Restock Tool** — Recommends quantities and timing for replenishment\n- **Replenishment Alerts** — Notifications when inventory is running low\n- **FBA Dashboard** — Forecasting and inventory health overview\n- **Manage All Inventory** page — View restock recommendations per SKU - **Target 30–60 days of forward cover** — Enough to avoid stockouts, not enough to incur aged inventory fees.\n- **Monitor weekly:** Check IPI score, sell-through rate, and stranded inventory.\n- **Remove slow-movers:** Use removal or liquidation orders before the 180-day aged surcharge kicks in.\n- **Plan for Q4 peak:** Storage fees spike Oct–Dec; adjust inventory levels accordingly.\n- **Use FBA Liquidations** for unproductive inventory rather than paying long-term storage.\n\n---"},{"title":"6. Shipping to Amazon Warehouses (KSA)","html":"<h4>6.1 Inbound Shipment Process</h4>\n<p><strong>Using \"Send to Amazon\" workflow in Seller Central:</strong></p>\n<ul><li><strong>Select inventory</strong> — Choose which products and quantities to ship.</li><li><strong>Choose shipping method</strong> — Options include:</li><li><strong>Amazon Partnered Carrier (PCP)</strong> — Discounted rates through Amazon's carrier partners</li><li><strong>Seller Managed Carrier</strong> — Use your own freight forwarder</li><li><strong>Amazon Global Logistics (AGL)</strong> — For international shipments</li><li><strong>SEND (Seller Export & Delivery)</strong> — Competitive rates from Amazon-vetted carrier partners</li><li><strong>Print carton/box labels</strong> — Each carton gets an Amazon shipment label.</li><li><strong>Confirm carrier details</strong> (for PCP and Seller Managed options).</li><li><strong>Print pallet labels</strong> (if applicable for PCP).</li><li><strong>Book delivery appointment</strong> on <strong>Carrier Central</strong> for the fulfillment center.</li><li><strong>Ship and track</strong> — Monitor delivery status in Seller Central.</li></ul>\n<h4>6.2 Key Shipping Requirements</h4>\n<ul><li><strong>Carton limits:</strong> Maximum carton/box dimensions of 63.5 × 63.5 × 63.5 cm (25 × 25 × 25 in) or maximum weight of 22.7 kg (50 lb) for standard.</li><li><strong>Pallet requirements:</strong> Follow Amazon's pallet specifications if shipping LTL/FTL.</li><li><strong>Labeling:</strong> Every carton must have the correct Amazon shipment ID label. Every unit must have a scannable FNSKU barcode.</li><li><strong>Appointment required:</strong> Deliveries without a scheduled appointment may be refused.</li></ul>\n<h4>6.3 Shipping to KSA — Special Considerations</h4>\n<p>#### For International Sellers Shipping into Saudi Arabia:</p>\n<ul><li><strong>Customs clearance:</strong> KSA customs can be strict. Allow 2–4 business days for air freight with proper documentation; 10+ days without it.</li><li><strong>SAR 1,000 duty-free threshold</strong> per individual shipment.</li><li><strong>15% VAT</strong> on most imports.</li><li><strong>DDP (Delivered Duty Paid) terms recommended</strong> to avoid shipment returns at customs.</li><li><strong>Arabic labeling mandatory</strong> for consumer goods.</li></ul>\n<p>#### Freight Options to KSA:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Method</th><th>Speed</th><th>Approx. Cost</th><th>Best For</th></tr></thead><tbody><tr><td>DHL Express</td><td>3–5 days</td><td>$25–45/kg</td><td>High-value, time-sensitive SKUs</td></tr><tr><td>Aramex</td><td>5–7 days</td><td>$18–28/kg</td><td>Balanced cost-speed</td></tr><tr><td>Package Consolidation</td><td>7–10 days</td><td>$12–20/kg</td><td>Multi-SKU orders, bulk</td></tr><tr><td>Sea Freight</td><td>28–45 days</td><td>$3–8/kg</td><td>Large inventory restocks</td></tr></tbody></table></div>\n<p>#### Required Documentation for KSA Import:</p>\n<ul><li>Commercial invoice (Arabic required)</li><li>Certificate of Conformity (SABER/SASO — see Section 9)</li><li>Precise HS code mapping</li><li>Packing list</li><li>Bill of Lading / Airway Bill</li></ul>\n<p>---</p>\n","searchText":"**Using \"Send to Amazon\" workflow in Seller Central:**\n\n1. **Select inventory** — Choose which products and quantities to ship.\n2. **Choose shipping method** — Options include:\n   - **Amazon Partnered Carrier (PCP)** — Discounted rates through Amazon's carrier partners\n   - **Seller Managed Carrier** — Use your own freight forwarder\n   - **Amazon Global Logistics (AGL)** — For international shipments\n   - **SEND (Seller Export & Delivery)** — Competitive rates from Amazon-vetted carrier partners\n3. **Print carton/box labels** — Each carton gets an Amazon shipment label.\n4. **Confirm carrier details** (for PCP and Seller Managed options).\n5. **Print pallet labels** (if applicable for PCP).\n6. **Book delivery appointment** on **Carrier Central** for the fulfillment center.\n7. **Ship and track** — Monitor delivery status in Seller Central. - **Carton limits:** Maximum carton/box dimensions of 63.5 × 63.5 × 63.5 cm (25 × 25 × 25 in) or maximum weight of 22.7 kg (50 lb) for standard.\n- **Pallet requirements:** Follow Amazon's pallet specifications if shipping LTL/FTL.\n- **Labeling:** Every carton must have the correct Amazon shipment ID label. Every unit must have a scannable FNSKU barcode.\n- **Appointment required:** Deliveries without a scheduled appointment may be refused. #### For International Sellers Shipping into Saudi Arabia:\n\n- **Customs clearance:** KSA customs can be strict. Allow 2–4 business days for air freight with proper documentation; 10+ days without it.\n- **SAR 1,000 duty-free threshold** per individual shipment.\n- **15% VAT** on most imports.\n- **DDP (Delivered Duty Paid) terms recommended** to avoid shipment returns at customs.\n- **Arabic labeling mandatory** for consumer goods.\n\n#### Freight Options to KSA:\n\n| Method | Speed | Approx. Cost | Best For |\n|---|---|---|---|\n| DHL Express | 3–5 days | $25–45/kg | High-value, time-sensitive SKUs |\n| Aramex | 5–7 days | $18–28/kg | Balanced cost-speed |\n| Package Consolidation | 7–10 days | $12–20/kg | Multi-SKU orders, bulk |\n| Sea Freight | 28–45 days | $3–8/kg | Large inventory restocks |\n\n#### Required Documentation for KSA Import:\n- Commercial invoice (Arabic required)\n- Certificate of Conformity (SABER/SASO — see Section 9)\n- Precise HS code mapping\n- Packing list\n- Bill of Lading / Airway Bill\n\n---"},{"title":"7. FBA Prep Requirements","html":"<h4>7.1 Overview</h4>\n<p><strong>Every unit must arrive at Amazon's fulfillment center fully prepped, labeled, and compliant.</strong> Amazon discontinued in-house FBA prep and labeling services for US shipments as of January 1, 2026. The same expectation applies to MENA — all prep must be completed before arrival.</p>\n<h4>7.2 Barcode & Labeling Requirements</h4>\n<ul><li><strong>Every unit</strong> must have an exterior scannable barcode (FNSKU).</li><li>Labels must include: FNSKU barcode, product name, and item condition.</li><li><strong>Barcode clear zones:</strong> At least 0.25 inches (6.35mm) white space on sides, 0.125 inches (3.2mm) top/bottom.</li><li><strong>Manufacturer barcodes</strong> (UPC/EAN) can be used if enrolled in Amazon's commingling program, but <strong>FNSKU is recommended</strong> for brand control.</li><li>Barcodes must be <strong>scannable</strong> — no wrinkled, smudged, or obscured labels.</li></ul>\n<h4>7.3 Packaging Requirements</h4>\n<p>#### General Rules:</p>\n<ul><li>Products must be securely packaged to prevent damage during transit and storage.</li><li>Items must be packaged so they arrive in <strong>sellable condition</strong>.</li><li>Packaging must protect items from being damaged by other items in the shipment.</li></ul>\n<p>#### Category-Specific Prep:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Product Type</th><th>Prep Required</th></tr></thead><tbody><tr><td><strong>Liquids</strong></td><td>Sealed to prevent leaking; placed in poly bag with suffocation warning</td></tr><tr><td><strong>Fragile items</strong></td><td>Bubble wrap or sufficient cushioning; \"Fragile\" label</td></tr><tr><td><strong>Sharp items</strong></td><td>Blade/point covers; secure packaging</td></tr><tr><td><strong>Items with expiration dates</strong></td><td>Date clearly visible on outside of packaging (MM/DD/YYYY or MM/YYYY)</td></tr><tr><td><strong>Small items</strong></td><td>Poly-bagged to prevent loss</td></tr><tr><td><strong>Apparel</strong></td><td>Poly-bagged with suffocation warning</td></tr><tr><td><strong>Glass</strong></td><td>Bubble-wrapped; marked as \"Fragile\"</td></tr><tr><td><strong>Batteries (standalone)</strong></td><td>Must be packaged to prevent short circuits</td></tr><tr><td><strong>Sets/bundles</strong></td><td>Clearly labeled as a set; packaged together securely</td></tr></tbody></table></div>\n<p>#### Poly Bag Requirements:</p>\n<ul><li><strong>Suffocation warning</strong> required on all poly bags with opening ≥5 inches.</li><li>Warning text: \"WARNING: To avoid danger of suffocation, keep this plastic bag away from babies and children. Do not use this bag in cribs, beds, carriages, or play pens. This bag is not a toy.\"</li><li>Poly bags must be <strong>transparent</strong> and ≤100 microns thick.</li></ul>\n<h4>7.4 Carton/Box Requirements</h4>\n<ul><li>Each carton must contain only products for a <strong>single shipment ID</strong>.</li><li>Carton labels must be placed on a flat surface, not taped over seams.</li><li>All old shipping labels or barcodes must be <strong>removed or covered</strong>.</li><li>Cartons must be sturdy enough to protect contents during handling.</li></ul>\n<h4>7.5 KSA-Specific Prep</h4>\n<ul><li><strong>Arabic labeling</strong> is mandatory for consumer goods sold in Saudi Arabia.</li><li><strong>SAR pricing</strong> must be displayed where applicable.</li><li>Products must comply with <strong>SASO standards</strong> (see Compliance section).</li><li>Ensure packaging is <strong>culturally appropriate</strong> — modest imagery, no offensive content.</li></ul>\n<p>---</p>\n","searchText":"**Every unit must arrive at Amazon's fulfillment center fully prepped, labeled, and compliant.** Amazon discontinued in-house FBA prep and labeling services for US shipments as of January 1, 2026. The same expectation applies to MENA — all prep must be completed before arrival. - **Every unit** must have an exterior scannable barcode (FNSKU).\n- Labels must include: FNSKU barcode, product name, and item condition.\n- **Barcode clear zones:** At least 0.25 inches (6.35mm) white space on sides, 0.125 inches (3.2mm) top/bottom.\n- **Manufacturer barcodes** (UPC/EAN) can be used if enrolled in Amazon's commingling program, but **FNSKU is recommended** for brand control.\n- Barcodes must be **scannable** — no wrinkled, smudged, or obscured labels. #### General Rules:\n- Products must be securely packaged to prevent damage during transit and storage.\n- Items must be packaged so they arrive in **sellable condition**.\n- Packaging must protect items from being damaged by other items in the shipment.\n\n#### Category-Specific Prep:\n\n| Product Type | Prep Required |\n|---|---|\n| **Liquids** | Sealed to prevent leaking; placed in poly bag with suffocation warning |\n| **Fragile items** | Bubble wrap or sufficient cushioning; \"Fragile\" label |\n| **Sharp items** | Blade/point covers; secure packaging |\n| **Items with expiration dates** | Date clearly visible on outside of packaging (MM/DD/YYYY or MM/YYYY) |\n| **Small items** | Poly-bagged to prevent loss |\n| **Apparel** | Poly-bagged with suffocation warning |\n| **Glass** | Bubble-wrapped; marked as \"Fragile\" |\n| **Batteries (standalone)** | Must be packaged to prevent short circuits |\n| **Sets/bundles** | Clearly labeled as a set; packaged together securely |\n\n#### Poly Bag Requirements:\n- **Suffocation warning** required on all poly bags with opening ≥5 inches.\n- Warning text: \"WARNING: To avoid danger of suffocation, keep this plastic bag away from babies and children. Do not use this bag in cribs, beds, carriages, or play pens. This bag is not a toy.\"\n- Poly bags must be **transparent** and ≤100 microns thick. - Each carton must contain only products for a **single shipment ID**.\n- Carton labels must be placed on a flat surface, not taped over seams.\n- All old shipping labels or barcodes must be **removed or covered**.\n- Cartons must be sturdy enough to protect contents during handling. - **Arabic labeling** is mandatory for consumer goods sold in Saudi Arabia.\n- **SAR pricing** must be displayed where applicable.\n- Products must comply with **SASO standards** (see Compliance section).\n- Ensure packaging is **culturally appropriate** — modest imagery, no offensive content.\n\n---"},{"title":"8. FBA Returns Policy","html":"<h4>8.1 How FBA Returns Work</h4>\n<p>For FBA orders, <strong>Amazon handles the entire returns process</strong>:</p>\n<ul><li><strong>Customer initiates return</strong> through their Amazon account or the Online Returns Center.</li><li><strong>Amazon evaluates</strong> the request against the return window and product eligibility.</li><li><strong>Auto-authorization</strong> — Most in-policy requests are approved automatically.</li><li><strong>Return label issued</strong> — Customer receives a prepaid return shipping label.</li><li><strong>Customer ships item back</strong> to an Amazon fulfillment center.</li><li><strong>Amazon inspects</strong> the returned item.</li><li><strong>Refund processed</strong> — Typically 3–5 business days for credit cards.</li><li><strong>Inventory disposition</strong> — Item returned to sellable inventory (if in original condition) or classified as unsellable.</li></ul>\n<h4>8.2 Return Windows</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Product Category</th><th>Standard Return Window</th></tr></thead><tbody><tr><td>Most products</td><td><strong>30 days</strong> from delivery date</td></tr><tr><td>Electronics (smartphones, tablets, laptops, wearables)</td><td><strong>15 days</strong> (reduced from 30 as of March 2026 globally)</td></tr><tr><td>Holiday purchases (Prime Day, Black Friday)</td><td>Extended windows may apply</td></tr></tbody></table></div>\n<h4>8.3 Seller Responsibilities</h4>\n<ul><li><strong>FBA sellers do NOT need to manage returns directly</strong> — it's all handled by Amazon.</li><li>Amazon deducts the <strong>refund amount + a returns processing fee</strong> from the seller's account.</li><li>Sellers should monitor the <strong>Customer Returns Report</strong> in Seller Central.</li><li>If a customer receives a refund but doesn't return the product within 45 days, Amazon may <strong>reimburse the seller</strong>.</li></ul>\n<h4>8.4 Returns Processing Fees</h4>\n<p>Amazon charges returns processing fees for categories where free return shipping is provided to customers. These are per-unit fees deducted from the seller's account.</p>\n<h4>8.5 Reimbursement for Damaged Returns</h4>\n<p>If Amazon damages a product during the returns process:</p>\n<ul><li>Amazon may <strong>reimburse the seller</strong> based on historical selling price or fair market value.</li><li>Sellers must monitor inventory adjustment reports and file claims if discrepancies are found.</li></ul>\n<h4>8.6 FBA Reimbursement Claims (Saudi Arabia)</h4>\n<p>Common reimbursable scenarios:</p>\n<ul><li><strong>Lost inventory</strong> in fulfillment centers</li><li><strong>Damaged products</strong> during warehouse handling</li><li><strong>Customer refunds issued without product returns</strong></li><li><strong>Inbound shipment discrepancies</strong> (fewer units received than shipped)</li><li><strong>Removal/disposal order errors</strong></li></ul>\n<p><strong>Claim submission windows:</strong></p>\n<div class=\"table-wrap\"><table><thead><tr><th>Claim Type</th><th>Window</th></tr></thead><tbody><tr><td>Lost inventory</td><td>Up to 18 months</td></tr><tr><td>Inbound shipment discrepancies</td><td>Within 9 months of delivery</td></tr><tr><td>Customer refund issues</td><td>Up to 18 months</td></tr><tr><td>Removal order discrepancies</td><td>Up to 18 months</td></tr></tbody></table></div>\n<p><strong>Key reports to monitor in Seller Central:</strong></p>\n<ul><li>Inventory Adjustment Report</li><li>Reimbursements Report</li><li>Inventory Ledger Report</li><li>Customer Returns Report</li></ul>\n<p>---</p>\n","searchText":"For FBA orders, **Amazon handles the entire returns process**:\n\n1. **Customer initiates return** through their Amazon account or the Online Returns Center.\n2. **Amazon evaluates** the request against the return window and product eligibility.\n3. **Auto-authorization** — Most in-policy requests are approved automatically.\n4. **Return label issued** — Customer receives a prepaid return shipping label.\n5. **Customer ships item back** to an Amazon fulfillment center.\n6. **Amazon inspects** the returned item.\n7. **Refund processed** — Typically 3–5 business days for credit cards.\n8. **Inventory disposition** — Item returned to sellable inventory (if in original condition) or classified as unsellable. | Product Category | Standard Return Window |\n|---|---|\n| Most products | **30 days** from delivery date |\n| Electronics (smartphones, tablets, laptops, wearables) | **15 days** (reduced from 30 as of March 2026 globally) |\n| Holiday purchases (Prime Day, Black Friday) | Extended windows may apply | - **FBA sellers do NOT need to manage returns directly** — it's all handled by Amazon.\n- Amazon deducts the **refund amount + a returns processing fee** from the seller's account.\n- Sellers should monitor the **Customer Returns Report** in Seller Central.\n- If a customer receives a refund but doesn't return the product within 45 days, Amazon may **reimburse the seller**. Amazon charges returns processing fees for categories where free return shipping is provided to customers. These are per-unit fees deducted from the seller's account. If Amazon damages a product during the returns process:\n- Amazon may **reimburse the seller** based on historical selling price or fair market value.\n- Sellers must monitor inventory adjustment reports and file claims if discrepancies are found. Common reimbursable scenarios:\n- **Lost inventory** in fulfillment centers\n- **Damaged products** during warehouse handling\n- **Customer refunds issued without product returns**\n- **Inbound shipment discrepancies** (fewer units received than shipped)\n- **Removal/disposal order errors**\n\n**Claim submission windows:**\n| Claim Type | Window |\n|---|---|\n| Lost inventory | Up to 18 months |\n| Inbound shipment discrepancies | Within 9 months of delivery |\n| Customer refund issues | Up to 18 months |\n| Removal order discrepancies | Up to 18 months |\n\n**Key reports to monitor in Seller Central:**\n- Inventory Adjustment Report\n- Reimbursements Report\n- Inventory Ledger Report\n- Customer Returns Report\n\n---"},{"title":"9. Compliance & Regulatory Requirements for KSA","html":"<h4>9.1 VAT (Value Added Tax)</h4>\n<ul><li><strong>VAT rate:</strong> 15% in Saudi Arabia (one of the highest in the region).</li><li>Managed by <strong>ZATCA</strong> (Zakat, Tax and Customs Authority).</li><li><strong>Mandatory VAT registration</strong> for businesses with annual turnover ≥ <strong>SAR 375,000</strong> (~USD $100,000).</li><li>FBA sellers must register for and remit VAT.</li><li>VAT must be factored into pricing strategy.</li></ul>\n<h4>9.2 SASO Conformity & SABER Platform</h4>\n<p>This is the <strong>most critical compliance requirement</strong> for importing into KSA:</p>\n<ul><li><strong>SASO</strong> (Saudi Standards, Metrology and Quality Organization) requires most imported products to have a <strong>Certificate of Conformity</strong>.</li><li>Products must be registered on the <strong>SABER</strong> online portal before shipment.</li><li>Process:</li><li>Register products on SABER platform.</li><li>Submit product details and test reports to a SASO-approved conformity body.</li><li>Obtain <strong>Product Certificate of Conformity (PCoC)</strong>.</li><li>Obtain <strong>Shipment Certificate of Conformity (SCoC)</strong> before customs declaration.</li><li><strong>Shipments arriving without valid SABER certification WILL BE REJECTED by customs.</strong></li><li>As of October 2025, SCoC is mandatory for ALL imported products before customs declaration.</li></ul>\n<h4>9.3 Product Restrictions</h4>\n<ul><li>Audit SKU eligibility using Amazon.sa's restricted products database regularly (categories change quarterly).</li><li>Categories requiring special approval include: hazardous goods, health products, electronics, certain food items.</li><li>All products must comply with Saudi cultural and religious standards.</li></ul>\n<h4>9.4 Localization Requirements</h4>\n<ul><li><strong>Arabic-first approach</strong> is mandatory for product listings, A+ Content, and marketing.</li><li>All <strong>prices in SAR</strong> (Saudi Riyals).</li><li><strong>Culturally sensitive content</strong> — modest imagery, respect for Islamic values.</li><li>Product packaging may need <strong>Arabic labeling</strong>.</li></ul>\n<p>---</p>\n","searchText":"- **VAT rate:** 15% in Saudi Arabia (one of the highest in the region).\n- Managed by **ZATCA** (Zakat, Tax and Customs Authority).\n- **Mandatory VAT registration** for businesses with annual turnover ≥ **SAR 375,000** (~USD $100,000).\n- FBA sellers must register for and remit VAT.\n- VAT must be factored into pricing strategy. This is the **most critical compliance requirement** for importing into KSA:\n\n- **SASO** (Saudi Standards, Metrology and Quality Organization) requires most imported products to have a **Certificate of Conformity**.\n- Products must be registered on the **SABER** online portal before shipment.\n- Process:\n  1. Register products on SABER platform.\n  2. Submit product details and test reports to a SASO-approved conformity body.\n  3. Obtain **Product Certificate of Conformity (PCoC)**.\n  4. Obtain **Shipment Certificate of Conformity (SCoC)** before customs declaration.\n- **Shipments arriving without valid SABER certification WILL BE REJECTED by customs.**\n- As of October 2025, SCoC is mandatory for ALL imported products before customs declaration. - Audit SKU eligibility using Amazon.sa's restricted products database regularly (categories change quarterly).\n- Categories requiring special approval include: hazardous goods, health products, electronics, certain food items.\n- All products must comply with Saudi cultural and religious standards. - **Arabic-first approach** is mandatory for product listings, A+ Content, and marketing.\n- All **prices in SAR** (Saudi Riyals).\n- **Culturally sensitive content** — modest imagery, respect for Islamic values.\n- Product packaging may need **Arabic labeling**.\n\n---"},{"title":"10. FBA Advantages","html":"<h4>10.1 Sales & Visibility Benefits</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Advantage</th><th>Impact</th></tr></thead><tbody><tr><td><strong>Prime Badge</strong></td><td>FBA products display the Prime logo — Prime members are 2–3× more likely to purchase</td></tr><tr><td><strong>Buy Box advantage</strong></td><td>FBA listings have a significant edge in winning the Featured Offer (Buy Box)</td></tr><tr><td><strong>Higher conversion rates</strong></td><td>FBA listings convert at 18–25% vs. 10–13% for non-Prime</td></tr><tr><td><strong>Free shipping eligibility</strong></td><td>Customers see \"FREE Shipping\" — a major purchase driver in KSA</td></tr><tr><td><strong>Search ranking boost</strong></td><td>Prime-eligible products may rank higher in search results</td></tr></tbody></table></div>\n<h4>10.2 Operational Benefits</h4>\n<ul><li><strong>Scalability</strong> — No need to invest in warehouse space, staff, or shipping infrastructure.</li><li><strong>Customer service delegation</strong> — Amazon handles all inquiries in Arabic and English.</li><li><strong>Returns handling</strong> — No need to manage return logistics.</li><li><strong>Global infrastructure</strong> — Access to one of the world's most advanced fulfillment networks.</li><li><strong>Time savings</strong> — Focus on product development, sourcing, and marketing instead of logistics.</li></ul>\n<h4>10.3 KSA-Specific Benefits</h4>\n<ul><li><strong>Fast delivery</strong> — 1–3 day delivery in major cities (Riyadh, Jeddah, Dammam) via local FBA.</li><li><strong>Growing network</strong> — Amazon is investing heavily in Saudi Arabia's fulfillment infrastructure.</li><li><strong>Higher margins</strong> — KSA offers <strong>40–60% higher blended margins</strong> compared to saturated US market due to less competition.</li><li><strong>Premium pricing tolerance</strong> — Saudi consumers accept premium pricing for quality/convenience.</li><li><strong>Rapid market entry</strong> — Sellers can go live within <strong>10–14 days</strong> if inventory is in-country (vs. 3–6 months for European expansion).</li><li><strong>International Brand Pavilion</strong> — FBA brands can appear in dedicated storefronts on Amazon.sa.</li></ul>\n<h4>10.4 FBA New Selection Program Benefits</h4>\n<p>For <strong>new-to-FBA ASINs</strong>, Amazon offers:</p>\n<ul><li><strong>Free monthly storage</strong> for first 30 units for up to 90 days (Amazon.sa).</li><li><strong>Free shipping to fulfillment center</strong> (for eligible new ASINs).</li><li><strong>Free removals</strong> of inventory.</li><li><strong>Free return processing</strong>.</li><li><strong>Referral fee discounts</strong> (10% on first 100 qualifying units, 5% on next 100).</li><li><strong>Unlimited new parent ASINs per year</strong> once enrolled.</li></ul>\n<p>---</p>\n","searchText":"| Advantage | Impact |\n|---|---|\n| **Prime Badge** | FBA products display the Prime logo — Prime members are 2–3× more likely to purchase |\n| **Buy Box advantage** | FBA listings have a significant edge in winning the Featured Offer (Buy Box) |\n| **Higher conversion rates** | FBA listings convert at 18–25% vs. 10–13% for non-Prime |\n| **Free shipping eligibility** | Customers see \"FREE Shipping\" — a major purchase driver in KSA |\n| **Search ranking boost** | Prime-eligible products may rank higher in search results | - **Scalability** — No need to invest in warehouse space, staff, or shipping infrastructure.\n- **Customer service delegation** — Amazon handles all inquiries in Arabic and English.\n- **Returns handling** — No need to manage return logistics.\n- **Global infrastructure** — Access to one of the world's most advanced fulfillment networks.\n- **Time savings** — Focus on product development, sourcing, and marketing instead of logistics. - **Fast delivery** — 1–3 day delivery in major cities (Riyadh, Jeddah, Dammam) via local FBA.\n- **Growing network** — Amazon is investing heavily in Saudi Arabia's fulfillment infrastructure.\n- **Higher margins** — KSA offers **40–60% higher blended margins** compared to saturated US market due to less competition.\n- **Premium pricing tolerance** — Saudi consumers accept premium pricing for quality/convenience.\n- **Rapid market entry** — Sellers can go live within **10–14 days** if inventory is in-country (vs. 3–6 months for European expansion).\n- **International Brand Pavilion** — FBA brands can appear in dedicated storefronts on Amazon.sa. For **new-to-FBA ASINs**, Amazon offers:\n- **Free monthly storage** for first 30 units for up to 90 days (Amazon.sa).\n- **Free shipping to fulfillment center** (for eligible new ASINs).\n- **Free removals** of inventory.\n- **Free return processing**.\n- **Referral fee discounts** (10% on first 100 qualifying units, 5% on next 100).\n- **Unlimited new parent ASINs per year** once enrolled.\n\n---"},{"title":"11. Common Seller Questions (FAQ)","html":"<h4>Getting Started</h4>\n<p><strong>Q: Do I need a KSA-based business entity to sell on Amazon.sa?</strong></p>\n<p>A: No. International sellers can sell on Amazon.sa without forming a Saudi-based company. However, depending on your sales strategy and volumes, having a local entity may be advantageous for customs, VAT, and banking.</p>\n<p><strong>Q: Can I sell the same products in the US/UAE and Saudi Arabia?</strong></p>\n<p>A: Product requirements vary by country. You must review Saudi regulations, including SASO/SABER certification, Arabic labeling requirements, and cultural appropriateness. Use the \"Build International Listings\" tool to cross-list products.</p>\n<p><strong>Q: How long does it take to start selling with FBA in KSA?</strong></p>\n<p>A: If inventory is already in-country, sellers can typically go live within <strong>10–14 days</strong>. International sellers shipping inventory from abroad should add 2–6 weeks for freight and customs.</p>\n<p><strong>Q: Do I need a Professional selling plan for FBA?</strong></p>\n<p>A: You can use FBA with either plan, but a Professional plan is recommended if you sell 40+ items/month. On Amazon.sa, the Professional plan currently has <strong>no monthly subscription fee</strong> (limited-time offer).</p>\n<h4>Fees & Profitability</h4>\n<p><strong>Q: What percentage does Amazon take in total?</strong></p>\n<p>A: Typically <strong>25–40% of the sale price</strong> when you add referral fees, fulfillment fees, and storage. The exact amount depends on product category, size, weight, and price point.</p>\n<p><strong>Q: Is FBA profitable for low-price items?</strong></p>\n<p>A: It can be challenging. Items under 25 SAR benefit from lower FBA fulfillment fees, but the percentage taken by referral fees is the same. Target a <strong>minimum 25–30% gross margin</strong> after all fees and COGS.</p>\n<p><strong>Q: How do I calculate my fees before listing?</strong></p>\n<p>A: Use the <strong>FBA Revenue Calculator</strong> in Seller Central (available for Amazon.sa) to estimate fees based on product dimensions, weight, category, and selling price.</p>\n<p><strong>Q: Are there seasonal fee changes?</strong></p>\n<p>A: Yes — <strong>storage fees increase significantly during Q4 (October–December)</strong>, typically 2–3× the off-peak rate. Plan inventory levels accordingly.</p>\n<h4>Inventory & Shipping</h4>\n<p><strong>Q: What happens if Amazon loses my inventory?</strong></p>\n<p>A: Amazon will reimburse you based on historical selling price or estimated fair market value. You may need to file a claim through Seller Support. Sellers can lose <strong>1–3% of annual revenue</strong> from unclaimed reimbursements.</p>\n<p><strong>Q: My shipment shows \"0 received\" — what do I do?</strong></p>\n<p>A: This typically means inventory is delivered but hasn't been processed yet. Standard check-in is 72 hours (up to 7 days during peak). If still unresolved: (1) Verify shipment status in Manage FBA Shipments, (2) Check tracking/delivery confirmation, (3) Open a case with Seller Support after the standard check-in window.</p>\n<p><strong>Q: Can I ship inventory from outside Saudi Arabia to Amazon.sa FBA?</strong></p>\n<p>A: Yes. You can use Amazon Global Logistics (AGL), SEND (Seller Export & Delivery), or your own freight forwarder. Ensure all customs documentation (including SABER certificates) is complete.</p>\n<p><strong>Q: What are restock limits?</strong></p>\n<p>A: Monthly FBA capacity limits measured in cubic feet, calculated per storage type. Your IPI score is the primary lever — sellers above 400 get generous limits. View limits in the Capacity Monitor in your FBA Dashboard.</p>\n<h4>Returns & Customer Service</h4>\n<p><strong>Q: Do I have to handle returns myself with FBA?</strong></p>\n<p>A: No. Amazon handles everything — authorization, label generation, receiving the return, inspection, and refund processing.</p>\n<p><strong>Q: What if a customer gets a refund but doesn't return the product?</strong></p>\n<p>A: Amazon tracks this. If the item isn't returned within 45 days, Amazon may reimburse you. Monitor your Customer Returns Report regularly.</p>\n<p><strong>Q: Can I get reimbursed for warehouse-damaged inventory?</strong></p>\n<p>A: Yes. File reimbursement claims through Seller Support. You have up to 18 months for most claim types. Check the Inventory Adjustment Report regularly.</p>\n<h4>Compliance</h4>\n<p><strong>Q: What is SABER and do I need it?</strong></p>\n<p>A: SABER is Saudi Arabia's mandatory product certification platform. Most imported consumer products require a Certificate of Conformity issued through SABER before they can clear customs. <strong>Without it, your shipment will be rejected at customs.</strong></p>\n<p><strong>Q: Do I need to register for VAT in Saudi Arabia?</strong></p>\n<p>A: Yes, if your annual turnover in KSA reaches <strong>SAR 375,000</strong> (~$100,000 USD). VAT rate is <strong>15%</strong> and must be factored into your pricing.</p>\n<p><strong>Q: What languages do my listings need to be in?</strong></p>\n<p>A: <strong>Arabic is mandatory</strong> and should be the primary language. English can be secondary. Professional Arabic translations are essential — machine translations damage trust and conversion rates.</p>\n<p>---</p>\n","searchText":"**Q: Do I need a KSA-based business entity to sell on Amazon.sa?**\nA: No. International sellers can sell on Amazon.sa without forming a Saudi-based company. However, depending on your sales strategy and volumes, having a local entity may be advantageous for customs, VAT, and banking.\n\n**Q: Can I sell the same products in the US/UAE and Saudi Arabia?**\nA: Product requirements vary by country. You must review Saudi regulations, including SASO/SABER certification, Arabic labeling requirements, and cultural appropriateness. Use the \"Build International Listings\" tool to cross-list products.\n\n**Q: How long does it take to start selling with FBA in KSA?**\nA: If inventory is already in-country, sellers can typically go live within **10–14 days**. International sellers shipping inventory from abroad should add 2–6 weeks for freight and customs.\n\n**Q: Do I need a Professional selling plan for FBA?**\nA: You can use FBA with either plan, but a Professional plan is recommended if you sell 40+ items/month. On Amazon.sa, the Professional plan currently has **no monthly subscription fee** (limited-time offer). **Q: What percentage does Amazon take in total?**\nA: Typically **25–40% of the sale price** when you add referral fees, fulfillment fees, and storage. The exact amount depends on product category, size, weight, and price point.\n\n**Q: Is FBA profitable for low-price items?**\nA: It can be challenging. Items under 25 SAR benefit from lower FBA fulfillment fees, but the percentage taken by referral fees is the same. Target a **minimum 25–30% gross margin** after all fees and COGS.\n\n**Q: How do I calculate my fees before listing?**\nA: Use the **FBA Revenue Calculator** in Seller Central (available for Amazon.sa) to estimate fees based on product dimensions, weight, category, and selling price.\n\n**Q: Are there seasonal fee changes?**\nA: Yes — **storage fees increase significantly during Q4 (October–December)**, typically 2–3× the off-peak rate. Plan inventory levels accordingly. **Q: What happens if Amazon loses my inventory?**\nA: Amazon will reimburse you based on historical selling price or estimated fair market value. You may need to file a claim through Seller Support. Sellers can lose **1–3% of annual revenue** from unclaimed reimbursements.\n\n**Q: My shipment shows \"0 received\" — what do I do?**\nA: This typically means inventory is delivered but hasn't been processed yet. Standard check-in is 72 hours (up to 7 days during peak). If still unresolved: (1) Verify shipment status in Manage FBA Shipments, (2) Check tracking/delivery confirmation, (3) Open a case with Seller Support after the standard check-in window.\n\n**Q: Can I ship inventory from outside Saudi Arabia to Amazon.sa FBA?**\nA: Yes. You can use Amazon Global Logistics (AGL), SEND (Seller Export & Delivery), or your own freight forwarder. Ensure all customs documentation (including SABER certificates) is complete.\n\n**Q: What are restock limits?**\nA: Monthly FBA capacity limits measured in cubic feet, calculated per storage type. Your IPI score is the primary lever — sellers above 400 get generous limits. View limits in the Capacity Monitor in your FBA Dashboard. **Q: Do I have to handle returns myself with FBA?**\nA: No. Amazon handles everything — authorization, label generation, receiving the return, inspection, and refund processing.\n\n**Q: What if a customer gets a refund but doesn't return the product?**\nA: Amazon tracks this. If the item isn't returned within 45 days, Amazon may reimburse you. Monitor your Customer Returns Report regularly.\n\n**Q: Can I get reimbursed for warehouse-damaged inventory?**\nA: Yes. File reimbursement claims through Seller Support. You have up to 18 months for most claim types. Check the Inventory Adjustment Report regularly. **Q: What is SABER and do I need it?**\nA: SABER is Saudi Arabia's mandatory product certification platform. Most imported consumer products require a Certificate of Conformity issued through SABER before they can clear customs. **Without it, your shipment will be rejected at customs.**\n\n**Q: Do I need to register for VAT in Saudi Arabia?**\nA: Yes, if your annual turnover in KSA reaches **SAR 375,000** (~$100,000 USD). VAT rate is **15%** and must be factored into your pricing.\n\n**Q: What languages do my listings need to be in?**\nA: **Arabic is mandatory** and should be the primary language. English can be secondary. Professional Arabic translations are essential — machine translations damage trust and conversion rates.\n\n---"},{"title":"12. Key Seller Central Reports for FBA","html":"<div class=\"table-wrap\"><table><thead><tr><th>Report</th><th>Purpose</th><th>Frequency</th></tr></thead><tbody><tr><td>FBA Dashboard</td><td>Overall inventory health, IPI score</td><td>Weekly</td></tr><tr><td>Inventory Adjustment Report</td><td>Track lost, damaged, transferred units</td><td>Weekly</td></tr><tr><td>Reimbursements Report</td><td>View reimbursements already issued</td><td>Monthly</td></tr><tr><td>Inventory Ledger Report</td><td>Detailed inventory movement records</td><td>Weekly</td></tr><tr><td>Customer Returns Report</td><td>Identify refunds without returns</td><td>Weekly</td></tr><tr><td>Fee Preview Report</td><td>Preview FBA fees per SKU</td><td>Before listing</td></tr><tr><td>Capacity Monitor</td><td>View storage limits and usage</td><td>Monthly</td></tr><tr><td>Restock Recommendations</td><td>Replenishment timing and quantities</td><td>Weekly</td></tr></tbody></table></div>\n<p>---</p>","searchText":"| Report | Purpose | Frequency |\n|---|---|---|\n| FBA Dashboard | Overall inventory health, IPI score | Weekly |\n| Inventory Adjustment Report | Track lost, damaged, transferred units | Weekly |\n| Reimbursements Report | View reimbursements already issued | Monthly |\n| Inventory Ledger Report | Detailed inventory movement records | Weekly |\n| Customer Returns Report | Identify refunds without returns | Weekly |\n| Fee Preview Report | Preview FBA fees per SKU | Before listing |\n| Capacity Monitor | View storage limits and usage | Monthly |\n| Restock Recommendations | Replenishment timing and quantities | Weekly |\n\n---"},{"title":"13. Key Sales Events in KSA","html":"<p>Plan FBA inventory around these peak periods:</p>\n<div class=\"table-wrap\"><table><thead><tr><th>Event</th><th>Timing</th><th>Notes</th></tr></thead><tbody><tr><td><strong>Ramadan</strong></td><td>Varies (Islamic calendar)</td><td>Major shopping period; stock up well in advance</td></tr><tr><td><strong>Eid al-Fitr</strong></td><td>End of Ramadan</td><td>Gift-giving spike</td></tr><tr><td><strong>Eid al-Adha</strong></td><td>~70 days after Eid al-Fitr</td><td>Another major gifting event</td></tr><tr><td><strong>Saudi National Day</strong></td><td>September 23</td><td>National pride purchases, special promotions</td></tr><tr><td><strong>White Friday</strong></td><td>November (Black Friday equivalent)</td><td>Biggest sales event of the year</td></tr><tr><td><strong>Year-end holidays</strong></td><td>December</td><td>Continued momentum from White Friday</td></tr></tbody></table></div>\n<p>---</p>","searchText":"Plan FBA inventory around these peak periods:\n\n| Event | Timing | Notes |\n|---|---|---|\n| **Ramadan** | Varies (Islamic calendar) | Major shopping period; stock up well in advance |\n| **Eid al-Fitr** | End of Ramadan | Gift-giving spike |\n| **Eid al-Adha** | ~70 days after Eid al-Fitr | Another major gifting event |\n| **Saudi National Day** | September 23 | National pride purchases, special promotions |\n| **White Friday** | November (Black Friday equivalent) | Biggest sales event of the year |\n| **Year-end holidays** | December | Continued momentum from White Friday |\n\n---"},{"title":"14. Quick Reference — Key Contacts & Resources","html":"<div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>URL / Location</th></tr></thead><tbody><tr><td>Amazon.sa Seller Central</td><td>sellercentral.amazon.sa</td></tr><tr><td>Amazon.sa FBA Page</td><td>sell.amazon.sa/fulfillment-by-amazon</td></tr><tr><td>Amazon.sa Pricing / Fees</td><td>sell.amazon.sa/pricing</td></tr><tr><td>FBA Revenue Calculator</td><td>Available in Seller Central</td></tr><tr><td>SABER Platform</td><td>saber.sa</td></tr><tr><td>ZATCA (Tax Authority)</td><td>zatca.gov.sa</td></tr><tr><td>SASO (Standards Org)</td><td>saso.gov.sa</td></tr><tr><td>Seller Support</td><td>Via Seller Central case management</td></tr><tr><td>Carrier Central</td><td>Via Seller Central for delivery appointments</td></tr></tbody></table></div>\n<p>---</p>\n<p><em>Last Updated: September 2026. Fee structures and policies are subject to change. Always verify current rates in Seller Central before making business decisions.</em></p>","searchText":"| Resource | URL / Location |\n|---|---|\n| Amazon.sa Seller Central | sellercentral.amazon.sa |\n| Amazon.sa FBA Page | sell.amazon.sa/fulfillment-by-amazon |\n| Amazon.sa Pricing / Fees | sell.amazon.sa/pricing |\n| FBA Revenue Calculator | Available in Seller Central |\n| SABER Platform | saber.sa |\n| ZATCA (Tax Authority) | zatca.gov.sa |\n| SASO (Standards Org) | saso.gov.sa |\n| Seller Support | Via Seller Central case management |\n| Carrier Central | Via Seller Central for delivery appointments |\n\n---\n\n*Last Updated: September 2026. Fee structures and policies are subject to change. Always verify current rates in Seller Central before making business decisions.*"}],"pricing":[{"title":"Focus: MENA / Saudi Arabia (Amazon.sa) Marketplace","html":"<blockquote><strong>Purpose:</strong> Practical reference for account managers and support agents to answer seller questions about Amazon's Automate Pricing tool, manual pricing strategies, and Buy Box / Featured Offer pricing.</blockquote>\n<p>---</p>\n<ul><li><a href=\"#1-what-is-automate-pricing\" target=\"_blank\">What Is Automate Pricing?</a></li><li><a href=\"#2-availability-on-amazonsa--mena\" target=\"_blank\">Availability on Amazon.sa / MENA</a></li><li><a href=\"#3-how-it-works--core-mechanics\" target=\"_blank\">How It Works — Core Mechanics</a></li><li><a href=\"#4-types-of-pricing-rules-detailed\" target=\"_blank\">Types of Pricing Rules (Detailed)</a></li><li>4.1 Competitive Featured Offer Rule</li><li>4.2 Competitive Lowest Price Rule</li><li>4.3 Competitive External Price Rule</li><li>4.4 Sales-Based Rule (Based on Sales Units)</li><li>4.5 Business Competitive Featured Offer Rule</li><li>4.6 Business Price & Quantity Discounts Rule</li><li>4.7 Predefined (Pre-Built) Rules</li><li><a href=\"#5-step-by-step-setup-guide\" target=\"_blank\">Step-by-Step Setup Guide</a></li><li><a href=\"#6-min--max-price-guardrails\" target=\"_blank\">Min / Max Price Guardrails</a></li><li><a href=\"#7-how-the-tool-reprices--timing--behavior\" target=\"_blank\">How the Tool Reprices — Timing & Behavior</a></li><li><a href=\"#8-best-practices\" target=\"_blank\">Best Practices</a></li><li><a href=\"#9-limitations--known-issues\" target=\"_blank\">Limitations & Known Issues</a></li><li><a href=\"#10-manual-pricing-strategies\" target=\"_blank\">Manual Pricing Strategies</a></li><li><a href=\"#11-buy-box--featured-offer--pricing-strategies\" target=\"_blank\">Buy Box / Featured Offer — Pricing Strategies</a></li><li><a href=\"#12-frequently-asked-questions-faq\" target=\"_blank\">Frequently Asked Questions (FAQ)</a></li><li><a href=\"#13-troubleshooting-scenarios\" target=\"_blank\">Troubleshooting Scenarios</a></li><li><a href=\"#14-automate-pricing-vs-third-party-repricers\" target=\"_blank\">Automate Pricing vs. Third-Party Repricers</a></li><li><a href=\"#15-key-terminology-glossary\" target=\"_blank\">Key Terminology Glossary</a></li><li><a href=\"#16-sources\" target=\"_blank\">Sources</a></li></ul>\n<p>---</p>","searchText":"> **Purpose:** Practical reference for account managers and support agents to answer seller questions about Amazon's Automate Pricing tool, manual pricing strategies, and Buy Box / Featured Offer pricing.\n\n---\n\n\n1. [What Is Automate Pricing?](#1-what-is-automate-pricing)\n2. [Availability on Amazon.sa / MENA](#2-availability-on-amazonsa--mena)\n3. [How It Works — Core Mechanics](#3-how-it-works--core-mechanics)\n4. [Types of Pricing Rules (Detailed)](#4-types-of-pricing-rules-detailed)\n   - 4.1 Competitive Featured Offer Rule\n   - 4.2 Competitive Lowest Price Rule\n   - 4.3 Competitive External Price Rule\n   - 4.4 Sales-Based Rule (Based on Sales Units)\n   - 4.5 Business Competitive Featured Offer Rule\n   - 4.6 Business Price & Quantity Discounts Rule\n   - 4.7 Predefined (Pre-Built) Rules\n5. [Step-by-Step Setup Guide](#5-step-by-step-setup-guide)\n6. [Min / Max Price Guardrails](#6-min--max-price-guardrails)\n7. [How the Tool Reprices — Timing & Behavior](#7-how-the-tool-reprices--timing--behavior)\n8. [Best Practices](#8-best-practices)\n9. [Limitations & Known Issues](#9-limitations--known-issues)\n10. [Manual Pricing Strategies](#10-manual-pricing-strategies)\n11. [Buy Box / Featured Offer — Pricing Strategies](#11-buy-box--featured-offer--pricing-strategies)\n12. [Frequently Asked Questions (FAQ)](#12-frequently-asked-questions-faq)\n13. [Troubleshooting Scenarios](#13-troubleshooting-scenarios)\n14. [Automate Pricing vs. Third-Party Repricers](#14-automate-pricing-vs-third-party-repricers)\n15. [Key Terminology Glossary](#15-key-terminology-glossary)\n16. [Sources](#16-sources)\n\n---"},{"title":"1. What Is Automate Pricing?","html":"<p><strong>Amazon Automate Pricing</strong> is a <strong>free, built-in repricing tool</strong> available in Seller Central to all sellers with a <strong>Professional selling plan</strong>. It automatically adjusts product prices on selected SKUs in near real-time based on rules defined by the seller.</p><h4>Key Facts</h4>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribute</th><th>Detail</th></tr></thead><tbody><tr><td><strong>Cost</strong></td><td>Free — included with the Professional selling plan ($39.99/month in the US; equivalent subscription on Amazon.sa)</td></tr><tr><td><strong>Eligibility</strong></td><td>Professional sellers with active product listings</td></tr><tr><td><strong>Scope</strong></td><td>Works on individual SKUs or bulk-assigned SKUs — <strong>not</strong> applied to entire catalog automatically</td></tr><tr><td><strong>Operates</strong></td><td>24/7, adjusting prices in response to marketplace pricing events</td></tr><tr><td><strong>Currency</strong></td><td>Prices in the
